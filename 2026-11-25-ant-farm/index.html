<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ameisenfarm</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Eine Ameisenfarm im Glas. Die Kolonie gräbt, sammelt Futter und wächst.">
<meta name="theme-color" content="#3a2418">
<style>
html,body{margin:0;height:100%;background:#3a2418;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f6efe4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:#f6efe4;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #f0d78c;outline-offset:2px}
#pill{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));background:rgba(42,28,20,.78);border:1px solid rgba(255,236,210,.14);border-radius:14px;padding:8px 12px 9px;backdrop-filter:blur(6px);max-width:min(280px,74vw);pointer-events:none}
#pill strong{display:block;font-size:16px;letter-spacing:.01em}
#dayText,#popText{font-size:13px;opacity:.9;margin-top:2px}
#bar{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:16px;background:rgba(42,28,20,.82);border:1px solid rgba(255,236,210,.12);backdrop-filter:blur(6px);max-width:min(96vw,920px);box-sizing:border-box;overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{min-height:44px;padding:8px 10px;font-size:14px;display:flex;align-items:center;gap:5px;flex:none}
#bar button.on{background:rgba(232,176,92,.28);border-color:rgba(240,215,140,.75)}
#hint{position:fixed;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 72px);transform:translateX(-50%);background:rgba(42,28,20,.7);border-radius:12px;padding:8px 12px;font-size:14px;max-width:min(520px,92vw);text-align:center;pointer-events:none;transition:opacity .8s}
#hint.gone{opacity:0}
#toast{position:fixed;left:max(8px,env(safe-area-inset-left));top:calc(max(8px,env(safe-area-inset-top)) + 78px);background:rgba(42,28,20,.92);border:1px solid rgba(240,215,140,.45);color:#f6efe4;border-radius:12px;padding:8px 14px;font-size:14px;max-width:min(420px,80vw);pointer-events:none;z-index:5}
#toast[hidden]{display:none}
#scrim{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:6}
#scrim[hidden],#note[hidden]{display:none}
#note{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,94vw);max-height:min(80vh,640px);overflow:auto;background:rgba(48,32,24,.97);border:1px solid rgba(255,236,210,.16);border-radius:16px;padding:12px 14px 16px;box-sizing:border-box}
#note header{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:rgba(48,32,24,.97);padding-bottom:8px}
#note header b{font-size:18px}
#note header span{opacity:.75;font-size:13px;flex:1}
#note header button{min-width:36px;min-height:36px;border-radius:10px}
#noteBody p{margin:0;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px;line-height:1.35}
#noteBody b{display:inline-block;min-width:11.5em;font-weight:650}
#noteBody .soft{opacity:.8;font-size:13px;padding-top:10px}
@media (max-width:820px){
  #bar button .tx{display:none}
  #bar button{padding:8px 0;width:46px;justify-content:center}
  #pill strong{font-size:15px}
}
@media (max-height:430px){
  #hint{display:none}
  #pill{padding:4px 8px}
  #popText{display:none}
  #toast{top:max(8px,env(safe-area-inset-top));left:auto;right:max(8px,env(safe-area-inset-right));max-width:min(300px,54vw)}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Ameisenfarm. Ein Glas mit Wiese und Erde. Tippe, um zu leuchten, Futter zu legen oder ans Glas zu klopfen."></canvas>
<div id="pill">
  <strong>Ameisenfarm</strong>
  <div id="dayText">Tag 1 · Tag</div>
  <div id="popText">16 Ameisen</div>
</div>
<div id="bar" role="toolbar" aria-label="Ameisenfarm Werkzeuge">
  <button id="bSound" type="button" aria-pressed="false" aria-label="Ton ist aus. Tippe, um ihn einzuschalten" title="Ton (M)">
    <span class="ic" aria-hidden="true">🔇</span><span class="tx">Ton</span>
  </button>
  <button id="bNote" type="button" aria-label="Notizbuch öffnen" title="Notiz (N)">
    <span class="ic" aria-hidden="true">📒</span><span class="tx">Notiz</span>
  </button>
  <button id="bLight" type="button" data-tool="light" aria-pressed="true" aria-label="Taschenlampe" title="Licht (L)">
    <span class="ic" aria-hidden="true">🔦</span><span class="tx">Licht</span>
  </button>
  <button id="bSugar" type="button" data-tool="sugar" aria-pressed="false" aria-label="Zuckerkrümel legen" title="Zucker (1)">
    <span class="ic" aria-hidden="true">🍬</span><span class="tx">Zucker</span>
  </button>
  <button id="bSeed" type="button" data-tool="seed" aria-pressed="false" aria-label="Samen legen" title="Samen (2)">
    <span class="ic" aria-hidden="true">🌱</span><span class="tx">Samen</span>
  </button>
  <button id="bApple" type="button" data-tool="apple" aria-pressed="false" aria-label="Apfelschnitz legen" title="Apfel (3)">
    <span class="ic" aria-hidden="true">🍎</span><span class="tx">Apfel</span>
  </button>
  <button id="bWater" type="button" data-tool="water" aria-pressed="false" aria-label="Wasser tropfen" title="Wasser (4)">
    <span class="ic" aria-hidden="true">💧</span><span class="tx">Wasser</span>
  </button>
  <button id="bStone" type="button" data-tool="stone" aria-pressed="false" aria-label="Kiesel setzen" title="Stein (5)">
    <span class="ic" aria-hidden="true">🪨</span><span class="tx">Stein</span>
  </button>
  <button id="bKnock" type="button" aria-label="Sanft ans Glas klopfen" title="Klopfen (K)">
    <span class="ic" aria-hidden="true">✋</span><span class="tx">Klopf</span>
  </button>
  <button id="bTrails" type="button" aria-pressed="false" aria-label="Duftspuren zeigen" title="Spuren (P)">
    <span class="ic" aria-hidden="true">〰️</span><span class="tx">Spuren</span>
  </button>
</div>
<div id="hint">Lege Futter auf die Wiese. Tropfe Wasser, setze einen Stein, leuchte oder klopfe ans Glas.</div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="scrim" hidden></div>
<div id="note" hidden role="dialog" aria-modal="true" aria-label="Notizbuch">
  <header>
    <b>Notizbuch</b>
    <span id="noteDay">Tag 1</span>
    <button id="noteClose" type="button" aria-label="Schliessen">✕</button>
  </header>
  <div id="noteBody"></div>
</div>
<script>
'use strict';
(function () {
  const GW = 112;
  const GH = 78;
  const SURF = 16;
  const ENT = 56;
  const DAY = 64;
  const SIM = 1 / 30;
  const INF = 65535;
  const KEY = 'playbot-ant-farm';
  const AIR = 0, GRASS = 1, TOPSOIL = 2, LOAM = 3, SAND = 4, CLAY = 5, ROCK = 6, PEBBLE = 7, WATER = 8, FRAME = 9;
  const ST_DIG = 1, ST_HAUL = 2, ST_FORAGE = 3, ST_RETURN = 4, ST_NURSE = 5, ST_QUEEN = 6;
  const STAGE_T = [18, 26, 20];
  const DX = [1, -1, 0, 0];
  const DY = [0, 0, 1, -1];

  const params = new URLSearchParams(location.search);
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const soilC = document.createElement('canvas');
  soilC.width = GW;
  soilC.height = GH;
  const soilCtx = soilC.getContext('2d', { alpha: true });
  const pix = new Uint8ClampedArray(GW * GH * 4);

  const soil = new Uint8Array(GW * GH);
  const phero = new Uint8Array(GW * GH);
  const distE = new Uint16Array(GW * GH);
  const distS = new Uint16Array(GW * GH);
  const distB = new Uint16Array(GW * GH);
  const queue = new Int32Array(GW * GH);

  let cap = 150;
  let scale = 4, ox = 0, oy = 0, viewW = 800, viewH = 600, dpr = 1;
  let simTime = DAY * 0.22;
  let dugTotal = 0;
  let foodGathered = 0;
  let born = 0;
  let workerCount = 0;
  let foodCache = 0;
  let layAcc = 8;
  let foodAcc = 2;
  let bfsAcc = 0;
  let digsSince = 0;
  let seepAcc = 0;
  let pheroAcc = 0;
  let homeX = 46, homeY = 46;
  let storeX = ENT + 16, storeY = SURF + 14;
  let queen = null;
  let tool = 'light';
  let showTrails = false;
  let soundOn = false;
  let paused = params.has('pause');
  let fast = false;
  let shake = 0;
  let mapDirty = true;
  let reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduce = false; }

  const ants = [];
  const brood = [];
  const foods = [];
  const crumbs = [];
  const drips = [];
  const torches = [];
  const rain = [];
  const clouds = [
    { x: 8, y: 3.2, w: 16, s: 1.1 },
    { x: 36, y: 5.1, w: 20, s: 0.7 },
    { x: 62, y: 2.4, w: 13, s: 1.3 },
    { x: 88, y: 4.6, w: 18, s: 0.55 }
  ];

  let audio = null;
  let nextChirp = 0;
  let lastDigAt = 0;
  let lastRustle = 0;

  function hash2(x, y) {
    let n = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return (n ^ (n >>> 16)) >>> 0;
  }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function dayPhase() { return (simTime % DAY) / DAY; }
  function dayNumber() { return Math.floor(simTime / DAY) + 1; }
  function nightAmt() {
    const p = dayPhase();
    if (p < 0.42) return 0;
    if (p < 0.55) return (p - 0.42) / 0.13;
    if (p < 0.84) return 1;
    if (p < 0.95) return 1 - (p - 0.84) / 0.11;
    return 0;
  }
  function dayPart() {
    if (rainingNow()) return 'Regen';
    const p = dayPhase();
    if (p < 0.16 || p > 0.95) return 'Morgen';
    if (p < 0.42) return 'Mittag';
    if (p < 0.58) return 'Abend';
    return 'Nacht';
  }
  function rainingNow() {
    const w = simTime % 96;
    return w > 70 && w < 84;
  }
  function updateCap() {
    cap = Math.min(innerWidth, innerHeight) < 700 ? 90 : 150;
  }

  function walkable(x, y) {
    if (x < 1 || y < SURF - 2 || x >= GW - 1 || y >= GH - 1) return false;
    return soil[y * GW + x] === AIR;
  }
  function diggable(x, y) {
    if (x < 2 || y <= SURF || x >= GW - 2 || y >= GH - 2) return false;
    const m = soil[y * GW + x];
    return m >= TOPSOIL && m <= CLAY;
  }
  function colorOf(x, y, m) {
    if (m === AIR) {
      if (y < SURF) return [0, 0, 0, 0];
      const depth = (y - SURF) / (GH - SURF);
      const h = hash2(x, y);
      return [
        clamp(214 - depth * 50 + (h & 15) - 6, 0, 255),
        clamp(186 - depth * 42 + ((h >> 4) & 15) - 6, 0, 255),
        clamp(146 - depth * 30 + ((h >> 8) & 7), 0, 255),
        255
      ];
    }
    const base = {
      1: [58, 128, 52],
      2: [96, 60, 36],
      3: [128, 82, 46],
      4: [196, 162, 96],
      5: [168, 88, 58],
      6: [108, 104, 100],
      7: [132, 126, 118],
      8: [86, 150, 184],
      9: [118, 74, 46]
    }[m] || [0, 0, 0];
    const h = hash2(x, y);
    const amp = m === GRASS ? 16 : 12;
    let r = base[0] + (h % (amp * 2 + 1)) - amp;
    let g = base[1] + ((h >> 3) % (amp * 2 + 1)) - amp;
    let b = base[2] + ((h >> 6) % 9) - 4;
    if (m === GRASS && (h % 23) === 0) { r = 214; g = 86; b = 110; }
    else if (m === GRASS && (h % 29) === 0) { r = 232; g = 196; b = 72; }
    if (m === TOPSOIL && (h % 17) === 0) { r -= 18; g -= 12; b -= 8; }
    return [clamp(r, 0, 255), clamp(g, 0, 255), clamp(b, 0, 255), 255];
  }
  function paintCell(x, y) {
    const i = y * GW + x;
    const c = colorOf(x, y, soil[i]);
    const o = i * 4;
    pix[o] = c[0]; pix[o + 1] = c[1]; pix[o + 2] = c[2]; pix[o + 3] = c[3];
    mapDirty = true;
  }
  function setMat(x, y, m) {
    const i = y * GW + x;
    soil[i] = m;
    paintCell(x, y);
  }
  function flushMap() {
    if (!mapDirty) return;
    mapDirty = false;
    soilCtx.putImageData(new ImageData(pix, GW, GH), 0, 0);
  }
  function paintAll() {
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) paintCell(x, y);
  }

  function carveCell(x, y) {
    if (x < 1 || x >= GW - 1 || y < SURF || y >= GH - 1) return;
    if (soil[y * GW + x] === FRAME) return;
    setMat(x, y, AIR);
  }
  function carveDisk(cx, cy, rx, ry) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
      for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const nx = (x - cx) / rx, ny = (y - cy) / ry;
        if (nx * nx + ny * ny <= 1) carveCell(x, y);
      }
    }
  }
  function countDug() {
    let n = 0;
    for (let y = SURF; y < GH - 1; y++) {
      for (let x = 1; x < GW - 1; x++) if (soil[y * GW + x] === AIR) n++;
    }
    return n;
  }
  function canDig() {
    const max = Math.floor((GW - 4) * (GH - SURF - 4) * 0.2);
    return dugTotal < Math.min(max, 340 + workerCount * 9);
  }
  function nearestWalk(x, y) {
    x = clamp(x | 0, 1, GW - 2);
    y = clamp(y | 0, SURF - 2, GH - 2);
    if (walkable(x, y)) return [x, y];
    for (let r = 1; r <= 18; r++) {
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
          if (walkable(x + dx, y + dy)) return [x + dx, y + dy];
        }
      }
    }
    return [ENT, SURF - 1];
  }

  function generateSoil() {
    soil.fill(AIR);
    for (let y = 0; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        let m = AIR;
        if (x === 0 || x === GW - 1 || y === 0 || y === GH - 1) m = FRAME;
        else if (y > SURF) {
          const d = y - SURF;
          const h = hash2(x, y);
          const n = (h % 1000) / 1000;
          if (d > 8 && n > 0.972) m = ROCK;
          else if (d < 7) m = TOPSOIL;
          else if (d < 18) m = n > 0.84 ? SAND : LOAM;
          else if (d < 36) m = n > 0.9 ? CLAY : SAND;
          else if (d < 52) m = n > 0.86 ? ROCK : CLAY;
          else m = n > 0.78 ? ROCK : CLAY;
        } else if (y === SURF) m = GRASS;
        soil[y * GW + x] = m;
      }
    }
    for (let x = ENT - 2; x <= ENT + 2; x++) carveCell(x, SURF);
    for (let y = SURF; y <= SURF + 22; y++) { carveCell(ENT, y); carveCell(ENT + 1, y); }
    for (let x = ENT - 16; x <= ENT + 1; x++) { carveCell(x, SURF + 20); carveCell(x, SURF + 21); }
    carveDisk(ENT - 14, SURF + 24, 4.2, 3);
    homeX = 46;
    homeY = SURF + 30;
    carveDisk(homeX, homeY, 7, 4.6);
    for (let y = SURF + 21; y <= homeY; y++) { carveCell(48, y); carveCell(49, y); }
    storeX = ENT + 16;
    storeY = SURF + 14;
    carveDisk(storeX, storeY, 5.2, 3.4);
    for (let x = ENT; x <= storeX; x++) { carveCell(x, storeY); carveCell(x, storeY + 1); }
    for (let x = ENT - 10; x <= ENT; x++) carveCell(x, SURF + 4);
    carveDisk(ENT - 10, SURF + 6, 3.2, 2.2);
    for (let x = ENT + 1; x <= ENT + 12; x++) carveCell(x, SURF + 28);
    carveDisk(ENT + 12, SURF + 30, 3.4, 2.6);
  }

  function makeAnt(x, y, kind) {
    return {
      x: x, y: y, tx: x, ty: y,
      kind: kind, state: kind ? ST_QUEEN : ST_DIG,
      carry: 0, carryAmt: 0,
      cool: Math.random() * 0.25,
      scurry: 0,
      phase: Math.random() * 6.28,
      stuck: 0,
      dir: Math.random() < 0.5 ? -1 : 1,
      jobT: 3 + Math.random() * 5
    };
  }
  function recount() {
    workerCount = 0;
    queen = null;
    for (let i = 0; i < ants.length; i++) {
      if (ants[i].kind === 1) queen = ants[i];
      else workerCount++;
    }
  }
  function recomputeFood() {
    foodCache = 0;
    for (let i = 0; i < foods.length; i++) if (foods[i].home) foodCache += foods[i].amount;
  }
  function consume(amt) {
    if (amt <= 0 || foodCache <= 0) return;
    let need = amt;
    for (let i = foods.length - 1; i >= 0 && need > 0.0001; i--) {
      const f = foods[i];
      if (!f.home) continue;
      const t = Math.min(f.amount, need);
      f.amount -= t;
      need -= t;
      foodCache -= t;
      if (f.amount <= 0.3) foods.splice(i, 1);
    }
    if (foodCache < 0) foodCache = 0;
  }
  function addFood(x, y, kind, amount, home) {
    for (let i = 0; i < foods.length; i++) {
      const f = foods[i];
      if (f.home !== home || f.kind !== kind) continue;
      if (Math.abs(f.x - x) < 2.4 && Math.abs(f.y - y) < 2.4) {
        f.amount += amount;
        if (home) foodCache += amount;
        return;
      }
    }
    if (foods.length >= 46) {
      let bi = -1, ba = -1;
      for (let i = 0; i < foods.length; i++) {
        if (foods[i].kind === kind && foods[i].home === home && foods[i].amount > ba) {
          ba = foods[i].amount; bi = i;
        }
      }
      if (bi >= 0) {
        foods[bi].amount += amount;
        if (home) foodCache += amount;
        return;
      }
    }
    foods.push({ x: x, y: y, kind: kind, amount: amount, home: home, age: 0 });
    if (home) foodCache += amount;
  }
  function spawnWorker(x, y) {
    if (workerCount >= cap) return null;
    const n = nearestWalk(Math.floor(x), Math.floor(y));
    const a = makeAnt(n[0] + 0.5, n[1] + 0.5, 0);
    ants.push(a);
    workerCount++;
    chooseJob(a);
    return a;
  }
  function chooseJob(ant) {
    if (ant.kind === 1) { ant.state = ST_QUEEN; return; }
    const hungry = foodCache < 26 + workerCount * 0.35;
    let wD = canDig() ? 0.48 : 0.06;
    let wN = brood.length ? 0.26 : 0;
    if (hungry) { wD *= 0.45; wN *= 0.55; }
    const wF = Math.max(0.22, 1 - wD - wN);
    const sum = wD + wN + wF;
    let r = Math.random() * sum;
    if ((r -= wD) < 0) ant.state = ST_DIG;
    else if ((r -= wN) < 0) ant.state = ST_NURSE;
    else ant.state = ST_FORAGE;
  }

  function seedAnts() {
    ants.length = 0;
    brood.length = 0;
    foods.length = 0;
    crumbs.length = 0;
    queen = makeAnt(homeX + 0.5, homeY + 0.5, 1);
    ants.push(queen);
    const spots = [];
    for (let y = SURF + 1; y < GH - 1; y++) {
      for (let x = 1; x < GW - 1; x++) if (soil[y * GW + x] === AIR) spots.push(x, y);
    }
    for (let n = 0; n < 12; n++) {
      const i = ((hash2(n + 3, 11) % (spots.length / 2)) | 0) * 2;
      ants.push(makeAnt(spots[i] + 0.5, spots[i + 1] + 0.5, 0));
    }
    for (let n = 0; n < 4; n++) {
      const x = 18 + n * 16;
      ants.push(makeAnt(x + 0.5, (SURF - 1) + 0.5, 0));
    }
    const broodSpots = [];
    for (let y = homeY - 3; y <= homeY + 3; y++) {
      for (let x = homeX - 4; x <= homeX + 4; x++) if (walkable(x, y)) broodSpots.push(x, y);
    }
    const stages = [0, 0, 0, 1, 1, 2, 2];
    for (let i = 0; i < stages.length; i++) {
      const s = broodSpots[(i * 3) % broodSpots.length];
      brood.push({ x: s[0] + 0.5, y: s[1] + 0.5, stage: stages[i], prog: (i % 3) * 0.2 });
    }
    addFood(storeX + 0.5, storeY + 0.5, 0, 46, true);
    addFood(storeX + 1.5, storeY - 0.5, 1, 54, true);
    foods.push({ x: 28.5, y: (SURF - 1) + 0.5, kind: 0, amount: 30, home: false, age: 0 });
    foods.push({ x: 86.5, y: (SURF - 1) + 0.5, kind: 2, amount: 48, home: false, age: 0 });
    setMat(22, SURF - 1, PEBBLE);
    recount();
    for (let i = 0; i < ants.length; i++) if (ants[i].kind === 0) chooseJob(ants[i]);
  }

  function bfs(dist, seeds) {

    if (tool === 'stone') {
      let ix = clamp(x | 0, 2, GW - 3), iy = y | 0;
      if (iy < SURF) iy = SURF - 1;
      if (iy >= GH - 1) return;
      if (Math.abs(ix - ENT) <= 1 && iy <= SURF + 1) { toast('Der Eingang bleibt frei.'); return; }
      const m = soil[iy * GW + ix];
      if (m === FRAME || m === ROCK || m === PEBBLE || iy < SURF - 1) { toast('Hier ist kein Platz.'); return; }
      setMat(ix, iy, PEBBLE);
      digsSince += 6;
      toast('Ein Kiesel liegt im Weg.');
      blip(180, 120, 0.1, 0.04);
      return;
    }
    const kind = tool === 'apple' ? 2 : tool === 'seed' ? 1 : 0;
    const amount = kind === 2 ? 140 : kind === 1 ? 78 : 36;
    let fx = clamp(x, 2, GW - 3);
    let fy = y;
    let home = false;
    if (fy < SURF) fy = (SURF - 1) + 0.5;
    else {
      const ix = fx | 0, iy = fy | 0;
      if (walkable(ix, iy)) { fx = ix + 0.5; fy = iy + 0.5; home = iy > SURF; }
      else fy = (SURF - 1) + 0.5;
    }
    addFood(fx, fy, kind, amount, home);
    if (home) foodGathered += amount;
    toast(kind === 2 ? 'Ein Apfelschnitz.' : kind === 1 ? 'Ein Samen für die Kolonie.' : 'Zuckerkrümel auf der Wiese.');
    blip(660, 440, 0.1, 0.04);
  }
  function pointerPos(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left - ox) / scale,
      y: (ev.clientY - r.top - oy) / scale,
      px: ev.clientX - r.left,
      py: ev.clientY - r.top
    };
  }
  function onBezel(p) {
    const t = Math.max(8, scale + 4);
    const left = ox - t, top = oy - t, right = ox + GW * scale + t, bot = oy + GH * scale + t;
    if (p.px < left || p.py < top || p.px > right || p.py > bot) return false;
    const inside = p.px >= ox && p.px <= ox + GW * scale && p.py >= oy && p.py <= oy + GH * scale;
    return !inside;
  }
  function openNote(open) {
    document.getElementById('note').hidden = !open;
    document.getElementById('scrim').hidden = !open;
    if (open) updateHud();
  }

  function setupAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = new AC();
    const master = ac.createGain();
    master.gain.value = 0.8;
    master.connect(ac.destination);
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const data = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      b = b * 0.97 + w * 0.03;
      data[i] = b * 2.2;
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 680;
    const ng = ac.createGain();
    ng.gain.value = 0;
    src.connect(lp); lp.connect(ng); ng.connect(master);
    const rf = ac.createBiquadFilter();
    rf.type = 'highpass';
    rf.frequency.value = 900;
    const rg = ac.createGain();
    rg.gain.value = 0;
    src.connect(rf); rf.connect(rg); rg.connect(master);
    src.start();
    function osc(freq, type) {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      const g = ac.createGain();
      g.gain.value = 0;
      o.connect(g); g.connect(master); o.start();
      return g;
    }
    audio = { ac: ac, master: master, ng: ng, rg: rg, buf: buf, d1: osc(196, 'sine'), d2: osc(247, 'sine'), d3: osc(330, 'triangle') };
  }
  function ramp(g, v) {
    if (!audio) return;
    const t = audio.ac.currentTime;
    g.gain.setTargetAtTime(Math.max(0, v), t, 0.3);
  }
  function updateAmb() {
    if (!audio) return;
    if (!soundOn) {
      ramp(audio.ng, 0); ramp(audio.rg, 0); ramp(audio.d1, 0); ramp(audio.d2, 0); ramp(audio.d3, 0);
      return;
    }
    const n = nightAmt();
    ramp(audio.ng, 0.03 * (1 - n * 0.5) + 0.006);
    ramp(audio.rg, rainingNow() ? 0.03 : 0);
    ramp(audio.d1, 0.011 * (1 - n));
    ramp(audio.d2, 0.008 * (1 - n));
    ramp(audio.d3, 0.005 * (1 - n));
    if (n > 0.35) {
      const t = audio.ac.currentTime;
      if (t >= nextChirp) {
        nextChirp = t + 0.22 + Math.random() * 0.5;
        chirpAt(t, 0.015 * n);
        chirpAt(t + 0.07, 0.012 * n);
      }
    }
  }
  function chirpAt(t, vol) {
    const src = audio.ac.createBufferSource();
    src.buffer = audio.buf;
    const f = audio.ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = 4600;
    f.Q.value = 9;
    const g = audio.ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.028);
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(t); src.stop(t + 0.04);
  }
  function noiseHit(freq, q, vol, dur) {
    if (!audio || !soundOn || fast) return;
    const t = audio.ac.currentTime;
    const src = audio.ac.createBufferSource();
    src.buffer = audio.buf;
    const f = audio.ac.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = freq;
    f.Q.value = q;
    const g = audio.ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(audio.master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function digSound() {
    const now = performance.now();
    if (now - lastDigAt < 90) return;
    lastDigAt = now;
    noiseHit(240 + Math.random() * 160, 0.7, 0.045, 0.08);
  }
  function rustle() {
    const now = performance.now();
    if (now - lastRustle < 120) return;
    lastRustle = now;
    noiseHit(500, 0.6, 0.02, 0.05);
  }
  function blip(f0, f1, dur, vol) {
    if (!audio || !soundOn || fast) return;
    const ac = audio.ac;
    const t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function glassSound() {
    blip(880, 420, 0.12, 0.04);
    noiseHit(1400, 0.5, 0.02, 0.06);
  }
  function updateSoundButton() {
    const b = document.getElementById('bSound');
    b.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    b.setAttribute('aria-label', soundOn ? 'Ton ist an. Tippe, um ihn auszuschalten' : 'Ton ist aus. Tippe, um ihn einzuschalten');
    b.querySelector('.ic').textContent = soundOn ? '🔊' : '🔇';
    b.classList.toggle('on', soundOn);
  }
  function toggleSound() {
    soundOn = !soundOn;
    if (soundOn) {
      try {
        if (!audio) setupAudio();
        if (audio && audio.ac.state === 'suspended') audio.ac.resume();
      } catch (e) { soundOn = false; }
    }
    updateSoundButton();
    toast(soundOn ? 'Ton ist an.' : 'Ton ist aus.');
    updateAmb();
  }

  let acc = 0;
  let lastT = 0;
  let hudAcc = 0;
  let saveAcc = 0;
  function frame(now) {
    const real = Math.min(0.05, lastT ? (now - lastT) / 1000 : 0.016);
    lastT = now;
    if (shake > 0) shake = Math.max(0, shake - real * 1.35);
    if (!paused) {
      acc += real;
      let guard = 0;
      while (acc >= SIM && guard < 4) { tick(SIM); acc -= SIM; guard++; }
      saveAcc += real;
      if (saveAcc > 8) { saveAcc = 0; persist(); }
    }
    tickRain(real);
    if (soundOn) updateAmb();
    draw(real);
    hudAcc += real;
    if (hudAcc > 0.3) { hudAcc = 0; updateHud(); }
    requestAnimationFrame(frame);
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(buildSave())); } catch (e) { /* full or blocked */ }
  }
  function broodCounts() {
    let eggs = 0, larvae = 0, pupae = 0;
    for (let i = 0; i < brood.length; i++) {
      if (brood[i].stage === 0) eggs++;
      else if (brood[i].stage === 1) larvae++;
      else pupae++;
    }
    return { eggs: eggs, larvae: larvae, pupae: pupae };
  }
  function stats() {
    recount();
    recomputeFood();
    const b = broodCounts();
    return {
      workers: workerCount,
      queen: queen ? 1 : 0,
      brood: brood.length,
      eggs: b.eggs,
      larvae: b.larvae,
      pupae: b.pupae,
      dug: dugTotal,
      gathered: Math.round(foodGathered),
      stored: Math.round(foodCache),
      days: dayNumber(),
      cap: cap,
      ants: ants.length,
      foods: foods.length,
      raining: rainingNow(),
      sim: simTime,
      born: born
    };
  }
  function audit() {
    rebuildBFS();
    let storeOk = false;
    for (let y = storeY - 2; y <= storeY + 2 && !storeOk; y++) {
      for (let x = storeX - 2; x <= storeX + 2; x++) {
        if (walkable(x, y) && distE[y * GW + x] < INF) storeOk = true;
      }
    }
    let outside = 0, nan = 0, maxStuck = 0, water = 0;
    for (let i = 0; i < ants.length; i++) {
      const a = ants[i];
      if (!Number.isFinite(a.x) || !Number.isFinite(a.y)) nan++;
      const x = a.x | 0, y = a.y | 0;
      if (!cellOk(x, y)) outside++;
      if (a.stuck > maxStuck) maxStuck = a.stuck;
    }
    for (let i = 0; i < soil.length; i++) if (soil[i] === WATER) water++;
    return { storeOk: storeOk, outside: outside, nan: nan, maxStuck: maxStuck, water: water, foods: foods.length, brood: brood.length, workers: workerCount };
  }

  document.getElementById('bSound').addEventListener('click', toggleSound);
  document.getElementById('bKnock').addEventListener('click', doKnock);
  document.getElementById('bTrails').addEventListener('click', function () {
    showTrails = !showTrails;
    const b = document.getElementById('bTrails');
    b.classList.toggle('on', showTrails);
    b.setAttribute('aria-pressed', showTrails ? 'true' : 'false');
    toast(showTrails ? 'Duftspuren sind an.' : 'Duftspuren sind aus.');
  });
  document.getElementById('bNote').addEventListener('click', function () { openNote(true); });
  document.getElementById('noteClose').addEventListener('click', function () { openNote(false); });
  document.getElementById('scrim').addEventListener('click', function () { openNote(false); });
  const toolButtons = ['bSugar', 'bSeed', 'bApple', 'bWater', 'bStone', 'bLight'];
  for (let i = 0; i < toolButtons.length; i++) {
    document.getElementById(toolButtons[i]).addEventListener('click', function (ev) {
      setTool(ev.currentTarget.dataset.tool);
    });
  }
  canvas.addEventListener('pointerdown', function (ev) {
    if (!document.getElementById('note').hidden) return;
    ev.preventDefault();
    const p = pointerPos(ev);
    if (onBezel(p)) { doKnock(); return; }
    if (p.x < -0.2 || p.y < -0.2 || p.x > GW + 0.2 || p.y > GH + 0.2) return;
    useTool(p.x, p.y);
  });
  window.addEventListener('keydown', function (ev) {
    const k = ev.key.toLowerCase();
    if (k === 'escape') { openNote(false); return; }
    if (k === 'm') toggleSound();
    else if (k === '1') setTool('sugar');
    else if (k === '2') setTool('seed');
    else if (k === '3') setTool('apple');
    else if (k === '4') setTool('water');
    else if (k === '5') setTool('stone');
    else if (k === 'l') setTool('light');
    else if (k === 'k') doKnock();
    else if (k === 'p') document.getElementById('bTrails').click();
    else if (k === 'n') openNote(document.getElementById('note').hidden);
  });
  window.addEventListener('resize', resize);
  window.addEventListener('pagehide', function () { if (!paused) persist(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && !paused) persist();
  });
  setTimeout(function () { document.getElementById('hint').classList.add('gone'); }, 7500);

  resize();
  let booted = false;
  if (!params.has('fresh')) {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { applySave(JSON.parse(raw)); booted = true; }
    } catch (e) { booted = false; }
  }
  if (!booted) fresh();
  finalize();
  updateHud();
  setTool('light');

  window.__antfarm = {
    ready: true,
    step: function (sec) {
      const n = Math.max(0, Math.round(sec / SIM));
      fast = true;
      for (let i = 0; i < n; i++) tick(SIM);
      fast = false;
      return stats();
    },
    stats: stats,
    audit: audit,
    exportState: function () { return JSON.stringify(buildSave()); },
    importState: function (s) { applySave(JSON.parse(s)); finalize(); },
    save: function () { persist(); return true; },
    load: function () {
      const raw = localStorage.getItem(KEY);
      if (!raw) return false;
      applySave(JSON.parse(raw));
      finalize();
      return true;
    },
    knock: doKnock,
    setTool: setTool,
    tap: useTool,
    types: function () {
      return { soil: soil.constructor.name, phero: phero.constructor.name, cap: cap };
    },
    debug: function () {
      rebuildBFS();
      const roles = {};
      let onSurface = 0;
      const carriers = [];
      for (let i = 0; i < ants.length; i++) {
        const a = ants[i];
        const key = (a.kind ? 'Q' : 'W') + a.state + 'c' + a.carry;
        roles[key] = (roles[key] || 0) + 1;
        if ((a.y | 0) <= SURF - 1) onSurface++;
        if (a.carry) carriers.push([Math.round(a.x), Math.round(a.y), a.carry, a.stuck]);
      }
      const loose = [];
      let homeN = 0;
      for (let i = 0; i < foods.length; i++) {
        const f = foods[i];
        if (f.home) homeN++;
        else loose.push([Math.round(f.x * 10) / 10, Math.round(f.y * 10) / 10, f.kind, Math.round(f.amount)]);
      }
      return {
        roles: roles,
        onSurface: onSurface,
        carriers: carriers.slice(0, 12),
        loose: loose,
        homeN: homeN,
        entranceDistS: distS[(SURF - 1) * GW + ENT],
        storeDistE: distE[storeY * GW + storeX],
        canDig: canDig()
      };
    }
  };

  requestAnimationFrame(frame);
})();
</script>
</body>
