<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangram</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: #3a2414;
    background: #c4956a;
    touch-action: manipulation;
  }
  h1 {
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.02em;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 8px 6px;
    background: linear-gradient(#8a542c, #6e4122);
    color: #fff6e8;
    max-width: 100%;
  }
  .bar h1 { color: #fff6e8; padding: 0 4px; }
  button {
    min-height: 40px;
    min-width: 40px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid #e6c59a;
    background: #f6e6cc;
    color: #3a2414;
    font: 600 15px/1.2 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 1px; }
  button[aria-pressed="true"] { background: #3a2414; color: #fff6e8; border-color: #3a2414; }
  button:active { transform: translateY(1px); }
  .help {
    margin: 0;
    padding: 0 10px 8px;
    background: #6e4122;
    color: #f6e6cc;
    font-size: 13px;
    line-height: 1.35;
  }
  #stage { position: relative; flex: 1; min-height: 0; min-width: 0; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #toast {
    position: absolute;
    left: 12px; right: 12px; bottom: 10px;
    text-align: center;
    color: #fff8ee;
    background: rgba(48, 28, 14, 0.78);
    border-radius: 12px;
    padding: 8px 10px;
    font-size: 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s linear;
  }
  #toast.show { opacity: 1; }
  #win {
    position: absolute;
    left: 0; right: 0; top: 10%;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  #win[hidden] { display: none !important; }
  #win .card {
    pointer-events: auto;
    max-width: calc(100% - 24px);
    background: #fff8ee;
    color: #3a2414;
    border-radius: 18px;
    padding: 16px 16px 14px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(40, 20, 8, 0.35);
    border: 2px solid #e2b56a;
  }
  #win h2 { font-family: Palatino, Georgia, serif; margin: 0 0 4px; font-size: 28px; }
  #win p { margin: 0 0 12px; }
  #win .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #picker {
    position: fixed;
    inset: 0;
    background: rgba(40, 22, 10, 0.46);
    z-index: 5;
    overflow: auto;
    padding: 12px;
  }
  #picker[hidden] { display: none !important; }
  #picker .sheet {
    max-width: 920px;
    margin: 0 auto;
    background: #fff8ee;
    border-radius: 16px;
    padding: 12px;
  }
  #pickGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 8px;
  }
  #pickGrid button {
    min-width: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 6px;
  }
  #pickGrid canvas { width: 100%; height: 64px; background: #efe2cc; border-radius: 8px; touch-action: auto; }
  #pickGrid .nm { font-size: 13px; }
  .mark { color: #2f7a3a; font-weight: 700; }
</style>
</head>
<body>
  <header class="bar">
    <h1>Tangram</h1>
    <button type="button" id="btnMode" aria-pressed="false">Rätsel</button>
    <button type="button" id="btnPrev" aria-label="Vorheriges Rätsel">‹</button>
    <button type="button" id="btnList" aria-haspopup="dialog">Quadrat</button>
    <button type="button" id="btnNext" aria-label="Nächstes Rätsel">›</button>
    <span id="count" aria-live="polite">0 von 0</span>
    <button type="button" id="btnRot">Drehen</button>
    <button type="button" id="btnFlip">Wenden</button>
    <button type="button" id="btnTip">Tipp</button>
    <button type="button" id="btnMix">Mischen</button>
    <button type="button" id="btnSound" aria-pressed="false">Ton</button>
  </header>
  <p class="help">Ziehen. Drehen mit Knopf, Mausrad oder zwei Fingern. Wenden spiegelt das Parallelogramm.</p>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast" role="status"></div>
    <div id="win" hidden>
      <div class="card">
        <h2>Geschafft!</h2>
        <p id="winName">Die Figur steht.</p>
        <div class="row">
          <button type="button" id="winStay">Schliessen</button>
          <button type="button" id="winNext">Weiter</button>
        </div>
      </div>
    </div>
  </div>
  <div id="picker" hidden role="dialog" aria-label="Rätsel wählen">
    <div class="sheet">
      <button type="button" id="pickClose">Schliessen</button>
      <div id="pickGrid"></div>
    </div>
  </div>

function metrics() {
  if (mode !== 'puzzle') {
    return { minX: -5.2, maxX: 5.2, minY: -4.4, maxY: 4.2, cols: 4, rows: 2, gapX: 1.7, gapY: 1.8, mid: 0, baseY: -1.2 };
  }
  const b = bounds(solutionPolys());
  const short = cssH < 520 && cssW > cssH;
  const cols = short ? 7 : 4;
  const rows = short ? 1 : 2;
  const gapX = 1.65, gapY = 1.8;
  const dockW = (cols - 1) * gapX;
  const mid = (b.minX + b.maxX) / 2;
  const side = 1.7;
  return {
    minX: Math.min(b.minX - side, mid - dockW / 2 - side),
    maxX: Math.max(b.maxX + side, mid + dockW / 2 + side),
    maxY: b.maxY + 1.05,
    minY: b.minY - 1.2 - rows * gapY - 0.55,
    cols, rows, gapX, gapY, mid,
    baseY: b.minY - 1.25

function loadSave() {

    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!s || typeof s !== 'object') return;
    soundOn = !!s.sound;
    if (s.mode === 'free' || s.mode === 'puzzle') mode = s.mode;
    if (Array.isArray(s.solved)) for (const id of s.solved) solved[id] = true;
    if (s.lay && typeof s.lay === 'object') layouts = s.lay;
    const ix = PUZZLES.findIndex(p => p.id === s.puzzle);

  } catch (e) { /* private mode */ }
}

document.getElementById('winNext').addEventListener('click', () => { hideWin(); openPuzzle(puzzleIx + 1); });
document.getElementById('picker').addEventListener('click', e => { if (e.target.id === 'picker') document.getElementById('picker').hidden = true; });

function openPicker() {
  const grid = document.getElementById('pickGrid');
  grid.replaceChildren();
  PUZZLES.forEach((pz, ix) => {
    const b = document.createElement('button');
    b.type = 'button';
    const mini = document.createElement('canvas');
    mini.width = 160; mini.height = 96;
    drawMini(mini, pz);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = pz.name + (solved[pz.id] ? ' ✓' : '');
    b.append(mini, nm);
    b.addEventListener('click', () => {
      document.getElementById('picker').hidden = true;
      if (mode === 'free') setMode('puzzle');
      openPuzzle(ix);
    });
    grid.appendChild(b);
  });
  document.getElementById('picker').hidden = false;
}
function drawMini(canvas, pz) {
  const m = canvas.getContext('2d');
  const polys = pz.poses.map(verts);
  const b = bounds(polys);
  const pad = 0.2;
  const w = b.w + pad * 2, h = b.h + pad * 2;
  const scale = Math.min(canvas.width / w, canvas.height / h);
  const ox = (canvas.width - w * scale) / 2 - (b.minX - pad) * scale;
  const oy = (canvas.height - h * scale) / 2 + (b.maxY + pad) * scale;
  m.clearRect(0, 0, canvas.width, canvas.height);
  m.fillStyle = '#3a4a3c';
  m.fillRect(0, 0, canvas.width, canvas.height);
  m.fillStyle = '#1c140e';
  for (const poly of polys) {
    m.beginPath();
    poly.forEach((p, i) => {
      const x = ox + p[0] * scale, y = oy - p[1] * scale;
      if (i) m.lineTo(x, y); else m.moveTo(x, y);
    });
    m.closePath();
    m.fill();
  }
}

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if (e.key === 'Escape') { document.getElementById('picker').hidden = true; hideWin(); return; }
  if (e.key === 'ArrowLeft') openPuzzle(puzzleIx - 1);
  else if (e.key === 'ArrowRight') openPuzzle(puzzleIx + 1);
  else if (e.key === 'r' || e.key === 'R') rotate(selected(), 1);
  else if (e.key === 'w' || e.key === 'W') flip(selected());
  else if (e.key === 't' || e.key === 'T') tip();
  else if (e.key === 'm' || e.key === 'M') mix();
  else return;
  e.preventDefault();
});

window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.getElementById('stage'));

loadSave();
openPuzzle(puzzleIx);
resize();

window.TANGRAM = {
  puzzles: () => PUZZLES.map(p => ({ id: p.id, name: p.name })),
  mode: () => mode,
  puzzleId: () => puzzle().id,
  soundOn: () => soundOn,
  audio: () => actx,
  solved: () => Object.keys(solved),
  isSolved: id => !!solved[id],
  placeSolution(id) {
    const ix = id ? PUZZLES.findIndex(p => p.id === id) : puzzleIx;
    if (ix < 0) return null;
    mode = 'puzzle';
    puzzleIx = ix;
    hideWin();
    pieces = freshPieces();
    selectedId = null;
    maskKey = '';
    fit();
    const res = maybeCelebrate(true);
    draw();
    return res;
  },
  nudge(id, dx, dy) {
    const p = pieceById(id);
    if (!p) return;
    p.x += dx; p.y += dy;
    draw();
    return checkNow();
  },
  check: checkNow,
  resize,
  buttons() {
    return [...document.querySelectorAll('button')].filter(b => !b.closest('#picker') || !document.getElementById('picker').hidden).map(b => {
      const r = b.getBoundingClientRect();
      return { t: b.textContent.trim(), w: r.width, h: r.height, x: r.x, right: r.right };
    });
  }
};
