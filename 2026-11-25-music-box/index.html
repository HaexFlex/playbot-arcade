<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spieldosen-Werkstatt</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Spieldosen-Werkstatt: Stifte in eine Messingwalze setzen, Kurbel drehen oder die Feder aufziehen.">
<meta name="theme-color" content="#c49a6a">
<style>
html,body{margin:0;height:100%;background:#c49a6a;color:#3b2415;font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,"Times New Roman",serif;-webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;min-height:100%;display:flex;flex-direction:column}
#main{flex:1 1 34%;min-height:190px;display:flex;flex-direction:column;min-width:0}
header{padding:max(8px,env(safe-area-inset-top)) 12px 4px;display:flex;flex-direction:column;gap:2px}
h1{margin:0;font-size:clamp(18px,2.4vw,28px);font-weight:700;letter-spacing:.01em;line-height:1.1}
#help,#hint{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.3;opacity:.9}
#hint{min-height:1.3em;font-weight:600}
#stage{flex:1;min-height:150px;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.hold{cursor:grabbing}
#side{flex:1 1 66%;min-height:0;display:flex;flex-direction:column;background:linear-gradient(#e7c8a2,#d7b088);border-top:1px solid rgba(80,40,16,.25)}
#rollHead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px 2px;font-family:system-ui,sans-serif;font-size:13px}
#wind{font-variant-numeric:tabular-nums;opacity:.8}
#rollWrap{flex:1;min-height:0;overflow:auto;padding:2px 8px 6px;-webkit-overflow-scrolling:touch}
#roll{--cell:22px;--row:20px;--lab:42px;width:max-content}
#roll .ruler,#roll .row{display:grid;grid-template-columns:var(--lab) repeat(32,var(--cell));gap:3px;margin-bottom:3px;align-items:center}
#roll .nl{font:600 10px/1.1 system-ui,sans-serif;text-align:right;padding-right:4px;opacity:.8}
#roll .ruler i{font:600 9px/1 system-ui,sans-serif;font-style:normal;text-align:center;opacity:.55}
#roll .ruler i.now{opacity:1;color:#6b3a22}
button{touch-action:manipulation}
#roll button{width:var(--cell);height:var(--row);padding:0;border-radius:4px;border:1px solid #6b4528;background:radial-gradient(circle at 50% 40%,#a87848,#6a4326 70%);cursor:pointer}
#roll button.on{background:radial-gradient(circle at 35% 30%,#fff4c8,#e0b03a 45%,#8d6416);border-color:#5c4010;box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
#roll button.now{outline:1px solid rgba(90,40,10,.55);outline-offset:-1px}
#roll button.beat{margin-left:0}
#roll button:focus-visible,#bar button:focus-visible{outline:2px solid #8a3d12;outline-offset:2px}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:6px 8px max(8px,env(safe-area-inset-bottom));box-sizing:border-box}
#bar button{font:600 14px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#3b2415;background:#f6e6cc;border:1px solid #8a5a32;border-radius:999px;padding:8px 10px;min-height:40px;cursor:pointer}
#bar button.on,#bar button.sel{background:#6b3a22;color:#f8ecd8;border-color:#4a2614}
#bar button.full{box-shadow:inset 0 -3px 0 #e0b03a}
@media (pointer:coarse){#roll{--cell:24px;--row:22px}}
@media (min-width:1100px){#roll{--cell:24px;--row:22px;--lab:48px}#help{font-size:14px}}
@media (max-width:420px){#bar button{padding:8px 8px;font-size:13px}#help{display:none}}
@media (orientation:landscape) and (max-height:560px){
  #app{flex-direction:row}
  #main{flex:1 1 56%;min-height:0}
  #side{flex:1 1 44%;width:min(460px,48vw);border-top:0;border-left:1px solid rgba(80,40,16,.25)}
  header{padding-top:6px}
  h1{font-size:18px}
  #help{display:none}
  #stage{min-height:0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <header>
      <h1>Spieldosen-Werkstatt</h1>
      <p id="help">Tippe Stifte ins Raster. Drehe die Kurbel oder ziehe die Feder auf.</p>
      <p id="hint" role="status" aria-live="polite"></p>
    </header>
    <div id="stage"><canvas id="c" aria-label="Werkbank von oben: offene Spieldose mit Walze, Kamm, Tänzerin, Kurbel und Feder"></canvas></div>
  </div>
  <div id="side">
    <div id="rollHead"><span>Stifte auf der Walze</span><span id="wind">Feder 0%</span></div>
    <div id="rollWrap"><div id="roll" role="grid" aria-label="Stifte der Walze, hohe Töne oben"></div></div>
    <div id="bar" role="toolbar" aria-label="Werkstatt">
      <button type="button" id="bEnt" title="Alle meine Entchen">Entchen</button>
      <button type="button" id="bWeih" title="Morgen kommt der Weihnachtsmann">Weihnacht</button>
      <button type="button" id="bWalz" title="Kleiner Walzer">Walzer</button>
      <button type="button" id="bClear">Leeren</button>
      <button type="button" id="bScale" aria-label="Tonleiter: Dur">Dur</button>
      <button type="button" id="bP0" aria-pressed="true">Platz 1</button>
      <button type="button" id="bP1" aria-pressed="false">Platz 2</button>
      <button type="button" id="bP2" aria-pressed="false">Platz 3</button>
      <button type="button" id="bSave" title="In den gewählten Platz merken">Merken</button>
      <button type="button" id="bLoad" title="Gewählten Platz laden">Laden</button>
      <button type="button" id="bShare">Teilen</button>
      <button type="button" id="bSound" aria-pressed="false" aria-label="Ton ist aus">Ton aus</button>
    </div>
  </div>
</div>
<script>
'use strict';
(function () {
  const STEPS = 32, TEETH = 15, MAX_WIND = 6, WIND_PER_REV = 1.15, TAU = Math.PI * 2;
  const STORE = 'spieldose-werkstatt-v1';
  const SCALES = [
    { name: 'Dur', iv: [0, 2, 4, 5, 7, 9, 11] },
    { name: 'Pentatonik', iv: [0, 2, 4, 7, 9] },
    { name: 'Moll', iv: [0, 2, 3, 5, 7, 8, 10] },
    { name: 'Mixolydisch', iv: [0, 2, 4, 5, 7, 9, 10] }
  ];
  const NOTE_DE = ['C', 'Cis', 'D', 'Dis', 'E', 'F', 'Fis', 'G', 'Gis', 'A', 'Ais', 'H'];
  const DETUNE = [-6, 4, -3, 7, -2, 5, -8, 3, 1, -4, 6, -5, 2, -1, 8];
  const DEG = { C: 0, D: 1, E: 2, F: 3, G: 4, A: 5, H: 6, c: 7, d: 8, e: 9, f: 10, g: 11, a: 12, h: 13, x: 14 };

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mod = (n, m) => ((n % m) + m) % m;
  function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function noteLabel(m) { return NOTE_DE[m % 12] + (Math.floor(m / 12) - 1); }

  function parseTune(text) {
    const toks = text.trim().split(/\s+/);
    if (toks.length !== STEPS) throw new Error('tune length ' + toks.length);
    return toks.map(tok => {
      if (tok === '.') return [];
      return tok.split('+').map(n => {
        if (!Object.prototype.hasOwnProperty.call(DEG, n)) throw new Error('bad note ' + n);
        return DEG[n];
      });
    });
  }

  // 32 steps around the cylinder. Rests are ".". Chords join with "+".
  // Letters: C D E F G A H in the lower octave, c d e f g a h one octave up, x = top C.
  const DEMOS = [
    { name: 'Alle meine Entchen', rows: parseTune('C D E F G G A A A A G . A A A A G . . . F F F F E E E E D D D C') },
    { name: 'Morgen kommt der Weihnachtsmann', rows: parseTune('C C G G A A G . F F E E D D C . G G F F E E D . G G F F E E D .') },
    { name: 'Kleiner Walzer', rows: parseTune('C+G E G+c C+A G E+A C+F G A+c G+c E C+G C+E G c D+G c H+G C+A G F+A C+E D C+G G+c+g e G+c C+G+c . . . .') }
  ];

  const pins = new Uint16Array(STEPS);
  const toothMidiN = new Float64Array(TEETH);
  const toothHz = new Float64Array(TEETH);
  const toothAmp = new Float64Array(TEETH);
  const toothPh = new Float64Array(TEETH);
  const combTips = Array.from({ length: TEETH }, () => ({ x: 0, y: 0 }));
  const sparks = Array.from({ length: 36 }, () => ({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1 }));
  const PIN_POOL = Array.from({ length: STEPS * TEETH }, () => ({ x: 0, y: 0, r: 0, a: 0, z: 0 }));
  const events = [];
  let sparkI = 0, scaleIx = 0, pos = -0.001, crankAngle = 0, keyAngle = 0, wind = 0, springOn = false;
  let holdingCrank = false, holdingKey = false, saidEnd = false, soundOn = false, userMuted = false, announced = false;
  let sel = 0, slots = [null, null, null], windShown = 0, head = 0, headReady = false;
  let ac = null, master = null, dry = null, send = null, noiseBuf = null, voices = 0, saveTimer = 0;
  let lastLayout = null, wood = null, woodW = 0, woodH = 0, reduceMotion = false;

  const canvas = $('c'), ctx = canvas.getContext('2d', { alpha: false });
  const roll = $('roll'), rollWrap = $('rollWrap'), hint = $('hint'), elWind = $('wind');
  const bScale = $('bScale'), bSound = $('bSound');
  const slotBtns = [$('bP0'), $('bP1'), $('bP2')];
  const btns = Array.from({ length: TEETH }, () => new Array(STEPS));
  const colEls = Array.from({ length: STEPS }, () => []);
  const labels = new Array(TEETH);
  const rulerCells = [];

  try { reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduceMotion = false; }

  function say(msg) { hint.textContent = msg; }

  function toothMidiOf(i) {
    const iv = SCALES[scaleIx].iv, n = iv.length;
    return 72 + iv[i % n] + 12 * Math.floor(i / n);
  }
  function rebuildFreqs() {
    for (let i = 0; i < TEETH; i++) {
      toothMidiN[i] = toothMidiOf(i);
      toothHz[i] = midiHz(toothMidiN[i]) * Math.pow(2, DETUNE[i] / 1200);
    }
  }

  function encodeHash() {
    let s = '';
    for (let i = 0; i < STEPS; i++) s += String.fromCharCode(pins[i] & 255, (pins[i] >> 8) & 127);
    const b64 = btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    return '#w' + scaleIx + '.' + b64;
  }
  function applyHash(h) {
    const m = /^#?w([0-3])\.([A-Za-z0-9_-]+)$/.exec(h || '');
    if (!m) return false;
    let b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    let bin;
    try { bin = atob(b64); } catch (e) { return false; }
    if (bin.length < STEPS * 2) return false;
    scaleIx = +m[1];
    rebuildFreqs();
    for (let i = 0; i < STEPS; i++) pins[i] = (bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8)) & 0x7fff;
    refreshScaleUi();
    syncGrid();
    return true;
  }

  function refreshScaleUi() {
    bScale.textContent = SCALES[scaleIx].name;
    bScale.setAttribute('aria-label', 'Tonleiter: ' + SCALES[scaleIx].name);
    for (let t = 0; t < TEETH; t++) {
      const name = noteLabel(toothMidiN[t]);
      if (labels[t]) labels[t].textContent = name;
      for (let s = 0; s < STEPS; s++) {
        const b = btns[t][s];
        if (b) b.setAttribute('aria-label', 'Schritt ' + (s + 1) + ', ' + name);
      }
    }
  }
  function setScale(i, quiet) {
    scaleIx = ((i % 4) + 4) % 4;
    rebuildFreqs();
    refreshScaleUi();
    if (!quiet) {
      say('Tonleiter: ' + SCALES[scaleIx].name + '. Dieselben Stifte, neue Stimmung.');
      persistCur();
    }
  }

  function paintCell(s, t) {
    const on = (pins[s] & (1 << t)) !== 0;
    const b = btns[t][s];
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function syncGrid() {
    for (let t = 0; t < TEETH; t++) for (let s = 0; s < STEPS; s++) paintCell(s, t);
  }
  function setPin(s, t, on) {
    if (s < 0 || s >= STEPS || t < 0 || t >= TEETH) return;
    if (on) pins[s] |= 1 << t; else pins[s] &= ~(1 << t);
    paintCell(s, t);
    persistCur();
  }
  function togglePin(s, t) { setPin(s, t, (pins[s] & (1 << t)) === 0); }
  function applyPattern(rows) {
    pins.fill(0);
    for (let s = 0; s < STEPS; s++) {
      const teeth = rows[s] || [];
      for (let i = 0; i < teeth.length; i++) {
        const t = teeth[i];
        if (t >= 0 && t < TEETH) pins[s] |= 1 << t;
      }
    }
    syncGrid();
  }
  function clearPins() {
    pins.fill(0);
    syncGrid();
    persistCur();
    say('Walze geleert.');
  }
  function loadDemo(i) {
    const d = DEMOS[i];
    if (!d) return;
    setScale(0, true);
    applyPattern(d.rows);
    seek(-0.001);
    persistCur();
    revealPins();
    say(d.name + ' geladen.');
  }

  function readStore() {
    try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; }
  }
  function writeStore() {
    try {
      localStorage.setItem(STORE, JSON.stringify({ v: 1, sel: sel, slots: slots, cur: encodeHash() }));
    } catch (e) {}
  }
  function persistCur() {
    const h = encodeHash();
    try { history.replaceState(null, '', h); } catch (e) {}
    clearTimeout(saveTimer);
    saveTimer = setTimeout(writeStore, 160);
  }
  function refreshSlots() {
    for (let i = 0; i < 3; i++) {
      slotBtns[i].classList.toggle('sel', i === sel);
      slotBtns[i].classList.toggle('full', !!slots[i]);
      slotBtns[i].setAttribute('aria-pressed', i === sel ? 'true' : 'false');
    }
  }
  function saveSlot(i) {
    sel = clamp(i | 0, 0, 2);
    slots[sel] = encodeHash();
    refreshSlots();
    writeStore();
    say('In Platz ' + (sel + 1) + ' gemerkt.');
  }
  function loadSlot(i) {
    sel = clamp(i | 0, 0, 2);
    refreshSlots();
    const h = slots[sel];
    if (!h || !applyHash(h)) { writeStore(); say('Platz ' + (sel + 1) + ' ist leer.'); return false; }
    seek(-0.001);
    persistCur();
    revealPins();
    say('Platz ' + (sel + 1) + ' geladen.');
    return true;
  }

  function bootStore() {
    const data = readStore();
    if (data && data.v === 1 && Array.isArray(data.slots)) {
      slots = [data.slots[0] || null, data.slots[1] || null, data.slots[2] || null];
      sel = clamp(data.sel | 0, 0, 2);
    }
    refreshSlots();
    if (applyHash(location.hash)) return;
    if (data && data.cur) applyHash(data.cur);
  }

  function ensureAudio() {
    if (ac) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ac = new AC(); } catch (e) { ac = null; return false; }
    master = ac.createGain();
    master.gain.value = 0.0001;
    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 240;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 10;
    comp.ratio.value = 3.2;
    comp.attack.value = 0.003;
    comp.release.value = 0.18;
    dry = ac.createGain();
    dry.gain.value = 1;
    send = ac.createGain();
    send.gain.value = 0.22;
    const delay = ac.createDelay(0.3);
    delay.delayTime.value = 0.038;
    const fb = ac.createGain();
    fb.gain.value = 0.22;
    const damp = ac.createBiquadFilter();
    damp.type = 'lowpass';
    damp.frequency.value = 2800;
    send.connect(delay);
    delay.connect(damp);
    damp.connect(fb);
    fb.connect(delay);
    damp.connect(dry);
    dry.connect(hp);
    hp.connect(comp);
    comp.connect(master);
    master.connect(ac.destination);
    const len = Math.floor(ac.sampleRate * 0.04);
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    return true;
  }
  function setSound(on) {
    if (on && !ensureAudio()) { say('Ton konnte nicht starten.'); return; }
    soundOn = !!on;
    if (ac && master) {
      if (ac.state === 'suspended') ac.resume();
      master.gain.setTargetAtTime(soundOn ? 0.4 : 0.0001, ac.currentTime, 0.015);
    }
    bSound.textContent = soundOn ? 'Ton an' : 'Ton aus';
    bSound.classList.toggle('on', soundOn);
    bSound.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    bSound.setAttribute('aria-label', soundOn ? 'Ton ist an' : 'Ton ist aus');
    if (soundOn && !announced) { announced = true; say('Ton an.'); }
    else if (!soundOn && announced) say('Ton aus.');
  }

  // Metallic comb: additive inharmonic partials plus a short FM bloom. Each tooth is detuned a few cents.
  function ring(tooth, when) {
    if (!ac || !soundOn || !dry) return;
    if (voices >= 20) return;
    voices++;
    const freq = toothHz[tooth];
    const dur = 0.95;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(0.85, when + 0.007);
    g.gain.exponentialRampToValueAtTime(0.0008, when + dur);
    g.connect(dry);
    g.connect(send);
    const stretch = 1 + tooth * 0.00022;
    const partials = [[1, 0.62], [2.007, 0.32], [3.98, 0.18], [5.81, 0.09], [8.66, 0.045]];
    for (let i = 0; i < partials.length; i++) {
      const ratio = partials[i][0], amp = partials[i][1];
      const o = ac.createOscillator();
      o.type = 'sine';
      const f = freq * (1 + (ratio - 1) * stretch);
      o.frequency.setValueAtTime(f * 1.006, when);
      o.frequency.exponentialRampToValueAtTime(f, when + 0.05);
      const pg = ac.createGain();
      pg.gain.value = amp;
      o.connect(pg);
      pg.connect(g);
      o.start(when);
      o.stop(when + dur + 0.02);
    }
    const car = ac.createOscillator();
    const modu = ac.createOscillator();
    const mi = ac.createGain();
    car.type = 'sine';
    modu.type = 'sine';
    car.frequency.setValueAtTime(freq * 1.01, when);
    car.frequency.exponentialRampToValueAtTime(freq, when + 0.08);
    modu.frequency.value = freq * (2.73 + tooth * 0.008);
    mi.gain.setValueAtTime(freq * 1.7, when);
    mi.gain.exponentialRampToValueAtTime(freq * 0.08, when + 0.16);
    modu.connect(mi);
    mi.connect(car.frequency);
    const cg = ac.createGain();
    cg.gain.value = 0.42;
    car.connect(cg);
    cg.connect(g);
    car.start(when);
    modu.start(when);
    car.stop(when + dur + 0.02);
    modu.stop(when + 0.2);
    const ns = ac.createBufferSource();
    ns.buffer = noiseBuf;
    const bp = ac.createBiquadFilter();
    bp.type = 'highpass';
    bp.frequency.value = 1600 + tooth * 40;
    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.16, when);
    ng.gain.exponentialRampToValueAtTime(0.0008, when + 0.028);
    ns.connect(bp);
    bp.connect(ng);
    ng.connect(g);
    ns.start(when);
    ns.stop(when + 0.04);
    setTimeout(() => { voices = Math.max(0, voices - 1); }, 1000);
  }

  function strike(step) {
    const mask = pins[step];
    const when = ac && soundOn ? ac.currentTime : 0;
    if (!mask) return;
    for (let t = 0; t < TEETH; t++) {
      if ((mask & (1 << t)) === 0) continue;
      events.push({ step: step, tooth: t, time: when, pos: pos });
      if (events.length > 6000) events.shift();
      toothAmp[t] = 1;
      toothPh[t] = 0;
      ring(t, when);
      if (!reduceMotion) {
        const s = sparks[sparkI];
        sparkI = (sparkI + 1) % sparks.length;
        const tip = combTips[t];
        s.x = tip.x; s.y = tip.y; s.vx = (t - 7) * 8; s.vy = -36 - (t % 3) * 8; s.life = 0.38; s.max = 0.38;
      }
    }
  }

  // Crossing an integer step rings that step. Forward: every k with from < k <= pos.
  // Backward: every k with pos <= k < from. One full turn from 0 rings steps 1..31 and then 0.
  function turn(d) {
    if (!Number.isFinite(d) || d === 0) return;
    const from = pos;
    pos += d;
    crankAngle = pos / STEPS * TAU;
    if (d > 0) {
      for (let k = Math.floor(from) + 1; k <= Math.floor(pos); k++) strike(mod(k, STEPS));
    } else {
      for (let k = Math.ceil(from) - 1; k >= Math.ceil(pos); k--) strike(mod(k, STEPS));
    }
    syncPlayhead();
  }

  function springRate() {
    return 0.65 + 6.4 * (wind / MAX_WIND);
  }
  function windLabel() {
    const p = Math.round(wind / MAX_WIND * 100);
    if (p !== windShown) { windShown = p; elWind.textContent = 'Feder ' + p + '%'; }
  }
  function tick(dt) {
    dt = clamp(dt, 0, 0.05);
    if (springOn && !holdingCrank && !holdingKey && wind > 0) {
      const d = springRate() * dt;
      wind = Math.max(0, wind - (d / STEPS) * WIND_PER_REV);
      keyAngle -= (d / STEPS) * TAU;
      if (wind <= 0.0008) {
        wind = 0;
        springOn = false;
        if (!saidEnd) { saidEnd = true; say('Die Feder ist abgelaufen.'); }
      }
      turn(d);
    }

  function mulberry32(a) {

    const rnd = mulberry32(20261125);
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#e8cba4');
    grd.addColorStop(0.45, '#d7ae7e');
    grd.addColorStop(1, '#c4925e');

      g.moveTo(0, y + 0.5);
      g.lineTo(c.width, y + 0.5);

      g.moveTo(x, y);

  function drawDancer(x, y, r, ang) {

    ctx.translate(x, y);

    pod.addColorStop(0, '#fffaf2');
    pod.addColorStop(1, '#e4d3bc');

    ctx.beginPath();
    ctx.ellipse(0, 6, r * 0.64, r * 0.2, 0, 0, TAU);

    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();

  function drawCylinder(cyl) {

  function drawComb(cyl) {
