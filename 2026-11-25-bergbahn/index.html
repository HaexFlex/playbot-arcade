<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bergbahn</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Baue eine Seilbahn durch ein Alpental. Masten, Kettenlinie, Gondeln, Kühe und Bauprüfung.">
<style>
html,body{margin:0;height:100%;background:#87b4d4;overflow:hidden;font-family:Palatino,"Palatino Linotype",Georgia,serif;color:#3a2a1c;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#top{position:fixed;z-index:3;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));
  display:flex;flex-direction:column;gap:6px;max-width:min(460px,calc(100vw - 72px));pointer-events:none}
#hud{background:rgba(255,248,236,.9);border:2px solid rgba(90,58,36,.35);border-radius:14px;
  padding:7px 12px 8px;box-shadow:0 2px 0 rgba(90,58,36,.12);line-height:1.35;pointer-events:none}
#hud b{display:block;font-size:18px;font-weight:600;letter-spacing:.2px}
#hud .row{font-size:14px;font-variant-numeric:tabular-nums}
#hud .hint{font-size:13px;opacity:.85;margin-top:2px}
#tools{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
button{font:600 14px/1 Palatino,Georgia,serif;color:#3a2a1c;background:rgba(255,248,236,.94);
  border:2px solid rgba(90,58,36,.4);border-radius:999px;min-height:40px;padding:0 12px;cursor:pointer}
button:focus-visible{outline:2px solid #c4683a;outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
#sound{position:fixed;z-index:4;right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));
  width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px}
#toast{position:fixed;z-index:4;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;
  background:rgba(255,248,236,.94);border:2px solid rgba(90,58,36,.35);border-radius:12px;
  padding:8px 14px;max-width:min(420px,90vw);pointer-events:none;opacity:0;transition:opacity .3s;font-size:16px}
#toast.show{opacity:1}
#sheet{position:fixed;z-index:6;inset:0;background:rgba(28,22,16,.35);display:flex;align-items:center;justify-content:center;padding:16px}
#sheet[hidden]{display:none}
#card{background:#fff8ec;border:2px solid rgba(90,58,36,.45);border-radius:16px;padding:14px 16px 12px;
  width:min(440px,100%);max-height:min(86vh,640px);overflow:auto;box-shadow:0 12px 40px rgba(40,24,12,.25)}
#card h2{margin:0 0 8px;font-size:22px;font-weight:600}
.block{border-top:1px solid rgba(90,58,36,.18);padding:8px 0}
.block h3{margin:0 0 4px;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums;padding:1px 0}
.kv span:last-child{font-weight:600}
#card .note{font-size:20px}
#close{margin-top:8px}
@media (max-width:700px){
  #hud b{font-size:16px}#hud .row,#hud .hint{font-size:13px}
  button{min-height:38px;font-size:13px;padding:0 10px}
}
@media (max-height:430px){
  #hud{padding:3px 8px}#hud b{font-size:14px}#hud .row,#hud .hint{font-size:12px}
  button,#sound{min-height:32px;height:32px;font-size:12px}
  #sound{width:36px;height:36px;font-size:16px}
  #toast{font-size:13px}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="Bergbahn. Tippe ins Tal für die Talstation, dann Masten den Hang hinauf, und die Bergstation auf den Gipfel."></canvas>
<div id="top">
  <div id="hud" aria-live="polite">
    <b>Bergbahn</b>
    <div class="row" id="stat">Fahrgäste 0 · Wind leicht</div>
    <div class="row" id="lineStat">Linie 1 · Talstation setzen</div>
    <div class="hint" id="hint">Tippe ins Tal für die Talstation.</div>
  </div>
  <div id="tools">
    <button type="button" id="season">Sommer</button>
    <button type="button" id="day">Tag</button>
    <button type="button" id="exam">Prüfung</button>
    <button type="button" id="run" disabled>Fahren</button>
    <button type="button" id="newline">Linie 2</button>
    <button type="button" id="reset">Neu</button>
  </div>
</div>
<button type="button" id="sound" aria-pressed="false" aria-label="Ton aus. Tippen zum Einschalten." title="Ton (M)">🔇</button>
<div id="toast" role="status"></div>
<div id="sheet" hidden>
  <div id="card" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Bauprüfung</h2>
    <div id="sheetBody"></div>
    <button type="button" id="close">Schliessen</button>
  </div>
</div>
<script>
'use strict';
(function () {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  function hash(i) {
    let x = Math.imul(i | 0, 374761393) + 668265263 | 0;
    x = Math.imul(x ^ (x >>> 13), 1274126177);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }
  function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function asRgb(c) { return typeof c === 'string' ? hex(c) : c; }
  function rgb(c, a) {
    const v = asRgb(c);
    if (a == null) return 'rgb(' + (v[0] | 0) + ',' + (v[1] | 0) + ',' + (v[2] | 0) + ')';
    return 'rgba(' + (v[0] | 0) + ',' + (v[1] | 0) + ',' + (v[2] | 0) + ',' + a + ')';
  }
  function mix(a, b, t) {
    const A = asRgb(a), B = asRgb(b);
    return [lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)];
  }

  const WORLD_W = 1000, WORLD_H = 760;
  const KNOTS = [
    [0, 76], [100, 84], [190, 98], [260, 128],
    [340, 168], [410, 214], [470, 258],
    [505, 340],
    [545, 362], [610, 400],
    [645, 488],
    [690, 512], [760, 548], [840, 578], [920, 598], [1000, 608]
  ];
  const PYLON_H = 70, STATION_H = 52, CLEAR = 8, TREE_PAD = 3;
  const MIN_SPAN = 50, MAX_SPAN = 158, CLIFF = 1.15;
  const KEY = 'playbot-bergbahn';
  const COLS = ['#d64545', '#3d7ec4', '#e0a030', '#3f8f46', '#c46b2c', '#7a4ea3'];

  function terrainY(x) {
    x = clamp(x, 0, 1000);
    for (let i = 0; i < KNOTS.length - 1; i++) {
      const a = KNOTS[i], b = KNOTS[i + 1];
      if (x >= a[0] && x <= b[0]) {
        const t = (x - a[0]) / (b[0] - a[0] || 1);
        return a[1] + (b[1] - a[1]) * t;
      }
    }
    return KNOTS[KNOTS.length - 1][1];
  }
  function slopeAt(x) {
    const e = 1.2;
    const x0 = clamp(x - e, 0, 1000), x1 = clamp(x + e, 0, 1000);
    return (terrainY(x1) - terrainY(x0)) / (x1 - x0 || 1);
  }
  function treeTop(x) {
    if (Math.abs(slopeAt(x)) > 1.05) return 0;
    if (x > 315 && x < 468) return 43;
    if (x >= 548 && x < 608) return 22;
    return 0;
  }
  function sampleXs(x1, x2) {
    const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
    const raw = [lo, hi];
    const step = 3;
    for (let x = Math.ceil((lo + 0.01) / step) * step; x < hi - 0.01; x += step) raw.push(x);
    for (let i = 0; i < KNOTS.length; i++) {
      const k = KNOTS[i][0];
      if (k > lo + 0.05 && k < hi - 0.05) raw.push(k);
    }
    raw.sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < raw.length; i++) {
      if (!out.length || raw[i] - out[out.length - 1] > 0.04) out.push(raw[i]);
    }
    if (x1 > x2) out.reverse();
    return out;
  }
  function catenary(x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    if (Math.abs(dx) < 1) return null;
    const a = Math.max(54, Math.abs(dx) * 0.95);
    const h = dx / 2;
    const sh = Math.sinh(h / a);
    if (!isFinite(sh) || Math.abs(sh) < 1e-8) return null;
    const d = a * Math.asinh(dy / (2 * a * sh));
    if (!isFinite(d)) return null;
    const x0 = (x1 + x2) / 2 - d;
    const c = y1 - a * Math.cosh((x1 - x0) / a);
    return function (x) { return c + a * Math.cosh((x - x0) / a); };
  }
  function spanProblem(x1, h1, x2, h2) {
    const f = catenary(x1, terrainY(x1) + h1, x2, terrainY(x2) + h2);
    if (!f) return 'near';
    const xs = sampleXs(x1, x2);
    let ground = false, tree = false;
    for (let i = 0; i < xs.length; i++) {
      const x = xs[i], cy = f(x), g = terrainY(x), tr = treeTop(x);
      if (cy < g + CLEAR - 0.05) ground = true;
      else if (tr && cy < g + CLEAR + tr + TREE_PAD - 0.05) tree = true;
    }
    if (ground) return 'ground';
    if (tree) return 'tree';
    return null;
  }

  const MSG = {
    valley: 'Die Talstation gehört ins Tal.',
    cliff: 'Hier ist es zu steil für einen Masten.',
    far: 'Zu weit vom letzten Masten.',
    near: 'Zu nah am letzten Masten.',
    back: 'Der Masten muss bergwärts stehen.',
    ground: 'Das Seil streift den Hang.',
    tree: 'Das Seil streift die Bäume.',
    summit: 'Die Bergstation gehört auf den Gipfel.',
    sky: 'Tippe auf den Hang.',
    done: 'Diese Linie ist schon fertig.',
    okvalley: 'Talstation steht.',
    okpylon: 'Mast steht.',
    oksummit: 'Bergstation steht. Gute Fahrt.'
  };

  const view = $('view');
  const ctx = view.getContext('2d', { alpha: false });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let viewW = 800, viewH = 600, scale = 1, originX = 0, originY = 0;
  let simT = 0, winterAmt = 0, winterTarget = 0, nightAmt = 0, nightTarget = 0;
  let running = false, carried = 0, active = 0, dirty = false, saveT = 0;
  let lastReason = '', lastToast = '', hover = null, ptr = null, resetArm = 0;
  let windSlowTold = false, sheetOpen = false;
  const frameDts = [];
  const clouds = [
    { x: 80, y: 700, r: 34, z: 0.35 },
    { x: 280, y: 730, r: 26, z: 0.55 },
    { x: 520, y: 690, r: 42, z: 0.3 },
    { x: 760, y: 720, r: 30, z: 0.5 },
    { x: 940, y: 705, r: 24, z: 0.4 }
  ];
  const birds = [
    { x: 200, y: 680, p: 0.4, s: 28 },
    { x: 640, y: 710, p: 2.2, s: 34 }
  ];
  const flakes = Array.from({ length: 48 }, (_, i) => ({
    x: hash(i + 1) * 1000, y: hash(i + 80) * 760, z: 0.4 + hash(i + 20) * 0.8, p: hash(i + 40) * 7
  }));
  const smokes = [];
  const TREES = [];
  for (let x = 326; x <= 458; x += 16) {
    const h = treeTop(x);
    if (h) TREES.push({ x: x, h: h, k: hash(x | 0) });
  }
  for (let x = 556; x <= 598; x += 18) {
    const h = treeTop(x);
    if (h) TREES.push({ x: x, h: h, k: hash((x + 3) | 0) });
  }
  const FLOWERS = [];
  for (let i = 0; i < 26; i++) {
    const x = 165 + hash(i + 11) * 200;
    if (treeTop(x) === 0 && Math.abs(slopeAt(x)) < 0.85) FLOWERS.push({ x: x, c: i % 4, k: hash(i + 90) });
  }
  const cows = [
    { x: 236, dir: 1, phase: 0.2, bell: 1.2 },
    { x: 278, dir: -1, phase: 1.4, bell: 2.1 },
    { x: 318, dir: 1, phase: 2.3, bell: 0.6 }
  ];
  let cogX = 220, cogDir = 1;

  function emptyLine() {
    return {
      phase: 'valley', valley: null, summit: null, pylons: [],
      queue: [], riders: [], cabins: [], samples: [], supports: [],
      spawnT: 1.2, len: 0
    };
  }
  let lines = [emptyLine()];

  function supportsOf(line) {
    const s = [];
    if (line.valley == null) return s;
    s.push({ x: line.valley, h: STATION_H, kind: 'valley' });
    for (let i = 0; i < line.pylons.length; i++) s.push({ x: line.pylons[i], h: PYLON_H, kind: 'pylon' });
    if (line.summit != null) s.push({ x: line.summit, h: STATION_H, kind: 'summit' });
    return s;
  }
  function rebuild(line) {
    const sup = supportsOf(line);
    line.supports = sup;
    const samples = [];
    if (sup.length >= 2) {
      let dist = 0, px = sup[0].x, py = terrainY(px) + sup[0].h;
      samples.push({ x: px, y: py, s: 0, sup: 0 });
      for (let i = 0; i < sup.length - 1; i++) {
        const a = sup[i], b = sup[i + 1];
        const y1 = terrainY(a.x) + a.h, y2 = terrainY(b.x) + b.h;
        const f = catenary(a.x, y1, b.x, y2);
        const xs = sampleXs(a.x, b.x);
        for (let k = 1; k < xs.length; k++) {
          const x = xs[k], y = f(x);
          dist += Math.hypot(x - px, y - py);
          samples.push({ x: x, y: y, s: dist, sup: (k === xs.length - 1) ? i + 1 : -1 });
          px = x; py = y;
        }
      }
    }
    line.samples = samples;
    line.len = samples.length ? samples[samples.length - 1].s : 0;
  }
  function pointAt(line, s) {
    const samples = line.samples;
    if (!samples.length) return null;
    s = clamp(s, 0, line.len);
    let lo = 0, hi = samples.length - 1;
    while (lo < hi - 1) {
      const m = (lo + hi) >> 1;
      if (samples[m].s < s) lo = m; else hi = m;
    }
    const a = samples[lo], b = samples[hi];
    const t = (b.s - a.s) < 1e-4 ? 0 : (s - a.s) / (b.s - a.s);
    return {
      x: a.x + (b.x - a.x) * t,
      y: a.y + (b.y - a.y) * t
    };
  }
  function comfortWord(c) {
    if (c >= 5.4) return 'sehr gut';
    if (c >= 4.7) return 'gut';
    if (c >= 4.0) return 'genügend';
    if (c >= 3.2) return 'knapp';
    return 'ruppig';
  }
  function survey(line) {
    if (!line || line.phase !== 'done') return null;
    const sup = supportsOf(line);
    let maxAng = 0, maxSag = 0;
    for (let i = 0; i < sup.length - 1; i++) {
      const a = sup[i], b = sup[i + 1];
      const y1 = terrainY(a.x) + a.h, y2 = terrainY(b.x) + b.h;
      const f = catenary(a.x, y1, b.x, y2);
      if (!f) continue;
      const xs = sampleXs(a.x, b.x);
      let px = xs[0], py = f(px);
      for (let k = 0; k < xs.length; k++) {
        const x = xs[k], cy = f(x);
        const t = (x - a.x) / (b.x - a.x || 1);
        maxSag = Math.max(maxSag, y1 + (y2 - y1) * t - cy);
        if (k) maxAng = Math.max(maxAng, Math.abs(Math.atan2(cy - py, x - px)) * 180 / Math.PI);
        px = x; py = cy;
      }
    }
    const pylons = line.pylons.length;
    const comfort = clamp(6 - Math.max(0, maxSag - 12) * 0.08 - Math.max(0, maxAng - 48) * 0.035, 1, 6);
    const note = clamp(comfort - Math.max(0, pylons - 5) * 0.12, 1, 6);
    return {
      pylons: pylons, cost: pylons * 80000,
      maxAng: maxAng, maxSag: maxSag, comfort: comfort, note: note, word: comfortWord(comfort)
    };
  }
  function francs(n) {
    return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  }
  function num(n) { return n.toFixed(1).replace('.', ','); }

  function seedQueue() {
    const q = [];
    for (let i = 0; i < 5; i++) q.push({ col: i % 6 });
    return q;
  }
  function fail(reason) {
    lastReason = reason;
    if (MSG[reason]) toast(MSG[reason]);
    return { ok: false, reason: reason };
  }
  function tryPlace(x, y) {
    const line = lines[active];
    if (!line) return fail('done');
    if (sheetOpen) return { ok: false, reason: 'sheet' };
    if (line.phase === 'done') return fail('done');
    if (!Number.isFinite(x) || !Number.isFinite(y)) return fail('sky');
    x = clamp(x, 0, 1000);
    const gy = terrainY(x);
    if (y > gy + 96) return fail('sky');
    if (line.phase === 'valley') return placeValley(line, x);
    return placeSupport(line, x);
  }
  function placeValley(line, x) {
    const sl = Math.abs(slopeAt(x)), gy = terrainY(x);
    if (x < 72 || x > 205 || gy > 118 || sl > 0.42) return fail('valley');
    line.valley = x;
    line.phase = 'pylon';
    line.queue = seedQueue();
    lastReason = 'ok';
    toast(MSG.okvalley);
    changed();
    return { ok: true, reason: 'ok' };
  }
  function placeSupport(line, x) {
    const prev = line.pylons.length
      ? { x: line.pylons[line.pylons.length - 1], h: PYLON_H }
      : { x: line.valley, h: STATION_H };
    const dx = x - prev.x;
    const sl = slopeAt(x), gy = terrainY(x);
    if (x >= 888 && gy >= 575) {
      if (!(x >= 900 && gy >= 590 && Math.abs(sl) < 0.35)) return fail('summit');
      if (dx < -0.5) return fail('back');
      if (dx < MIN_SPAN) return fail('near');
      if (dx > MAX_SPAN) return fail('far');
      const hit = spanProblem(prev.x, prev.h, x, STATION_H);
      if (hit) return fail(hit);
      line.summit = x;
      line.phase = 'done';
      rebuild(line);
      lastReason = 'ok';
      toast(MSG.oksummit);
      changed();
      return { ok: true, reason: 'ok' };
    }
    if (dx < -0.5) return fail('back');
    if (Math.abs(sl) > CLIFF) return fail('cliff');
    if (dx < MIN_SPAN) return fail('near');
    if (dx > MAX_SPAN) return fail('far');
    const hit = spanProblem(prev.x, prev.h, x, PYLON_H);
    if (hit) return fail(hit);
    line.pylons.push(+x.toFixed(2));
    lastReason = 'ok';
    toast(MSG.okpylon);
    changed();
    return { ok: true, reason: 'ok' };
  }

  function makeCabin(s, dir, at, wait, phase) {
    return { s: s, dir: dir, at: at, wait: wait, speed: 0, prevSpeed: 0, passengers: 0, swing: 0, clack: -1, phase: phase };
  }
  function bootCabins(line) {
    if (!line.len) rebuild(line);
    if (!line.len) { line.cabins = []; return; }
    const a = makeCabin(0, 1, 'bottom', 0.35, 0.4);
    const b = makeCabin(line.len, -1, 'top', 0.55, 2.2);
    board(line, a);
    line.cabins = [a, b];
  }
  function board(line, cabin) {
    const n = Math.min(4, line.queue.length);
    line.queue.splice(0, n);
    cabin.passengers = n;
  }
  function arriveTop(line, cabin) {
    if (cabin.passengers > 0) {
      carried += cabin.passengers;
      for (let i = 0; i < cabin.passengers; i++) {
        line.riders.push({
          x: line.summit - 6 - i * 8,
          v: 34 + (i % 3) * 6,
          col: (cabin.phase + i) % 6 | 0,
          phase: i
        });
      }
      cabin.passengers = 0;
      dirty = true;
    }
    cabin.s = line.len;
    cabin.wait = 1.15;
    cabin.at = 'top';
    cabin.dir = -1;
    cabin.speed = 0;
  }
  function arriveBottom(line, cabin) {
    cabin.s = 0;
    cabin.at = 'bottom';
    cabin.dir = 1;
    cabin.wait = 1.05;
    cabin.speed = 0;
    board(line, cabin);
  }

  function windAt(t) {
    const base = 0.28 + 0.18 * Math.sin(t * 0.07) + 0.08 * Math.sin(t * 0.23);
    const gust = Math.pow(Math.max(0, Math.sin(t * 0.11)), 10) * 0.85;
    return clamp(base + gust, 0, 1);
  }
  function windWord(w) {
    if (w < 0.22) return 'ruhig';
    if (w < 0.4) return 'leicht';
    if (w < 0.62) return 'mässig';
    if (w < 0.8) return 'stark';
    return 'stürmisch';
  }
  function cruise(w) {
    const slow = w > 0.66 ? 1 - (w - 0.66) * 1.35 : 1;
    return 118 * clamp(slow, 0.42, 1);
  }

  let toastT = 0, toastOn = false;
  function toast(text) {
    if (stepping) return;
    lastToast = text;
    const el = $('toast');
    el.textContent = text;
    el.classList.add('show');
    toastOn = true;
    toastT = 0;
  }
  function hintFor(line) {
    if (!line || line.phase === 'valley') return 'Tippe ins Tal für die Talstation.';
    if (line.phase === 'pylon' && line.pylons.length < 3) return 'Setze Masten den Hang hinauf. Das Seil hängt als Kettenlinie.';
    if (line.phase === 'pylon') return 'Weiter bergwärts, dann die Bergstation auf den Gipfel.';
    if (!running) return 'Die Linie steht. Fahren schickt die Gondeln los.';
    return 'Gondeln unterwegs. Gäste fahren hinauf und steigen zu Fuss oder auf Ski ab.';
  }
  function lineLabel(line, i) {

  let stepping = false;
  function step(dt) {
    dt = clamp(dt || 0, 0, 0.05);

    winterAmt = lerp(winterAmt, winterTarget, ease);

    if (running && wind > 0.72 && !windSlowTold) {
      windSlowTold = true;

    }
    if (wind < 0.6) windSlowTold = false;

    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];

      if (c.x < -80) c.x = 1080;

    for (let i = 0; i < birds.length; i++) {

        if (f.y < 40) { f.y = 760; f.x = hash((i + simT * 10) | 0) * 1000; }

    if (cogX > 430) { cogX = 430; cogDir = -1; }
    if (cogX < 210) { cogX = 210; cogDir = 1; }

    if (winterAmt < 0.55) {
      for (let i = 0; i < cows.length; i++) {
        const cow = cows[i];
        cow.phase += dt * 2.2;
        cow.x += cow.dir * 6 * dt;
        if (cow.x > 340) cow.dir = -1;
        if (cow.x < 220) cow.dir = 1;
        cow.bell -= dt;
        if (cow.bell <= 0) {
          cow.bell = 2.4 + hash((i + simT * 4) | 0) * 3.2;
          cowbell(cow.x);

      }
    }

    if (running) {
      for (let li = 0; li < lines.length; li++) {
        const line = lines[li];
        if (line.phase !== 'done' || !line.len) continue;
        if (line.queue.length < 6) {
          line.spawnT -= dt;
          if (line.spawnT <= 0) {
            line.queue.push({ col: (line.queue.length + li + (simT * 3 | 0)) % 6 });
            line.spawnT = 1.35;

        for (let ci = 0; ci < line.cabins.length; ci++) {
          const cabin = line.cabins[ci];
          const prevS = cabin.s;
          cabin.prevSpeed = cabin.speed;
          if (cabin.wait > 0) {
            cabin.wait -= dt;
            cabin.speed += (0 - cabin.speed) * Math.min(1, dt * 4);
            if (cabin.wait <= 0) cabin.speed = 0;
          } else {
            const target = cruise(wind);
            cabin.speed += (target - cabin.speed) * Math.min(1, dt * 0.85);
            cabin.s += cabin.dir * cabin.speed * dt;
            if (cabin.s >= line.len) arriveTop(line, cabin);
            else if (cabin.s <= 0) arriveBottom(line, cabin);

          const accel = (cabin.speed - cabin.prevSpeed) / dt;

  function passPylon(line, cabin, prevS) {
    const samples = line.samples;
    const lo = Math.min(prevS, cabin.s), hi = Math.max(prevS, cabin.s);

      const p = samples[i];

          cabin.clack = p.sup;

      }

  function save() {

        running: !!running, active: active,
        lines: lines.map(line => ({
          valley: line.valley, summit: line.summit, pylons: line.pylons.slice(),
          queue: line.queue.map(q => q.col | 0),
          cabins: line.cabins.map(c => ({

    } catch (e) {}
  }
  function load() {
    let raw = null;
    try { raw = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { raw = null; }
    if (!raw || raw.v !== 1) return;
    carried = Math.max(0, raw.carried | 0);
    winterTarget = winterAmt = raw.winter ? 1 : 0;
    nightTarget = nightAmt = raw.night ? 1 : 0;
    const built = [];
    const src = Array.isArray(raw.lines) ? raw.lines.slice(0, 2) : [];
    for (let i = 0; i < src.length; i++) {
      const item = src[i];
      const line = emptyLine();
      if (!replay(line, item)) continue;
      if (Array.isArray(item.queue)) {
        line.queue = item.queue.slice(0, 8).map(c => ({ col: (c | 0) % 6 }));
      }
      built.push({ line: line, cabins: item.cabins });
    }
    if (!built.length) built.push({ line: emptyLine(), cabins: null });
    lines = built.map(b => b.line);
    active = clamp(raw.active | 0, 0, lines.length - 1);
    running = !!raw.running && lines.some(l => l.phase === 'done');
    if (running) {
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.phase !== 'done') continue;
        const saved = built[i].cabins;
        if (Array.isArray(saved) && saved.length && line.len) {
          line.cabins = saved.slice(0, 3).map((c, k) => {
            const cab = makeCabin(clamp(+c.s || 0, 0, line.len), c.dir < 0 ? -1 : 1, c.at === 'top' ? 'top' : 'bottom', Math.max(0, +c.wait || 0), k + 0.5);
            cab.passengers = clamp(c.passengers | 0, 0, 4);

    const pylons = Array.isArray(item.pylons) ? item.pylons : [];
    for (let i = 0; i < pylons.length; i++) {
      const r = placeSupport(line, +pylons[i]);
      if (!r.ok) return false;
    }
    if (item.summit != null && Number.isFinite(+item.summit)) {
      const r = placeSupport(line, +item.summit);

    }

  function openSheet() {

      blocks.push(

        '<div class="kv"><span>Masten</span><span>' + sv.pylons + '</span></div>' +
        '<div class="kv"><span>Kosten</span><span>CHF ' + francs(sv.cost) + '</span></div>' +

        '<div class="kv"><span>Komfort</span><span>' + sv.word + '</span></div>' +

  function draw() {
    const skyTop = mix(mix('#8ec6ea', '#f0b56a', clamp(winterAmt * 0.15, 0, 1)), '#0c1430', nightAmt);
    const skyMid = mix(mix('#d5eef8', '#f3d2a4', winterAmt * 0.2), '#1a2748', nightAmt);
    const skyLow = mix(mix('#d5eef8', '#e7f2f6', winterAmt * 0.4), '#24365c', nightAmt);
    const g = ctx.createLinearGradient(0, 0, 0, viewH);
    g.addColorStop(0, rgb(skyTop));
    g.addColorStop(0.55, rgb(skyMid));
    g.addColorStop(1, rgb(skyLow));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, viewW, viewH);

    if (nightAmt > 0.35) {
      for (let i = 0; i < 48; i++) {
        const x = hash(i + 3) * viewW, y = hash(i + 19) * viewH * 0.55;
        const tw = 0.35 + 0.65 * Math.max(0, Math.sin(simT * 1.4 + i));

  function ridge(points, col, alpha) {

      const p = toS(points[i][0], points[i][1]);

  function drawGround() {

 function blocked(c){var r=rectFor(c),xs=[.1,.5,.9],ys=[.2,.8];for(var i=0;i<3;i++)for(var j=0;j<2;j++){var px=r.x+r.w*xs[i],py=r.y+r.h*ys[j];if(px<0||py<0||px>=innerWidth||py>=innerHeight)continue;var l=document.elementsFromPoint(px,py);for(var k=0;k<l.length;k++){var e=l[k];if(e===b||b.contains(e))continue;if(e.closest&&e.closest(INTER))return true}}return false}

 function place(){pend=0;if(!blocked(cur))return;var o=[CORNER,'tr','tl','br','bl'];for(var i=0;i<o.length;i++){if(o[i]!==cur&&!blocked(o[i])){put(o[i]);return}}}
