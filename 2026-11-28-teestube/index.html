<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teestube am Abend</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23241912' width='32' height='32'/%3E%3Cpath d='M8 12h12v8a6 6 0 0 1-12 0z' fill='%23f4e6d4'/%3E%3Cpath d='M20 14h3a3 3 0 0 1 0 6h-3' fill='none' stroke='%23f4e6d4' stroke-width='2'/%3E%3C/svg%3E">
<meta name="description" content="Teestube am Abend: Kessel, Kanne und Gäste. Tee ziehen lassen und das Stammbuch füllen.">
<meta name="theme-color" content="#241912">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#241912;color:#f6ead8;font-family:"Iowan Old Style",Palatino,Georgia,serif;-webkit-user-select:none;user-select:none;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;min-height:100%;display:flex;flex-direction:column}
header{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 96px 6px 14px;background:linear-gradient(#3a2a24,#2a1c18)}
h1{margin:0;font-size:clamp(20px,2.6vw,30px);font-weight:700;letter-spacing:.01em;line-height:1.05}

#help,#hint{margin:3px 0 0;font:500 13.5px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
#hint{font-weight:700;min-height:2.7em}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
#stage{flex:1 1 auto;min-height:168px;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
#say{position:absolute;z-index:2;top:10px;right:10px;max-width:min(280px,68%);margin:0;padding:8px 12px 10px;background:#fff8ee;color:#3a2416;border-radius:16px 16px 4px 16px;font:600 14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 8px 22px rgba(0,0,0,.28);pointer-events:none}
#say:empty{display:none}
#say::after{content:"";position:absolute;right:22px;bottom:-8px;border:8px solid transparent;border-top-color:#fff8ee;border-bottom:0}
#controls{flex:0 0 auto;max-height:48dvh;overflow:auto;background:linear-gradient(#4a3428,#3a271e);border-top:1px solid rgba(255,220,180,.16);padding:6px 8px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
#tins{display:flex;flex-wrap:wrap;gap:6px;padding:1px 2px 2px}
#adds,#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
button{font:700 14px/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
#tins button{flex:0 0 auto;display:flex;align-items:center;gap:6px;min-height:40px;padding:4px 12px 4px 4px;border-radius:999px;border:1px solid #8a6248;background:#f3e2cc;color:#3a2416}
#tins button i{width:28px;height:28px;border-radius:50%;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
#tins button[aria-pressed="true"]{background:#6b3a22;color:#fff6e8;border-color:#f0d2a4}
#adds button,#bar button,#book button{min-height:40px;min-width:44px;padding:8px 10px;border-radius:999px;border:1px solid #a07858;background:#f6e7d2;color:#3a2416}
#adds button[aria-pressed="true"],#bar button[aria-pressed="true"]{background:#6b3a22;color:#fff6e8;border-color:#e7c8a2}
#bSound[aria-pressed="true"]{background:#2f5d4a;color:#f3fff6;border-color:#8fd0b0}
button.coach,#tins.coach button{box-shadow:0 0 0 3px #e7b84a}
button:focus-visible{outline:2px solid #ffe3a3;outline-offset:2px}
#tins button.fresh{box-shadow:0 0 0 3px #fff1c2}
#book[hidden]{display:none !important}
#book{position:fixed;inset:0;z-index:30;background:rgba(18,10,12,.55);display:flex;align-items:center;justify-content:center;padding:14px}
.sheet{width:min(680px,100%);max-height:min(86dvh,760px);overflow:auto;background:#f7ecd8;color:#3a2416;border-radius:18px;padding:14px 14px 18px;box-shadow:0 18px 50px rgba(0,0,0,.38)}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet h2{margin:0;font-size:22px}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button.on{background:#6b3a22;color:#fff6e8}
.guest{padding:8px 0;border-top:1px solid rgba(80,40,20,.16)}
.guest h3{margin:0 0 4px;font-size:17px}
.guest p,.recipe p{margin:0;font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips span{background:#efe0c4;border-radius:999px;padding:3px 8px;font:600 12px/1.3 system-ui,sans-serif}
.guest .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.recipe{padding:8px 0;border-top:1px solid rgba(80,40,20,.16)}
.recipe h3{margin:0 0 3px;font-size:16px}
@media (max-width:520px){
  #help{display:none}
  #adds button,#bar button{font-size:13px;padding:8px}
  header{padding-right:88px}
}
@media (orientation:landscape) and (max-height:560px){
  #body{flex-direction:row}
  header{padding-top:4px;padding-bottom:2px}

  #help{display:none}
  h1{font-size:18px}
  #meta{margin:0}
  #hint{min-height:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tins{flex-wrap:nowrap}
  #tins button{flex:1 1 0;min-width:0;padding:4px 6px 4px 3px;font-size:12px}
  #tins button span{overflow:hidden;text-overflow:ellipsis}
  #adds,#bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}

}
@media (prefers-reduced-motion:reduce){
  #tins button.fresh{box-shadow:0 0 0 3px #fff1c2}
}

</head>
<body>
<div id="app">
  <header>
    <h1>Teestube</h1>
    <p id="meta"><span id="weather">Regen</span> · <span id="stars">Sterne 0/6</span></p>
    <p id="help">Heize den Kessel, giesse auf, lass den Tee ziehen und serviere die Tasse.</p>
    <p id="hint" role="status" aria-live="polite"></p>
  </header>
  <div id="body">
    <div id="stage">
      <canvas id="c" aria-label="Tresen mit Fenster, Kessel, Kanne, Tasse und Gast"></canvas>
      <p id="say" role="status" aria-live="polite"></p>
    </div>
    <div id="controls">
      <div id="tins" role="group" aria-label="Tee wählen"></div>
      <div id="adds" role="group" aria-label="Zutaten">
        <button type="button" id="bHoney" aria-pressed="false">Honig</button>
        <button type="button" id="bLemon" aria-pressed="false">Zitrone</button>
        <button type="button" id="bMilk" aria-pressed="false">Milch</button>
        <button type="button" id="bMint" aria-pressed="false">Minze</button>
        <button type="button" id="bSprig" aria-pressed="false">Zweig</button>
        <button type="button" id="bSaucer">Untertasse</button>
      </div>
      <div id="bar" role="toolbar" aria-label="Handgriffe">
        <button type="button" id="bHeat" aria-pressed="false">Heizen</button>
        <button type="button" id="bRefill">Auffüllen</button>
        <button type="button" id="bPour">Aufgiessen</button>
        <button type="button" id="bLeaf">Blätter</button>
        <button type="button" id="bStrainer">Sieb heben</button>
        <button type="button" id="bCup">Einschenken</button>
        <button type="button" id="bServe">Servieren</button>
        <button type="button" id="bRinse">Ausspülen</button>
        <button type="button" id="bBook">Stammbuch</button>
        <button type="button" id="bSound" aria-pressed="false" aria-label="Ton ist aus">Ton aus</button>
      </div>
    </div>
  </div>
</div>
<div id="book" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <div class="sheethead">
      <h2 id="bookTitle">Stammbuch</h2>
      <button type="button" id="bClose">Schliessen</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" id="tabG" class="on" role="tab" aria-selected="true">Gäste</button>
      <button type="button" id="tabR" role="tab" aria-selected="false">Rezepte</button>
    </div>
    <div id="page"></div>
  </div>
</div>
<script>
'use strict';
(function () {
  const STORE = 'teestube-abend-v1';
  const LOVE = 0.86;
  const PARADE = ['holunder', 'lio', 'noor', 'quell', 'mira', 'pema'];
  const TEA_ORDER = ['schwarz', 'kamille', 'minze', 'gruen', 'jasmin', 'ingwer', 'rooibos', 'bergamotte', 'holunderbluete'];
  const GIFTS = { holunder: 'ingwer', lio: 'gruen', mira: 'jasmin', quell: 'rooibos', noor: 'holunderbluete' };
  const WEATHERS = ['rain', 'clear', 'snow', 'wind'];
  const WEATHER_DE = { rain: 'Regen', clear: 'Klar', snow: 'Schnee', wind: 'Wind' };

  const TEAS = {
    schwarz: { name: 'Schwarztee', family: 'black', color: '#6a3418', tin: '#4a3424', rate: 0.11, bitter: 1.22, curdle: false },
    kamille: { name: 'Kamille', family: 'herbal', color: '#e4b23e', tin: '#d4a84a', rate: 0.15, bitter: 1.30, curdle: false },
    minze: { name: 'Pfefferminze', family: 'herbal', color: '#6eae62', tin: '#2f6a3c', rate: 0.15, bitter: 1.15, curdle: true },
    gruen: { name: 'Grüntee', family: 'green', color: '#c5d46a', tin: '#7d9a3a', rate: 0.10, bitter: 0.64, curdle: true },
    jasmin: { name: 'Jasmin', family: 'floral', color: '#f0e4a4', tin: '#ddd6a2', rate: 0.12, bitter: 0.82, curdle: true, floral: true },
    ingwer: { name: 'Ingwer', family: 'spicy', color: '#e08a32', tin: '#c47a28', rate: 0.12, bitter: 1.25, curdle: false },
    rooibos: { name: 'Rooibos', family: 'spicy', color: '#c85a38', tin: '#a84830', rate: 0.11, bitter: 1.28, curdle: false },
    bergamotte: { name: 'Bergamotte', family: 'black', color: '#c48440', tin: '#8a6840', rate: 0.11, bitter: 1.18, curdle: false, floral: true },
    holunderbluete: { name: 'Holunderblüte', family: 'floral', color: '#f3e6c4', tin: '#efe4c4', rate: 0.13, bitter: 1.05, curdle: true, floral: true }
  };

  const GUESTS = {
    holunder: {
      name: 'Frau Holunder',
      enter: 'Frau Holunder kommt herein.',
      wish: 'Mir ist kalt bis in die Finger. Blumig, heiss, und Honig wäre schön.',
      delight: 'Genau die Wärme. Danke.',
      teas: { kamille: 0.95, holunderbluete: 1, ingwer: 0.82, jasmin: 0.58, minze: 0.42, schwarz: 0.28, rooibos: 0.36, gruen: 0.2, bergamotte: 0.34 },
      temp: 94, tempW: 16, strength: 0.62, strengthW: 0.36,
      add: { honey: 0.22, lemon: 0, milk: -0.55, mint: 0.05 }
    },
    lio: {
      name: 'Lio',
      enter: 'Lio kommt herein.',
      wish: 'Ich lese noch. Bitte wach, mit Zitrone, nicht zu dünn.',
      delight: 'Jetzt bleiben die Augen offen.',
      teas: { schwarz: 0.92, bergamotte: 1, gruen: 0.55, rooibos: 0.5, ingwer: 0.34, kamille: 0.22, minze: 0.16, jasmin: 0.4, holunderbluete: 0.26 },
      temp: 91, tempW: 16, strength: 0.9, strengthW: 0.32, likesBitter: true,
      add: { honey: -0.05, lemon: 0.22, milk: -0.2, mint: 0 }
    },
    noor: {
      name: 'Noor',
      enter: 'Noor kommt herein.',
      wish: 'Nach dem Garten: Minze. Honig und ein Minzblatt, wenn du hast.',
      delight: 'Nachtgarten in der Tasse.',
      teas: { minze: 1, rooibos: 0.8, kamille: 0.84, holunderbluete: 0.78, ingwer: 0.48, schwarz: 0.2, gruen: 0.36, jasmin: 0.42, bergamotte: 0.24 },
      temp: 88, tempW: 22, strength: 0.58, strengthW: 0.36, combo: true,
      add: { honey: 0.16, lemon: 0, milk: -0.25, mint: 0.2 }
    },
    quell: {
      name: 'Herr Quell',
      enter: 'Herr Quell kommt herein.',
      wish: 'Stark und heiss, wie im Hafen. Milch darf dazu.',
      delight: 'Wie im Hafen. Danke.',
      teas: { schwarz: 1, bergamotte: 0.9, rooibos: 0.62, ingwer: 0.55, kamille: 0.16, minze: 0.12, gruen: 0.08, jasmin: 0.2, holunderbluete: 0.14 },
      temp: 97, tempW: 12, strength: 1.02, strengthW: 0.28, likesBitter: true,
      add: { honey: -0.08, lemon: -0.22, milk: 0.2, mint: 0 }
    },
    mira: {
      name: 'Mira',
      enter: 'Mira kommt herein.',
      wish: 'Hell und eher kühl, sonst stimmt die Farbe nicht. Keine Milch.',
      delight: 'Die Farbe stimmt. Wunderbar.',
      teas: { gruen: 1, jasmin: 0.96, holunderbluete: 0.5, minze: 0.44, bergamotte: 0.34, kamille: 0.4, schwarz: 0.12, ingwer: 0.16, rooibos: 0.2 },
      temp: 76, tempW: 10, strength: 0.4, strengthW: 0.28,
      add: { honey: -0.12, lemon: 0.05, milk: -0.7, mint: 0 }
    },
    pema: {
      name: 'Pema',
      enter: 'Pema kommt herein.',
      wish: 'Die Nacht soll in die Tasse. Floral, ruhig, nicht zu stark.',
      delight: 'Die Nacht passt hinein.',
      teas: { jasmin: 1, holunderbluete: 0.86, bergamotte: 0.68, kamille: 0.5, gruen: 0.55, minze: 0.3, schwarz: 0.25, ingwer: 0.2, rooibos: 0.3 },
      temp: 82, tempW: 14, strength: 0.48, strengthW: 0.24,
      add: { honey: 0.08, lemon: 0.05, milk: -0.65, mint: -0.08 }
    }
  };

  const LOOK = {
    holunder: { coat: '#7a4e74', hair: '#f3efe6', skin: '#efc2a4', hat: 'bun', shawl: '#d9c6e0' },
    lio: { coat: '#2c4a78', hair: '#241c16', skin: '#d39a6c', hat: 'short', scarf: '#e2b33a' },
    mira: { coat: '#b5523e', hair: '#1a1a1e', skin: '#f0c2a2', hat: 'bob', beret: '#2f6b4f' },
    quell: { coat: '#243246', hair: '#d5d8dc', skin: '#e0b08e', hat: 'beard', cap: '#1c2836' },
    noor: { coat: '#3d6a45', hair: '#4a2c22', skin: '#8d5a3a', hat: 'tie', sprig: true },
    pema: { coat: '#c47a3a', hair: '#161616', skin: '#e7b898', hat: 'knot', wrap: '#f2d7a2' }
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };

  const S = {
    kettle: { on: false, temp: 22, water: 1, boil: 0, whistled: false, urged: false },
    pot: { tea: null, water: 0, temp: 22, strength: 0, lifted: false, spent: false },
    cup: { filled: false, tea: null, temp: 22, strength: 0, curdled: false, add: { honey: false, lemon: false, milk: false, mint: false } },
    tray: { honey: false, lemon: false, milk: false, mint: false, sprig: 0 },
    plant: { health: 1, sprigs: 2, grow: 0, warned: false },
    selected: 'kamille',
    guest: null,
    guestLast: '',
    wait: 1.05,
    weather: 'rain',
    weatherT: 0,
    served: 0,
    delighted: {},
    unlocked: { schwarz: 1, kamille: 1, minze: 1 },
    notes: {},
    recipes: [],
    queue: PARADE.slice(),
    cat: false,
    catGifted: false,
    saucer: 0,
    pendingCat: false,
    evening: false,
    knownRecipe: false
  };

  const steam = [];
  const drops = [];
  const flakes = [];
  let W = 0, H = 0, time = 0, last = 0, lastM = null;
  let audioOn = false, userMuted = false;
  let tab = 'guests';
  const AU = { ac: null, master: null, rain: null, hiss: null, noise: null };

  const canvas = $('c');
  const ctx = canvas.getContext('2d');

  function say(msg) {
    if (say.last === msg) return;
    say.last = msg;
    $('hint').textContent = msg;
  }
  function speak(msg) {
    if (speak.last === msg) return;
    speak.last = msg;
    $('say').textContent = msg || '';
  }
  function starCount() {
    return PARADE.filter(id => S.delighted[id] > 0).length;
  }
  function paintStars() {
    const t = 'Sterne ' + starCount() + '/6';
    const el = $('stars');
    if (el.dataset.src === t) return;
    el.dataset.src = t;
    el.textContent = t;
  }
  function paintWeather() {
    const t = WEATHER_DE[S.weather];
    const el = $('weather');
    if (el.dataset.src === t) return;
    el.dataset.src = t;
    el.textContent = t;
  }
  const attrMem = new WeakMap();
  function setText(el, text) {
    if (!el || el.dataset.src === text) return;
    el.dataset.src = text;
    el.textContent = text;
  }
  function setAttr(el, name, val) {
    let mem = attrMem.get(el);
    if (!mem) { mem = {}; attrMem.set(el, mem); }
    if (mem[name] === val) return;
    mem[name] = val;
    el.setAttribute(name, val);
  }
  function setPressed(el, on) {
    const v = on ? 'true' : 'false';
    if (el.getAttribute('aria-pressed') !== v) el.setAttribute('aria-pressed', v);
  }

  function noteOf(id) {
    if (!S.notes[id] || typeof S.notes[id] !== 'object') S.notes[id] = { chips: [], last: '', visits: 0 };
    if (!Array.isArray(S.notes[id].chips)) S.notes[id].chips = [];
    return S.notes[id];
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (d.unlocked && typeof d.unlocked === 'object') {
        S.unlocked = { schwarz: 1, kamille: 1, minze: 1 };
        TEA_ORDER.forEach(id => { if (d.unlocked[id]) S.unlocked[id] = 1; });
      }
      if (d.notes && typeof d.notes === 'object') S.notes = d.notes;
      if (Array.isArray(d.recipes)) S.recipes = d.recipes.filter(r => r && TEAS[r.tea]).slice(0, 24);
      if (d.delighted && typeof d.delighted === 'object') S.delighted = d.delighted;
      if (Array.isArray(d.queue)) S.queue = d.queue.filter(id => GUESTS[id]);
      if (typeof d.served === 'number' && d.served >= 0) S.served = d.served;
      if (d.cat) S.cat = true;
      if (d.catGifted) { S.catGifted = true; S.unlocked.bergamotte = 1; }
      if (d.evening) S.evening = true;
      if (d.plant && typeof d.plant.health === 'number') {
        S.plant.health = clamp(d.plant.health, 0, 1);
        S.plant.sprigs = clamp(d.plant.sprigs | 0, 0, 3);
      }
      if (typeof d.guestLast === 'string') S.guestLast = d.guestLast;
      return true;
    } catch (e) { return false; }
  }
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        unlocked: S.unlocked,
        notes: S.notes,
        recipes: S.recipes,
        delighted: S.delighted,
        queue: S.queue,
        served: S.served,
        cat: S.cat,
        catGifted: S.catGifted,
        evening: S.evening,
        guestLast: S.guestLast,
        plant: { health: S.plant.health, sprigs: S.plant.sprigs }
      }));
    } catch (e) {}
  }

  function canPlay() { return !!(AU.ac && audioOn && !userMuted); }
  function startAudio() {
    try {
      if (!AU.ac) {
        const ac = new AudioContext();
        AU.ac = ac;
        const master = ac.createGain();
        master.gain.value = 0.42;
        master.connect(ac.destination);
        AU.master = master;
        const n = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const data = n.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        AU.noise = n;
        const src = ac.createBufferSource();
        src.buffer = n; src.loop = true;
        const bp = ac.createBiquadFilter();
        bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 0.55;
        const g = ac.createGain(); g.gain.value = 0;
        src.connect(bp); bp.connect(g); g.connect(master); src.start();
        AU.rain = g;
        const src2 = ac.createBufferSource();
        src2.buffer = n; src2.loop = true;
        const hp = ac.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 1600;
        const g2 = ac.createGain(); g2.gain.value = 0;
        src2.connect(hp); hp.connect(g2); g2.connect(master); src2.start();
        AU.hiss = g2;
      }
      if (AU.ac.state === 'suspended') AU.ac.resume().catch(() => {});
      AU.master.gain.value = userMuted ? 0 : 0.42;
    } catch (e) {}
  }
  function tone(freq, dur, vol, type, toFreq) {
    if (!canPlay()) return;
    const ac = AU.ac, t = ac.currentTime;
    const o = ac.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(Math.max(40, freq), t);
    if (toFreq) o.frequency.exponentialRampToValueAtTime(Math.max(40, toFreq), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(AU.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function burst(dur, freq, q, vol) {
    if (!canPlay() || !AU.noise) return;
    const ac = AU.ac, t = ac.currentTime;
    const src = ac.createBufferSource();
    src.buffer = AU.noise;
    const f = ac.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    src.connect(f); f.connect(g); g.connect(AU.master);
    src.start(t); src.stop(t + dur + 0.02);
  }
  function playPour() { burst(0.32, 780, 0.45, 0.16); }
  function playClink() { tone(1480, 0.07, 0.05, 'sine'); tone(2100, 0.05, 0.03, 'sine'); }
  function playWhistle() { tone(1320, 0.42, 0.045, 'sine', 2140); tone(1760, 0.48, 0.02, 'triangle', 2480); }
  function playBell() { tone(784, 0.45, 0.04, 'sine'); tone(1176, 0.55, 0.025, 'sine'); }
  function playChime() {
    tone(523, 0.34, 0.05, 'sine');
    tone(659, 0.38, 0.04, 'sine');
    tone(784, 0.46, 0.035, 'sine');
  }
  function playPurr() { burst(0.7, 180, 0.6, 0.12); tone(90, 0.6, 0.03, 'sine', 70); }
  function syncAudio(dt) {
    if (!AU.rain) return;
    const rainT = (!audioOn || userMuted) ? 0 : S.weather === 'rain' ? 0.075 : S.weather === 'wind' ? 0.05 : S.weather === 'snow' ? 0.018 : 0.01;
    AU.rain.gain.value += (rainT - AU.rain.gain.value) * Math.min(1, dt * 3);
    const hissT = (audioOn && !userMuted && S.kettle.water > 0 && S.kettle.temp > 58) ? ((S.kettle.temp - 58) / 42) * 0.07 : 0;
    AU.hiss.gain.value += (hissT - AU.hiss.gain.value) * Math.min(1, dt * 4);
    if (AU.master) AU.master.gain.value = (audioOn && !userMuted) ? 0.42 : 0;
  }

  function worldGesture() {
    if (userMuted || audioOn) return;
    audioOn = true;
    startAudio();
    syncSound();
  }
  function toggleSound() {
    if (!audioOn && !userMuted) {
      audioOn = true;
      startAudio();
    } else if (!userMuted) {
      userMuted = true;
      audioOn = false;
    } else {
      userMuted = false;
      audioOn = true;
      startAudio();
    }
    syncSound();
  }
  function syncSound() {
    const on = audioOn && !userMuted;
    setText($('bSound'), on ? 'Ton an' : 'Ton aus');
    setPressed($('bSound'), on);
    setAttr($('bSound'), 'aria-label', on ? 'Ton ist an' : 'Ton ist aus');
  }

  function judge(g, cup, weather) {
    const tea = TEAS[cup.tea];
    let teaS = tea && g.teas[cup.tea] != null ? g.teas[cup.tea] : 0;
    const tempS = 1 - Math.min(1.5, Math.abs(cup.temp - g.temp) / g.tempW);
    const strS = 1 - Math.min(1.5, Math.abs(cup.strength - g.strength) / g.strengthW);
    let add = 0;
    let requiredMissing = false;
    const freshSprig = cup.add.sprig === 1;
    const tiredSprig = cup.add.sprig === 2;
    ['honey', 'lemon', 'milk', 'mint'].forEach(k => {
      const w = g.add[k] || 0;
      if (k === 'mint') {
        const mintOn = !!cup.add.mint || freshSprig;
        if (mintOn) add += w;
        else if (tiredSprig) add += w * 0.35;
        else if (w > 0.12) add -= Math.min(0.22, w);
        if (w > 0.15 && !mintOn) requiredMissing = true;
        if (freshSprig && w > 0.1) add += 0.14;
        return;
      }
      if (cup.add[k]) add += w;
      else if (w > 0.12) add -= Math.min(0.22, w);
      if (w > 0.15 && !cup.add[k]) requiredMissing = true;
    });
    if (g.combo && cup.add.honey && (!!cup.add.mint || freshSprig)) add += 0.12;
    const curdle = !!(tea && cup.add.milk && tea.curdle);
    if (curdle) add -= 0.5;
    const bitter = !!(tea && cup.strength > tea.bitter);
    if (bitter) add -= g.likesBitter ? 0.06 : 0.24;
    let weatherB = 0;
    if (tea) {
      if (weather === 'rain' && cup.temp >= 90) weatherB += 0.05;
      if (weather === 'snow' && (tea.family === 'spicy' || tea.family === 'black')) weatherB += 0.06;
      if (weather === 'clear' && (tea.family === 'floral' || tea.floral)) weatherB += 0.06;
      if (weather === 'wind' && cup.temp >= 88) weatherB += 0.04;
    }
    let raw = teaS * 0.50 + Math.max(0, tempS) * 0.28 + Math.max(0, strS) * 0.22 + add + weatherB;
    if (tempS < 0.45) raw -= (0.45 - tempS) * 0.7;
    if (strS < 0.35) raw -= (0.35 - strS) * 0.4;
    if (teaS < 0.72) raw = Math.min(raw, 0.56 + teaS * 0.22);
    if (requiredMissing) raw = Math.min(raw, 0.84);
    return {
      score: clamp(raw, 0, 1),
      teaS, tempS, strS, add, curdle, bitter, weatherB
    };
  }

  function missingLine(g, cup) {
    const mintOn = !!cup.add.mint || cup.add.sprig === 1;
    const items = [
      [g.add.honey || 0, !!cup.add.honey, 'Honig hätte gut gepasst.'],
      [g.add.lemon || 0, !!cup.add.lemon, 'Eine Zitrone hätte mich geweckt.'],
      [g.add.milk || 0, !!cup.add.milk, 'Milch hätte mich an den Hafen erinnert.'],
      [g.add.mint || 0, mintOn, 'Ein Minzblatt hätte den Garten gebracht.']
    ];
    let best = null, w = 0.12;
    items.forEach(it => { if (it[0] > w && !it[1]) { w = it[0]; best = it[2]; } });
    return best;
  }
  function reaction(g, cup, j) {
    if (j.curdle) return 'Die Milch flockt aus. Das mag ich nicht.';
    if (j.score >= LOVE && j.teaS >= 0.72) return g.delight;
    if (j.teaS < 0.72) return 'Ein anderer Tee wäre mir lieber.';
    if (j.tempS < 0.45 && cup.temp < g.temp - 3) return 'Die Tasse ist mir zu kühl.';
    if (j.tempS < 0.45 && cup.temp > g.temp + 3) return 'Zu heiss für meine Zunge.';
    if (j.bitter && !g.likesBitter) return 'Etwas bitter für mich.';
    if (j.strS < 0.4 && cup.strength < g.strength - 0.04) return 'Etwas zu dünn.';
    if (j.strS < 0.4 && cup.strength > g.strength + 0.04) return 'Etwas zu stark für mich.';
    if (cup.add.milk && (g.add.milk || 0) < -0.2) return 'Milch mag ich in diesem Tee nicht.';
    if (cup.add.lemon && (g.add.lemon || 0) < -0.15) return 'Die Zitrone ist mir zu scharf. Lieber ohne.';
    if (cup.add.honey && (g.add.honey || 0) < -0.1) return 'Honig brauche ich nicht.';
    if (cup.add.sprig === 2 && (g.add.mint || 0) > 0.12) return 'Die Minze ist matt von der Hitze.';
    const miss = missingLine(g, cup);
    if (miss) return miss;
    if (j.score >= 0.68) return 'Das tut gut. Danke.';
    if (j.score >= 0.45) return 'Ich trinke ihn aus. Ganz meiner war er nicht.';
    return 'Lieb, dass du einschenkst. Heute lieber ein andermal.';
  }

  function learn(g, cup, j, line, love) {
    const n = noteOf(g.id || guestId(g));
    n.visits += 1;
    n.last = line;
    const add = c => { if (c && n.chips.indexOf(c) < 0 && n.chips.length < 8) n.chips.push(c); };
    const id = cup.tea;
    if (j.teaS >= 0.72 && TEAS[id]) add(TEAS[id].name);
    if (g.temp >= 90 && j.tempS > 0.6) add('heiss');
    if (g.temp <= 82 && j.tempS > 0.6) add('kühl');
    if (g.strength >= 0.85 && j.strS > 0.55) add('stark');
    if (g.strength <= 0.55 && j.strS > 0.55) add('zart');
    if (cup.add.honey && (g.add.honey || 0) > 0.1) add('Honig');
    if ((g.add.honey || 0) > 0.15 && !cup.add.honey) add('Honig fehlt');
    if (cup.add.lemon && (g.add.lemon || 0) > 0.1) add('Zitrone');
    if ((g.add.lemon || 0) > 0.15 && !cup.add.lemon) add('Zitrone fehlt');
    if (cup.add.milk && (g.add.milk || 0) > 0.1) add('Milch');
    if ((g.add.milk || 0) > 0.15 && !cup.add.milk) add('Milch fehlt');
    const mintThere = !!cup.add.mint || cup.add.sprig === 1;
    if (mintThere && (g.add.mint || 0) > 0.1) add(cup.add.sprig === 1 ? 'frische Minze' : 'Minze');
    if ((g.add.mint || 0) > 0.15 && !mintThere) add(cup.add.sprig === 2 ? 'matte Minze' : 'Minze fehlt');
    if (j.curdle || (love && (g.add.milk || 0) < -0.3)) add('keine Milch');
    if (j.bitter && !g.likesBitter) add('nicht bitter');
  }
  function guestId(g) {
    return PARADE.find(id => GUESTS[id] === g) || '';
  }

  function addRecipe(gid, cup) {
    const adds = [];
    if (cup.add.honey) adds.push('Honig');
    if (cup.add.lemon) adds.push('Zitrone');
    if (cup.add.milk) adds.push('Milch');
    if (cup.add.sprig === 1) adds.push('Frische Minze');
    else if (cup.add.sprig === 2) adds.push('Matte Minze');
    else if (cup.add.mint) adds.push('Minze');
    const heat = cup.temp >= 90 ? 'Heiss' : cup.temp >= 78 ? 'Warm' : 'Kühl';
    const body = cup.strength >= 0.85 ? 'Stark' : cup.strength >= 0.5 ? 'Mittel' : 'Zart';
    const key = cup.tea + '|' + adds.join('+') + '|' + heat + '|' + body + '|' + gid;
    const old = S.recipes.find(r => r.key === key);
    if (old) { old.n += 1; return true; }
    S.recipes.push({ key, tea: cup.tea, adds, heat, body, guest: GUESTS[gid].name, n: 1 });
    if (S.recipes.length > 24) S.recipes.shift();
    return false;
  }

  function rebuildTins(freshId) {
    const box = $('tins');
    box.textContent = '';
    TEA_ORDER.forEach(id => {
      if (!S.unlocked[id]) return;
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.tea = id;
      const sw = document.createElement('i');
      sw.style.background = TEAS[id].tin;
      const lab = document.createElement('span');
      lab.textContent = TEAS[id].name;
      b.append(sw, lab);
      if (id === freshId) b.classList.add('fresh');
      b.addEventListener('click', () => act('tea:' + id));
      box.appendChild(b);
    });
    if (!S.unlocked[S.selected]) S.selected = 'kamille';
  }

  function onLove(gid, cup) {
    S.delighted[gid] = (S.delighted[gid] || 0) + 1;
    const known = addRecipe(gid, cup);
    let gift = null;
    const gidTea = GIFTS[gid];
    if (gidTea && !S.unlocked[gidTea]) {
      S.unlocked[gidTea] = 1;
      gift = gidTea;
      rebuildTins(gidTea);
    }
    const finished = starCount() >= 6 && !S.evening;
    if (finished) S.evening = true;
    if (finished) say('Sechs Sterne im Fenster. Der Abend ist rund.');
    else if (gift) say('Neue Dose: ' + TEAS[gift].name + '.');
    else if (known) say('Das Rezept kennst du schon.');
    else say('Ins Stammbuch geschrieben.');
    playChime();
    paintStars();
  }

  function heatWord(temp) { return temp >= 90 ? 'Heiss' : temp >= 78 ? 'Warm' : 'Kühl'; }
  function bodyWord(st) { return st >= 0.85 ? 'Stark' : st >= 0.5 ? 'Mittel' : 'Zart'; }
  function cupPhrase(cup) {
    return 'Die Tasse steht bereit. ' + heatWord(cup.temp) + ' und ' + bodyWord(cup.strength) + '.';
  }

  function toggleHeat() {
    if (!S.kettle.on && S.kettle.water <= 0) { say('Der Kessel ist leer. Erst auffüllen.'); return; }
    S.kettle.on = !S.kettle.on;
    if (!S.kettle.on) { S.kettle.boil = 0; S.kettle.urged = false; }
    say(S.kettle.on ? 'Der Kessel steht auf der Flamme.' : 'Der Kessel ist vom Feuer.');
  }
  function refill() {
    if (S.kettle.water > 0) { say('Der Kessel ist schon voll.'); return; }
    S.kettle.water = 1;
    S.kettle.temp = Math.min(S.kettle.temp, 26);
    S.kettle.boil = 0;
    S.kettle.whistled = false;
    S.kettle.urged = false;
    say('Frisches Wasser. Der Kessel muss neu heizen.');
    playClink();
  }
  function pourKettle() {
    if (S.kettle.water <= 0) { say('Der Kessel ist leer. Erst auffüllen.'); return; }
    if (S.pot.water > 0) { say('Die Kanne ist voll.'); return; }
    S.pot.water = 1;
    S.pot.temp = S.kettle.temp;
    S.pot.lifted = false;
    if (S.pot.spent) S.pot.strength *= 0.45;
    if (S.pot.spent) say('Zweiter Aufguss. Der Sud ist zarter.');
    else if (S.kettle.temp < 65) say('Laues Wasser. Der Tee wird still.');
    else if (S.pot.tea) say('Der Tee zieht.');
    else say('Wasser in der Kanne. Jetzt die Blätter.');
    S.kettle.boil = 0;
    S.kettle.urged = false;
    playPour();
  }
  function addLeaves(id) {
    if (!TEAS[id] || !S.unlocked[id]) return;
    if (S.pot.tea) { say('In der Kanne liegen schon Blätter.'); return; }
    S.pot.tea = id;
    if (!S.pot.spent) S.pot.strength = 0;
    S.pot.lifted = false;
    say(S.pot.water ? 'Der Tee zieht.' : 'Die Blätter warten auf Wasser.');
  }
  function chooseTea(id) {
    if (!TEAS[id] || !S.unlocked[id]) return;
    S.selected = id;
    addLeaves(id);
  }
  function toggleStrainer() {
    if (!S.pot.tea || S.pot.water <= 0) { say('Der Tee zieht noch nicht.'); return; }
    S.pot.lifted = !S.pot.lifted;
    say(S.pot.lifted ? 'Das Sieb ist oben. Der Sud hält an.' : 'Das Sieb ist wieder unten.');
  }
  function pourCup() {
    if (!S.pot.tea) { say('Die Kanne hat noch keine Blätter.'); return; }
    if (S.pot.water <= 0) { say('Erst Wasser in die Kanne.'); return; }
    const add = { honey: S.tray.honey, lemon: S.tray.lemon, milk: S.tray.milk, mint: S.tray.mint, sprig: S.tray.sprig };
    S.tray.sprig = 0;
    S.cup.filled = true;
    S.cup.tea = S.pot.tea;
    S.cup.temp = S.pot.temp;
    S.cup.strength = S.pot.strength;
    S.cup.add = add;
    S.cup.curdled = !!(add.milk && TEAS[S.pot.tea].curdle);
    S.pot.water = 0;
    S.pot.spent = true;
    S.pot.lifted = true;
    say(S.cup.curdled ? 'Die Milch flockt in der Tasse.' : cupPhrase(S.cup));
    playPour();
  }
  function rinse() {
    S.pot.tea = null;
    S.pot.water = 0;
    S.pot.strength = 0;
    S.pot.lifted = false;
    S.pot.spent = false;
    say('Die Kanne ist wieder klar.');
  }
  function toggleAdd(k) {
    S.tray[k] = !S.tray[k];
    if (S.cup.filled) say('Die Zutaten liegen erst in der nächsten Tasse.');
  }
  function serve() {
    if (!S.guest || S.guest.phase === 'out') { say('Der Stuhl ist leer.'); return; }
    if (S.guest.phase === 'sip') { say('Der Gast trinkt schon.'); return; }
    if (!S.cup.filled) { say('Die Tasse ist noch leer.'); return; }
    const gid = S.guest.id;
    const g = GUESTS[gid];
    const cup = {
      tea: S.cup.tea, temp: S.cup.temp, strength: S.cup.strength, curdled: S.cup.curdled,
      add: { honey: S.cup.add.honey, lemon: S.cup.add.lemon, milk: S.cup.add.milk, mint: S.cup.add.mint, sprig: S.cup.add.sprig || 0 }
    };
    const j = judge(g, cup, S.weather);
    const line = reaction(g, cup, j);
    const love = j.score >= LOVE && j.teaS >= 0.72 && !j.curdle;
    g.id = gid;
    learn(g, cup, j, line, love);
    speak(line);
    S.guest.mood = love ? 'glad' : j.score >= 0.68 ? 'calm' : 'flat';
    S.guest.phase = 'sip';
    S.guest.t = 0;
    S.guest.dur = 1.85;
    S.guest.sip = liquorColor(cup.tea, cup.strength, cup.curdled);
    if (love) onLove(gid, cup);
    else { say('Der Gast trinkt.'); playClink(); }
    S.cup.filled = false;
    S.served += 1;
    if (S.served === 2) S.pendingCat = true;
    S.queue = S.queue.filter(id => id !== gid);
    S.guestLast = gid;
    paintStars();
    save();
  }
  function snip() {
    if (S.tray.sprig) {
      S.tray.sprig = 0;
      S.plant.sprigs = Math.min(3, S.plant.sprigs + 1);
      say('Der Zweig liegt wieder am Stock.');
      return;
    }
    if (S.plant.sprigs <= 0) { say('Die Minze ruht noch. Ein neues Blatt braucht Zeit.'); return; }
    S.plant.sprigs -= 1;
    if (S.plant.health < 0.4) {
      S.tray.sprig = 2;
      say(S.cup.filled ? 'Die Zutaten liegen erst in der nächsten Tasse.' : 'Ein matter Zweig. Die Hitze war zu viel.');
    } else {
      S.tray.sprig = 1;
      say(S.cup.filled ? 'Die Zutaten liegen erst in der nächsten Tasse.' : 'Frische Minze. Sie duftet stärker als die Dose.');
      burst(0.09, 2400, 3, 0.07);
    }
  }
  function stepPlant(dt) {
    const hot = S.kettle.on && S.kettle.water > 0 && S.kettle.temp >= 92;
    if (hot) {
      S.plant.health = Math.max(0, S.plant.health - dt * 0.09);
      if (S.plant.health < 0.4 && !S.plant.warned) {
        S.plant.warned = true;
        say('Die Minze auf dem Sims lasst die Blätter hängen.');
      }
    } else if (!S.kettle.on || S.kettle.temp < 70) {
      S.plant.health = Math.min(1, S.plant.health + dt * 0.045);
      if (S.plant.health >= 0.7) S.plant.warned = false;
    }
    if (S.plant.health >= 0.65 && S.plant.sprigs < 3) {
      S.plant.grow += dt;
      if (S.plant.grow >= 18) {
        S.plant.grow = 0;
        S.plant.sprigs += 1;
      }
    } else S.plant.grow = 0;
  }
  function saucer() {
    if (!S.cat) { say('Die Untertasse wartet auf Semmel.'); return; }
    S.saucer = 9;
    if (!S.catGifted) {
      S.catGifted = true;
      S.unlocked.bergamotte = 1;
      rebuildTins('bergamotte');
      say('Semmel schnurrt. In ihrem Fell hing eine Dose Bergamotte.');
      playPurr();
      save();
    } else {
      say('Semmel schnurrt und legt sich hin.');
      playPurr();
    }
  }
  function endGuest(kind) {
    const g = S.guest;
    if (!g) return;
    if (kind === 'leave') {
      const n = noteOf(g.id);
      n.visits += 1;
      n.last = 'Ich komme ein andermal. Die Kerze ist zu Ende.';
      speak('Ich komme ein andermal. Die Kerze ist zu Ende.');
      say('Die Kerze ist heruntergebrannt.');
      S.queue = S.queue.filter(id => id !== g.id);
      save();
    }
    g.phase = 'out';
    g.t = 0;
    g.dur = 0.7;
  }

  function nextId() {
    if (S.queue.length) return S.queue[0];
    const pool = [];
    PARADE.forEach(id => {
      if (id === S.guestLast) return;
      const w = S.delighted[id] > 0 ? 1 : 3;
      for (let i = 0; i < w; i++) pool.push(id);
    });
    const bag = pool.length ? pool : PARADE.slice();
    return bag[Math.floor(Math.random() * bag.length)];
  }
  function spawn(id) {
    if (!GUESTS[id]) return;
    const max = S.weather === 'wind' ? 62 : 78;
    S.guest = { id, phase: 'in', t: 0, dur: 0.7, patience: max, max, mood: 'calm', warned: false, sip: '#f4e6d4' };
    speak(GUESTS[id].enter);
    playBell();
  }
  function invite(id) {
    closeBook();
    if (S.guest) { say('Es sitzt schon jemand.'); return; }
    S.queue = S.queue.filter(x => x !== id);
    S.wait = 0;
    spawn(id);
    save();
  }

  function coachTarget() {
    if (S.served > 0) return null;
    if (!S.kettle.on && S.kettle.temp < 85) return 'heat';
    if (S.pot.water <= 0) return S.kettle.temp >= 85 ? 'pour' : 'heat';
    if (!S.pot.tea) return 'tin';
    if (!S.pot.lifted && S.pot.strength >= 0.48) return 'strainer';
    if (!S.cup.filled && S.pot.lifted) return 'cup';
    if (S.cup.filled) return 'serve';
    return null;
  }
  function syncControls() {
    setText($('bHeat'), S.kettle.on ? 'Heizt' : 'Heizen');
    setPressed($('bHeat'), S.kettle.on);
    setText($('bStrainer'), S.pot.lifted ? 'Sieb senken' : 'Sieb heben');
    setPressed($('bHoney'), S.tray.honey);
    setPressed($('bLemon'), S.tray.lemon);
    setPressed($('bMilk'), S.tray.milk);
    setPressed($('bMint'), S.tray.mint);
    setText($('bSprig'), S.tray.sprig === 1 ? 'Frischer Zweig' : S.tray.sprig === 2 ? 'Matter Zweig' : 'Zweig');
    setPressed($('bSprig'), S.tray.sprig > 0);
    const target = coachTarget();
    const map = { heat: 'bHeat', pour: 'bPour', strainer: 'bStrainer', cup: 'bCup', serve: 'bServe' };
    ['bHeat', 'bPour', 'bStrainer', 'bCup', 'bServe'].forEach(id => {
      const on = map[target] === id;
      if ($(id).classList.contains('coach') !== on) $(id).classList.toggle('coach', on);
    });
    const tinCoach = target === 'tin';
    if ($('tins').classList.contains('coach') !== tinCoach) $('tins').classList.toggle('coach', tinCoach);
    document.querySelectorAll('#tins button').forEach(b => setPressed(b, b.dataset.tea === S.selected));
    paintStars();
    paintWeather();
    syncSound();
  }

  function act(name) {
    if (name === 'heat') toggleHeat();
    else if (name === 'refill') refill();
    else if (name === 'pour') pourKettle();
    else if (name === 'leaf') addLeaves(S.selected);
    else if (name === 'strainer') toggleStrainer();
    else if (name === 'cup') pourCup();
    else if (name === 'serve') serve();
    else if (name === 'rinse') rinse();
    else if (name === 'honey' || name === 'lemon' || name === 'milk' || name === 'mint') toggleAdd(name);
    else if (name === 'sprig') snip();
    else if (name === 'saucer') saucer();
    else if (name === 'book') toggleBook();
    else if (name === 'sound') toggleSound();
    else if (name.indexOf('tea:') === 0) chooseTea(name.slice(4));
    syncControls();
  }

  function closeBook() { $('book').hidden = true; }
  function openBook() {
    $('book').hidden = false;
    renderBook();
    $('bClose').focus();
  }
  function toggleBook() { if ($('book').hidden) openBook(); else closeBook(); }
  function recipeTitle(r) {
    const name = TEAS[r.tea] ? TEAS[r.tea].name : r.tea;
    if (!r.adds || !r.adds.length) return name;
    return name + ' mit ' + r.adds.join(' und ');
  }
  function recipeDetail(r) {
    return r.heat + ' und ' + r.body + ', für ' + r.guest + '.';
  }
  function renderBook() {
    const page = $('page');
    page.textContent = '';
    $('tabG').classList.toggle('on', tab === 'guests');
    $('tabR').classList.toggle('on', tab === 'recipes');
    $('tabG').setAttribute('aria-selected', tab === 'guests' ? 'true' : 'false');
    $('tabR').setAttribute('aria-selected', tab === 'recipes' ? 'true' : 'false');
    if (tab === 'recipes') {
      if (!S.recipes.length) {
        const p = document.createElement('p');
        p.textContent = 'Noch kein Rezept. Eine begeisterte Tasse wird hier notiert.';
        page.appendChild(p);
        return;
      }
      S.recipes.forEach(r => {
        if (!TEAS[r.tea]) return;
        const art = document.createElement('article');
        art.className = 'recipe';
        const h = document.createElement('h3');
        h.textContent = recipeTitle(r) + (r.n > 1 ? ' ×' + r.n : '');
        const p = document.createElement('p');
        p.textContent = recipeDetail(r);
        art.append(h, p);
        page.appendChild(art);
      });
      return;
    }
    PARADE.forEach(id => {
      const g = GUESTS[id];
      const n = S.notes[id];
      const art = document.createElement('article');
      art.className = 'guest';
      const head = document.createElement('div');
      head.className = 'row';
      const h = document.createElement('h3');
      const known = n && (n.visits > 0 || (n.last && n.last.length));
      if (!known) h.textContent = 'Ein leerer Stuhl';
      else h.textContent = (S.delighted[id] > 0 ? '★ ' : '☆ ') + g.name;
      head.appendChild(h);
      if (known) {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = 'Einladen';
        b.addEventListener('click', () => invite(id));
        head.appendChild(b);
      }
      const p = document.createElement('p');
      p.textContent = known && n.last ? n.last : 'Noch nicht da gewesen.';
      art.append(head, p);
      if (known && S.delighted[id] > 0) {
        const mark = document.createElement('p');
        mark.textContent = S.delighted[id] > 1 ? ('Begeistert, ' + S.delighted[id] + ' Mal') : 'Begeistert';
        art.appendChild(mark);
      }
      if (known && Array.isArray(n.chips) && n.chips.length) {
        const chips = document.createElement('div');
        chips.className = 'chips';
        n.chips.forEach(c => {
          const s = document.createElement('span');
          s.textContent = c;
          chips.appendChild(s);
        });
        art.appendChild(chips);
      }
      page.appendChild(art);
    });
  }

  function liquorColor(id, strength, curdled) {
    const tea = TEAS[id] || { color: '#d5e4ea' };
    const n = parseInt(tea.color.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const w = clamp(strength / 0.95, 0.12, 1);
    let R = Math.round(232 * (1 - w) + r * w);
    let G = Math.round(236 * (1 - w) + g * w);
    let B = Math.round(228 * (1 - w) + b * w);
    if (curdled) { R = Math.round(R * 0.7 + 150 * 0.3); G = Math.round(G * 0.7 + 148 * 0.3); B = Math.round(B * 0.65 + 120 * 0.35); }
    return 'rgb(' + R + ',' + G + ',' + B + ')';
  }

  function step(dt) {
    const k = S.kettle;
    if (k.on && k.water > 0) {
      if (k.temp < 100) k.temp = Math.min(100, k.temp + dt * 13);
      if (k.temp >= 99.4) {
        if (!k.whistled) { k.whistled = true; playWhistle(); say('Der Kessel singt. Tippe die Kanne zum Aufgiessen.'); }
        k.boil += dt;
        if (k.boil > 8 && !k.urged) { k.urged = true; say('Der Kessel ruft. Nimm ihn herunter oder giesse auf.'); }
        if (k.boil > 15) {
          k.water = 0; k.boil = 0; k.on = false; k.urged = false;
          say('Das Wasser ist verkocht.');
        }
      }
    } else if (k.temp > 22) {
      k.temp = Math.max(22, k.temp - dt * 5);
    }
    if (k.temp < 96) k.whistled = false;

    if (S.pot.water > 0 && S.pot.tea && !S.pot.lifted) {
      const tea = TEAS[S.pot.tea];
      const hf = S.pot.temp < 70 ? 0.4 : 1;
      const spent = S.pot.spent ? 0.45 : 1;
      S.pot.strength = Math.min(1.4, S.pot.strength + dt * tea.rate * hf * spent);
    }
    if (S.pot.water > 0) S.pot.temp = Math.max(22, S.pot.temp - dt * 0.65);
    if (S.cup.filled) S.cup.temp = Math.max(22, S.cup.temp - dt * 2.8);
    if (S.saucer > 0) S.saucer = Math.max(0, S.saucer - dt);
    stepPlant(dt);

    if (!S.guest) {
      S.wait -= dt;
      if (S.wait <= 0) spawn(nextId());
    } else {
      const g = S.guest;
      g.t += dt;
      if (g.phase === 'in' && g.t >= g.dur) {
        g.phase = 'sit';
        g.t = 0;
        speak(GUESTS[g.id].wish);
      } else if (g.phase === 'sit') {
        g.patience -= dt;
        if (g.patience < 18 && !g.warned) { g.warned = true; say('Die Kerze wird kurz.'); }
        if (g.patience <= 0) endGuest('leave');
      } else if (g.phase === 'sip' && g.t >= g.dur) {
        g.phase = 'out'; g.t = 0; g.dur = 0.65;
      } else if (g.phase === 'out' && g.t >= g.dur) {
        S.guestLast = g.id;
        S.guest = null;
        speak('');
        S.wait = 2.1;
        if (S.pendingCat) {
          S.pendingCat = false;
          S.cat = true;
          say('Semmel springt auf den Tresen und schaut die Milch an.');
          save();
        }
      }
    }

    S.weatherT += dt;
    if (S.weatherT > 72) {
      S.weatherT = 0;
      const i = (WEATHERS.indexOf(S.weather) + 1) % WEATHERS.length;
      S.weather = WEATHERS[i];
      const line = {
        rain: 'Regen am Fenster.',
        clear: 'Klare Nacht.',
        snow: 'Es schneit.',
        wind: 'Wind an der Scheibe.'
      }[S.weather];
      say(line);
    }

    if (lastM && lastM.kettle) {
      const hotK = S.kettle.water > 0 && S.kettle.temp > 62;
      const hotP = S.pot.water > 0 && S.pot.temp > 60;
      const hotC = S.cup.filled && S.cup.temp > 60;
      const rate = reduce ? 0.35 : 1;
      if (hotK && Math.random() < dt * 10 * rate) puff(lastM.kettle.x + 16 * lastM.s, lastM.kettle.y - 58 * lastM.s);
      if (hotP && Math.random() < dt * 8 * rate) puff(lastM.pot.x, lastM.pot.y - 46 * lastM.s);
      if (hotC && Math.random() < dt * 6 * rate) puff(lastM.cup.x, lastM.cup.y - 36 * lastM.s);
    }
    for (let i = steam.length - 1; i >= 0; i--) {
      const p = steam[i];
      p.age += dt;
      p.y += p.vy * dt;
      p.x += Math.sin(time * 2 + i) * 8 * dt;
      if (p.age > p.life) steam.splice(i, 1);
    }
    if (S.weather === 'rain' || S.weather === 'wind') {
      const cap = reduce ? 24 : 64;
      if (drops.length < cap && Math.random() < dt * 40) drops.push({ x: Math.random(), y: -0.05, v: 0.55 + Math.random() * 0.5, len: 8 + Math.random() * 10 });
    }
    for (let i = drops.length - 1; i >= 0; i--) {
      drops[i].y += drops[i].v * dt;
      if (drops[i].y > 1.05) drops.splice(i, 1);
    }
    if (S.weather === 'snow') {
      const cap = reduce ? 16 : 40;
      if (flakes.length < cap && Math.random() < dt * 20) flakes.push({ x: Math.random(), y: -0.05, v: 0.12 + Math.random() * 0.12, r: 1.2 + Math.random() * 1.6, drift: Math.random() * 6 });
    }
    for (let i = flakes.length - 1; i >= 0; i--) {
      flakes[i].y += flakes[i].v * dt;
      flakes[i].x += Math.sin(time + flakes[i].drift) * dt * 0.05;
      if (flakes[i].y > 1.05) flakes.splice(i, 1);
    }
    syncAudio(dt);
    syncControls();
  }
  function puff(x, y) {
    if (steam.length > (reduce ? 10 : 32)) return;
    steam.push({ x: x + (Math.random() - 0.5) * 8, y, vy: -16 - Math.random() * 18, life: 0.8 + Math.random() * 0.5, age: 0, r: 2 + Math.random() * 3 });
  }

  function metrics() {
    const s = Math.max(0.62, Math.min(1.12, Math.min(W / 860, H / 500)));
    const counter = Math.min(H - 4, Math.max(120, H * 0.64));
    const win = {
      x: Math.max(78, W * 0.28),
      y: 8,
      w: Math.max(100, Math.min(W * 0.42, W - Math.max(78, W * 0.28) - 16)),
      h: Math.max(70, counter - 18)
    };
    const kettle = { x: Math.max(64, W * 0.16), y: counter, r: Math.max(34, 46 * s) };
    const pot = { x: W * 0.40, y: counter, r: Math.max(30, 42 * s) };
    const cup = { x: W * 0.56, y: counter, r: Math.max(24, 30 * s) };
    const guest = { x: Math.min(W - 42, Math.max(cup.x + 70, W * 0.78)), y: counter, r: Math.max(34, 50 * s) };
    const tap = { x: Math.max(22, kettle.x - 52 * s), y: counter - 62 * s, r: Math.max(20, 24 * s) };
    const cat = { x: win.x + Math.min(46, win.w * 0.18), y: counter - 4, r: Math.max(20, 24 * s) };
    const candle = { x: clamp((cup.x + guest.x) * 0.5, cup.x + 28, guest.x - 28), y: counter };
    const plant = { x: win.x + win.w * 0.78, y: counter - 58 * s, r: Math.max(18, 22 * s) };
    const jars = ['honey', 'lemon', 'milk', 'mint'].map((id, i) => ({
      id,
      x: kettle.x + (58 + i * 30) * s,
      y: counter - 54 * s,
      r: Math.max(15, 17 * s)
    }));
    const unlocked = TEA_ORDER.filter(id => S.unlocked[id]);
    const tins = W >= 760 ? unlocked.map((id, i) => ({
      id,
      x: 30,
      y: 26 + i * Math.max(32, 36 * s),
      r: Math.max(15, 16 * s)
    })) : [];
    return { s, counter, win, kettle, pot, cup, guest, tap, cat, candle, plant, jars, tins };
  }

  function round(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }
  function star(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * Math.PI * 2 / 5 - Math.PI / 2;
      const b = a + Math.PI / 5;
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(b) * r * 0.42, y + Math.sin(b) * r * 0.42);
    }
    ctx.closePath();
  }

  function draw() {
    if (W < 2 || H < 2) return;
    const m = metrics();
    lastM = m;
    const s = m.s;
    ctx.clearRect(0, 0, W, H);
    const wall = ctx.createLinearGradient(0, 0, 0, H);
    wall.addColorStop(0, '#2c2433');
    wall.addColorStop(0.55, '#3a2a2c');
    wall.addColorStop(1, '#4a3024');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, W, H);

    drawWindow(m);
    drawCounter(m);
    drawTap(m);
    drawJars(m);
    drawKettle(m);
    drawPot(m);
    drawCup(m);
    drawCandle(m);
    drawPlant(m);
    if (S.cat) drawCat(m);
    if (S.guest) drawGuest(m);
    if (W > 700) drawDoor(m);
    drawTins(m);
    drawSteam();
    drawCoach(m);
    tempLabel(m.kettle.x, Math.min(H - 8, m.counter + 28 * s), S.kettle.water > 0 ? Math.round(S.kettle.temp) + '°' : 'leer', S.kettle.temp, s);
    if (S.pot.water > 0) tempLabel(m.pot.x, Math.min(H - 8, m.counter + 28 * s), Math.round(S.pot.temp) + '°', S.pot.temp, s);
    if (S.cup.filled) tempLabel(m.cup.x, Math.min(H - 8, m.counter + 22 * s), Math.round(S.cup.temp) + '°', S.cup.temp, s);
  }

  function tempLabel(x, y, text, temp, s) {
    ctx.font = '700 ' + Math.round(12 * s) + 'px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = temp >= 88 ? '#ffe1b0' : temp >= 70 ? '#f6e2c8' : '#d5e4f2';
    ctx.fillText(text, x, y);
  }

  function drawWindow(m) {
    const w = m.win;
    ctx.save();
    round(w.x - 8, w.y - 6, w.w + 16, w.h + 14, 12);
    ctx.fillStyle = '#6b4632';
    ctx.fill();
    ctx.save();
    round(w.x, w.y, w.w, w.h, 6);
    ctx.clip();
    const sky = ctx.createLinearGradient(0, w.y, 0, w.y + w.h);
    if (S.weather === 'clear') { sky.addColorStop(0, '#141a33'); sky.addColorStop(1, '#243456'); }
    else if (S.weather === 'snow') { sky.addColorStop(0, '#2a3348'); sky.addColorStop(1, '#465066'); }
    else { sky.addColorStop(0, '#1a2233'); sky.addColorStop(1, '#2c3848'); }
    ctx.fillStyle = sky;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    if (S.weather === 'clear' || S.weather === 'snow') {
      ctx.fillStyle = S.weather === 'snow' ? 'rgba(255,248,230,.85)' : '#f7f1cf';
      ctx.beginPath();
      ctx.arc(w.x + w.w * 0.78, w.y + w.h * 0.28, Math.min(22, w.w * 0.06), 0, Math.PI * 2);
      ctx.fill();
    }
    if (S.weather === 'clear') {
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < 10; i++) {
        const sx = w.x + ((i * 47) % 100) / 100 * w.w;
        const sy = w.y + ((i * 29) % 70) / 100 * w.h * 0.55;
        ctx.fillRect(sx, sy, 2, 2);
      }
    }
    ctx.fillStyle = '#1b1422';
    ctx.beginPath();
    ctx.moveTo(w.x, w.y + w.h * 0.72);
    ctx.lineTo(w.x + w.w * 0.22, w.y + w.h * 0.5);
    ctx.lineTo(w.x + w.w * 0.4, w.y + w.h * 0.7);
    ctx.lineTo(w.x + w.w * 0.62, w.y + w.h * 0.42);
    ctx.lineTo(w.x + w.w * 0.82, w.y + w.h * 0.66);
    ctx.lineTo(w.x + w.w, w.y + w.h * 0.5);
    ctx.lineTo(w.x + w.w, w.y + w.h);
    ctx.lineTo(w.x, w.y + w.h);
    ctx.fill();
    ctx.fillStyle = '#141018';
    ctx.fillRect(w.x, w.y + w.h * 0.78, w.w, w.h * 0.22);
    const lampX = w.x + w.w * 0.22;
    const lampY = w.y + w.h * 0.42;
    const glow = ctx.createRadialGradient(lampX, lampY, 4, lampX, lampY, w.w * 0.28);
    glow.addColorStop(0, 'rgba(255,214,140,.9)');
    glow.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.fillStyle = '#2a241c';
    ctx.fillRect(lampX - 2, lampY, 4, w.h * 0.2);
    ctx.fillStyle = '#ffe1a8';
    ctx.beginPath();
    ctx.arc(lampX, lampY, 6, 0, Math.PI * 2);
    ctx.fill();
    const swing = Math.sin(time * (S.weather === 'wind' ? 2.4 : 0.8)) * (S.weather === 'wind' ? 0.2 : 0.05);
    ctx.save();
    ctx.translate(w.x + w.w * 0.55, w.y + 18);
    ctx.rotate(swing);
    ctx.fillStyle = '#6b3a2a';
    ctx.fillRect(-16, 0, 32, 16);
    ctx.fillStyle = '#fff6e4';
    ctx.font = '700 10px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('TEE', 0, 8);
    ctx.restore();
    const slant = S.weather === 'wind' ? 10 : 4;
    ctx.strokeStyle = 'rgba(210,225,240,.45)';
    ctx.lineWidth = 1.4;
    drops.forEach(d => {
      const x = w.x + d.x * w.w;
      const y = w.y + d.y * w.h;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + slant, y + d.len);
      ctx.stroke();
    });
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    flakes.forEach(f => {
      ctx.beginPath();
      ctx.arc(w.x + f.x * w.w, w.y + f.y * w.h, f.r, 0, Math.PI * 2);
      ctx.fill();
    });
    if (S.weather === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.75)';
      ctx.fillRect(w.x, w.y + w.h - 8, w.w, 8);
    }
    ctx.restore();
    const gx = w.x + w.w / 2 - 42;
    PARADE.forEach((id, i) => {
      ctx.fillStyle = S.delighted[id] > 0 ? '#ffd56a' : 'rgba(255,248,220,.62)';
      star(gx + i * 16, w.y + 16, S.delighted[id] > 0 ? 6 : 4.5, -0.2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCounter(m) {
    const y = m.counter;
    const g = ctx.createLinearGradient(0, y - 8, 0, H);
    g.addColorStop(0, '#c4895c');
    g.addColorStop(0.08, '#a56b42');
    g.addColorStop(1, '#6e4128');
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 8, W, H - y + 8);
    ctx.strokeStyle = 'rgba(80,40,20,.25)';
    ctx.lineWidth = 2;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.moveTo(0, y + i * ((H - y) / 5));
      ctx.lineTo(W, y + i * ((H - y) / 5));
      ctx.stroke();
    }
  }
  function drawTap(m) {
    const t = m.tap, s = m.s;
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.fillStyle = '#c6a15a';
    ctx.fillRect(-4 * s, -16 * s, 8 * s, 28 * s);
    ctx.beginPath();
    ctx.arc(0, -16 * s, 7 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8c6a32';
    ctx.fillRect(0, -2 * s, 16 * s, 5 * s);
    ctx.restore();
  }
  function drawJars(m) {
    const colors = { honey: '#e2a02a', lemon: '#f0d15a', milk: '#f7f4ee', mint: '#3f8f52' };
    m.jars.forEach(j => {
      const on = S.tray[j.id];
      ctx.save();
      ctx.translate(j.x, j.y);
      ctx.fillStyle = 'rgba(0,0,0,.18)';
      ctx.beginPath();
      ctx.ellipse(0, 12 * m.s, 12 * m.s, 4 * m.s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = colors[j.id];
      round(-10 * m.s, -8 * m.s, 20 * m.s, 20 * m.s, 5);
      ctx.fill();
      ctx.fillStyle = on ? '#fff6e0' : '#6b4a30';
      ctx.fillRect(-8 * m.s, -14 * m.s + (on ? -3 : 0), 16 * m.s, 6 * m.s);
      if (j.id === 'lemon') {
        ctx.fillStyle = '#7da84a';
        ctx.fillRect(-2, -16 * m.s, 4, 5);
      }
      if (j.id === 'mint') {
        ctx.fillStyle = '#1e5a30';
        ctx.beginPath();
        ctx.ellipse(0, 2, 5, 8, 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    });
  }
  function drawKettle(m) {
    const k = m.kettle, s = m.s;
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.fillStyle = '#2a241e';
    round(-28 * s, -8 * s, 56 * s, 16 * s, 4);
    ctx.fill();
    if (S.kettle.on && S.kettle.water > 0) {
      const flick = reduce ? 1 : 0.75 + Math.sin(time * 18) * 0.25;
      ctx.fillStyle = '#ffb15a';
      ctx.beginPath();
      ctx.moveTo(-10 * s, -6 * s);

    const hits = [];
    hits.push({ id: 'heat', x: m.kettle.x, y: m.kettle.y - 24 * m.s, r: m.kettle.r });
    hits.push({ id: 'refill', x: m.tap.x, y: m.tap.y, r: m.tap.r });
    m.jars.forEach(j => hits.push({ id: j.id, x: j.x, y: j.y, r: j.r }));

    hits.push({ id: 'cup', x: m.cup.x, y: m.cup.y - 16 * m.s, r: m.cup.r });

    if (S.cat) hits.push({ id: 'saucer', x: m.cat.x, y: m.cat.y, r: m.cat.r });
    if (m.plant) hits.push({ id: 'sprig', x: m.plant.x, y: m.plant.y, r: m.plant.r });

    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      const dx = x - h.x, dy = y - h.y;
      if (dx * dx + dy * dy <= h.r * h.r) {
        if (h.id === 'pour' && S.pot.water > 0 && S.pot.tea) act('strainer');
