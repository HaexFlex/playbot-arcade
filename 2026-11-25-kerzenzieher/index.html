<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kerzenzieher</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Kerzen ziehen in der Wachswerkstatt. Farben wählen, Docht tauchen, Schichten, Tropfen, Spirale und Flammen.">
<meta name="theme-color" content="#3a261c">
<style>
html,body{margin:0;height:100%;background:#3a261c;color:#3a2416;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html{overflow:hidden}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:100%;overflow:hidden;min-width:0}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:80px}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c.carve{cursor:crosshair}
#top{position:absolute;z-index:2;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 12px 0;pointer-events:none;max-width:100%;box-sizing:border-box}
h1{margin:0;font-family:Georgia,Palatino,"Iowan Old Style",serif;font-weight:650;font-size:clamp(18px,4.4vw,30px);letter-spacing:.01em;color:#3a2416;text-shadow:0 1px 0 rgba(255,244,230,.8);max-width:100%}
#status{margin:2px 0 0;font-size:13.5px;line-height:1.35;color:#3a2416;text-shadow:0 1px 0 rgba(255,244,230,.75);max-width:min(680px,100%)}
#bar{flex:0 0 auto;min-width:0;max-width:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#4a3024;border-top:1px solid #6a4634;box-sizing:border-box;overflow-x:hidden}
.pots,.actions{display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%;justify-content:center}
button{font:inherit;font-size:14px;color:#3a2416;background:#fff6ea;border:1px solid #e2cbb0;border-radius:12px;min-height:36px;min-width:36px;padding:6px 10px;cursor:pointer;touch-action:manipulation;box-sizing:border-box;max-width:100%}
.pots button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:focus-visible{outline:2px solid #ffe3b0;outline-offset:1px}
.pots button[aria-checked="true"]{background:#8d3a2a;color:#fff8f2;border-color:#8d3a2a}
button[aria-pressed="true"]{background:#8d3a2a;color:#fff8f2;border-color:#8d3a2a}
button:disabled{opacity:.55;cursor:default}
.sw{width:18px;height:18px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 -3px 0 rgba(40,16,8,.28), inset 0 2px 0 rgba(255,255,255,.55), 0 0 0 1px rgba(40,20,10,.2)}
.w-honig{background:#e2a84a}
.w-kirsche{background:#c0394a}
.w-kupfer{background:#d06a32}
.w-rose{background:#e07a96}
.w-tanne{background:#2f7a45}
.w-meer{background:#2a7f9c}
.w-flieder{background:#8a62b0}
.w-schnee{background:#f4efe4}
#veil{position:fixed;inset:0;z-index:6;background:rgba(28,16,10,.46);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
#veil[hidden]{display:none}
#card{width:min(440px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:#fff6ea;color:#3a2416;border-radius:16px;padding:16px 16px 12px;box-shadow:0 16px 40px rgba(0,0,0,.28);box-sizing:border-box}
#card h2{margin:0 0 8px;font-family:Georgia,Palatino,"Iowan Old Style",serif;font-size:22px;color:#3a2416}
#card p{margin:0 0 14px;font-size:15.5px;line-height:1.45}
#card .row{display:flex;flex-wrap:wrap;gap:8px}
#card button{min-width:44px}
@media (max-height:520px){
  #app{flex-direction:row}
  #bar{flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:flex-start;width:min(232px,46vw);max-height:100%;overflow-x:hidden;overflow-y:auto;border-top:none;border-left:1px solid #6a4634;gap:6px;padding:6px}
  .pots,.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pots button,.actions button{width:100%;font-size:13.5px;padding:4px 6px}
  h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){
  #status{transition:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Wachswerkstatt mit Kessel, Docht und Regal. Ziehe den Docht ins Wachs oder tippe auf Tauchen."></canvas>
    <header id="top">
      <h1>Kerzenzieher</h1>
      <p id="status" role="status" aria-live="polite">Ziehe den Docht ins Wachs, oder tippe auf Tauchen.</p>
    </header>
  </div>
  <section id="bar" aria-label="Steuerung">
    <div class="pots" role="radiogroup" aria-label="Wachsfarben">
      <button type="button" role="radio" data-wax="honig" aria-checked="true"><i class="sw w-honig" aria-hidden="true"></i>Honig</button>
      <button type="button" role="radio" data-wax="kirsche" aria-checked="false"><i class="sw w-kirsche" aria-hidden="true"></i>Kirsche</button>
      <button type="button" role="radio" data-wax="kupfer" aria-checked="false"><i class="sw w-kupfer" aria-hidden="true"></i>Kupfer</button>
      <button type="button" role="radio" data-wax="rose" aria-checked="false"><i class="sw w-rose" aria-hidden="true"></i>Rose</button>
      <button type="button" role="radio" data-wax="tanne" aria-checked="false"><i class="sw w-tanne" aria-hidden="true"></i>Tanne</button>
      <button type="button" role="radio" data-wax="meer" aria-checked="false"><i class="sw w-meer" aria-hidden="true"></i>Meer</button>
      <button type="button" role="radio" data-wax="flieder" aria-checked="false"><i class="sw w-flieder" aria-hidden="true"></i>Flieder</button>
      <button type="button" role="radio" data-wax="schnee" aria-checked="false"><i class="sw w-schnee" aria-hidden="true"></i>Schnee</button>
    </div>
    <div class="actions" role="toolbar" aria-label="Werkzeuge">
      <button id="bDip" type="button">Tauchen</button>
      <button id="bTwist" type="button" aria-pressed="false">Drehen</button>
      <button id="bCarve" type="button" aria-pressed="false">Schnitzen</button>
      <button id="bShelf" type="button">Abstellen</button>
      <button id="bLight" type="button" aria-pressed="false">Anzünden</button>
      <button id="bWick" type="button">Neuer Docht</button>
      <button id="bClear" type="button">Regal leeren</button>
      <button id="bTon" type="button" aria-pressed="false">Ton</button>
    </div>
  </section>
</div>
<div id="veil" hidden>
  <article id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
    <h2 id="cardTitle"></h2>
    <p id="cardBody"></p>
    <div class="row" id="cardRow"></div>
  </article>
</div>
<script>
'use strict';
(function () {
  const KEY = 'kerzenzieher-v1';
  const WAX_KEYS = ['honig', 'kirsche', 'kupfer', 'rose', 'tanne', 'meer', 'flieder', 'schnee'];
  const WAX = {
    honig:   { name: 'Honig',   hot: '#ffe7a8', cool: '#e2a84a', deep: '#8a5418' },
    kirsche: { name: 'Kirsche', hot: '#ffb7be', cool: '#c0394a', deep: '#6a1522' },
    kupfer:  { name: 'Kupfer',  hot: '#ffd0a6', cool: '#d06a32', deep: '#7a3412' },
    rose:    { name: 'Rose',    hot: '#ffd4e0', cool: '#e07a96', deep: '#8a3a50' },
    tanne:   { name: 'Tanne',   hot: '#c6e6b8', cool: '#2f7a45', deep: '#14361e' },
    meer:    { name: 'Meer',    hot: '#c5eaf6', cool: '#2a7f9c', deep: '#0e3e52' },
    flieder: { name: 'Flieder', hot: '#f0d8f8', cool: '#8a62b0', deep: '#462860' },
    schnee:  { name: 'Schnee',  hot: '#ffffff', cool: '#f3eee4', deep: '#b7ad9c' }
  };
  const MAX_LAYERS = 16;
  const MAX_SHELF = 7;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const statusEl = document.getElementById('status');
  const topEl = document.getElementById('top');
  const veil = document.getElementById('veil');
  const cardTitle = document.getElementById('cardTitle');
  const cardBody = document.getElementById('cardBody');
  const cardRow = document.getElementById('cardRow');
  const bDip = document.getElementById('bDip');
  const bTwist = document.getElementById('bTwist');
  const bCarve = document.getElementById('bCarve');
  const bShelf = document.getElementById('bShelf');
  const bLight = document.getElementById('bLight');
  const bWick = document.getElementById('bWick');
  const bClear = document.getElementById('bClear');
  const bTon = document.getElementById('bTon');
  const waxButtons = Array.prototype.slice.call(document.querySelectorAll('.pots button'));

  let reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) { reduce = false; }

  function fresh() {
    return { layers: [], twist: 0, phase: Math.random() * 6, grooves: [], lit: false, seed: Math.random() * 20 };
  }

  const state = {
    color: 'honig',
    pot: hexRgb(WAX.honig.cool),
    work: fresh(),
    shelf: [],
    dip: 0,
    anim: null,
    time: 0,
    twistOn: false,
    carveOn: false,
    drips: [],
    ripples: [],
    steam: [],
    smoke: [],
    motes: []
  };

  let geom = null;
  let grain = null;
  let ptr = null;
  let dialog = null;
  let dialogReturn = null;
  let gesture = false;
  let soundOn = false;
  let actx = null;
  let noiseBuf = null;
  let lastSound = 0;
  let saveAt = 0;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexRgb(h) {
    return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  }
  function mix(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }
  function rgba(c, a) {
    return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  function say(msg) { statusEl.textContent = msg; }
  function spanReach(c) {
    let m = 0;
    for (let i = 0; i < c.layers.length; i++) if (c.layers[i].reach > m) m = c.layers[i].reach;
    return m;
  }
  function motion(x) { return reduce ? x * 0.4 : x; }

  function makeGrain() {
    const c = document.createElement('canvas');
    c.width = 140;
    c.height = 140;
    const g = c.getContext('2d');
    const img = g.createImageData(140, 140);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = 180 + ((Math.random() * 70) | 0);
      img.data[i] = n;
      img.data[i + 1] = n - 8;
      img.data[i + 2] = n - 20;
      img.data[i + 3] = 26;
    }
    g.putImageData(img, 0, 0);
    grain = c;
  }

  function noteGesture() { gesture = true; }
  function ensureAudio() {
    if (!gesture || !soundOn) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!actx) {
      try { actx = new AC(); } catch (err) { actx = null; return null; }
    }
    if (actx.state === 'suspended') {
      const p = actx.resume();
      if (p && p.catch) p.catch(function () {});
    }
    return actx;
  }
  function noiseBurst(dur, freq, gain) {
    const ac = ensureAudio();
    if (!ac) return;
    try {
      if (!noiseBuf) {
        const n = Math.floor(ac.sampleRate * 0.4);
        const buf = ac.createBuffer(1, n, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        noiseBuf = buf;
      }
      const src = ac.createBufferSource();
      src.buffer = noiseBuf;
      const filter = ac.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = freq;
      const g = ac.createGain();
      const t = ac.currentTime;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(g);
      g.connect(ac.destination);
      src.start(t);
      src.stop(t + dur + 0.02);
    } catch (err) { /* audio graph failed */ }
  }
  function plop() {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;
    if (now - lastSound < 0.05) return;
    lastSound = now;
    try {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(210, now);
      o.frequency.exponentialRampToValueAtTime(78, now + 0.16);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.07, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + 0.22);
    } catch (err) { /* ignore */ }
    noiseBurst(0.12, 380, 0.03);
  }
  function dripNote() {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;
    if (now - lastSound < 0.07) return;
    lastSound = now;
    try {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(640 + Math.random() * 180, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.03, now + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + 0.1);
    } catch (err) { /* ignore */ }
  }
  function scrape() {
    const ac = ensureAudio();
    if (!ac) return;
    const now = ac.currentTime;
    if (now - lastSound < 0.08) return;
    lastSound = now;
    noiseBurst(0.09, 900, 0.025);
  }
  function lightNote() {
    const ac = ensureAudio();
    if (!ac) return;
    try {
      const now = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(320, now);
      o.frequency.exponentialRampToValueAtTime(180, now + 0.25);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.04, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + 0.3);
    } catch (err) { /* ignore */ }
    noiseBurst(0.18, 1400, 0.02);
  }
  function puff() {
    noiseBurst(0.16, 500, 0.04);
  }
  function confirmTone() {
    const ac = ensureAudio();
    if (!ac) return;
    try {
      const now = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(392, now);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.04, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      o.connect(g);
      g.connect(ac.destination);
      o.start(now);
      o.stop(now + 0.24);
    } catch (err) { /* ignore */ }
  }

  function syncWax() {
    waxButtons.forEach(function (b) {
      const on = b.getAttribute('data-wax') === state.color;
      b.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  function syncTools() {
    bTwist.setAttribute('aria-pressed', state.twistOn ? 'true' : 'false');
    bCarve.setAttribute('aria-pressed', state.carveOn ? 'true' : 'false');
    bTon.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    bTon.setAttribute('aria-label', soundOn ? 'Ton ist an. Tippen zum Ausschalten.' : 'Ton ist aus. Tippen zum Einschalten.');
    const lit = !!(state.work && state.work.lit);
    bLight.textContent = lit ? 'Löschen' : 'Anzünden';
    bLight.setAttribute('aria-pressed', lit ? 'true' : 'false');
    bLight.setAttribute('aria-label', lit ? 'Flamme löschen' : 'Kerze anzünden');
    bDip.disabled = !!state.anim;
    canvas.classList.toggle('carve', state.carveOn);
  }

  function packCandle(c) {
    return {
      layers: c.layers.map(function (L) {
        return { color: L.color, reach: +L.reach.toFixed(3), cool: +L.cool.toFixed(3) };
      }),
      twist: +c.twist.toFixed(3),
      phase: +c.phase.toFixed(3),
      grooves: c.grooves.slice(0, 80).map(function (g) {
        return { u: +g.u.toFixed(3), s: +g.s.toFixed(3), d: +g.d.toFixed(3) };
      }),
      lit: c.lit ? 1 : 0,
      seed: +c.seed.toFixed(3)
    };
  }
  function unpackCandle(raw) {
    const c = fresh();
    if (!raw || !Array.isArray(raw.layers)) return c;
    raw.layers.slice(0, MAX_LAYERS).forEach(function (L) {
      if (!L || WAX_KEYS.indexOf(L.color) < 0) return;
      c.layers.push({
        color: L.color,
        reach: clamp(+L.reach || 0, 0.1, 1),
        cool: clamp(+L.cool || 1, 0, 1)
      });
    });
    if (typeof raw.twist === 'number') c.twist = clamp(raw.twist, 0, 8);
    if (typeof raw.phase === 'number') c.phase = raw.phase;
    if (typeof raw.seed === 'number') c.seed = raw.seed;
    c.lit = !!raw.lit && c.layers.length > 0;
    if (Array.isArray(raw.grooves)) {
      raw.grooves.slice(0, 80).forEach(function (g) {
        if (!g) return;
        c.grooves.push({ u: clamp(+g.u || 0, 0, 1), s: clamp(+g.s || 0, -1, 1), d: clamp(+g.d || 0, 0, 1) });
      });
    }
    return c;
  }
  function save() {
    const data = {
      v: 1,
      color: state.color,
      sound: soundOn ? 1 : 0,
      twist: state.twistOn ? 1 : 0,
      work: packCandle(state.work),
      shelf: state.shelf.map(packCandle)
    };
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (err) { /* full or blocked */ }
  }
  function saveSoon() { saveAt = performance.now() + 400; }
  function load() {
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch (err) { return; }
    if (!raw) return;
    let data = null;
    try { data = JSON.parse(raw); } catch (err) { return; }
    if (!data || data.v !== 1) return;
    if (WAX_KEYS.indexOf(data.color) >= 0) state.color = data.color;
    state.pot = hexRgb(WAX[state.color].cool);
    soundOn = !!data.sound;
    state.twistOn = !!data.twist;
    state.work = unpackCandle(data.work);
    state.shelf = [];
    if (Array.isArray(data.shelf)) {
      data.shelf.slice(0, MAX_SHELF).forEach(function (item) {
        const c = unpackCandle(item);
        if (c.layers.length) state.shelf.push(c);
      });
    }
  }

  function layout() {
    const w = canvas.clientWidth || 300;
    const h = canvas.clientHeight || 300;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.max(1, Math.round(w * dpr));
      canvas.height = Math.max(1, Math.round(h * dpr));
    }
    const topInset = Math.max(36, topEl.offsetHeight + 6);
    const shortWide = h < 480 && w > h * 1.05;
    const scale = clamp(Math.min(w, h) / 560, 0.62, 1.2);
    const stationRight = shortWide ? Math.round(w * 0.58) : w;
    const cx = shortWide ? stationRight * 0.48 : w * 0.5;
    let potRx = clamp(stationRight * (shortWide ? 0.2 : 0.2), shortWide ? 56 : 74, shortWide ? 92 : 124);
    let potRy = potRx * 0.3;
    let potH = potRx * 0.82;
    let waxY = h - 12 - potH * 0.95;
    if (waxY < topInset + 120) {
      potRx *= 0.82;
      potRy = potRx * 0.3;
      potH = potRx * 0.82;
      waxY = h - 12 - potH * 0.95;
    }
    const flameRoom = 34;
    let candleH = shortWide ? clamp(h * 0.3, 70, 104) : clamp((h - topInset) * 0.2, 96, 150);
    let boardY = topInset + flameRoom + candleH;
    if (!shortWide && boardY > waxY - 170) {
      candleH = Math.max(78, waxY - 170 - topInset - flameRoom);
      boardY = topInset + flameRoom + candleH;
    }
    if (shortWide) boardY = clamp(boardY, topInset + 96, h - 28);
    const regionX0 = shortWide ? stationRight + 18 : 20;
    const regionX1 = w - 18;
    const regionW = Math.max(70, regionX1 - regionX0);
    const gap = clamp(regionW / MAX_SHELF, 38, shortWide ? 54 : 86);
    const rowW = gap * MAX_SHELF;
    let rowStart = regionX0 + Math.max(0, (regionW - rowW) / 2);
    if (rowStart + rowW > regionX1) rowStart = Math.max(regionX0, regionX1 - rowW);
    const xs = [];
    for (let i = 0; i < MAX_SHELF; i++) xs.push(rowStart + gap * (i + 0.5));
    const shelf = {
      boardY: boardY,
      x0: xs[0] - gap * 0.42,
      x1: xs[xs.length - 1] + gap * 0.42,
      xs: xs,
      candleH: candleH,
      scale: clamp(scale * (shortWide ? 0.62 : 0.7), 0.55, 0.86)
    };
    const winW = Math.min(shortWide ? 96 : 142, Math.max(70, stationRight * 0.26));
    const winH = shortWide ? 60 : Math.min(100, Math.max(68, (waxY - boardY) * 0.38));
    const winY = shortWide ? topInset + 6 : Math.min(boardY + 40, Math.max(boardY + 16, waxY - winH - 28));
    const win = { x: 16, y: winY, w: winW, h: winH };
    const hookY = shortWide ? topInset + 8 : boardY + 30;
    let wickLen = waxY - hookY - 42 * scale;
    wickLen = clamp(wickLen, 72, shortWide ? 200 : 320);
    let restBottom = waxY - 22 * scale;
    let restTop = restBottom - wickLen;
    const minTop = hookY + 18;
    if (restTop < minTop) {
      restTop = minTop;
      wickLen = Math.max(64, restBottom - restTop);
      restTop = restBottom - wickLen;
    }
    const deepBottom = waxY + wickLen * 0.98;
    const travel = Math.max(30, deepBottom - restBottom);
    geom = {
      w: w, h: h, dpr: dpr, cssW: w, cssH: h, scale: scale, shortWide: shortWide,
      topInset: topInset, cx: cx, waxY: waxY, potRx: potRx, potRy: potRy, potH: potH,
      hookY: hookY, wickLen: wickLen, restBottom: restBottom,
      deepBottom: deepBottom, travel: travel, restTop: restTop, shelf: shelf, win: win,
      maxShelf: MAX_SHELF
    };
    if (state.motes.length < 10) {
      state.motes = [];
      for (let i = 0; i < 12; i++) {
        state.motes.push({
          x: Math.random() * w,
          y: Math.random() * h * 0.7,
          s: 0.6 + Math.random() * 1.4,
          v: 4 + Math.random() * 8
        });
      }
    }
  }

  function workBox() {
    const g = geom;
    const top = g.restTop + state.dip * g.travel;
    return {
      cx: g.cx,
      top: top,
      len: g.wickLen,
      scale: clamp(g.scale, 0.78, 1.05)
    };
  }

  function coverage(candle, t, radScale) {
    let r = 0;
    let color = null;
    let under = null;
    let cool = 1;
    let boost = 0;
    const n = candle.layers.length;
    for (let i = 0; i < n; i++) {
      const L = candle.layers[i];
      const shoulder = 1 - L.reach;
      if (t < shoulder - 0.002) continue;
      under = color;
      color = L.color;
      cool = L.cool;
      const coat = r === 0 ? 10.5 : 4.6;
      r += coat * Math.pow(0.86, i);
      const dist = t - shoulder;
      if (dist >= 0 && dist < 0.045) {
        const u = dist / 0.045;
        boost = Math.max(boost, Math.sin(u * Math.PI) * (2.3 + (1 - L.cool) * 1.4));
      }
    }
    if (!color) return null;
    const maxR = spanReach(candle);
    const waxTop = 1 - maxR;
    const u = maxR > 0.001 ? clamp((t - waxTop) / maxR, 0, 1) : 1;
    let taper = 0.8 + 0.2 * Math.sin(Math.min(1, u) * Math.PI);
    if (u > 0.88) taper *= Math.cos(clamp((u - 0.88) / 0.12, 0, 1) * Math.PI * 0.5);
    if (candle.twist > 0.08) {
      taper *= 1 + 0.028 * Math.sin(u * candle.twist * Math.PI * 2 + candle.phase);
    }
    r = (r * taper + boost) * radScale;
    let reveal = 0;
    const grooves = candle.grooves;
    for (let i = 0; i < grooves.length; i++) {
      const gv = grooves[i];
      const du = Math.abs(gv.u - u);
      if (du > 0.045) continue;
      if (Math.abs(gv.s) > 0.78) continue;
      const k = (1 - du / 0.045) * gv.d * (1 - Math.abs(gv.s) * 0.35);
      if (k > reveal) reveal = k;
    }
    r = Math.max(1.5 * radScale, r - reveal * 9 * radScale);
    if (candle.lit && u < 0.07) r += (1 - u / 0.07) * 2.2 * radScale;
    return { r: r, color: color, under: under, cool: cool, reveal: reveal, u: u, boost: boost };
  }

  function colorAt(cov) {
    const spec = WAX[cov.color];
    let rgb = mix(hexRgb(spec.hot), hexRgb(spec.cool), cov.cool);
    rgb = mix(rgb, hexRgb(spec.deep), 0.06 + cov.u * 0.1);
    if (cov.reveal > 0.18 && cov.under && WAX[cov.under]) {
      const inner = hexRgb(WAX[cov.under].cool);
      rgb = mix(rgb, inner, Math.min(1, (cov.reveal - 0.12) * 1.3));
    }
    return rgb;
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function fillBand(cx, run) {
    if (!run.length) return;
    const top = run[0];
    const bot = run[run.length - 1];
    const gloss = 1 - top.cool;
    const rgb = top.rgb;
    const deep = mix(rgb, [36, 16, 8], 0.5);
    const hi = mix(rgb, [255, 250, 236], 0.48 + gloss * 0.34);
    const maxR = run.reduce(function (m, s) { return Math.max(m, s.r); }, 1);
    ctx.beginPath();
    if (run.length === 1) {
      ctx.ellipse(cx, top.y, top.r, Math.max(2, top.r * 0.28), 0, 0, Math.PI * 2);
    } else {
      ctx.moveTo(cx - top.r, top.y);
      for (let i = 1; i < run.length; i++) ctx.lineTo(cx - run[i].r, run[i].y);
      ctx.ellipse(cx, bot.y, Math.max(0.8, bot.r), Math.max(2, bot.r * 0.26), 0, Math.PI, 0, true);
      for (let i = run.length - 1; i >= 0; i--) ctx.lineTo(cx + run[i].r, run[i].y);
      ctx.ellipse(cx, top.y, Math.max(0.8, top.r), Math.max(2, top.r * 0.26), 0, 0, Math.PI, true);
      ctx.closePath();
    }
    const g = ctx.createLinearGradient(cx - maxR, 0, cx + maxR, 0);
    g.addColorStop(0, rgba(deep, 1));
    g.addColorStop(0.34, rgba(mix(rgb, deep, 0.18), 1));
    g.addColorStop(0.48, rgba(rgb, 1));
    g.addColorStop(0.58, rgba(hi, 1));
    g.addColorStop(1, rgba(mix(rgb, deep, 0.38), 1));
    ctx.fillStyle = g;
    ctx.fill();
    if (top.boost > 1.2) {
      ctx.strokeStyle = rgba(deep, 0.45);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(cx, top.y, top.r, Math.max(1.6, top.r * 0.22), 0, 0, Math.PI);
      ctx.stroke();
    }
  }

  function drawSpiral(candle, box) {
    if (candle.twist < 0.2) return;
    const maxR = spanReach(candle);
    if (maxR < 0.05) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.beginPath();
    let drawing = false;
    const steps = 90;
    for (let i = 0; i <= steps; i++) {
      const u = i / steps;
      const t = (1 - maxR) + u * maxR;
      const cov = coverage(candle, t, box.scale);
      if (!cov) { drawing = false; continue; }
      const ang = candle.phase + u * candle.twist * Math.PI * 2;
      const front = Math.cos(ang);
      if (front < -0.05) { drawing = false; continue; }
      const x = box.cx + Math.sin(ang) * cov.r * 0.72;
      const y = box.top + t * box.len;
      if (!drawing) { ctx.moveTo(x, y); drawing = true; }
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = 'rgba(90, 48, 28, 0.35)';
    ctx.lineWidth = Math.max(1.6, 2.4 * box.scale);
    ctx.stroke();
    ctx.restore();
  }

  function drawGrooves(candle, box) {
    if (!candle.grooves.length) return;
    const maxR = spanReach(candle);
    if (maxR < 0.04) return;
    ctx.save();
    candle.grooves.forEach(function (g) {
      const t = (1 - maxR) + g.u * maxR;
      const cov = coverage(candle, t, box.scale);
      if (!cov) return;
      const x = box.cx + g.s * cov.r * 0.65;
      const y = box.top + t * box.len;
      ctx.fillStyle = 'rgba(40, 18, 10, ' + (0.18 + g.d * 0.25) + ')';
      ctx.beginPath();
      ctx.ellipse(x, y, 1.6 + g.d * 2.2, 2.4 + g.d * 1.4, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawCandle(candle, box) {
    const steps = Math.max(48, Math.floor(box.len));
    const samples = [];
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const cov = coverage(candle, t, box.scale);
      if (!cov) continue;
      samples.push({
        y: box.top + t * box.len,
        r: cov.r,
        color: cov.color,
        cool: cov.cool,
        boost: cov.boost,
        rgb: colorAt(cov)
      });
    }
    if (!samples.length) {
      ctx.strokeStyle = '#efe8dc';
      ctx.lineWidth = Math.max(1.4, 1.7 * box.scale);
      ctx.beginPath();
      ctx.moveTo(box.cx, box.top);
      ctx.lineTo(box.cx, box.top + box.len);
      ctx.stroke();
      return { x: box.cx, y: box.top + Math.min(18, box.len * 0.2), bare: true };
    }
    let run = [samples[0]];
    for (let i = 1; i < samples.length; i++) {
      if (samples[i].color !== run[0].color) {
        fillBand(box.cx, run);
        run = [samples[i - 1], samples[i]];
      } else run.push(samples[i]);
    }
    fillBand(box.cx, run);
    const waxTop = samples[0].y;
    ctx.strokeStyle = candle.lit ? '#2a211c' : '#f4efe6';
    ctx.lineWidth = candle.lit ? Math.max(2, 2.2 * box.scale) : Math.max(1.3, 1.6 * box.scale);
    ctx.beginPath();
    ctx.moveTo(box.cx, box.top);
    ctx.lineTo(box.cx, waxTop);
    ctx.stroke();
    if (candle.lit) {
      ctx.strokeStyle = '#1a1410';
      ctx.lineWidth = Math.max(2.2, 2.5 * box.scale);
      ctx.beginPath();
      ctx.moveTo(box.cx, waxTop - 1);
      ctx.lineTo(box.cx, waxTop + 9 * box.scale);
      ctx.stroke();
    }
    drawSpiral(candle, box);
    drawGrooves(candle, box);
    return { x: box.cx, y: waxTop - (candle.lit ? 2 : 0), bare: false };
  }

  function drawFlame(x, y, scale, seed, alpha) {
    const time = state.time;
    const flickAmp = reduce ? 0.04 : 0.16;
    const flick = 1 - flickAmp + flickAmp * Math.sin(time * 14 + seed) * (0.65 + 0.35 * Math.sin(time * 9 + seed * 1.7));
    const lean = Math.sin(time * 3.2 + seed) * 2.4 * scale * (reduce ? 0.25 : 1);
    const fh = 28 * scale * flick;
    const fw = 8.2 * scale * (0.92 + 0.08 * Math.sin(time * 11 + seed));
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    const glow = ctx.createRadialGradient(x + lean * 0.2, y - fh * 0.45, 2, x, y - fh * 0.35, fh * 2.8);
    glow.addColorStop(0, 'rgba(255, 220, 150, 0.62)');
    glow.addColorStop(0.35, 'rgba(255, 150, 50, 0.16)');
    glow.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y - fh * 0.4, fh * 2.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - fw * 0.12, y + 1);
    ctx.bezierCurveTo(x - fw * 1.2, y - fh * 0.42, x - fw * 0.1 + lean, y - fh * 0.9, x + lean, y - fh);
    ctx.bezierCurveTo(x + fw * 0.45 + lean, y - fh * 0.9, x + fw * 1.15, y - fh * 0.38, x + fw * 0.12, y + 1);
    ctx.fillStyle = '#ff7a24';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x - fw * 0.55, y - fh * 0.38, x + lean * 0.4, y - fh * 0.7, x + lean * 0.65, y - fh * 0.76);
    ctx.bezierCurveTo(x + fw * 0.25 + lean, y - fh * 0.66, x + fw * 0.5, y - fh * 0.32, x, y);
    ctx.fillStyle = '#ffc14d';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + lean * 0.15, y - fh * 0.26, Math.max(0.8, fw * 0.2), fh * 0.2, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#fff4d2';
    ctx.fill();
    ctx.restore();
  }

  function drawWallLight(x, y, scale) {
    const rad = 90 * scale;
    const g = ctx.createRadialGradient(x, y, 4, x, y, rad);
    g.addColorStop(0, 'rgba(255, 196, 110, 0.38)');
    g.addColorStop(0.45, 'rgba(255, 160, 70, 0.1)');
    g.addColorStop(1, 'rgba(255, 140, 50, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRoom() {
    const g = geom;
    const sky = ctx.createLinearGradient(0, 0, 0, g.h);
    sky.addColorStop(0, '#f3d7b4');
    sky.addColorStop(0.42, '#e7c49a');
    sky.addColorStop(1, '#c8966c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, g.w, g.h);
    const vig = ctx.createRadialGradient(g.w * 0.5, g.h * 0.4, g.h * 0.2, g.w * 0.5, g.h * 0.45, g.h * 0.85);
    vig.addColorStop(0, 'rgba(255, 230, 190, 0)');
    vig.addColorStop(1, 'rgba(90, 42, 22, 0.28)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, g.w, g.h);
    if (grain) {
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.drawImage(grain, 0, 0, g.w, g.h);
      ctx.restore();
    }
    const win = g.win;
    ctx.save();
    roundRect(win.x, win.y, win.w, win.h, 8);
    ctx.clip();
    const dusk = ctx.createLinearGradient(0, win.y, 0, win.y + win.h);
    dusk.addColorStop(0, '#f6b16a');
    dusk.addColorStop(0.45, '#e07a78');
    dusk.addColorStop(1, '#6d4d78');
    ctx.fillStyle = dusk;
    ctx.fillRect(win.x, win.y, win.w, win.h);
    ctx.fillStyle = 'rgba(255, 244, 220, 0.9)';
    ctx.beginPath();
    ctx.arc(win.x + win.w * 0.72, win.y + win.h * 0.32, Math.min(win.w, win.h) * 0.12, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3d4a3c';
    ctx.beginPath();
    ctx.moveTo(win.x, win.y + win.h * 0.78);
    ctx.quadraticCurveTo(win.x + win.w * 0.35, win.y + win.h * 0.58, win.x + win.w * 0.62, win.y + win.h * 0.74);
    ctx.quadraticCurveTo(win.x + win.w * 0.82, win.y + win.h * 0.66, win.x + win.w, win.y + win.h * 0.7);
    ctx.lineTo(win.x + win.w, win.y + win.h);
    ctx.lineTo(win.x, win.y + win.h);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#6b4630';
    ctx.lineWidth = 6;
    roundRect(win.x, win.y, win.w, win.h, 8);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(90, 50, 30, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(win.x + win.w * 0.5, win.y + 3);
    ctx.lineTo(win.x + win.w * 0.5, win.y + win.h - 3);
    ctx.moveTo(win.x + 3, win.y + win.h * 0.5);
    ctx.lineTo(win.x + win.w - 3, win.y + win.h * 0.5);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255, 214, 160, 0.13)';
    ctx.beginPath();
    ctx.moveTo(win.x + win.w * 0.2, win.y + win.h);
    ctx.lineTo(win.x + win.w * 0.85, win.y + win.h);
    ctx.lineTo(g.cx * 0.3, g.h * 0.62);
    ctx.lineTo(win.x - 10, g.h * 0.48);
    ctx.fill();
  }

  function shelfX(i) {
    const xs = geom.shelf.xs;
    const n = state.shelf.length;
    const start = Math.max(0, Math.floor((xs.length - n) / 2));
    return xs[start + i];
  }

  function drawShelfBoard() {
    const s = geom.shelf;
    const y = s.boardY;
    const x0 = s.x0;
    const bw = Math.max(24, s.x1 - s.x0);
    ctx.fillStyle = 'rgba(90, 48, 24, 0.1)';
    ctx.beginPath();
    ctx.ellipse(x0 + bw / 2, y + 20, bw * 0.46, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    const grd = ctx.createLinearGradient(0, y, 0, y + 18);
    grd.addColorStop(0, '#f3d4aa');
    grd.addColorStop(0.45, '#c48952');
    grd.addColorStop(1, '#6e4428');
    ctx.fillStyle = grd;
    roundRect(x0, y, bw, 16, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255, 236, 210, 0.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0 + 10, y + 4);
    ctx.lineTo(x0 + bw - 10, y + 4);
    ctx.stroke();
    ctx.fillStyle = '#6a4030';
    const posts = bw < 180 ? [0.5] : [0.18, 0.5, 0.82];
    posts.forEach(function (p) {
      const x = x0 + bw * p;
      ctx.beginPath();
      ctx.moveTo(x - 8, y + 16);
      ctx.lineTo(x - 12, y + 30);
      ctx.lineTo(x + 12, y + 30);
      ctx.lineTo(x + 8, y + 16);
      ctx.fill();
    });
  }

  function drawBench() {
    const g = geom;
    const y = Math.min(g.waxY + g.potH * 0.58, g.h - 28);
    const wood = ctx.createLinearGradient(0, y, 0, g.h);
    wood.addColorStop(0, '#b48358');
    wood.addColorStop(0.2, '#8d5a36');
    wood.addColorStop(1, '#4e301f');
    ctx.fillStyle = wood;
    ctx.fillRect(0, y, g.w, g.h - y);
    ctx.strokeStyle = 'rgba(60, 28, 14, 0.28)';
    ctx.lineWidth = 2;
    for (let i = 1; i <= 4; i++) {
      const yy = y + i * Math.max(8, (g.h - y) / 5);
      if (yy >= g.h) break;
      ctx.beginPath();
      ctx.moveTo(0, yy);
      ctx.lineTo(g.w, yy);
      ctx.stroke();
    }
  }

  function drawPotBody() {
    const g = geom;
    const cx = g.cx;
    const y = g.waxY;
    ctx.fillStyle = 'rgba(70, 32, 16, 0.22)';
    ctx.beginPath();
    ctx.ellipse(cx, y + g.potH * 0.95, g.potRx * 1.05, g.potRy * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    const ember = 0.75 + 0.25 * Math.sin(state.time * 6);
    const eg = ctx.createRadialGradient(cx, y + g.potH * 0.9, 4, cx, y + g.potH * 0.9, g.potRx * 0.85);
    eg.addColorStop(0, 'rgba(255, 176, 70, ' + (0.55 * ember) + ')');
    eg.addColorStop(1, 'rgba(255, 90, 20, 0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(cx, y + g.potH * 0.92, g.potRx * 0.7, g.potRy * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2c211c';
    ctx.lineWidth = 5 * g.scale;
    ctx.beginPath();
    ctx.ellipse(cx, y + g.potH * 0.9, g.potRx * 0.62, g.potRy * 0.4, 0, 0, Math.PI * 2);
    ctx.stroke();
    const body = ctx.createLinearGradient(cx - g.potRx, 0, cx + g.potRx, 0);
    body.addColorStop(0, '#6a3822');
    body.addColorStop(0.32, '#c48452');
    body.addColorStop(0.48, '#f2c7a4');
    body.addColorStop(0.68, '#b86b3e');
    body.addColorStop(1, '#5a301c');
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(cx - g.potRx, y);
    ctx.bezierCurveTo(cx - g.potRx * 1.06, y + g.potH * 0.48, cx - g.potRx * 0.7, y + g.potH * 0.9, cx, y + g.potH * 0.9);
    ctx.bezierCurveTo(cx + g.potRx * 0.7, y + g.potH * 0.9, cx + g.potRx * 1.06, y + g.potH * 0.48, cx + g.potRx, y);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8d5340';
    ctx.lineWidth = 3.5 * g.scale;
    ctx.beginPath();
    ctx.arc(cx - g.potRx + 1, y + 2, 11 * g.scale, Math.PI * 0.55, Math.PI * 1.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + g.potRx - 1, y + 2, 11 * g.scale, -Math.PI * 0.55, Math.PI * 0.45);
    ctx.stroke();
  }

  function drawWax() {
    const g = geom;
    const cx = g.cx;
    const y = g.waxY + Math.sin(state.time * 1.6) * 0.6;
    const rx = g.potRx * 0.9;
    const ry = g.potRy * 0.48;
    const rgb = state.pot;
    const hot = mix(rgb, [255, 246, 224], 0.38);
    const deep = mix(rgb, [40, 18, 10], 0.5);
    const grd = ctx.createRadialGradient(cx - rx * 0.25, y - ry * 0.3, 4, cx, y, rx);
    grd.addColorStop(0, rgba(hot, 1));
    grd.addColorStop(0.55, rgba(rgb, 1));
    grd.addColorStop(1, rgba(deep, 1));
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(cx, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.ellipse(cx - rx * 0.22 + Math.sin(state.time * 0.8) * 8, y - ry * 0.18, rx * 0.26, ry * 0.24, -0.5, 0, Math.PI * 2);
    ctx.fill();
    state.ripples.forEach(function (rip) {
      const k = rip.age / rip.life;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 * (1 - k)) + ')';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(rip.x, y, rx * (0.12 + k * 0.7), ry * (0.12 + k * 0.7), 0, 0, Math.PI * 2);
      ctx.stroke();
    });
    ctx.strokeStyle = '#8a4e2e';
    ctx.lineWidth = 5 * g.scale;
    ctx.beginPath();
    ctx.ellipse(cx, g.waxY, g.potRx, g.potRy * 0.55, 0, 0, Math.PI);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 220, 190, 0.45)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, g.waxY - 1, g.potRx * 0.92, g.potRy * 0.42, 0, Math.PI * 1.05, Math.PI * 1.45);
    ctx.stroke();
  }

  function drawHook(stringY) {
    const g = geom;
    const x = g.cx;
    const y = g.hookY;
    const wood = ctx.createLinearGradient(x - 60, y, x + 60, y + 12);
    wood.addColorStop(0, '#6b4228');
    wood.addColorStop(0.5, '#c49262');
    wood.addColorStop(1, '#6b4228');
    ctx.fillStyle = wood;
    roundRect(x - 48 * g.scale, y, 96 * g.scale, 11, 3);
    ctx.fill();
    ctx.strokeStyle = '#5e564e';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(x, y + 10);
    ctx.lineTo(x, y + 18);
    ctx.arc(x + 5, y + 18, 6, Math.PI, 0.2, true);
    ctx.stroke();
    ctx.strokeStyle = '#ece4d8';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x, y + 22);
    ctx.lineTo(x + Math.sin(state.time * 1.4) * 0.6, stringY);
    ctx.stroke();
  }

  function drawSteam() {
    state.steam.forEach(function (p) {
      const k = p.age / p.life;
      ctx.fillStyle = 'rgba(255, 248, 240, ' + (0.22 * (1 - k)) + ')';
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, p.r * (1 + k), p.r * 0.7 * (1 + k), 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawSmoke() {
    state.smoke.forEach(function (p) {
      const k = p.age / p.life;
      ctx.fillStyle = 'rgba(90, 80, 74, ' + (0.22 * (1 - k)) + ')';
      ctx.beginPath();
      ctx.arc(p.x + Math.sin(p.age * 3 + p.seed) * 6, p.y, 4 + k * 14, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function drawMotes() {
    ctx.fillStyle = 'rgba(255, 236, 200, 0.7)';
    state.motes.forEach(function (m) {
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(state.time * 1.5 + m.x);
      ctx.fillRect(m.x, m.y, m.s, m.s);
    });
    ctx.globalAlpha = 1;
  }

  function drawDrips(mode) {
    state.drips.forEach(function (d) {
      if (d.mode !== mode) return;
      const spec = WAX[d.color] || WAX.honig;
      const rgb = mix(hexRgb(spec.hot), hexRgb(spec.cool), d.cool);
      let x = d.x;
      let y = d.y;
      if (d.mode === 'slide') {
        const box = workBox();
        const cov = coverage(state.work, d.t, box.scale);
        const rr = cov ? cov.r : 4;
        x = box.cx + d.side * rr * 0.92;
        y = box.top + d.t * box.len;
        d.x = x;
        d.y = y;
      }
      ctx.fillStyle = rgba(rgb, 0.95);
      ctx.beginPath();
      ctx.ellipse(x, y, d.r * 0.7, d.r * 1.15, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(x - d.r * 0.15, y - d.r * 0.3, d.r * 0.22, d.r * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function draw() {
    const w = canvas.clientWidth || 0;
    const h = canvas.clientHeight || 0;
    if (!w || !h) return;
    if (!geom || w !== geom.cssW || h !== geom.cssH || Math.min(2, window.devicePixelRatio || 1) !== geom.dpr) layout();
    const g = geom;
    if (!g) return;
    ctx.setTransform(g.dpr, 0, 0, g.dpr, 0, 0);
    drawRoom();
    const lights = [];
    state.shelf.forEach(function (c, i) {
      if (!c.lit) return;
      const x = shelfX(i);
      if (x == null) return;
      lights.push({ x: x, y: g.shelf.boardY - g.shelf.candleH * 0.72, scale: g.shelf.scale });
    });
    if (state.work.lit && state.dip < 0.08 && !state.anim) {
      const box = workBox();
      lights.push({ x: box.cx, y: box.top + box.len * (1 - spanReach(state.work)) * 0.5, scale: box.scale });
    }
    if (lights.length) {
      ctx.fillStyle = 'rgba(255, 176, 90, ' + Math.min(0.07, lights.length * 0.018) + ')';
      ctx.fillRect(0, 0, g.w, g.h);
    }
    lights.forEach(function (L) { drawWallLight(L.x, L.y, L.scale * 1.4); });
    drawShelfBoard();
    const shelfFlames = [];
    state.shelf.forEach(function (c, i) {
      const s = g.shelf;
      const x = shelfX(i);
      if (x == null) return;
      const len = s.candleH;
      const top = s.boardY - len;
      const tip = drawCandle(c, { cx: x, top: top, len: len, scale: s.scale });
      if (c.lit && !tip.bare) shelfFlames.push({ x: tip.x, y: tip.y, scale: s.scale * 0.85, seed: c.seed });
    });
    drawBench();
    drawPotBody();
    const box = workBox();
    drawHook(Math.min(box.top, g.waxY - 1));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, g.w, g.waxY + 1);
    ctx.clip();
    drawCandle(state.work, box);
    drawDrips('slide');
    ctx.restore();
    drawWax();
    drawDrips('fall');
    drawSteam();
    drawSmoke();
    shelfFlames.forEach(function (f) { drawFlame(f.x, f.y, f.scale, f.seed, 1); });
    if (state.work.lit && state.dip < 0.12) {
      const maxR = spanReach(state.work);
      if (maxR > 0.05) {
        const t = 1 - maxR;
        const cov = coverage(state.work, Math.min(0.99, t + 0.01), box.scale);
        const y = box.top + t * box.len;
        drawFlame(box.cx, y, box.scale * 0.95, state.work.seed, 1);
        if (cov) {
          ctx.fillStyle = 'rgba(255, 220, 160, 0.35)';
          ctx.beginPath();
          ctx.ellipse(box.cx, y + 2, cov.r * 0.7, Math.max(2, cov.r * 0.18), 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    drawMotes();
    if (state.carveOn && state.work.layers.length) {
      ctx.save();
      ctx.strokeStyle = 'rgba(90, 40, 24, 0.35)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.strokeRect(box.cx - 36 * g.scale, box.top, 72 * g.scale, box.len);
      ctx.restore();
    }
  }

  function spawnDrips(reach) {
    const n = 2 + ((Math.random() * 3) | 0);
    const shoulder = 1 - reach;
    for (let i = 0; i < n; i++) {
      state.drips.push({
        mode: 'slide',
        side: Math.random() < 0.5 ? -1 : 1,
        t: shoulder + 0.01,
        speed: 0.12 + Math.random() * 0.16,
        r: 3.1 + Math.random() * 2.6,
        color: state.color,
        cool: 0,
        detach: clamp(shoulder + 0.25 + Math.random() * 0.55, shoulder + 0.15, 0.98),
        x: 0,
        y: 0,
        vx: 0,
        vy: 0
      });
    }
  }

  function commitLayer(reach) {
    if (state.work.layers.length >= MAX_LAYERS) {
      say('Die Kerze ist dick genug. Stelle sie ins Regal.');
      return false;
    }
    reach = clamp(reach, 0.16, 0.98);
    if (state.work.lit) extinguish(state.work, true);
    state.work.layers.push({ color: state.color, reach: reach, cool: 0 });
    if (state.twistOn) state.work.twist = clamp(state.work.twist + 0.55, 0, 8);
    state.work.grooves = [];
    spawnDrips(reach);
    plop();
    const n = state.work.layers.length;
    say('Schicht ' + n + ', ' + WAX[state.color].name + '. Das heisse Wachs kühlt und tropft.');
    saveSoon();
    syncTools();
    return true;
  }

  function buttonReach() {
    const n = state.work.layers.length;
    const pattern = [0.93, 0.76, 0.88, 0.68, 0.84, 0.73];
    const base = pattern[n % pattern.length];
    return clamp(base + (Math.random() - 0.5) * 0.035, 0.6, 0.97);
  }

  function dipForReach(reach) {
    const bottom = geom.waxY + reach * geom.wickLen;
    return clamp((bottom - geom.restBottom) / geom.travel, 0, 1);
  }

  function reachForDip(dip) {
    const bottom = geom.restBottom + dip * geom.travel;
    const submerged = bottom - geom.waxY;
    if (submerged <= 2) return 0;
    return clamp(submerged / geom.wickLen, 0, 1);
  }

  function startButtonDip() {
    if (state.anim || dialog) return;
    if (state.work.layers.length >= MAX_LAYERS) {
      say('Die Kerze ist dick genug. Stelle sie ins Regal.');
      return;
    }
    const reach = buttonReach();
    const target = dipForReach(reach);
    state.anim = { kind: 'down', from: state.dip, to: target, dur: motion(0.46), el: 0, reach: reach };
    syncTools();
  }

  function releaseDip() {
    const reach = reachForDip(state.dip);
    if (reach < 0.14) {
      state.anim = { kind: 'up', from: state.dip, to: 0, dur: motion(0.28), el: 0, reach: 0, skip: true };
      say('Wachs zu knapp. Tauche tiefer.');
      return;
    }
    if (state.work.layers.length >= MAX_LAYERS) {
      state.anim = { kind: 'up', from: state.dip, to: 0, dur: motion(0.32), el: 0, reach: 0, skip: true };
      say('Die Kerze ist dick genug. Stelle sie ins Regal.');
      return;
    }
    commitLayer(reach);
    state.anim = { kind: 'up', from: state.dip, to: 0, dur: motion(0.5), el: 0, reach: 0, skip: true };
    syncTools();
  }

  function placeOnShelf() {
    if (!state.work.layers.length) {
      say('Noch kein Wachs auf dem Docht.');
      return false;
    }
    if (state.shelf.length >= geom.maxShelf) {
      say('Das Regal ist voll.');
      return false;
    }
    state.shelf.push(unpackCandle(packCandle(state.work)));
    state.work = fresh();
    state.dip = 0;
    say('Die Kerze steht im Regal.');
    saveSoon();
    syncTools();
    return true;
  }

  function extinguish(candle, quiet) {
    candle.lit = false;
    if (!quiet) {
      const box = workBox();
      const maxR = spanReach(candle);
      state.smoke.push({
        x: box.cx,
        y: box.top + (1 - maxR) * box.len,
        age: 0,
        life: 1.3,
        seed: Math.random() * 6
      });
      puff();
      say('Die Flamme ist aus.');
    }
  }

  function toggleWorkFlame() {
    if (!state.work.layers.length) {
      say('Zuerst eine Schicht Wachs.');
      return;
    }
    if (state.anim) return;
    if (state.work.lit) {
      extinguish(state.work, false);
    } else {
      state.work.lit = true;
      lightNote();
      say('Die Flamme brennt.');
    }
    saveSoon();
    syncTools();
  }

  function toggleShelfFlame(index) {
    const c = state.shelf[index];
    if (!c) return;
    c.lit = !c.lit;
    if (c.lit) {
      lightNote();
      say('Eine Kerze im Regal brennt.');
    } else {
      const s = geom.shelf;
      state.smoke.push({ x: shelfX(index), y: s.boardY - s.candleH * 0.7, age: 0, life: 1.2, seed: Math.random() * 6 });
      puff();
      say('Die Flamme im Regal ist aus.');
    }
    saveSoon();
  }

  function addGroove(x, y) {
    const box = workBox();
    if (!state.work.layers.length) {
      say('Zuerst eine Schicht Wachs.');
      return;
    }
    const maxR = spanReach(state.work);
    const t = clamp((y - box.top) / box.len, 0, 1);
    const u = maxR > 0.02 ? clamp((t - (1 - maxR)) / maxR, 0, 1) : 0;
    const cov = coverage(state.work, t, box.scale);
    const r = cov ? cov.r : 10;
    const s = clamp((x - box.cx) / (r || 1), -1, 1);
    const grooves = state.work.grooves;
    const last = grooves[grooves.length - 1];
    if (last && Math.abs(last.u - u) < 0.015 && Math.abs(last.s - s) < 0.08) {
      last.d = Math.min(1, last.d + 0.08);
    } else if (grooves.length < 80) {
      grooves.push({ u: u, s: s, d: 0.45 });
    }
    scrape();
    saveSoon();
  }

  function openDialog(opts) {
    dialog = opts;
    cardTitle.textContent = opts.title;
    cardBody.textContent = opts.body;
    cardRow.innerHTML = '';
    opts.buttons.forEach(function (b, i) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = b.label;
      el.addEventListener('click', function () {
        closeDialog();
        b.run();
      });
      cardRow.appendChild(el);
      if (i === 0) dialogReturn = el;
    });
    veil.hidden = false;
    const first = cardRow.querySelector('button');
    if (first) first.focus();
  }
  function closeDialog() {
    dialog = null;
    veil.hidden = true;
    cardRow.innerHTML = '';
  }

  function askNewWick() {
    if (state.anim) return;
    if (!state.work.layers.length) {
      state.work = fresh();
      say('Frischer Docht.');
      saveSoon();
      syncTools();
      return;
    }
    if (state.shelf.length >= geom.maxShelf) {
      openDialog({
        title: 'Neuer Docht',
        body: 'Das Regal ist voll. Kerze verwerfen oder weiterziehen?',
        buttons: [
          { label: 'Verwerfen', run: function () { state.work = fresh(); state.dip = 0; say('Frischer Docht.'); saveSoon(); syncTools(); } },
          { label: 'Zurück', run: function () {} }
        ]
      });
      return;
    }
    openDialog({
      title: 'Neuer Docht',
      body: 'Die Kerze am Haken hat schon Wachs. Abstellen oder verwerfen?',
      buttons: [
        { label: 'Abstellen', run: function () { placeOnShelf(); } },
        { label: 'Verwerfen', run: function () { state.work = fresh(); state.dip = 0; say('Frischer Docht.'); saveSoon(); syncTools(); } },
        { label: 'Zurück', run: function () {} }
      ]
    });
  }

  function askClear() {
    if (!state.shelf.length) {
      say('Das Regal ist schon leer.');
      return;
    }
    openDialog({
      title: 'Regal leeren',
      body: 'Alle Kerzen aus dem Regal nehmen?',
      buttons: [
        { label: 'Leeren', run: function () { state.shelf = []; say('Das Regal ist leer.'); saveSoon(); } },
        { label: 'Zurück', run: function () {} }
      ]
    });
  }

  function localPoint(ev) {
    const r = canvas.getBoundingClientRect();
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }

  function hitShelf(x, y) {
    const s = geom.shelf;
    for (let i = 0; i < state.shelf.length; i++) {
      const sx = shelfX(i);
      if (sx == null) continue;
      const top = s.boardY - s.candleH - 24;
      if (Math.abs(x - sx) < 26 && y >= top && y <= s.boardY + 16) return i;
    }
    return -1;
  }

  function hitWork(x, y) {
    const box = workBox();
    if (y < box.top - 16 || y > box.top + box.len + 10) return false;
    const t = clamp((y - box.top) / box.len, 0, 1);
    const cov = coverage(state.work, t, box.scale);
    const r = (cov ? cov.r : 8) + 16;
    return Math.abs(x - box.cx) <= r;
  }

  function onDown(ev) {
    if (dialog) return;
    if (ev.button != null && ev.button !== 0) return;
    noteGesture();
    const p = localPoint(ev);
    const shelfHit = hitShelf(p.x, p.y);
    if (shelfHit >= 0 && !(state.carveOn && hitWork(p.x, p.y))) {
      toggleShelfFlame(shelfHit);
      return;
    }
    if (!hitWork(p.x, p.y)) return;
    if (state.anim) return;
    canvas.setPointerCapture(ev.pointerId);
    const bottom = geom.restBottom + state.dip * geom.travel;
    ptr = { id: ev.pointerId, x: p.x, y: p.y, lx: p.x, ly: p.y, mode: state.carveOn ? 'carve' : null, grab: bottom - p.y, moved: false };
    if (state.carveOn) addGroove(p.x, p.y);
  }
  function onMove(ev) {
    if (!ptr || ev.pointerId !== ptr.id) return;
    const p = localPoint(ev);
    const dx = p.x - ptr.x;
    const dy = p.y - ptr.y;
    if (!ptr.mode) {
      if (Math.hypot(dx, dy) < 7) return;
      if (state.twistOn && Math.abs(dx) > Math.abs(dy) * 1.15) ptr.mode = 'twist';
      else ptr.mode = 'dip';
    }
    ptr.moved = true;
    if (ptr.mode === 'dip') {
      const bottom = p.y + ptr.grab;
      state.dip = clamp((bottom - geom.restBottom) / geom.travel, 0, 1);
    } else if (ptr.mode === 'twist') {
      state.work.twist = clamp(state.work.twist + (p.x - ptr.lx) / 72, 0, 8);
      state.work.phase += (p.x - ptr.lx) / 36;
    } else if (ptr.mode === 'carve') {
      addGroove(p.x, p.y);
    }
    ptr.lx = p.x;
    ptr.ly = p.y;
  }
  function onUp(ev) {
    if (!ptr || ev.pointerId !== ptr.id) return;
    const mode = ptr.mode;
    const moved = ptr.moved;
    ptr = null;
    if (mode === 'dip') releaseDip();
    else if (!mode && !moved) startButtonDip();
    else if (mode === 'twist') {
      say(state.work.twist > 0.3 ? 'Die Schichten liegen in einer Spirale.' : 'Drehen ist an. Ziehe seitlich für eine Spirale.');
      saveSoon();
    } else if (mode === 'carve') {
      say('Die Rille sitzt. Eine neue Schicht deckt sie wieder zu.');
      saveSoon();
    }
  }

  function update(dt) {
    const target = hexRgb(WAX[state.color].hot);
    const coolTarget = mix(target, hexRgb(WAX[state.color].cool), 0.25);
    state.pot = mix(state.pot, coolTarget, 1 - Math.exp(-dt * 3.5));
    if (state.twistOn) state.work.phase += dt * 0.7;
    state.shelf.forEach(function (c) {
      if (c.twist > 0.2) c.phase += dt * 0.18;
      c.layers.forEach(function (L) { L.cool = Math.min(1, L.cool + dt * 0.35); });
    });
    state.work.layers.forEach(function (L) { L.cool = Math.min(1, L.cool + dt * 0.42); });
    if (state.anim) {
      const a = state.anim;
      a.el += dt;
      const u = clamp(a.el / a.dur, 0, 1);
      const s = u * u * (3 - 2 * u);
      state.dip = a.from + (a.to - a.from) * s;
      if (u >= 1) {
        if (a.kind === 'down') {
          state.anim = { kind: 'soak', from: state.dip, to: state.dip, dur: motion(0.14), el: 0, reach: a.reach };
        } else if (a.kind === 'soak') {
          commitLayer(a.reach);
          state.anim = { kind: 'up', from: state.dip, to: 0, dur: motion(0.52), el: 0, reach: 0, skip: true };
        } else {
          state.anim = null;
          state.dip = 0;
          syncTools();
        }
      }
    }
    for (let i = state.drips.length - 1; i >= 0; i--) {
      const d = state.drips[i];
      d.cool = Math.min(1, d.cool + dt * 0.85);
      if (d.mode === 'slide') {
        d.t += d.speed * dt;
        if (d.t >= d.detach || d.t >= 0.99) {
          d.mode = 'fall';
          d.vx = d.side * (10 + Math.random() * 16);
          d.vy = 30;
          dripNote();
        }
      } else {
        d.vy += 640 * dt;
        d.x += d.vx * dt;
        d.y += d.vy * dt;
        const inPot = d.y > geom.waxY && Math.abs(d.x - geom.cx) < geom.potRx * 0.85;
        if (inPot) {
          state.ripples.push({ x: d.x, age: 0, life: 0.8 });
          state.drips.splice(i, 1);
          continue;
        }
        if (d.y > geom.h + 20) state.drips.splice(i, 1);
      }
    }
    if (state.ripples.length > 8) state.ripples.splice(0, state.ripples.length - 8);
    state.ripples.forEach(function (r) { r.age += dt; });
    for (let i = state.ripples.length - 1; i >= 0; i--) if (state.ripples[i].age > state.ripples[i].life) state.ripples.splice(i, 1);
    if (state.steam.length < 7 && Math.random() < dt * 3) {
      state.steam.push({
        x: geom.cx + (Math.random() - 0.5) * geom.potRx * 0.7,
        y: geom.waxY,
        vx: (Math.random() - 0.5) * 8,
        r: 3 + Math.random() * 4,
        age: 0,
        life: 1.4 + Math.random() * 0.8
      });
    }
    for (let i = state.steam.length - 1; i >= 0; i--) {
      const p = state.steam[i];
      p.age += dt;
      p.y -= (18 + p.r * 2) * dt;
      p.x += p.vx * dt;
      if (p.age > p.life) state.steam.splice(i, 1);
    }
    for (let i = state.smoke.length - 1; i >= 0; i--) {
      const p = state.smoke[i];
      p.age += dt;
      p.y -= 28 * dt;
      if (p.age > p.life) state.smoke.splice(i, 1);
    }
    state.motes.forEach(function (m) {
      m.y -= m.v * dt;
      m.x += Math.sin(state.time + m.y * 0.01) * 6 * dt;
      if (m.y < -4) {
        m.y = geom.h * 0.75;
        m.x = Math.random() * geom.w;
      }
    });
    if (saveAt && performance.now() > saveAt) {
      saveAt = 0;
      save();
    }
  }

  function loop(now) {
    if (!loop.last) loop.last = now;
    const dt = Math.min(0.05, (now - loop.last) / 1000);
    loop.last = now;
    state.time += dt;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  waxButtons.forEach(function (b) {
    b.addEventListener('click', function () {
      noteGesture();
      state.color = b.getAttribute('data-wax');
      syncWax();
      say(WAX[state.color].name + ' im Kessel.');
      saveSoon();
    });
  });
  bDip.addEventListener('click', function () { noteGesture(); startButtonDip(); });
  bTwist.addEventListener('click', function () {
    noteGesture();
    state.twistOn = !state.twistOn;
    if (state.twistOn) state.carveOn = false;
    say(state.twistOn ? 'Drehen ist an. Ziehe seitlich für eine Spirale, oder tauche.' : 'Drehen ist aus.');
    syncTools();
    saveSoon();
  });
  bCarve.addEventListener('click', function () {
    noteGesture();
    state.carveOn = !state.carveOn;
    if (state.carveOn) state.twistOn = false;
    say(state.carveOn ? 'Schnitzen ist an. Ziehe über die Kerze.' : 'Schnitzen ist aus.');
    syncTools();
  });
  bShelf.addEventListener('click', function () { noteGesture(); if (!state.anim && !dialog) placeOnShelf(); });
  bLight.addEventListener('click', function () { noteGesture(); toggleWorkFlame(); });
  bWick.addEventListener('click', function () { noteGesture(); askNewWick(); });
  bClear.addEventListener('click', function () { noteGesture(); askClear(); });
  bTon.addEventListener('click', function () {
    noteGesture();
    soundOn = !soundOn;
    syncTools();
    say(soundOn ? 'Ton ist an.' : 'Ton ist aus.');
    if (soundOn) confirmTone();
    saveSoon();
  });

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);

  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (dialog) {
      if (ev.key === 'Escape') { closeDialog(); ev.preventDefault(); }
      return;
    }
    const k = ev.key.toLowerCase();
    if (k >= '1' && k <= '8') {
      state.color = WAX_KEYS[+k - 1];
      syncWax();
      say(WAX[state.color].name + ' im Kessel.');
      saveSoon();
      ev.preventDefault();
      return;
    }
    if (k === 't') { startButtonDip(); ev.preventDefault(); }
    else if (k === 'd') { bTwist.click(); ev.preventDefault(); }
    else if (k === 'c') { bCarve.click(); ev.preventDefault(); }
    else if (k === 'a') { if (!state.anim) placeOnShelf(); ev.preventDefault(); }
    else if (k === 'l') { toggleWorkFlame(); ev.preventDefault(); }
    else if (k === 'n') { askNewWick(); ev.preventDefault(); }
    else if (k === 'r') { askClear(); ev.preventDefault(); }
    else if (k === 'm') { bTon.click(); ev.preventDefault(); }
    else if (ev.key === 'Escape') { state.carveOn = false; state.twistOn = false; syncTools(); }
  });

  document.addEventListener('pointerdown', function () { noteGesture(); }, true);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  window.addEventListener('pagehide', function () { save(); });
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(document.getElementById('stage'));

  makeGrain();
  load();
  syncWax();
  syncTools();
  layout();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
