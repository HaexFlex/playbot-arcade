<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="description" content="Star Loom: draw constellations in a slowly turning night sky. Each finished figure gets a name and a short legend.">
<title>Star Loom</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070b16' width='32' height='32' rx='7'/%3E%3Cpath fill='%23f4efe2' d='M16 3.5l2.4 7.4H26l-6.1 4.5 2.3 7.3L16 18.4 9.8 22.7 12.1 15.4 6 10.9h7.6z'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #070b16; overflow: hidden; color: #e7eef8;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none;
    overscroll-behavior: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  button { font: inherit; color: #e7eef8; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    border-radius: 10px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #b9d4ff; outline-offset: 2px; }
  #top { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.65); }
  #top b { display: block; font-size: 18px; font-weight: 650; letter-spacing: .01em; }
  #top span { display: block; margin-top: 2px; font-size: 13px; opacity: .8; }
  #hint { position: fixed; left: max(12px, env(safe-area-inset-left)); top: calc(max(10px, env(safe-area-inset-top)) + 48px);
    max-width: min(420px, 78vw); font-size: 13.5px; line-height: 1.35; color: #d5e4f8;
    background: rgba(7,12,24,.55); border-radius: 10px; padding: 6px 10px; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,.5); }
  #hint.soft { opacity: .72; }
  #toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(7,12,24,.88); border: 1px solid rgba(185,212,255,.28); border-radius: 999px;
    padding: 8px 14px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .35s; max-width: 90vw; text-align: center; }
  #toast.show { opacity: 1; }
  #bar { position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 14px; background: rgba(7,12,24,.72);
    border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); max-width: calc(100vw - 16px); box-sizing: border-box; }
  #bar button { font-size: 15px; padding: 8px 12px; min-height: 44px; min-width: 44px; }
  #bar button.on { background: rgba(160,196,255,.22); border-color: rgba(185,212,255,.55); }
  #bar button:disabled { opacity: .38; cursor: default; }
  #card, #book { position: fixed; left: 50%; width: min(460px, calc(100vw - 20px));
    background: rgba(8,14,28,.92); border: 1px solid rgba(185,212,255,.28); border-radius: 16px;
    box-shadow: 0 16px 50px rgba(0,0,0,.45); backdrop-filter: blur(10px); box-sizing: border-box; }
  #card { bottom: calc(max(10px, env(safe-area-inset-bottom)) + 68px); transform: translateX(-50%); padding: 14px 16px 12px; }
  #card[hidden], #book[hidden] { display: none; }
  #card .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
  #card h2 { margin: 4px 0 8px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; }
  #card p { margin: 0; font-size: 15.5px; line-height: 1.45; color: #dce7f6; }
  #card .row, #book .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #card .row button, #book .row button, #bookList button { min-height: 40px; padding: 8px 12px; }
  #book { top: max(12px, env(safe-area-inset-top)); transform: translateX(-50%);
    max-height: min(70vh, 560px); display: flex; flex-direction: column; padding: 12px 12px 10px; }
  #book header { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; }
  #book header b { flex: 1; font-size: 18px; }
  #book header button { width: 40px; height: 40px; border-radius: 10px; }
  #bookList { overflow: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; padding: 0 2px; }
  #bookList button { text-align: left; background: rgba(255,255,255,.04); display: flex; flex-direction: column; gap: 2px; }
  #bookList button b { font-weight: 650; }
  #bookList button small { opacity: .72; font-size: 12.5px; }
  #book .empty { padding: 8px 6px 12px; opacity: .8; font-size: 14px; line-height: 1.4; }
  #book .row { justify-content: space-between; }
  @media (max-width: 720px) {
    #bar button span { display: none; }
    #bar { gap: 4px; }
    #bar button { width: 46px; padding: 8px 0; font-size: 18px; }
    #top b { font-size: 16px; }
  }
  @media (max-height: 520px) {
    #hint { display: none; }
    #card { max-height: 46vh; overflow: auto; }
    #card h2 { font-size: 18px; }
    #card p { font-size: 14px; }
    #book { max-height: 64vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Star Loom. A night sky over a hill and a campfire. Drag from star to star to draw a constellation."></canvas>
<div id="top"><b>Star Loom</b><span id="phase">Waxing crescent</span></div>
<div id="hint" role="status">Drag from star to star. A loop seals the figure — or tap Done.</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="card" hidden role="dialog" aria-labelledby="cardName">
  <div class="kicker" id="cardShape"></div>
  <h2 id="cardName"></h2>
  <p id="cardText" lang="de-CH"></p>
  <div class="row">
    <button type="button" id="cardPlay">Replay</button>
    <button type="button" id="cardDrop">Release</button>
    <button type="button" id="cardX">Close</button>
  </div>
</div>
<div id="book" hidden role="dialog" aria-label="Sky book">
  <header><b>Sky book</b><button type="button" id="bookX" aria-label="Close the sky book">✕</button></header>
  <div id="bookList"></div>
  <div class="row">
    <button type="button" id="bookNew">New sky</button>
  </div>
</div>
<div id="bar" role="toolbar" aria-label="Star Loom tools">
  <button type="button" id="bBook" aria-expanded="false" title="Sky book (B)">📖 <span>Book</span></button>
  <button type="button" id="bDone" disabled title="Seal this figure (Enter)">✨ <span>Done</span></button>
  <button type="button" id="bUndo" disabled title="Undo the last line (Z)">↩ <span>Undo</span></button>
  <button type="button" id="bShare" title="Copy a link to this sky (S)">🔗 <span>Share</span></button>
  <button type="button" id="bSound" aria-pressed="false" aria-label="Sound is off" title="Sound on or off (M)">🔇 <span>Sound</span></button>
</div>
<script>
(function () {
  "use strict";
  const TAU = Math.PI * 2;
  const STAR_N = 96;
  const TURN_SECONDS = 480;
  const KEY = "playbot-star-loom-v1";
  const SHAPE_LABEL = {
    line: "Line", triangle: "Triangle", square: "Square", star: "Star",
    chain: "Long chain", ring: "Ring", hook: "Hook", arc: "Arc",
    cross: "Cross", crown: "Crown", dipper: "Dipper"
  };
  const SHAPE_CODE = {
    line: "ln", triangle: "tr", square: "sq", star: "st", chain: "ch",
    ring: "rg", hook: "hk", arc: "ar", cross: "cr", crown: "cw", dipper: "dp"
  };
  const CODE_SHAPE = Object.fromEntries(Object.entries(SHAPE_CODE).map(([k, v]) => [v, k]));
  const SHAPE_COLOR = {
    line: "#c9dcff", triangle: "#ffe1a8", square: "#c8f0e4", star: "#fff6cf",
    chain: "#d7d4ff", ring: "#ffd0e6", hook: "#ffd8bf", arc: "#cde7ff",
    cross: "#f3d2ff", crown: "#ffe9a6", dipper: "#d4f5c8"
  };
  const PHASES = ["New moon", "Waxing crescent", "First quarter", "Waxing gibbous", "Full moon", "Waning gibbous", "Last quarter", "Waning crescent"];

  // Hand-written German, de-CH spelling (ss, never the eszett). {name} is always a nominative with Der/Die/Das.
  const ADJ = ["silberne","stille","ferne","blasse","klare","tiefe","sanfte","kleine","alte","zarte","einsame","helle","dunkle","langsame","goldene","leise","wilde","treue","milde","warme","kühle","schmale","hohe","nahe","lichte","ruhige","feine","späte","frühe","freie","grosse","fremde"];
  const NOUNS = {
    line: [["m","Weg"],["m","Pfad"],["m","Faden"],["m","Steg"],["f","Nadel"],["f","Spur"],["f","Linie"],["f","Leiter"],["n","Band"],["n","Seil"]],
    triangle: [["n","Dreieck"],["m","Giebel"],["n","Zelt"],["m","Gipfel"],["m","Keil"],["n","Dach"],["n","Segel"],["m","Hut"]],
    square: [["n","Fenster"],["m","Rahmen"],["m","Tisch"],["n","Feld"],["n","Tor"],["m","Kasten"],["n","Tuch"],["m","Hof"]],
    star: [["m","Stern"],["m","Funke"],["m","Kristall"],["f","Blume"],["f","Spitze"],["n","Zeichen"],["m","Dorn"],["f","Flocke"]],
    chain: [["f","Kette"],["f","Reihe"],["f","Treppe"],["f","Brücke"],["f","Folge"],["f","Perlenschnur"],["m","Zug"],["n","Band"]],
    ring: [["m","Ring"],["m","Reif"],["m","Kreis"],["n","Rad"],["m","Kranz"],["n","Nest"],["f","Wiege"],["f","Schale"]],
    hook: [["m","Haken"],["f","Angel"],["f","Sense"],["f","Kralle"],["f","Sichel"],["m","Schnabel"],["m","Schlüssel"],["f","Spange"]],
    arc: [["m","Bogen"],["f","Brücke"],["m","Regenbogen"],["f","Welle"],["f","Braue"],["f","Kuppel"],["f","Bucht"],["m","Schwung"]],
    cross: [["n","Kreuz"],["m","Scheideweg"],["m","Knoten"],["m","Treffpunkt"],["m","Schnitt"],["n","Gatter"],["f","Wegkreuzung"],["n","Mal"]],
    crown: [["f","Krone"],["m","Kamm"],["f","Zinne"],["n","Diadem"],["m","Zackenkranz"],["f","Haube"],["m","Reif"],["n","Krönchen"]],
    dipper: [["f","Kelle"],["f","Schöpfkelle"],["m","Löffel"],["f","Schale"],["m","Wagen"],["m","Topf"],["f","Pfanne"],["f","Giesskanne"]]
  };

  const PLACES = [
    "hoch über dem dunklen Hügel","nahe beim Mond","weit hinter den Tannen","dicht am Rand der Nacht",
    "tief über dem Lagerfeuer","in der stillen Hälfte des Himmels","dort, wo der Wind dünn wird","zwischen den alten Sternen",
    "knapp über der Hügelkante","im breiten Blau der Mitternacht","etwas abseits vom Polarstern","im feinen Dunst über dem Tal"
  ];
  const PEOPLE = [
    "Eine Hirtin","Ein Wanderer","Ein Kind aus dem Tal","Eine Eule","Der Fuchs","Eine Müllerin",
    "Ein Fischer","Die Nachtwächterin","Ein Imker","Eine Bäckerin","Der Leuchtturmwärter","Eine Sängerin"
  ];
  const TIMES = [
    "bevor das Feuer herunterbrennt","wenn der erste Raureif kommt","in Nächten ohne Wind","sobald der Mond schmal wird",
    "wenn jemand zu spät nach Hause geht","nur im tiefen Winter","wenn die Grillen aufgehört haben","kurz vor dem Einschlafen",
    "an Abenden nach einem langen Weg","wenn unten im Tal die Lichter ausgehen"
  ];
  const ENDS = [
    "Seither findet ein verirrter Blick wieder nach Hause.","Das Feuer unten knistert dazu, ganz leise.",
    "Wer den Namen kennt, schläft ruhiger.","Das Bild bleibt, auch wenn der Mond sich wendet.",
    "Man darf die Weise leise nachsummen.","Kein Sturm hat die Figur je verschoben.",
    "Am Morgen ist alles noch da, nur blasser.","Kinder geben dem Bild jedes Jahr einen neuen Spitznamen.",
    "Ein Antippen genügt, und die alte Weise klingt noch einmal.","So steht es im Himmelsbuch, in kleiner Schrift."
  ];
  const TPL = {
    line: [
      ["{name} liegt {place} wie ein gespannter Faden.", "{person} merkt sich, dass es keine Biegung gibt, {time}.", "{end}"],
      ["{name} zieht eine ruhige Gerade durch das Gewimmel.", "{person} vertraut dieser Linie mehr als dem Kompass, {time}."],
      ["{name} verbindet Sterne, die sich sonst nie grüssen würden.", "Dazwischen bleibt absichtlich nichts.", "{end}"]
    ],
    triangle: [
      ["{name} hält drei Sterne in einem festen Bund.", "{person} zählt die Punkte leise, {time}.", "{end}"],
      ["{name} steht {place} wie ein kleines Dach.", "Darunter bleibt der Wind draussen.", "Wer hinaufsieht, geht danach etwas langsamer."],
      ["{name} ist das kleinste Zelt am Himmel.", "Abgebaut wird hier nie.", "{end}"]
    ],
    square: [
      ["{name} hat vier Ecken und einen stillen Innenraum.", "{person} stellt ein Licht ins Fenster, {time}.", "{end}"],
      ["{name} liegt {place} wie ein aufgeschlagenes Buch.", "Die Seiten sind leer, und gerade das gefällt den Eulen."],
      ["{name} rahmt ein Stück besonders dunkle Nacht.", "Manchmal blinzelt darin etwas zurück.", "{end}"]
    ],
    star: [
      ["{name} kreuzt sich selbst und wird dadurch heller.", "{person} wünscht sich jedes Mal dasselbe, {time}.", "{end}"],
      ["{name} hat mehr Spitzen, als ein gewöhnlicher Stern braucht.", "Keine zeigt ins Leere.", "Alle deuten nach Hause."],
      ["{name} entstand aus einem Wunsch, der zu gross für einen einzelnen Stern war.", "Die Reste hat der Himmel säuberlich gefaltet.", "{end}"]
    ],
    chain: [
      ["{name} hängt {place}, Glied um Glied.", "Jedes Glied ist ein Abend, den jemand behalten wollte.", "{end}"],
      ["{name} klimpert leise, wenn der Wind die Richtung wechselt.", "{person} bleibt dann stehen, {time}."],
      ["{name} ist länger als der Weg vom Feuer bis zum ersten Schlaf.", "Auf einmal ansehen lässt sich das Ganze nicht.", "{end}"]
    ],
    ring: [
      ["{name} schliesst sich {place} zu einem ruhigen Kreis.", "In der Mitte schläft ein kleiner Sommer.", "{end}"],
      ["{name} lässt keinen Stern aus der Runde.", "{person} setzt sich in Gedanken dazu, {time}."],
      ["{name} ist rund genug für einen Finger, der keine Ecke treffen will.", "Das beruhigt mehr, als man zugibt.", "{end}"]
    ],
    hook: [
      ["{name} biegt sich {place} wie ein Haken aus Draht.", "Daran hängen Laternen, auch weit weg vom Wasser.", "{end}"],
      ["{name} hält einen hellen Stern fest, damit er nicht weiterrollt.", "{person} kommt selten vorbei, aber regelmässig, {time}."],
      ["{name} zeigt nach unten, Richtung Feuer.", "Wer den Weg verloren hat, folgt der Biegung.", "{end}"]
    ],
    arc: [
      ["{name} spannt sich {place} wie ein Bogen ohne Pfeil.", "Der Pfeil bleibt absichtlich im Köcher.", "{end}"],
      ["{name} ist eine Brücke, die nur das Licht benutzen darf.", "{person} winkt hinüber, {time}."],
      ["{name} hebt sich sanft und senkt sich wieder.", "Mehr Aufregung braucht diese Nacht nicht.", "{end}"]
    ],
    cross: [
      ["{name} ist die Stelle, an der sich zwei Wege kreuzen.", "{person} wählt jedes Mal neu, {time}.", "{end}"],
      ["{name} markiert {place} einen stillen Treffpunkt.", "Wer zu spät kommt, findet trotzdem Anschluss.", "{end}"],
      ["{name} teilt den Himmel in vier ruhige Felder.", "In jedem steht ein anderer Gedanke."]
    ],
    crown: [
      ["{name} sitzt {place} mit ungleichen Zacken.", "Gerade die schiefe Zacke macht das Bild kenntlich.", "{end}"],
      ["{name} krönt einen Fleck Himmel, der sonst leer bliebe.", "{person} grüsst nach oben, {time}."],
      ["{name} wurde am Feuer gebogen, aus dem, was gerade da war.", "Umso besser sitzt das Ganze.", "{end}"]
    ],
    dipper: [
      ["{name} ist eine Schale mit einem langen Stiel.", "Damit schöpft jemand Nacht aus dem Hügel und giesst sie über das Feuer.", "{end}"],
      ["{name} zeigt {place} auf das nächste freundliche Licht.", "{person} trinkt nur mit den Augen, {time}."],
      ["{name} trägt einen Griff, damit die Schale nicht verloren geht.", "Die Schale selbst bleibt immer ein wenig geneigt.", "{end}"]
    ]
  };

  const PENTA = [0, 2, 4, 7, 9];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = () => matchMedia("(pointer: coarse)").matches;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const elPhase = document.getElementById("phase");
  const elHint = document.getElementById("hint");
  const elToast = document.getElementById("toast");
  const elCard = document.getElementById("card");
  const elBook = document.getElementById("book");
  const elBookList = document.getElementById("bookList");
  const elDone = document.getElementById("bDone");
  const elUndo = document.getElementById("bUndo");
  const elSound = document.getElementById("bSound");
  const elBookBtn = document.getElementById("bBook");

  let W = 1, H = 1, dpr = 1;
  let view = { cx: 0, cy: 0, R: 1 };
  const state = { seed: 1, moon: 1, sound: null };
  let stars = [];
  let drawOrder = [];
  let wishes = [];
  let figs = [];
  let loom = null;
  let selected = -1;
  let rot = 0;
  let hold = false;
  let drag = null;
  let shot = null;
  let shotAt = 0;
  let freezeShot = false;
  let quiet = false;
  let lastT = 0;
  let crackAt = 0;
  let bursts = [];
  let sparks = [];
  let newSkyArmed = 0;
  let lastHash = "";
  let toastTimer = 0;
  let melGen = 0;
  let frames = 0;
  const audio = { ctx: null, master: null, bed: null };

  function mulberry32(a) {
    let t = a >>> 0;
    return function () {
      t = (t + 0x6D2B79F5) >>> 0;
      let x = Math.imul(t ^ (t >>> 15), 1 | t);
      x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function starAt(i) { return i >= 1000 ? wishes[i - 1000] : stars[i]; }
  function wishPh(w) {
    const x = Math.abs(Math.sin(w.ang * 12.9898 + w.rad * 78.233)) * 43758.5453;
    return (x - Math.floor(x)) * TAU;
  }

  function makeStars(seed) {
    const rnd = mulberry32(seed >>> 0);
    const list = [];
    list.push({ ang: rnd() * TAU, rad: 0.012, mag: 1, ph: rnd() * TAU, warm: 0.2 });
    for (let i = 1; i < STAR_N; i++) {
      list.push({
        ang: rnd() * TAU,
        rad: 0.07 + rnd() * 1.14,
        mag: 0.16 + Math.pow(rnd(), 1.35) * 0.84,
        ph: rnd() * TAU,
        warm: rnd()
      });
    }
    list.forEach(function (s) {
      const r = 200 + Math.round(s.warm * 55);
      const g = 214 + Math.round(s.warm * 28);
      const b = 255 - Math.round(s.warm * 55);
      s.col = "rgb(" + r + "," + g + "," + b + ")";
    });
    return list;
  }

  function legendRng(seed, salt) {
    let x = (Math.imul((seed >>> 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(salt >>> 0, 0xc2b2ae35)) >>> 0;
    if (x === 0) x = 0x1a2b3c4d;
    return mulberry32(x);
  }
  function legendFor(shape, salt, seed) {
    const rnd = legendRng(seed, salt);
    const nouns = NOUNS[shape] || NOUNS.line;
    const noun = nouns[Math.floor(rnd() * nouns.length)];
    const adj = ADJ[Math.floor(rnd() * ADJ.length)];
    const tpls = TPL[shape] || TPL.line;
    const tpl = tpls[Math.floor(rnd() * tpls.length)];
    const place = PLACES[Math.floor(rnd() * PLACES.length)];
    const person = PEOPLE[Math.floor(rnd() * PEOPLE.length)];
    const time = TIMES[Math.floor(rnd() * TIMES.length)];
    const end = ENDS[Math.floor(rnd() * ENDS.length)];
    const art = noun[0] === "m" ? "Der" : noun[0] === "f" ? "Die" : "Das";
    const name = art + " " + adj + " " + noun[1];
    const legend = tpl.map(function (s) {
      return s.replaceAll("{name}", name).replaceAll("{place}", place).replaceAll("{person}", person).replaceAll("{time}", time).replaceAll("{end}", end);
    }).join(" ").replace(/\u00df/g, "ss");
    return { name: name, legend: legend };
  }

  function adjOf(n, edges) {
    const adj = Array.from({ length: n }, function () { return []; });
    edges.forEach(function (e) {
      if (e[0] === e[1] || e[0] < 0 || e[1] < 0 || e[0] >= n || e[1] >= n) return;
      adj[e[0]].push(e[1]);
      adj[e[1]].push(e[0]);
    });
    return adj;
  }
  function linearity(pts) {
    const n = pts.length;
    if (n < 2) return 1;
    let mx = 0, my = 0;
    pts.forEach(function (p) { mx += p.x; my += p.y; });
    mx /= n; my /= n;
    let xx = 0, xy = 0, yy = 0;
    pts.forEach(function (p) {
      const dx = p.x - mx, dy = p.y - my;
      xx += dx * dx; xy += dx * dy; yy += dy * dy;
    });
    const tr = xx + yy;
    const det = xx * yy - xy * xy;
    const disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
    const l1 = tr / 2 + disc;
    const l2 = tr / 2 - disc;
    if (l1 < 1e-12) return 1;
    return 1 - l2 / l1;
  }
  function segCross(p, q, r, s) {
    const d1x = q.x - p.x, d1y = q.y - p.y;
    const d2x = s.x - r.x, d2y = s.y - r.y;
    const den = d1x * d2y - d1y * d2x;
    if (Math.abs(den) < 1e-12) return false;
    const t = ((r.x - p.x) * d2y - (r.y - p.y) * d2x) / den;
    const u = ((r.x - p.x) * d1y - (r.y - p.y) * d1x) / den;
    const eps = 1e-5;
    return t > eps && t < 1 - eps && u > eps && u < 1 - eps;
  }

      const hover = pickStar(drag.px, drag.py, snapR());
      const to = hover >= 0 && hover !== drag.id ? projectId(hover) : { x: drag.px, y: drag.py };
      ctx.save();
      ctx.setLineDash([4, 7]);
      ctx.strokeStyle = "rgba(232,242,255,0.85)";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      ctx.restore();
      if (hover >= 0 && hover !== drag.id) {
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(to.x, to.y, 8, 0, TAU);
        ctx.stroke();
      }
    }

    for (let i = bursts.length - 1; i >= 0; i--) {
      const b = bursts[i];
      const u = (now - b.t) / 900;
      if (u > 1) { bursts.splice(i, 1); continue; }
      ctx.globalAlpha = 1 - u;
      ctx.fillStyle = "#fff6d2";
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * TAU + u;
        const r = 10 + u * 40;
        ctx.beginPath();
        ctx.arc(b.x + Math.cos(a) * r, b.y + Math.sin(a) * r, 1.7, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    if (state.sound === "on" && now > crackAt) {
      crackle();
      crackAt = now + 1800 + Math.random() * 2600;
    }
  }

  function boot() {
    resize();
    const stored = loadStore();
    const hashed = decodeHash(location.hash.replace(/^#/, ""));
    if (hashed) {
      if (stored && (stored.sound === "on" || stored.sound === "off")) state.sound = stored.sound;
      adopt(hashed);
      lastHash = location.hash.replace(/^#/, "");
    } else if (stored && isFinite(stored.seed)) {
      state.sound = stored.sound || null;
      adopt({
        seed: stored.seed >>> 0,
        moon: ((stored.moon | 0) + 1) % 8,
        wishes: stored.wishes || [],
        figs: stored.figs || [],
        loom: stored.loom || null
      });
      if (location.hash.length > 1) toast("That link did not hold a sky.");
    } else {
      state.seed = (Math.floor(Math.random() * 0x7ffffffe) + 1) >>> 0;
      state.moon = 1;
      stars = makeStars(state.seed);
      drawOrder = stars.map(function (_, i) { return i; }).sort(function (a, b) { return stars[a].mag - stars[b].mag; });
      setRotation();
      syncUI();
    }
    syncSound();
    save();
    shotAt = performance.now() + 7000 + Math.random() * 8000;
    crackAt = performance.now() + 1500;
    requestAnimationFrame(frame);
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", function () { drag = null; });
  window.addEventListener("resize", resize);
  document.addEventListener("visibilitychange", function () {
    applyMute();
    if (document.hidden) save();
  });
  window.addEventListener("pagehide", save);
  window.addEventListener("hashchange", function () {
    const h = location.hash.replace(/^#/, "");
    if (h === lastHash) return;
    const data = decodeHash(h);
    if (!data) {
      if (h) toast("That link did not hold a sky.");
      return;
    }
    lastHash = h;
    adopt(data);
    save();
  });

  document.getElementById("bBook").addEventListener("click", function () {
    canvasGesture();
    if (elBook.hidden) openBook(); else closeBook();
  });
  document.getElementById("bookX").addEventListener("click", closeBook);
  document.getElementById("bookNew").addEventListener("click", confirmNewSky);
  elDone.addEventListener("click", function () { canvasGesture(); finishLoom(); });
  elUndo.addEventListener("click", function () { canvasGesture(); undo(); });
  document.getElementById("bShare").addEventListener("click", function () { canvasGesture(); share(); });
  elSound.addEventListener("click", function () { toggleSound(); });
  document.getElementById("cardX").addEventListener("click", closeCard);
  document.getElementById("cardPlay").addEventListener("click", function () {
    canvasGesture();
    if (selected >= 0) playMelody(figs[selected].edges);
  });
  document.getElementById("cardDrop").addEventListener("click", function () {
    if (selected < 0) return;
    figs.splice(selected, 1);
    closeCard();
    syncUI();
    saveSoon();
  });
  window.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeBook(); closeCard(); return; }
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "m" || e.key === "M") { toggleSound(); return; }
    if (e.key === "Enter") { e.preventDefault(); finishLoom(); return; }
    if (e.key === "z" || e.key === "Z" || e.key === "Backspace") { e.preventDefault(); undo(); return; }
    if (e.key === "b" || e.key === "B") { if (elBook.hidden) openBook(); else closeBook(); return; }
    if ((e.key === "s" || e.key === "S") && !e.metaKey && !e.ctrlKey) { e.preventDefault(); share(); }
  });

  function visibleIds() {
    const ids = [];
    function push(i) {
      const p = projectId(i);
      if (p.x < 36 || p.y < 36 || p.x > W - 36 || p.y > H - 110) return;
      if (p.y > hillY(p.x) - 24) return;
      ids.push(i);
    }
    for (let i = 0; i < stars.length; i++) push(i);
    return ids;
  }
  function screenSep(a, b) {
    const pa = projectId(a), pb = projectId(b);
    return Math.hypot(pa.x - pb.x, pa.y - pb.y);
  }

  window.SL = {
    shapeOf: shapeOf,
    legend: legendFor,
    snapshot: function () {
      return {
        seed: state.seed >>> 0,
        moon: state.moon | 0,
        wishes: wishes.map(function (w) { return { ang: packAng(w.ang), rad: packRad(w.rad), mag: clamp(Math.round(w.mag * 100), 0, 100) }; }),
        figs: figs.map(function (f) { return { edges: f.edges.map(function (e) { return [e[0], e[1]]; }), salt: f.salt >>> 0, shape: f.shape, name: f.name, legend: f.legend }; })
      };
    },
    encode: encodeHash,
    decode: decodeHash,
    applyHash: function (h) {
      const data = decodeHash(h);
      if (!data) return false;
      lastHash = h;
      if (location.hash.replace(/^#/, "") !== h) location.hash = h;
      adopt(data);
      save();
      return true;
    },
    screen: function (i) { return projectId(i); },
    hold: function (v) { hold = !!v; },
    freezeShot: function (v) { freezeShot = !!v; },
    quiet: function (v) { quiet = !!v; if (quiet) shot = null; },
    spawnShot: spawnShot,
    shotPoint: function () {
      const head = shotHead();
      if (!head) return null;
      return { x: head.x, y: head.y, u: head.u };
    },
    setMoon: function (i) { state.moon = ((i % 8) + 8) % 8; syncUI(); saveSoon(); },
    reseed: function (seed) {
      state.seed = seed >>> 0;
      stars = makeStars(state.seed);
      drawOrder = stars.map(function (_, i) { return i; }).sort(function (a, b) { return stars[a].mag - stars[b].mag; });
      wishes = [];
      figs = [];
      loom = null;
      selected = -1;
      closeCard();
      setRotation();
      syncUI();
    },
    pickTriangle: function () {
      const ids = visibleIds();
      let best = null, bestA = 0;
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          if (screenSep(ids[i], ids[j]) < 110) continue;
          for (let k = j + 1; k < ids.length; k++) {
            if (screenSep(ids[i], ids[k]) < 110 || screenSep(ids[j], ids[k]) < 110) continue;
            const a = skyXY(ids[i]), b = skyXY(ids[j]), c = skyXY(ids[k]);
            const area = Math.abs((b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y));
            if (area < 0.05) continue;
            const cy = (projectId(ids[i]).y + projectId(ids[j]).y + projectId(ids[k]).y) / 3;
            const score = area * 4 - cy / H;
            if (score > bestA) { bestA = score; best = [ids[i], ids[j], ids[k]]; }
          }
        }
      }
      return best;
    },
    pickChain: function (n) {
      const ids = visibleIds().slice().sort(function (a, b) { return projectId(a).x - projectId(b).x; });
      for (let s = 0; s < ids.length; s++) {
        const chain = [ids[s]];
        for (let i = s + 1; i < ids.length && chain.length < n; i++) {
          const prev = chain[chain.length - 1];
          if (screenSep(prev, ids[i]) < 70 || screenSep(prev, ids[i]) > 180) continue;
          const py = projectId(prev).y, iy = projectId(ids[i]).y;
          if (chain.length % 2 === 0 && iy > py) continue;
          if (chain.length % 2 === 1 && iy < py) continue;
          chain.push(ids[i]);
        }
        if (chain.length >= n) {
          const pts = chain.slice(0, n).map(skyXY);
          if (linearity(pts) < 0.97) return chain.slice(0, n);
        }
      }
      return null;
    },
    figs: function () { return figs.map(function (f) { return { shape: f.shape, name: f.name, legend: f.legend, edges: f.edges }; }); },
    wishCount: function () { return wishes.length; },
    sound: function () { return state.sound; },
    loom: function () { return loom ? loom.edges.map(function (e) { return [e[0], e[1]]; }) : []; },
    frames: function () { return frames; },
    size: function () { return { w: W, h: H }; },
    moonCenter: moonGeom
  };

  boot();
})();
</script>
</body>
</html>
