<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sand-Alchemie</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Eine Sandkasten-Alchemie. Male mit Sand, Wasser, Feuer und dem, was du entdeckst.">
<meta name="theme-color" content="#2a1a12">
<style>
html,body{margin:0;height:100%;background:#24160f;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#f6efe4;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:#f6efe4;background:rgba(255,244,230,.08);border:1px solid rgba(243,215,161,.28);border-radius:12px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #f3d7a1;outline-offset:2px}
#pill{position:fixed;z-index:4;top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));max-width:min(300px,calc(100vw - 92px));background:rgba(36,22,16,.78);border:1px solid rgba(231,194,122,.38);border-radius:14px;padding:8px 12px 9px;backdrop-filter:blur(8px);pointer-events:none}
#pill strong{display:block;font-family:Georgia,Palatino,"Iowan Old Style",serif;font-size:18px;font-weight:600;letter-spacing:.02em;color:#f3d7a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font-size:13px;opacity:.9;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dock{position:fixed;z-index:4;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(1040px,calc(100vw - 12px));display:flex;flex-direction:column;gap:6px}
#elems,#tools{display:flex;gap:4px;overflow-x:auto;background:rgba(28,18,12,.8);border:1px solid rgba(243,215,161,.2);border-radius:16px;padding:4px;backdrop-filter:blur(8px);scrollbar-width:none}
#elems::-webkit-scrollbar,#tools::-webkit-scrollbar{height:0}
#tools{justify-content:center}
.el,.tool{flex:0 0 auto;min-width:44px;min-height:44px;padding:4px 6px;display:flex;align-items:center;justify-content:center;gap:4px}
.el{flex-direction:column;gap:2px;padding:4px 5px 3px}
.el .sw{width:20px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.45)}
.el .nm,.tool .nm{font-size:11px;line-height:1.1;white-space:nowrap}
button.on{background:rgba(231,194,122,.24);border-color:rgba(243,215,161,.85)}
.el.fresh{box-shadow:0 0 0 1px #f3d7a1}
#hint{position:fixed;z-index:4;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 58px));transform:translateX(-50%);background:rgba(36,22,16,.72);border:1px solid rgba(243,215,161,.2);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.35;max-width:min(460px,92vw);text-align:center;pointer-events:none;transition:opacity .8s}
#hint.gone{opacity:0}
#toast{position:fixed;z-index:6;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 52px));transform:translateX(-50%);background:rgba(42,26,16,.94);border:1px solid rgba(243,215,161,.7);color:#f6efe4;border-radius:14px;padding:10px 16px;font-size:16px;font-family:Georgia,Palatino,serif;letter-spacing:.01em;box-shadow:0 8px 30px rgba(0,0,0,.35);pointer-events:none;max-width:min(420px,92vw);text-align:center}
#toast[hidden]{display:none}
#scrim{position:fixed;inset:0;background:rgba(12,8,6,.5);z-index:6}
#scrim[hidden]{display:none}
#book{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,94vw);max-height:min(78vh,640px);overflow:auto;background:rgba(40,26,18,.97);border:1px solid rgba(243,215,161,.35);border-radius:16px;padding:12px 14px 16px;box-sizing:border-box;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#book[hidden]{display:none}
#book header{display:flex;align-items:center;gap:8px;position:sticky;top:0;background:rgba(40,26,18,.97);padding-bottom:8px}
#book header b{font-family:Georgia,Palatino,serif;font-size:18px;color:#f3d7a1;font-weight:600}
#book header span{opacity:.75;font-size:13px;flex:1}
#book header button{min-width:44px;min-height:44px;border-radius:10px}
.brow{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(255,236,210,.1)}
.brow .sw{width:22px;height:22px;border-radius:6px;flex:none;margin-top:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.brow b{font-size:14px}
.brow p{margin:2px 0 0;font-size:13px;line-height:1.35;opacity:.86}
.brow.unknown{opacity:.55}
.brow.fresh b{color:#f3d7a1}
@media (max-width:720px){
  .tool .nm{display:none}
  .tool{width:48px;padding:8px 0}
  #pill strong{font-size:16px}
}
@media (max-height:460px){
  #dock{flex-direction:row;width:min(1040px,calc(100vw - 8px));align-items:stretch}
  .el .nm{display:none}
  #hint{display:none}
  #pill{padding:4px 8px}
  #status{display:none}
  #toast{top:max(8px,env(safe-area-inset-top))}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Sand-Alchemie. Eine Werkstattplatte. Zieh mit dem Finger, um Elemente zu malen."></canvas>
<div id="pill">
  <strong>Sand-Alchemie</strong>
  <div id="status">Pinsel: Sand · Grösse 1</div>
</div>
<div id="hint">Zieh über die Platte. Feuer frisst Holz, Wasser fliesst, Samen keimt auf nassem Sand.</div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<div id="dock">
  <div id="elems" role="listbox" aria-label="Elemente"></div>
  <div id="tools" role="toolbar" aria-label="Werkzeuge">
    <button id="bSize" class="tool" type="button" aria-label="Pinselgrösse 1"><span class="ic" aria-hidden="true">1</span><span class="nm">Grösse</span></button>
    <button id="bErase" class="tool" type="button" aria-pressed="false" aria-label="Radierer" title="Radierer (E)"><span class="ic" aria-hidden="true">✕</span><span class="nm">Radierer</span></button>
    <button id="bPause" class="tool" type="button" aria-pressed="false" aria-label="Pause" title="Pause (Leertaste)"><span class="ic" aria-hidden="true">❚❚</span><span class="nm">Pause</span></button>
    <button id="bClear" class="tool" type="button" aria-label="Platte leeren" title="Leeren (Rücktaste)"><span class="ic" aria-hidden="true">⌫</span><span class="nm">Leeren</span></button>
    <button id="bSound" class="tool" type="button" aria-pressed="false" aria-label="Ton ist aus. Tippen zum Einschalten" title="Ton (M)"><span class="ic" aria-hidden="true">🔇</span><span class="nm">Ton</span></button>
    <button id="bBook" class="tool" type="button" aria-label="Alchemie-Buch öffnen" title="Buch (B)"><span class="ic" aria-hidden="true">📖</span><span class="nm">Buch</span><span class="nm" id="badge">6/19</span></button>
  </div>
</div>
<div id="scrim" hidden></div>
<div id="book" hidden role="dialog" aria-modal="true" aria-label="Alchemie-Buch">
  <header>
    <b>Alchemie-Buch</b>
    <span id="bookCount">6 von 19</span>
    <button id="bookClose" type="button" aria-label="Buch schliessen">✕</button>
  </header>
  <div id="bookList"></div>
</div>
<script>
'use strict';
(function () {
  const EMPTY = 0, SAND = 1, WATER = 2, STONE = 3, WOOD = 4, FIRE = 5, SEED = 6;
  const SMOKE = 7, ASH = 8, STEAM = 9, PLANT = 10, LAVA = 11, GLASS = 12, ICE = 13;
  const SALT = 14, OIL = 15, METAL = 16, ACID = 17, CLOUD = 18, BOLT = 19;

  const KEY = ['leer','sand','water','stone','wood','fire','seed','smoke','ash','steam','plant','lava','glass','ice','salt','oil','metal','acid','cloud','bolt'];
  const NAME = ['Leer','Sand','Wasser','Stein','Holz','Feuer','Samen','Rauch','Asche','Dampf','Pflanze','Lava','Glas','Eis','Salz','Öl','Metall','Säure','Wolke','Blitz'];
  const HEX = ['#2a211c','#e4c56a','#3a96d2','#8a847c','#8a5630','#ff7a1a','#a8c448','#9a9694','#6a6460','#d5e6ee','#2e8c3e','#ff4a10','#b7e0ea','#d4f2ff','#f4f4f0','#5a4630','#c0c6ce','#b6e040','#e8e4dc','#fff6c2'];
  const PAINTABLE = [SAND, WATER, STONE, WOOD, FIRE, SEED, SMOKE, ASH, STEAM, PLANT, LAVA, GLASS, ICE, SALT, OIL, METAL, ACID, CLOUD];
  const ID_BY_KEY = {};
  for (let i = 0; i < KEY.length; i++) ID_BY_KEY[KEY[i]] = i;

  const HINT = [];
  HINT[SMOKE] = 'Wenn etwas Brennbares Feuer fasst.';
  HINT[ASH] = 'Was nach dem Brand liegen bleibt.';
  HINT[STEAM] = 'Wasser trifft auf Hitze.';
  HINT[PLANT] = 'Ein Samen mag nasse Erde.';
  HINT[LAVA] = 'Stein hält grosse Hitze nicht ewig aus.';
  HINT[GLASS] = 'Sand wird in der Hitze klar.';
  HINT[ICE] = 'Dampf steigt bis unter die kalten Balken.';
  HINT[SALT] = 'Asche und Wasser hinterlassen Kristalle.';
  HINT[OIL] = 'Eine Pflanze unter schwerem Stein.';
  HINT[METAL] = 'Stein, der in Lava liegt.';
  HINT[ACID] = 'Rauch, der ins Wasser sinkt.';
  HINT[CLOUD] = 'Viel Dampf ballt sich oben zusammen.';
  HINT[BOLT] = 'Eine Wolke entlädt sich.';

  const KNOWN = [];
  KNOWN[SAND] = 'Rieselt nach unten und sinkt durch Wasser. In grosser Hitze wird er zu Glas.';
  KNOWN[WATER] = 'Fliesst nach unten, löscht Feuer und wird zu Dampf. Trifft es Lava, gibt es Stein und Dampf.';
  KNOWN[STONE] = 'Liegt still. Grosse Hitze schmilzt ihn zu Lava, ein Bad in Lava zu Metall.';
  KNOWN[WOOD] = 'Brennt, sobald Feuer daran leckt. Zurück bleiben Asche und Rauch.';
  KNOWN[FIRE] = 'Züngelt nach oben und vergeht, ausser es findet Nahrung. Sehr heisses Feuer macht aus Sand Glas.';
  KNOWN[SEED] = 'Fällt wie Sand. Auf nassem Sand oder nasser Asche keimt eine Pflanze.';
  KNOWN[SMOKE] = 'Steigt auf und verweht. Im Wasser wird er zu Säure.';
  KNOWN[ASH] = 'Leicht und grau. Wasser wäscht sie zu Salz, Samen keimen gern darin.';
  KNOWN[STEAM] = 'Steigt auf. Oben an den kalten Balken wird ein Hauch zu Eis und viel Dampf zu einer Wolke.';
  KNOWN[PLANT] = 'Wächst nach oben, solange Wasser in der Nähe ist. Unter einem Stein presst sie Öl. Feuer verbrennt sie.';
  KNOWN[LAVA] = 'Dick und heiss. Macht aus Wasser Dampf und Stein, aus Sand Glas und aus Stein Metall.';
  KNOWN[GLASS] = 'Sand, der in der Hitze klar geworden ist. Liegt still.';
  KNOWN[ICE] = 'Kalt und still. Salz und Feuer schmelzen es zu Wasser. Eis bringt nahes Wasser langsam zum Frieren.';
  KNOWN[SALT] = 'Kristalle aus gewaschener Asche. Salz schmilzt Eis und löst sich in viel Wasser.';
  KNOWN[OIL] = 'Aus gepressten Pflanzen. Schwimmt auf Wasser und brennt zu Asche und Rauch.';
  KNOWN[METAL] = 'Aus Stein in Lava erschmolzen. Säure frisst es langsam.';
  KNOWN[ACID] = 'Aus Rauch und Wasser. Fliesst und löst Metall langsam auf.';
  KNOWN[CLOUD] = 'Geballter Dampf unter der Decke. Zieht weiter und wirft Blitze.';
  KNOWN[BOLT] = 'Ein Stoss aus der Wolke. Entzündet, macht aus Sand Glas und aus Stein Lava.';

  const PAL = [
    [[68,54,46],[58,46,40],[76,62,52],[52,42,36]],
    [[230,204,118],[218,188,102],[206,174,90],[236,214,136]],
    [[62,158,214],[48,142,202],[80,172,222],[42,128,188]],
    [[138,132,124],[110,106,100],[154,148,140],[96,92,86]],
    [[154,98,54],[122,74,40],[170,114,66],[104,60,32]],
    [[255,176,40],[255,96,28],[255,220,120],[255,64,18]],
    [[176,204,78],[146,176,54],[198,220,104],[124,156,44]],
    [[150,146,144],[120,116,118],[170,166,164],[96,94,96]],
    [[110,104,100],[90,86,82],[126,120,116],[74,70,66]],
    [[214,230,236],[190,214,224],[232,242,246],[170,198,210]],
    [[52,150,68],[36,118,52],[78,176,86],[28,96,42]],
    [[255,78,18],[255,150,28],[255,214,70],[210,46,12]],
    [[186,226,234],[156,206,220],[214,240,244],[126,186,202]],
    [[220,244,255],[186,224,248],[244,252,255],[160,208,236]],
    [[246,246,242],[230,230,226],[255,255,252],[214,214,210]],
    [[92,70,48],[64,46,30],[110,84,58],[48,34,22]],
    [[198,204,212],[166,174,184],[224,228,234],[146,154,164]],
    [[186,224,70],[156,204,46],[210,236,100],[126,174,36]],
    [[236,232,226],[220,216,210],[248,246,242],[204,200,194]],
    [[255,252,220],[255,255,255],[255,232,150],[210,225,255]]
  ];

  const INIT_M = new Uint8Array(20);
  const INIT_L = new Uint8Array(20);
  INIT_M[FIRE] = 3; INIT_L[FIRE] = 22;
  INIT_L[SMOKE] = 52;
  INIT_L[STEAM] = 56;
  INIT_M[PLANT] = 1;
  INIT_L[CLOUD] = 200;
  INIT_L[BOLT] = 10;

  const CRACK = 1, SIZZLE = 2, HISS = 4, TINK = 8, ZAP = 16, LAVA_BIT = 32, DRIP = 64, TICK = 128;
  const STORE = 'playbot-sand-alchemy-v1';
  const RAD = [0, 1, 2];
  const RAD_LABEL = [1, 3, 5];

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const off = document.createElement('canvas');
  const octx = off.getContext('2d', { alpha: false });
  const bg = document.createElement('canvas');
  const bctx = bg.getContext('2d', { alpha: false });
  const elemsEl = document.getElementById('elems');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const toastEl = document.getElementById('toast');
  const bookEl = document.getElementById('book');
  const scrimEl = document.getElementById('scrim');
  const bookList = document.getElementById('bookList');
  const bookCount = document.getElementById('bookCount');
  const badgeEl = document.getElementById('badge');
  const bSize = document.getElementById('bSize');
  const bErase = document.getElementById('bErase');
  const bPause = document.getElementById('bPause');
  const bClear = document.getElementById('bClear');
  const bSound = document.getElementById('bSound');
  const bBook = document.getElementById('bBook');

  let grid, meta, life, seen, active, proc;
  let cols = 0, rows = 0, chunkCols = 0, chunkRows = 0;
  let imgData, pix;
  let fieldX = 0, fieldY = 0, cellSize = 4;
  let viewW = 800, viewH = 600, dpr = 1;
  let frame = 0, gen = 1;
  let brush = SAND, erasing = false, sizeIndex = 0;
  let paused = window.__startPaused === true;
  let pausedBeforeBook = false;
  let bookWasOpen = false;
  let suppress = 0;
  let paletteDirty = false;
  let snd = 0;
  let clearArm = 0;
  let hover = null;
  let pointerId = null;
  let lastCell = null;
  let audioOn = false, soundOn = false, actx = null, master = null, noiseBuf = null;
  const NEXT = { drip: 0, crack: 0, sizzle: 0, hiss: 0, tink: 0, zap: 0, lava: 0, tick: 0 };
  const found = new Uint8Array(20);
  const fresh = new Uint8Array(20);
  for (let id = SAND; id <= SEED; id++) found[id] = 1;
  const toastLog = [];
  const toastQ = [];
  let toastTimer = 0;
  const stats = { ash: 0, smoke: 0, steam: 0, stoneFromLava: 0, plant: 0, glass: 0, melt: 0, acidBite: 0, bolts: 0, oil: 0, salt: 0, acid: 0, ice: 0, cloud: 0, lava: 0, metal: 0 };
  const frameSamples = [];
  let simMs = 0, simSteps = 0, acc = 0, lastNow = 0;
  let reduceMotion = false;
  try { reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduceMotion = false; }

  function loadStore() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return;
      const data = JSON.parse(raw);
      const list = data && data.found;
      if (list && list.length) {
        for (let i = 0; i < list.length; i++) {
          const id = ID_BY_KEY[list[i]];
          if (id) found[id] = 1;
        }
      }
      if (data && data.hint) hintEl.classList.add('gone');
    } catch (e) { /* private mode */ }
  }
  function saveStore() {
    try {
      const list = [];
      for (let id = 1; id < 20; id++) if (found[id] && id > SEED) list.push(KEY[id]);
      const hint = hintEl.classList.contains('gone') ? 1 : 0;
      localStorage.setItem(STORE, JSON.stringify({ found: list, hint: hint }));
    } catch (e) { /* ignore */ }
  }
  loadStore();

  function knownCount() {
    let n = 0;
    for (let id = 1; id < 20; id++) if (found[id]) n++;
    return n;
  }
  function discover(id) {
    if (suppress || !id || found[id]) return;
    found[id] = 1;
    fresh[id] = 1;
    paletteDirty = true;
    queueToast('Entdeckt! ' + NAME[id]);
    saveStore();
  }
  function queueToast(text) {
    toastLog.push(text);
    toastQ.push(text);
    pumpToast();
  }
  function pumpToast() {
    if (toastTimer || !toastQ.length) return;
    const text = toastQ.shift();
    toastEl.hidden = false;
    toastEl.textContent = text;
    toastTimer = setTimeout(function () {
      toastTimer = 0;
      if (toastQ.length) pumpToast();
      else toastEl.hidden = true;
    }, 2200);
  }

  function wake(x, y) {
    if (x < 0 || y < 0 || x >= cols || y >= rows) return;
    active[(y >> 4) * chunkCols + (x >> 4)] = 1;
  }
  function wakeNear(x, y) {
    wake(x, y);
    wake(x - 1, y);
    wake(x + 1, y);
    wake(x, y - 1);
    wake(x, y + 1);
  }
  function become(i, id, m, l) {
    const prev = grid[i];
    grid[i] = id;
    meta[i] = m == null ? INIT_M[id] : m;
    life[i] = l == null ? INIT_L[id] : l;
    seen[i] = gen;
    const x = i % cols;
    const y = (i / cols) | 0;
    wakeNear(x, y);
    if (id !== prev && id !== 0) discover(id);
  }
  function moveCell(a, b) {
    grid[b] = grid[a]; meta[b] = meta[a]; life[b] = life[a];
    grid[a] = 0; meta[a] = 0; life[a] = 0;
    seen[a] = gen; seen[b] = gen;
    const ax = a % cols, ay = (a / cols) | 0;
    const bx = b % cols, by = (b / cols) | 0;
    wakeNear(ax, ay);
    wakeNear(bx, by);
  }
  function swapCell(a, b) {
    const g = grid[a], m = meta[a], lv = life[a];
    grid[a] = grid[b]; meta[a] = meta[b]; life[a] = life[b];
    grid[b] = g; meta[b] = m; life[b] = lv;
    seen[a] = gen; seen[b] = gen;
    wakeNear(a % cols, (a / cols) | 0);
    wakeNear(b % cols, (b / cols) | 0);
  }
  function nearId(x, y, id) {
    const i = y * cols + x;
    if (x > 0 && grid[i - 1] === id) return i - 1;
    if (x + 1 < cols && grid[i + 1] === id) return i + 1;
    if (y > 0 && grid[i - cols] === id) return i - cols;
    if (y + 1 < rows && grid[i + cols] === id) return i + cols;
    return -1;
  }
  function nearHotFire(x, y) {
    const i = y * cols + x;
    if (x > 0 && grid[i - 1] === FIRE && meta[i - 1] >= 7) return i - 1;
    if (x + 1 < cols && grid[i + 1] === FIRE && meta[i + 1] >= 7) return i + 1;
    if (y > 0 && grid[i - cols] === FIRE && meta[i - cols] >= 7) return i - cols;
    if (y + 1 < rows && grid[i + cols] === FIRE && meta[i + cols] >= 7) return i + cols;
    return -1;
  }
  function nearFreshWater(x, y) {
    const i = y * cols + x;
    if (x > 0 && grid[i - 1] === WATER && meta[i - 1] === 0) return i - 1;
    if (x + 1 < cols && grid[i + 1] === WATER && meta[i + 1] === 0) return i + 1;
    if (y > 0 && grid[i - cols] === WATER && meta[i - cols] === 0) return i - cols;
    if (y + 1 < rows && grid[i + cols] === WATER && meta[i + cols] === 0) return i + cols;
    return -1;
  }
  function nearSaltWater(x, y) {
    const i = y * cols + x;
    if (x > 0 && grid[i - 1] === WATER && meta[i - 1] > 0) return i - 1;
    if (x + 1 < cols && grid[i + 1] === WATER && meta[i + 1] > 0) return i + 1;
    if (y > 0 && grid[i - cols] === WATER && meta[i - cols] > 0) return i - cols;
    if (y + 1 < rows && grid[i + cols] === WATER && meta[i + cols] > 0) return i + cols;
    return -1;
  }
  function moistAt(x, y) {
    if (nearId(x, y, WATER) >= 0) return true;
    if (y + 1 < rows) {
      const b = grid[(y + 1) * cols + x];
      if ((b === SAND || b === ASH) && nearId(x, y + 1, WATER) >= 0) return true;
    }
    return false;
  }
  function tryFall(i, x, y, heavy) {
    if (y + 1 >= rows) return false;
    const below = i + cols;
    const b = grid[below];
    if (b === 0) { moveCell(i, below); return true; }
    if (heavy && (b === WATER || b === OIL || b === ACID)) { swapCell(i, below); return true; }
    const dir = ((frame + x) & 1) ? 1 : -1;
    for (let k = 0; k < 2; k++) {
      const dx = k === 0 ? dir : -dir;
      const nx = x + dx;
      if (nx < 0 || nx >= cols) continue;
      const ni = below + dx;
      const nb = grid[ni];

  function simStep() {
    frame++;

    active.fill(0);

    snd = 0;
    for (let cy = chunkRows - 1; cy >= 0; cy--) {
      const base = cy * chunkCols;
      for (let cx = 0; cx < chunkCols; cx++) {
        if (!proc[base + cx]) continue;
        const x0 = cx << 4;
        const y0 = cy << 4;

        const y1 = y0 + 16 < rows ? y0 + 16 : rows;

          } else {
            for (let x = x0; x < x1; x++) update(row + x, x, y);
          }
        }
      }
    }

    if (paletteDirty) {
      paletteDirty = false;
      buildPalette();
      buildBook();
      updateBadge();
    }
  }

  function alloc(nc, nr) {
    const oldG = grid, oldM = meta, oldL = life, oc = cols, orows = rows;

    rows = nr;

    meta = new Uint8Array(n);
    life = new Uint8Array(n);
    seen = new Uint8Array(n);

      const rh = orows < nr ? orows : nr;

    off.height = nr;

  function reserves() {

    const short = h < 460;

  function layout(force) {

    canvas.width = Math.max(1, Math.round(viewW * dpr));
    canvas.height = Math.max(1, Math.round(viewH * dpr));

    const availW = viewW - box.side * 2;

    let nc = Math.floor(availW / cell);
    let nr = Math.floor(availH / cell);
    if (nc < 48) nc = 48;
    if (nr < 36) nr = 36;
    if (nc > 220) nc = 220;
    if (nr > 200) nr = 200;
    while (nc * nr > 28000 && (nc > 48 || nr > 36)) {

  function roundRect(c, x, y, w, h, r) {

    c.arcTo(x + w, y + h, x, y + h, r);

    g.addColorStop(0.35, '#2c1b13');

    bctx.fillRect(0, 0, viewW, viewH);
    bctx.fillStyle = '#5a3b28';
    bctx.fillRect(0, 0, viewW, 10);
    bctx.fillStyle = '#3d291c';
    for (let i = 0; i < 6; i++) bctx.fillRect(0, viewH - 28 - i * 14, viewW, 2);

      bctx.fillStyle = '#f3e2b8';
      bctx.beginPath();
      bctx.arc(viewW - 100, 34, 7, 0, 6.3);
      bctx.fill();
      bctx.fillStyle = '#6b442c';

      bctx.fillRect(viewW - 26, 70, 8, viewH - 150);

        bctx.fill();
        bctx.fillStyle = 'rgba(255,255,255,.28)';
        bctx.fillRect(x + 3, y + 6, 3, h * 0.45);
        bctx.fillStyle = '#4a301c';
        bctx.fillRect(x + 4, y - 5, 8, 6);

      bottle(34, 188, 28, '#b6e040');
      bottle(34, 250, 42, '#c45a3a');

    bctx.fillStyle = '#2a241e';

    bctx.fill();
  }

  function candle(x, y, t) {
    ctx.fillStyle = '#6d4a30';
    ctx.fillRect(x - 2, y, 4, 12);
    const wob = reduceMotion ? 0 : Math.sin(t * 0.006 + x) * 1.4;
    ctx.fillStyle = 'rgba(255,140,40,0.33)';
    ctx.beginPath();
    ctx.arc(x, y - 3 + wob, 9, 0, 6.3);
    ctx.fill();
    ctx.fillStyle = '#ffe6b0';
    ctx.beginPath();
    ctx.arc(x, y - 4 + wob, 2.6, 0, 6.3);
    ctx.fill();
  }

  function render(t) {
    const data = pix;
    const W = cols, H = rows;
    const flick = (t / 80) | 0;
    let p = 0;
    for (let y = 0; y < H; y++) {
      const row = y * W;
      const edgeY = y < 2 || y > H - 3;
      for (let x = 0; x < W; x++, p += 4) {
        const id = grid[row + x];
        let v = (x * 13 + y * 17) & 3;
        if (id === FIRE || id === LAVA) v = (v + flick) & 3;
        let pr = PAL[id][v][0], pg = PAL[id][v][1], pb = PAL[id][v][2];
        if ((id === SMOKE || id === STEAM) && life[row + x] < 40) {
          const a = life[row + x] / 40;
          const hr = PAL[0][v][0], hg = PAL[0][v][1], hb = PAL[0][v][2];
          pr = (pr * a + hr * (1 - a)) | 0;
          pg = (pg * a + hg * (1 - a)) | 0;
          pb = (pb * a + hb * (1 - a)) | 0;
        }
        if (id === 0 && (edgeY || x < 2 || x > W - 3)) {
