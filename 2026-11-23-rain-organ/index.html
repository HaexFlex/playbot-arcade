<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Organ</title>
<meta name="description" content="Draw leaves under little clouds; every raindrop that hits one rings a note.">
<style>html,body{margin:0;height:100%;background:#0f1a24;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#dfe9f2;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(15,26,36,.72);backdrop-filter:blur(6px)}
#bar button{font:inherit;font-size:15px;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
#bar button.on{background:rgba(140,200,255,.22);border-color:rgba(160,210,255,.55)}
#bar button:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
#hint{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);font-size:14px;opacity:.85;background:rgba(15,26,36,.6);padding:6px 12px;border-radius:10px;transition:opacity 1s;pointer-events:none;text-align:center;max-width:90vw}
#hint.gone{opacity:0}
@media (max-width:560px){#bar button span{display:none}#bar button{font-size:18px;padding:8px 14px}}
</style></head>
<body>
<canvas id="c" aria-label="Rain Organ: draw leaves under the clouds; raindrops ring them"></canvas>
<div id="bar" role="toolbar" aria-label="Tools">
 <button id="bDraw" class="on" aria-pressed="true" title="Draw leaves (D)">✏️ <span>Draw</span></button>
 <button id="bErase" aria-pressed="false" title="Erase: tap a leaf (E)">🧽 <span>Erase</span></button>
 <button id="bPause" title="Pause the rain (Space)">⏸ <span>Pause</span></button>
 <button id="bClear" title="Clear all leaves">🗑 <span>Clear</span></button>
 <button id="bPiece" title="Play a built-in piece">🎵 <span>Pieces</span></button>
 <button id="bShare" title="Copy a link to your drawing">🔗 <span>Share</span></button>
 <button id="bSound" title="Sound on/off (M)">🔇 <span>Sound</span></button>
</div>
<div id="hint">Drag to draw a leaf under a cloud. Short leaves ring high, long ones low.</div>
<script>// Rain Organ core: pure maths (music mapping, bounce). Works in the browser and in node.
(function (root) {
  const SCALE = [0, 2, 4, 7, 9];          // major pentatonic
  const STEPS = 15;                        // 3 octaves of the scale
  const BASE_MIDI = 48;                    // C3
  const MIN_LEN = 30, MAX_LEN = 600;       // leaf lengths in field units (field is 1000 x 700)
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const t = clamp(Math.log(len / MIN_LEN) / Math.log(MAX_LEN / MIN_LEN), 0, 1);

  }
  function midiForStep(step) { const o = Math.floor(step / 5); return BASE_MIDI + 12 * o + SCALE[step % 5]; }

  const noteName = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
  function leafNote(len) { const s = stepForLength(len), m = midiForStep(s); return { step: s, midi: m, freq: freqForMidi(m), name: noteName(m) }; }

  function closest(px, py, ax, ay, bx, by) {

        const L = { x1: px - ux * len * f, y1: py - uy * len * f, x2: px + ux * len * (1 - f), y2: py + uy * len * (1 - f) };

      others.push([v.x, v.y, L.map((_, i) => all.length + i)]); all.push(...L);

</script>
<script>(() => {
'use strict';

const $ = id => document.getElementById(id);

  clouds: [{ x: 300, y: 70, every: 2, off: 0 }, { x: 680, y: 60, every: 3, off: 1 }],

  { name: 'Waterwheel', voices: [[5, 6, 7, 8, 9, 10], [7, 9, 11, 12]] },
  { name: 'Bells', voices: [[12, 10, 11, 9, 10, 8], [10, 12, 14]] },

const HOME = [[300, 70], [700, 60]];
let pieceIx = -1;
function loadPiece(ix) {

if (fromLink) { save(); history.replaceState(null, '', location.pathname + location.search); }

// ---------- input ----------
let drag = null;
function leafAt(p) { let best = -1, bd = 16 / Math.max(0.6, scale); st.leaves.forEach((L, i) => { const c = RO.closest(p.x, p.y, L.x1, L.y1, L.x2, L.y2); if (c.d < bd) { bd = c.d; best = i; } }); return best; }

cv.addEventListener('pointerdown', e => {

  hint.classList.add('gone');

cv.addEventListener('pointermove', e => {
  if (!drag) return; const p = toField(e.clientX, e.clientY);
  if (drag.kind === 'cloud') { const c = st.clouds[drag.i]; c.x = RO.clamp(p.x + drag.dx, 40, FW - 40); c.y = RO.clamp(p.y + drag.dy, 30, 200); }

});
function endDrag() {
  if (drag && drag.kind === 'leaf') {

      if (len > RO.MAX_LEN) { const k = RO.MAX_LEN / len; x2 = x1 + (x2 - x1) * k; y2 = y1 + (y2 - y1) * k; }

cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

$('bDraw').onclick = () => setMode('draw'); $('bErase').onclick = () => setMode('erase');
$('bPause').onclick = () => setPause(!st.paused);
$('bClear').onclick = () => { if (st.leaves.length && confirm('Clear all leaves?')) { st.leaves = []; st.drops = []; save(); } };
$('bPiece').onclick = () => { const ix = (pieceIx + 1) % PIECES.length; if (loadPiece(ix)) say('🎵 ' + PIECES[ix].name); };
$('bShare').onclick = async () => {
  const url = location.href.split('#')[0] + '#s=' + encode();

let sayT = 0;

addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') setMode('draw'); else if (e.key === 'e' || e.key === 'E') setMode('erase');

// ---------- simulation ----------
