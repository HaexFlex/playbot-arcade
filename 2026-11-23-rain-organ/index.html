<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Organ</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Draw leaves under little clouds; every raindrop that hits one rings a note.">
<style>html,body{margin:0;height:100%;background:#0f1a24;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#dfe9f2;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(15,26,36,.72);backdrop-filter:blur(6px)}
#bar button{font:inherit;font-size:15px;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
#bar button.on{background:rgba(140,200,255,.22);border-color:rgba(160,210,255,.55)}
#bar button:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
#hint{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);font-size:14px;opacity:.85;background:rgba(15,26,36,.6);padding:6px 12px;border-radius:10px;transition:opacity 1s;pointer-events:none;text-align:center;max-width:90vw}
#hint.gone{opacity:0}
@media (max-width:760px){#bar button span{display:none}#bar{gap:4px;max-width:96vw;box-sizing:border-box}#bar button{font-size:18px;padding:8px 0;min-width:0;width:44px}}

#pad{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px);transform:translateX(-50%);width:min(560px,94vw);background:rgba(15,26,36,.9);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;box-sizing:border-box}
#pad[hidden]{display:none}
#pad .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}#pad .ph b{font-size:16px}#pad .ph span{opacity:.75;font-size:13px;flex:1}
#pad button{font:inherit;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;min-height:36px;cursor:pointer}
#padSeq{min-height:28px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;opacity:.9;margin-bottom:6px}
#padSeq i{font-style:normal;padding:3px 7px;border-radius:8px;color:#0f1a24;font-weight:600}
#padKeys{display:flex;gap:4px;align-items:flex-end;height:96px;margin-bottom:8px}
#padKeys button{flex:1;padding:0;min-width:0;border-radius:8px;color:#0f1a24;font-size:12px;font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
#pad .pa{display:flex;gap:6px;justify-content:space-between}#pad .go{background:rgba(140,200,255,.25);border-color:rgba(160,210,255,.6)}
#bSky{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));width:40px;height:40px;padding:0;font-size:18px;line-height:1;color:#dfe9f2;background:rgba(15,26,36,.55);border:1px solid rgba(255,255,255,.18);border-radius:50%;cursor:pointer;backdrop-filter:blur(6px)}
#bTempo{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 48px);right:max(8px,env(safe-area-inset-right));width:40px;height:40px;padding:0;font:600 13px/1 system-ui,sans-serif;color:#dfe9f2;background:rgba(15,26,36,.55);border:1px solid rgba(255,255,255,.18);border-radius:50%;cursor:pointer;backdrop-filter:blur(6px)}
#bTempo:focus-visible,#bSky:focus-visible,#pad button:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
#pad.busy #padKeys,#pad.busy #padUndo,#pad.busy #padSwap{opacity:.45;pointer-events:none}
#pad.busy .go{animation:roBusy 1.2s ease-in-out infinite}
@keyframes roBusy{50%{background:rgba(140,200,255,.45)}}
@media (prefers-reduced-motion:reduce){#pad.busy .go{animation:none}}
#bRec{position:fixed;top:calc(max(8px,env(safe-area-inset-top)) + 96px);right:max(8px,env(safe-area-inset-right));width:40px;height:40px;padding:0;font:600 14px/1 system-ui,sans-serif;color:#ff8a80;background:rgba(15,26,36,.55);border:1px solid rgba(255,255,255,.18);border-radius:50%;cursor:pointer;backdrop-filter:blur(6px)}
#bRec[hidden]{display:none}
#bRec.rec{color:#fff;background:rgba(214,60,60,.8);border-color:rgba(255,160,160,.8);animation:roRec 1.6s ease-in-out infinite}
@keyframes roRec{50%{background:rgba(214,60,60,.5)}}
@media (prefers-reduced-motion:reduce){#bRec.rec{animation:none}}
#bRec:focus-visible,#recBox button:focus-visible,#recBox a:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
#recBox{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px);transform:translateX(-50%);width:min(440px,94vw);background:rgba(15,26,36,.92);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;box-sizing:border-box}
#recBox[hidden]{display:none}
#recBox .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}#recBox .ph b{font-size:16px}#recBox .ph span{opacity:.75;font-size:13px;flex:1}
#recBox audio{width:100%;height:40px;margin-bottom:8px;display:block}
#recBox button,#recBox a{font:inherit;font-size:15px;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;min-height:36px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;box-sizing:border-box}
#recBox button[hidden]{display:none}
#recBox .pa{display:flex;gap:6px;justify-content:space-between}#recBox .go{background:rgba(140,200,255,.25);border-color:rgba(160,210,255,.6)}
</style></head>
<body>
<canvas id="c" aria-label="Rain Organ: draw leaves under the clouds; raindrops ring them"></canvas>
<div id="bar" role="toolbar" aria-label="Tools">
 <button id="bDraw" class="on" aria-pressed="true" title="Draw leaves (D)">✏️ <span>Draw</span></button>
 <button id="bErase" aria-pressed="false" aria-label="Erase: tap or swipe over leaves" title="Erase: tap a leaf (E)">🧽 <span>Erase</span></button>
 <button id="bPause" aria-label="Pause the rain" title="Pause the rain (Space)">⏸ <span>Pause</span></button>
 <button id="bClear" aria-label="Clear all leaves" title="Clear all leaves">🗑 <span>Clear</span></button>
 <button id="bPad" aria-label="Compose a melody for a cloud" title="Compose a melody for a cloud (C)">🎹 <span>Compose</span></button>
 <button id="bPiece" aria-label="Play the next built-in piece" title="Play a built-in piece">🎵 <span>Pieces</span></button>
 <button id="bShare" aria-label="Copy a link to your drawing" title="Copy a link to your drawing">🔗 <span>Share</span></button>
 <button id="bSound" aria-label="Sound is off (tap to turn on)" aria-pressed="false" title="Sound on/off (M)">🔇 <span>Sound</span></button>
</div>
<button id="bTempo" aria-label="Tempo">84</button>
<button id="bSky" aria-label="Sky: auto">🌗</button>
<button id="bRec" aria-label="Record">⏺</button>
<div id="pad" hidden role="dialog" aria-label="Compose a melody">
 <div class="ph"><b>Compose</b> <span id="padCloud"></span><button id="padX" aria-label="Close">✕</button></div>
 <div id="padSeq" aria-live="polite"></div>
 <div id="padKeys"></div>
 <div class="pa"><button id="padUndo">↩ Undo</button><button id="padSwap">☁️ Other cloud</button><button id="padGo" class="go">🌧 Let it rain</button></div>
</div>
<div id="recBox" hidden role="dialog" aria-label="Your recording">
 <div class="ph"><b>🎧 Your rain</b> <span id="recInfo" aria-live="polite"></span><button id="recX" aria-label="Close">✕</button></div>
 <audio id="recAudio" controls preload="metadata"></audio>
 <div class="pa"><button id="recAgain">⏺ Again</button><button id="recShare" hidden>📤 Share</button><a id="recSave" class="go" download>⬇ Save</a></div>
</div>
<div id="hint" role="status" aria-live="polite">Drag to draw a leaf under a cloud. Short leaves ring high, long ones low.</div>
<script>// Rain Organ core: pure maths (music mapping, bounce). Works in the browser and in node.
(function (root) {
  const SCALE = [0, 2, 4, 7, 9];          // major pentatonic
  const STEPS = 15;                        // 3 octaves of the scale
  const BASE_MIDI = 48;                    // C3
  const MIN_LEN = 30, MAX_LEN = 600;       // leaf lengths in field units (field is 1000 x 700)
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  // work clock for composer deadlines: counts physics work (drop steps x leaves checked) instead of wall time,
  // in units of ~1 ms on a desktop (WORK_PER_MS, measured 2026-11-23). So a sliced (async) run, a blocking run,
  // a slow phone and a fast laptop all stop at the same point and build the same leaves.
  const WORK_PER_MS = 50000;
  const clk = { work: 0 };
  const clock = () => clk.work / WORK_PER_MS;
  function stepForLength(len) {
    const t = clamp(Math.log(len / MIN_LEN) / Math.log(MAX_LEN / MIN_LEN), 0, 1);
    return Math.round((1 - t) * (STEPS - 1)); // short = high
  }
  function midiForStep(step) { const o = Math.floor(step / 5); return BASE_MIDI + 12 * o + SCALE[step % 5]; }
  const freqForMidi = m => 440 * Math.pow(2, (m - 69) / 12);
  const noteName = m => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m % 12] + (Math.floor(m / 12) - 1);
  function leafNote(len) { const s = stepForLength(len), m = midiForStep(s); return { step: s, midi: m, freq: freqForMidi(m), name: noteName(m) }; }
  // closest point on segment ab to p; returns {x,y,t,d}
  function closest(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy || 1e-9;
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / L2, 0, 1);
    const x = ax + t * dx, y = ay + t * dy;
    return { x, y, t, d: Math.hypot(px - x, py - y) };
  }
  // bounce a velocity off a surface with normal n (unit, pointing toward the drop)
  function bounce(vx, vy, nx, ny, rest = 0.62, fric = 0.97) {
    const vn = vx * nx + vy * ny;           // negative when moving into the leaf
    if (vn >= 0) return null;
    const tx = vx - vn * nx, ty = vy - vn * ny;
    return { vx: tx * fric - vn * rest * nx, vy: ty * fric - vn * rest * ny, impact: -vn };
  }
  // one physics step for a drop against leaves; returns the index of the leaf it hit (or -1)
  function stepDrop(d, leaves, dt, g = 900, r = 4, skip = -1) {
    d.vy += g * dt; d.x += d.vx * dt; d.y += d.vy * dt;
    for (let i = 0; i < leaves.length; i++) {
      if (i === skip) continue;
      // the same maths as closest(), inlined so the hot loop allocates nothing (the composer runs it millions of times; garbage meant GC pauses)
      const L = leaves[i], sx = L.x2 - L.x1, sy = L.y2 - L.y1, S2 = sx * sx + sy * sy || 1e-9;
      const st = clamp(((d.x - L.x1) * sx + (d.y - L.y1) * sy) / S2, 0, 1), cx = L.x1 + st * sx, cy = L.y1 + st * sy;
      if (Math.hypot(d.x - cx, d.y - cy) > r + 2) continue;
      const c = { x: cx, y: cy };
      let nx = d.x - c.x, ny = d.y - c.y, n = Math.hypot(nx, ny);
      if (n < 1e-6) { nx = -(L.y2 - L.y1); ny = L.x2 - L.x1; n = Math.hypot(nx, ny); if (nx * d.vx + ny * d.vy > 0) { nx = -nx; ny = -ny; } }
      nx /= n; ny /= n;
      const b = bounce(d.vx, d.vy, nx, ny);
      if (!b) continue;
      d.vx = b.vx; d.vy = b.vy; d.x = c.x + nx * (r + 2.1); d.y = c.y + ny * (r + 2.1);
      d.impact = b.impact;
      return i;
    }
    return -1;
  }

  // the leaf length that rings a given scale step (middle of its band)
  function lengthForStep(step) { return MIN_LEN * Math.pow(MAX_LEN / MIN_LEN, 1 - step / (STEPS - 1)); }
  // follow one drop from (x0,y0) through the leaves; returns the leaf indices it rings, in order
  function trace(leaves, x0, y0, maxY = 2000, dt = 1 / 240, keepPath = true) { // keepPath false: hits only, no path array (less garbage)
    const d = { x: x0, y: y0, vx: 0, vy: 40 }, hits = [], path = keepPath ? [] : null;
    for (let t = 0; t < 12 && d.y < maxY && d.x > -50 && d.x < 1050; t += dt) { clk.work += leaves.length + 1; const i = stepDrop(d, leaves, dt); if (path) path.push(d.x, d.y, d.vx, d.vy); if (i >= 0 && d.impact > 60 && !hits.includes(i)) hits.push(i); } // a drop rings each leaf once
    return { hits, path };
  }
  // build a falling melody: leaves placed so one drop from (x0,y0) rings steps[] in order.
  // rnd: a 0..1 random function (seeded in tests). Returns null if no layout fits in maxY.
  // do two leaves cross or nearly touch? (keeps composed pieces tidy: no leaf through another)
  function segDist(a, b, c, d) { // shortest distance between segments ab and cd
    const cr = (p, q, r) => (q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]);
    if (cr(a, b, c) * cr(a, b, d) < 0 && cr(c, d, a) * cr(c, d, b) < 0) return 0;
    const pd = (p, q, r) => { const dx = r[0] - q[0], dy = r[1] - q[1], l = dx * dx + dy * dy, t = l ? Math.max(0, Math.min(1, ((p[0] - q[0]) * dx + (p[1] - q[1]) * dy) / l)) : 0; return Math.hypot(p[0] - q[0] - t * dx, p[1] - q[1] - t * dy); };
    return Math.min(pd(a, c, d), pd(b, c, d), pd(c, a, b), pd(d, a, b));
  }
  function crowds(L, leaves, gap = 12) { return leaves.some(M => segDist([L.x1, L.y1], [L.x2, L.y2], [M.x1, M.y1], [M.x2, M.y2]) < gap); }
  // run a composer generator to the end in one go (the blocking form used by node tests and the app's sync calls)
  function finish(g) { let r = g.next(); while (!r.done) r = g.next(); return r.value; }
  // run it in slices of ~sliceMs with setTimeout yields in between; resolves with the same value as finish()
  function sliced(g, sliceMs = 30, onSlice = null) {
    return new Promise((res, rej) => {
      const step = () => {
        try {
          const t0 = performance.now(); let r;
          // stop early when the next piece of work would likely overrun the slice (one piece = the longest seen so far)
          let t = t0, piece = 0; do { r = g.next(); const now = performance.now(); piece = Math.max(piece, now - t); t = now; } while (!r.done && t - t0 + piece < sliceMs);
          clk.maxSlice = Math.max(clk.maxSlice || 0, performance.now() - t0); // the longest slice (checks read it)
          if (r.done) { res(r.value); return; }
          if (onSlice) onSlice();
          setTimeout(step, 0);
        } catch (e) { rej(e); }
      };
      step();
    });
  }
  function compose(...a) { return finish(composeGen(...a)); }
  function* composeGen(steps, x0, y0, rnd, maxY = 520, tries = 400, why = null, fixed = [], others = [], fallK = 1, xlo = 20, xhi = 980, fillY = 0, until = 0) {
    // until: a RO.clock() deadline (0 = none), so the app never works long on a hard tune
    // fillY (tall fields): spread the falls so the last leaf lands near fillY instead of bunching at the top
    // fixed: leaves already placed by other voices; others: [[x,y,hits]] their drops must keep ringing the same leaves
    const F = fixed.length;
    for (let k = 0; k < tries; k++) {
      if (k) yield; // a pause point between tries (sliced runs give the page a breath here)
      if (until && clock() > until) return null;
      const leaves = fixed.slice(); let ok = true;
      for (let n = 0; n < steps.length && ok; n++) {
        const { path } = trace(leaves, x0, y0, maxY + 40);
        // where the drop is after its last bounce: start looking a little below that
        let lastY = y0; for (let j = 0; j < path.length; j += 4) if (path[j + 3] < 0 && path[j + 1] > lastY) lastY = path[j + 1];
        const r0 = rnd(), base = (45 + r0 * 50) * fallK, fill = fillY > lastY ? (fillY - lastY) / (steps.length - n) * (0.8 + r0 * 0.35) : 0, fall = Math.max(base, fill), want = lastY + fall; let pj = -1;
        for (let j = 0; j < path.length; j += 4) if (path[j + 3] > 0 && path[j + 1] >= want) { pj = j; break; }
        if (pj < 0) { ok = false; if (why) why.nofall = (why.nofall || 0) + 1; break; }
        const px = path[pj], py = path[pj + 1], vx = path[pj + 2];
        const len = lengthForStep(steps[n]), f = 0.25 + rnd() * 0.5;
        // slope: send the drop back toward the middle when it drifts out, otherwise keep its direction
        let dir = Math.abs(vx) < 20 ? (rnd() < 0.5 ? 1 : -1) : Math.sign(vx);
        if (px < xlo + 200) dir = 1; else if (px > xhi - 200) dir = -1;
        const a = (0.18 + rnd() * 0.32) * dir * Math.max(0.55, Math.sqrt(base / fall)), // long falls: flatter leaves, so the faster drop is not flung out of its lane
          ux = Math.cos(a), uy = Math.sin(a); // dir 1 = right end lower
        const L = { x1: px - ux * len * f, y1: py - uy * len * f, x2: px + ux * len * (1 - f), y2: py + uy * len * (1 - f) };
        if (Math.min(L.x1, L.x2) < xlo || Math.max(L.x1, L.x2) > xhi || Math.max(L.y1, L.y2) > maxY) { ok = false; if (why) why[Math.max(L.y1, L.y2) > maxY ? 'deep' : 'side'] = (why[Math.max(L.y1, L.y2) > maxY ? 'deep' : 'side'] || 0) + 1; break; }
        if (crowds(L, leaves)) { ok = false; if (why) why.cross = (why.cross || 0) + 1; break; }
        leaves.push(L);
        yield; // a trace down a tall field is the costliest piece: one per pause
        const tr = trace(leaves, x0, y0, maxY + 40, 1 / 240, false).hits;
        let bad = tr.length !== leaves.length - F || tr.some((h, i) => h !== F + i);
        for (let o = 0; o < others.length && !bad; o++) { yield; const [ox, oy, oh] = others[o], t = trace(leaves, ox, oy, maxY + 40, 1 / 240, false).hits; bad = t.length !== oh.length || t.some((h, i) => h !== oh[i]); }
        if (bad) { ok = false; if (why) why['order' + n] = (why['order' + n] || 0) + 1; }
        if (n + 1 < steps.length) yield; // and between leaves: one try on a long tune can take a while
      }
      if (ok) return leaves.slice(F);
    }
    return null;
  }
  // each cloud keeps to its own lane, so there is always room to recompose one voice later
  function laneOf(x, n) { if (n < 2) return [20, 980]; const w = 960 / n, i = Math.max(0, Math.min(n - 1, Math.floor((x - 20) / w))); return [Math.max(20, 20 + i * w - 70), Math.min(980, 20 + (i + 1) * w + 70)]; }
  function composePiece(...a) { return finish(composePieceGen(...a)); }
  function* composePieceGen(voices, seed = 1, maxY = 520, fallK = 1, fill = 0, until = 0) {
    // fill 0..1: each voice spreads its leaves down to fill*maxY (0 = the old short falls)
    let sd = seed >>> 0 || 1; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const all = [], others = [];
    for (const v of voices) {
      const [lo, hi] = laneOf(v.x, voices.length);
      let L = null; // tall field: try the full spread first, then gentler ones (very long falls can fling a drop out of its lane)
      for (const f of fill ? [1, 0.9, 0.8, 0.7, 0.6, 0.5, 0] : [0]) if (!L) L = yield* composeGen(v.steps, v.x, v.y, rnd, maxY, f ? 250 : 600, null, all, others, fallK, lo, hi, f * fill * maxY, until);
      if (!L && until && clock() > until) return null;
      if (!L) return null;
      others.push([v.x, v.y, L.map((_, i) => all.length + i)]); all.push(...L);
    }
    return all;
  }

  // ---------- sky palette by local time of day (0..24 h): night, dawn, day, dusk with soft blends ----------
  // each key: [hour, skyTop, skyBottom, cloud, drop, ink, puddle, stars 0..1, night 0..1 (leaf glow), leafL (leaf lightness shift)]
  const SKY_KEYS = [
    [0, '#0a1120', '#060a12', '#7b879c', '#a8cdf5', '#dfe9f2', '#5a7fa8', 1, 1, 4],
    [5, '#0e1526', '#0a0f1a', '#7b879c', '#a8cdf5', '#dfe9f2', '#5a7fa8', 0.9, 1, 4],
    [6.5, '#3b3f6b', '#93666a', '#e6c6c8', '#f0f4ff', '#fff4ec', '#9a8fb5', 0.15, 0.4, 0],
    [8.5, '#7299b8', '#b9ccd8', '#f1f5f8', '#24507e', '#10202e', '#5c86a8', 0, 0, -12],
    [17, '#7299b8', '#b9ccd8', '#f1f5f8', '#24507e', '#10202e', '#5c86a8', 0, 0, -12],
    [18.7, '#2f2c58', '#8c5a5a', '#e8b9ad', '#f2f0ff', '#fff2ea', '#a1819f', 0.2, 0.4, 0],
    [20.5, '#101a2e', '#0b111c', '#8590a6', '#a8cdf5', '#dfe9f2', '#5a7fa8', 0.85, 0.9, 3],
    [24, '#0a1120', '#060a12', '#7b879c', '#a8cdf5', '#dfe9f2', '#5a7fa8', 1, 1, 4],
  ];
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixRGB = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const skyLum = c => { const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }; return 0.2126 * f(c[0]) + 0.7152 * f(c[1]) + 0.0722 * f(c[2]); };
