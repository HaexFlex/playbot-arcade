<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rain Organ</title>
<meta name="description" content="Draw leaves under little clouds; every raindrop that hits one rings a note.">
<style>html,body{margin:0;height:100%;background:#0f1a24;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#dfe9f2;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:14px;background:rgba(15,26,36,.72);backdrop-filter:blur(6px)}
#bar button{font:inherit;font-size:15px;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
#bar button.on{background:rgba(140,200,255,.22);border-color:rgba(160,210,255,.55)}
#bar button:focus-visible{outline:2px solid #9fd0ff;outline-offset:2px}
#hint{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 66px);transform:translateX(-50%);font-size:14px;opacity:.85;background:rgba(15,26,36,.6);padding:6px 12px;border-radius:10px;transition:opacity 1s;pointer-events:none;text-align:center;max-width:90vw}
#hint.gone{opacity:0}
@media (max-width:760px){#bar button span{display:none}#bar{gap:4px;max-width:96vw;box-sizing:border-box}#bar button{font-size:18px;padding:8px 0;min-width:0;width:44px}}

#pad{position:fixed;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px);transform:translateX(-50%);width:min(560px,94vw);background:rgba(15,26,36,.9);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px;box-sizing:border-box}
#pad[hidden]{display:none}
#pad .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}#pad .ph b{font-size:16px}#pad .ph span{opacity:.75;font-size:13px;flex:1}
#pad button{font:inherit;color:#dfe9f2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;min-height:36px;cursor:pointer}
#padSeq{min-height:28px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:13px;opacity:.9;margin-bottom:6px}
#padSeq i{font-style:normal;padding:3px 7px;border-radius:8px;color:#0f1a24;font-weight:600}
#padKeys{display:flex;gap:4px;align-items:flex-end;height:96px;margin-bottom:8px}
#padKeys button{flex:1;padding:0;min-width:0;border-radius:8px;color:#0f1a24;font-size:12px;font-weight:600;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
#pad .pa{display:flex;gap:6px;justify-content:space-between}#pad .go{background:rgba(140,200,255,.25);border-color:rgba(160,210,255,.6)}
</style></head>
<body>
<canvas id="c" aria-label="Rain Organ: draw leaves under the clouds; raindrops ring them"></canvas>
<div id="bar" role="toolbar" aria-label="Tools">
 <button id="bDraw" class="on" aria-pressed="true" title="Draw leaves (D)">✏️ <span>Draw</span></button>
 <button id="bErase" aria-pressed="false" title="Erase: tap a leaf (E)">🧽 <span>Erase</span></button>
 <button id="bPause" title="Pause the rain (Space)">⏸ <span>Pause</span></button>
 <button id="bClear" title="Clear all leaves">🗑 <span>Clear</span></button>
 <button id="bPad" title="Compose a melody for a cloud (C)">🎹 <span>Compose</span></button>
 <button id="bPiece" title="Play a built-in piece">🎵 <span>Pieces</span></button>
 <button id="bShare" title="Copy a link to your drawing">🔗 <span>Share</span></button>
 <button id="bSound" title="Sound on/off (M)">🔇 <span>Sound</span></button>
</div>
<div id="pad" hidden role="dialog" aria-label="Compose a melody">
 <div class="ph"><b>Compose</b> <span id="padCloud"></span><button id="padX" aria-label="Close">✕</button></div>
 <div id="padSeq" aria-live="polite"></div>
 <div id="padKeys"></div>
 <div class="pa"><button id="padUndo">↩ Undo</button><button id="padSwap">☁️ Other cloud</button><button id="padGo" class="go">🌧 Let it rain</button></div>
</div>
<div id="hint">Drag to draw a leaf under a cloud. Short leaves ring high, long ones low.</div>
<script>// Rain Organ core: pure maths (music mapping, bounce). Works in the browser and in node.

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function midiForStep(step) { const o = Math.floor(step / 5); return BASE_MIDI + 12 * o + SCALE[step % 5]; }

      const L = compose(v.steps, v.x, v.y, rnd, maxY, 600, null, all, others, fallK, lo, hi);

</script>
<script>(() => {
'use strict';

const $ = id => document.getElementById(id);
const st = {
  clouds: [{ x: 300, y: 70, every: 2, off: 0 }, { x: 680, y: 60, every: 3, off: 1 }],
  leaves: [], drops: [], splashes: [], paused: false, mode: 'draw', mat: 0, plips: 0, t: 0, beat: 0, nextBeat: 0, notes: 0,

// ---------- view: fit the 1000x700 field into the window ----------

addEventListener('resize', resize); resize();

  wet = ac.createGain(); wet.gain.value = 0.35; wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);

  const len = ac.sampleRate * 3, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0); let last = 0;
  for (let i = 0; i < len; i++) { last = last * 0.86 + (Math.random() * 2 - 1) * 0.14; d[i] = last * 2.2 + (Math.random() * 2 - 1) * 0.05; }

  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + 0.05);
  g.gain.setValueAtTime(0.018, t); g.gain.exponentialRampToValueAtTime(0.0004, t + 0.07); o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.09);

const RHYTHMS = [2, 3, 4, 6]; // cloud rhythms in eighth notes
const MAX_CLOUDS = 3;
function newCloud(x, y, i) { return { x, y, every: [2, 3, 4][i] || 4, off: [0, 1, 2][i] || 0 }; }

// clouds are named by where they sit, left to right
function cloudName(i) { const n = st.clouds.length, r = st.clouds.filter(c => c.x < st.clouds[i].x).length; return n === 3 ? ['left', 'middle', 'right'][r] : ['left', 'right'][Math.min(r, 1)]; }

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ leaves: st.leaves.map(L => [L.x1, L.y1, L.x2, L.y2].map(Math.round).concat([L.voice >= 0 ? L.voice : -1, L.mat | 0])), clouds: st.clouds.map(c => [Math.round(c.x), Math.round(c.y), c.every]) })); } catch (e) {} }
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (!s) return false;
    st.leaves = (s.leaves || []).slice(0, MAX_LEAVES).map(a => { const L = makeLeaf(a[0], a[1], a[2], a[3], (a[5] | 0) % 3); if (a[4] >= 0) L.voice = a[4]; return L; });

}

const PIECES = [
  { name: 'Lullaby', voices: [[9, 8, 7, 5, 7, 8], [8, 7, 5, 4]] },
  { name: 'Waterwheel', voices: [[5, 6, 7, 8, 9, 10], [7, 9, 11, 12]] },
  { name: 'Bells', voices: [[12, 10, 11, 9, 10, 8], [10, 12, 14]] },

let pieceIx = -1;
