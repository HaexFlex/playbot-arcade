<!DOCTYPE html>
<html lang="de-CH">
<head>

<title>Lebkuchenhaus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23c4783a' width='32' height='32' rx='6'/%3E%3Cpath fill='%23fff6e8' d='M6 18 L16 8 L26 18 V26 H6Z'/%3E%3Crect fill='%23e23d3d' x='13' y='20' width='6' height='6'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    position: fixed;
    inset: 0;
    width: 100%;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: #3a2018;
    color: #4a2414;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  h1.sr {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
  }
  #app {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #stage { flex: 1 1 auto; min-height: 120px; position: relative; touch-action: none; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    gap: 6px;
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));

      linear-gradient(180deg, #6b4030 0%, #4a2a1c 40%, #3d2216 100%);
    border-top: 4px solid #f0d2a0;
    max-height: 48vh;
    overflow-x: hidden;
    overflow-y: auto;
    touch-action: pan-y;
  }
  #colors { display: contents; }
  #colors[hidden] { display: none; }
  button {
    appearance: none;
    min-width: 44px;
    min-height: 44px;
    margin: 0;
    padding: 4px 8px 5px;
    border-radius: 14px;
    border: 2px solid #8a4e2c;
    background: linear-gradient(#fffaf3, #f3ddb8);
    box-shadow: 0 2px 0 #6a3218;
    color: #4a2414;
    font: 800 11px/1.1 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    flex: 0 0 auto;
    max-width: 100%;
  }
  button .ico { width: 22px; height: 22px; display: block; }
  button .ico svg { width: 22px; height: 22px; display: block; }
  button .lbl { white-space: nowrap; }
  button[aria-pressed="true"] {
    background: linear-gradient(#ffe58a, #ffc24d);
    border-color: #d23b32;
    box-shadow: inset 0 2px 0 #e09a30;
  }
  button:focus-visible { outline: 3px solid #ffd24a; outline-offset: 2px; }
  button:disabled { opacity: 0.42; cursor: default; }
  button.swatch {
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 50%;
    border-width: 3px;
  }
  button.swatch .dot {
    width: 26px; height: 26px; border-radius: 50%;

  #ask[hidden] { display: none; }

    position: fixed;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;

  #ask .card {
    background: #fff6e8;
    border: 4px solid #8a4e2c;

    max-width: 340px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  #ask p { margin: 0 0 14px; font-size: 18px; font-weight: 800; line-height: 1.35; }
  #ask .row { display: flex; gap: 10px; justify-content: center; }
  #ask button { min-width: 96px; font-size: 16px; padding: 8px 16px; flex-direction: row; }
  #toast {
    position: fixed;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    background: #fff6e8;
    color: #4a2414;
    border: 2px solid #e23d3d;
    border-radius: 999px;
    padding: 8px 14px;
    font-weight: 800;
    font-size: 15px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 6;
    max-width: calc(100% - 24px);
    text-align: center;
  }
  #toast.show { opacity: 1; }
  @media (max-height: 520px) {
    #bar { gap: 4px; padding: 4px 4px calc(4px + env(safe-area-inset-bottom)); max-height: 46vh; }
    button { padding: 2px 7px 3px; }
  }
</style>
</head>
<body>
<h1 class="sr">Lebkuchenhaus</h1>
<div id="app">
  <div id="stage"><canvas id="c" aria-label="Lebkuchenhaus in der Küche"></canvas></div>
  <div id="bar" role="toolbar" aria-label="Werkzeug"></div>
</div>
<div id="ask" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="askText">
    <p id="askText">Neues Haus? Der Schmuck geht weg. Mit Zurück holst du ihn wieder.</p>
    <div class="row">
      <button type="button" id="askJa">Ja</button>
      <button type="button" id="askNein">Nein</button>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  "use strict";

  const KEY = "lebkuchenhaus-v1";
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const stage = document.getElementById("stage");
  const bar = document.getElementById("bar");
  const ask = document.getElementById("ask");
  const toastEl = document.getElementById("toast");

  const ICING = {
    weiss: ["#e4d0bc", "#fffaf4", "#ffffff"],
    rosa: ["#d47b98", "#ffb7c8", "#ffe4ec"],
    rot: ["#a61f2a", "#e23d3d", "#ff9a9a"],
    gruen: ["#1c7a44", "#3eae6a", "#c8f5dc"],
    blau: ["#1d6eab", "#4aa3e8", "#d2ecff"],
    gelb: ["#c89212", "#ffd24a", "#fff4c8"]
  };
  const SMARTIE = ["#e23d3d", "#f0a020", "#f2d23a", "#3eae6a", "#4aa3e8", "#9b59d0", "#ff8eb8", "#fff4ea"];
  const BEAR = ["#e23b3b", "#f28a1a", "#f0c419", "#e2568a", "#f7f2ea", "#6fbf62"];
  const HINTS = {
    drehen: "Zieh zum Drehen. Tippe ein Fenster für Licht.",
    guss: "Zeichne Zuckerguss auf das Haus.",
    schnee: "Stäube Schnee aus Puderzucker.",
    smarties: "Tupfe Smarties aufs Haus.",
    baer: "Setze Gummibärchen aufs Haus.",
    stange: "Leg eine Zuckerstange dazu.",
    stern: "Klebe einen Stern aufs Haus.",
    mandel: "Setze Mandeln aufs Haus.",
    schoggi: "Setze ein Schoggi-Fenster aufs Haus."
  };
  const CANDY = { smarties: 1, baer: 1, stange: 1, stern: 1, mandel: 1, schoggi: 1 };
  const KIND_RGB = {
    wall: [176, 98, 52],
    roof: [132, 64, 34],
    floor: [118, 62, 34],
    chimney: [108, 56, 42],
    cap: [244, 236, 224],
    balcony: [168, 90, 48],
    steeple: [164, 86, 46]
  };

  const state = {
    shape: "hexen",
    yaw: 0.62,
    pitch: 0.46,
    tool: "drehen",
    icing: "weiss",
    lit: false,
    night: false,
    sound: false
  };
  let targetYaw = state.yaw;
  let targetPitch = state.pitch;
  let velYaw = 0;
  let decals = [];
  let hist = [];
  let model = null;
  let W = 300, H = 300, dpr = 1;
  let bg = document.createElement("canvas");
  let bgCtx = bg.getContext("2d");
  let scene = { win: null, mug: null };
  let flakes = [];
  let discoveredLight = false;
  let audioCtx = null;
  let audioNodes = [];
  let jingleArmed = false;
  let saveTimer = 0;
  let toastTimer = 0;
  let activeId = null;
  let down = null;
  let moved = false;
  let lastP = null;
  let stroke = null;
  let hover = null;
  let dragging = false;
  let shooting = false;
  let lastNow = 0;
  const buttons = {};

  function $(id) { return document.getElementById(id); }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function wrapPi(a) {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  }
  function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
  function cross(a, b) {
    return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
  }
  function normalize(v) {
    const L = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / L, y: v.y / L, z: v.z / L };
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function quad(id, pts, o) {
    o = o || {};
    const verts = pts.map(function (p) { return { x: p[0], y: p[1], z: p[2] }; });
    const normal = normalize(cross(sub(verts[1], verts[0]), sub(verts[2], verts[0])));
    return {
      id: id, verts: verts, normal: normal,
      uvs: [[0, 0], [1, 0], [1, 1], [0, 1]],
      tris: [[0, 1, 2], [0, 2, 3]],
      kind: o.kind || "wall",
      windows: o.windows || [],
      door: o.door || null,
      beads: o.beads || [],
      ornament: o.ornament || null,
      flowers: !!o.flowers,
      shutters: !!o.shutters
    };
  }
  function tri(id, pts, uvs, o) {
    o = o || {};
    const verts = pts.map(function (p) { return { x: p[0], y: p[1], z: p[2] }; });
    const normal = normalize(cross(sub(verts[1], verts[0]), sub(verts[2], verts[0])));
    return {
      id: id, verts: verts, normal: normal,
      uvs: uvs,
      tris: [[0, 1, 2]],
      kind: o.kind || "wall",
      windows: o.windows || [],
      door: null,
      beads: o.beads || [],
      ornament: o.ornament || null,
      flowers: false,
      shutters: false
    };
  }

  function specklesFor(face) {
    let s = hashStr(face.id + state.shape) || 1;
    const dots = [];
    for (let i = 0; i < 16; i++) {
      s = (Math.imul(s, 16807) + 11) >>> 0;
      const u = (s % 1000) / 1000;
      s = (Math.imul(s, 16807) + 11) >>> 0;
      const v = (s % 1000) / 1000;
      if (face.verts.length === 3) {
        const b = baryUV(u, v, face.uvs[0], face.uvs[1], face.uvs[2]);
        if (b.a < 0.04 || b.b < 0.04 || b.c < 0.04) continue;
      } else if (u < 0.06 || u > 0.94 || v < 0.06 || v > 0.94) continue;
      dots.push([u, v, 0.012 + (s % 7) / 400]);
    }
    face.speckles = dots;
  }

  function buildModel(shape) {
    const faces = [];
    let crown = null;
    let rails = [];
    let fit = 1;
    if (shape === "chalet") {
      fit = 0.94;
      const Wd = 1.28, D = 0.7, Hh = 0.9, RH = 0.46;
      faces.push(quad("floor", [[-Wd, 0, D], [Wd, 0, D], [Wd, 0, -D], [-Wd, 0, -D]], { kind: "floor" }));
      faces.push(quad("front", [[-Wd, 0, D], [Wd, 0, D], [Wd, Hh, D], [-Wd, Hh, D]], {
        door: { u: 0.4, v: 0.02, w: 0.2, h: 0.46, arch: true },
        windows: [
          { u: 0.08, v: 0.52, w: 0.16, h: 0.26, shutters: true },
          { u: 0.76, v: 0.52, w: 0.16, h: 0.26, shutters: true }
        ]
      }));
      faces.push(quad("back", [[Wd, 0, -D], [-Wd, 0, -D], [-Wd, Hh, -D], [Wd, Hh, -D]], {
        windows: [{ u: 0.36, v: 0.4, w: 0.28, h: 0.26 }]
      }));
      faces.push(quad("left", [[-Wd, 0, -D], [-Wd, 0, D], [-Wd, Hh, D], [-Wd, Hh, -D]], {
        windows: [{ u: 0.38, v: 0.48, w: 0.24, h: 0.26 }]
      }));
      faces.push(quad("right", [[Wd, 0, D], [Wd, 0, -D], [Wd, Hh, -D], [Wd, Hh, D]], {
        windows: [{ u: 0.38, v: 0.48, w: 0.24, h: 0.26 }]
      }));
      faces.push(tri("gableF", [[-Wd, Hh, D], [Wd, Hh, D], [0, Hh + RH, D]], [[0, 0], [1, 0], [0.5, 1]], {
        beads: [[0, 2], [1, 2]],
        ornament: { kind: "bell", u: 0.5, v: 0.34, size: 0.16 }
      }));
      faces.push(tri("gableB", [[Wd, Hh, -D], [-Wd, Hh, -D], [0, Hh + RH, -D]], [[0, 0], [1, 0], [0.5, 1]], {
        kind: "wall", beads: [[0, 2], [1, 2]]
      }));
      faces.push(quad("roofL", [[-Wd, Hh, D], [0, Hh + RH, D], [0, Hh + RH, -D], [-Wd, Hh, -D]], {
        kind: "roof", beads: [[0, 3]]
      }));
      faces.push(quad("roofR", [[Wd, Hh, D], [Wd, Hh, -D], [0, Hh + RH, -D], [0, Hh + RH, D]], {
        kind: "roof", beads: [[0, 1]]
      }));
      const bz0 = D, bz1 = D + 0.36, by0 = 0.46, by1 = 0.58, bx = 0.92;
      faces.push(quad("balT", [[-bx, by1, bz1], [bx, by1, bz1], [bx, by1, bz0], [-bx, by1, bz0]], { kind: "balcony" }));
      faces.push(quad("balF", [[-bx, by0, bz1], [bx, by0, bz1], [bx, by1, bz1], [-bx, by1, bz1]], { kind: "wood", flowers: true }));
      faces.push(quad("balL", [[-bx, by0, bz0], [-bx, by0, bz1], [-bx, by1, bz1], [-bx, by1, bz0]], { kind: "wood" }));
      faces.push(quad("balR", [[bx, by0, bz1], [bx, by0, bz0], [bx, by1, bz0], [bx, by1, bz1]], { kind: "wood" }));
      const posts = 6;
      for (let i = 0; i < posts; i++) {
        const x = -bx + (2 * bx) * (i / (posts - 1));
        rails.push({ a: { x: x, y: by1, z: bz1 }, b: { x: x, y: by1 + 0.28, z: bz1 } });
      }
      rails.push({ a: { x: -bx, y: by1 + 0.28, z: bz1 }, b: { x: bx, y: by1 + 0.28, z: bz1 }, rail: true });
    } else if (shape === "kirch") {
      fit = 0.84;
      const Wd = 0.78, D = 0.98, Hh = 1.12, RH = 0.72;
      faces.push(quad("floor", [[-Wd, 0, D], [Wd, 0, D], [Wd, 0, -D], [-Wd, 0, -D]], { kind: "floor" }));
      faces.push(quad("front", [[-Wd, 0, D], [Wd, 0, D], [Wd, Hh, D], [-Wd, Hh, D]], {
        door: { u: 0.36, v: 0.02, w: 0.28, h: 0.5, arch: true },
        windows: [{ u: 0.38, v: 0.58, w: 0.24, h: 0.24, round: true }]
      }));
      faces.push(quad("back", [[Wd, 0, -D], [-Wd, 0, -D], [-Wd, Hh, -D], [Wd, Hh, -D]], {
        windows: [{ u: 0.36, v: 0.42, w: 0.28, h: 0.32, arch: true }]
      }));
      faces.push(quad("left", [[-Wd, 0, -D], [-Wd, 0, D], [-Wd, Hh, D], [-Wd, Hh, -D]], {
        windows: [
          { u: 0.18, v: 0.38, w: 0.2, h: 0.3, arch: true },
          { u: 0.62, v: 0.38, w: 0.2, h: 0.3, arch: true }
        ]
      }));
      faces.push(quad("right", [[Wd, 0, D], [Wd, 0, -D], [Wd, Hh, -D], [Wd, Hh, D]], {
        windows: [
          { u: 0.18, v: 0.38, w: 0.2, h: 0.3, arch: true },
          { u: 0.62, v: 0.38, w: 0.2, h: 0.3, arch: true }
        ]
      }));
      faces.push(tri("gableF", [[-Wd, Hh, D], [Wd, Hh, D], [0, Hh + RH, D]], [[0, 0], [1, 0], [0.5, 1]], {
        beads: [[0, 2], [1, 2]]
      }));
      faces.push(tri("gableB", [[Wd, Hh, -D], [-Wd, Hh, -D], [0, Hh + RH, -D]], [[0, 0], [1, 0], [0.5, 1]], {
        beads: [[0, 2], [1, 2]]
      }));
      faces.push(quad("roofL", [[-Wd, Hh, D], [0, Hh + RH, D], [0, Hh + RH, -D], [-Wd, Hh, -D]], {
        kind: "roof", beads: [[0, 3]]
      }));
      faces.push(quad("roofR", [[Wd, Hh, D], [Wd, Hh, -D], [0, Hh + RH, -D], [0, Hh + RH, D]], {
        kind: "roof", beads: [[0, 1]]
      }));
      const sw = 0.18, z0 = -0.06, z1 = 0.26;
      const yb = Hh + RH * 0.78, yt = Hh + RH + 0.34;
      faces.push(quad("stF", [[-sw, yb, z1], [sw, yb, z1], [sw, yt, z1], [-sw, yt, z1]], {
        kind: "steeple",
        windows: [{ u: 0.28, v: 0.38, w: 0.44, h: 0.4, arch: true }]
      }));
      faces.push(quad("stB", [[sw, yb, z0], [-sw, yb, z0], [-sw, yt, z0], [sw, yt, z0]], { kind: "steeple" }));
      faces.push(quad("stL", [[-sw, yb, z0], [-sw, yb, z1], [-sw, yt, z1], [-sw, yt, z0]], { kind: "steeple" }));
      faces.push(quad("stR", [[sw, yb, z1], [sw, yb, z0], [sw, yt, z0], [sw, yt, z1]], { kind: "steeple" }));
      const apex = [0, yt + 0.46, (z0 + z1) / 2];
      const bFL = [-sw, yt, z1], bFR = [sw, yt, z1], bBR = [sw, yt, z0], bBL = [-sw, yt, z0];
      const uvT = [[0, 0], [1, 0], [0.5, 1]];
      faces.push(tri("spF", [bFL, bFR, apex], uvT, { kind: "roof", beads: [[0, 2], [1, 2]] }));
      faces.push(tri("spR", [bFR, bBR, apex], uvT, { kind: "roof", beads: [[0, 2], [1, 2]] }));
      faces.push(tri("spB", [bBR, bBL, apex], uvT, { kind: "roof", beads: [[0, 2], [1, 2]] }));
      faces.push(tri("spL", [bBL, bFL, apex], uvT, { kind: "roof", beads: [[0, 2], [1, 2]] }));
      crown = { x: apex[0], y: apex[1] + 0.02, z: apex[2] };
    } else {
      fit = 1;
      const Wd = 1.05, D = 0.78, Hh = 1.16, RH = 0.74;
      faces.push(quad("floor", [[-Wd, 0, D], [Wd, 0, D], [Wd, 0, -D], [-Wd, 0, -D]], { kind: "floor" }));
      faces.push(quad("front", [[-Wd, 0, D], [Wd, 0, D], [Wd, Hh, D], [-Wd, Hh, D]], {
        door: { u: 0.39, v: 0.02, w: 0.22, h: 0.5, arch: true },
        windows: [
          { u: 0.1, v: 0.46, w: 0.2, h: 0.28 },
          { u: 0.7, v: 0.46, w: 0.2, h: 0.28 }
        ]
      }));
      faces.push(quad("back", [[Wd, 0, -D], [-Wd, 0, -D], [-Wd, Hh, -D], [Wd, Hh, -D]], {
        windows: [{ u: 0.34, v: 0.42, w: 0.32, h: 0.3 }]
      }));
      faces.push(quad("left", [[-Wd, 0, -D], [-Wd, 0, D], [-Wd, Hh, D], [-Wd, Hh, -D]], {
        windows: [{ u: 0.36, v: 0.42, w: 0.28, h: 0.28 }]
      }));
      faces.push(quad("right", [[Wd, 0, D], [Wd, 0, -D], [Wd, Hh, -D], [Wd, Hh, D]], {
        windows: [{ u: 0.36, v: 0.42, w: 0.28, h: 0.28 }]
      }));
      faces.push(tri("gableF", [[-Wd, Hh, D], [Wd, Hh, D], [0, Hh + RH, D]], [[0, 0], [1, 0], [0.5, 1]], {
        beads: [[0, 2], [1, 2]],
        ornament: { kind: "star", u: 0.5, v: 0.38, size: 0.2 }
      }));
      faces.push(tri("gableB", [[Wd, Hh, -D], [-Wd, Hh, -D], [0, Hh + RH, -D]], [[0, 0], [1, 0], [0.5, 1]], {
        beads: [[0, 2], [1, 2]]
      }));
      faces.push(quad("roofL", [[-Wd, Hh, D], [0, Hh + RH, D], [0, Hh + RH, -D], [-Wd, Hh, -D]], {
        kind: "roof", beads: [[0, 3]]
      }));
      faces.push(quad("roofR", [[Wd, Hh, D], [Wd, Hh, -D], [0, Hh + RH, -D], [0, Hh + RH, D]], {
        kind: "roof", beads: [[0, 1]]
      }));
      const cx0 = 0.34, cx1 = 0.62, cz0 = -0.15, cz1 = 0.15, cy0 = 1.34, cy1 = 1.98;
      faces.push(quad("chimF", [[cx0, cy0, cz1], [cx1, cy0, cz1], [cx1, cy1, cz1], [cx0, cy1, cz1]], { kind: "chimney" }));
      faces.push(quad("chimB", [[cx1, cy0, cz0], [cx0, cy0, cz0], [cx0, cy1, cz0], [cx1, cy1, cz0]], { kind: "chimney" }));
      faces.push(quad("chimL", [[cx0, cy0, cz0], [cx0, cy0, cz1], [cx0, cy1, cz1], [cx0, cy1, cz0]], { kind: "chimney" }));
      faces.push(quad("chimR", [[cx1, cy0, cz1], [cx1, cy0, cz0], [cx1, cy1, cz0], [cx1, cy1, cz1]], { kind: "chimney" }));
      faces.push(quad("chimT", [[cx0, cy1, cz1], [cx1, cy1, cz1], [cx1, cy1, cz0], [cx0, cy1, cz0]], { kind: "cap" }));
    }
    let maxX = 0.2, maxY = 0.2;
    faces.forEach(function (f) {
      specklesFor(f);
      f.verts.forEach(function (v) {
        maxX = Math.max(maxX, Math.abs(v.x), Math.abs(v.z));
        maxY = Math.max(maxY, v.y);
      });
    });
    return { faces: faces, fit: fit, crown: crown, rails: rails, pad: maxX + 0.42, peak: maxY };
  }

  function baryUV(u, v, A, B, C) {
    const v0x = B[0] - A[0], v0y = B[1] - A[1];
    const v1x = C[0] - A[0], v1y = C[1] - A[1];
    const v2x = u - A[0], v2y = v - A[1];
    const den = v0x * v1y - v1x * v0y;
    if (Math.abs(den) < 1e-8) return { a: 1, b: 0, c: 0 };
    const b = (v2x * v1y - v1x * v2y) / den;
    const c = (v0x * v2y - v2x * v0y) / den;
    return { a: 1 - b - c, b: b, c: c };
  }
  function baryScreen(px, py, A, B, C) {
    const v0x = B.x - A.x, v0y = B.y - A.y;
    const v1x = C.x - A.x, v1y = C.y - A.y;
    const v2x = px - A.x, v2y = py - A.y;
    const den = v0x * v1y - v1x * v0y;
    if (Math.abs(den) < 1e-6) return null;
    const b = (v2x * v1y - v1x * v2y) / den;
    const c = (v0x * v2y - v2x * v0y) / den;
    const a = 1 - b - c;
    if (a < -0.004 || b < -0.004 || c < -0.004) return null;
    return { a: a, b: b, c: c };
  }

  function layoutUnit() {
    const base = Math.min(W, H);
    return Math.min(base * 0.34, H * 0.4, 250);
  }
  function project(p) {
    const yaw = state.yaw, pitch = state.pitch;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    let x = p.x * cy + p.z * sy;
    let z = -p.x * sy + p.z * cy;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const y = p.y * cp - z * sp;
    z = p.y * sp + z * cp;
    const camZ = 9.2;
    const f = 6.5 / (camZ - z);
    const unit = layoutUnit() * (model ? model.fit : 1);
    return {
      x: W * 0.56 + x * f * unit,
      y: H * 0.64 - y * f * unit,
      z: z,
      f: f
    };
  }
  function rotNorm(n) {
    const yaw = state.yaw, pitch = state.pitch;
    const cy = Math.cos(yaw), sy = Math.sin(yaw);
    let x = n.x * cy + n.z * sy;
    let z = -n.x * sy + n.z * cy;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const y = n.y * cp - z * sp;
    z = n.y * sp + z * cp;
    return { x: x, y: y, z: z };
  }
  function surfacePoint(face, u, v) {
    if (face.verts.length === 4) {
      const a = face.verts[0], b = face.verts[1], c = face.verts[2], d = face.verts[3];
      const abx = a.x + (b.x - a.x) * u, aby = a.y + (b.y - a.y) * u, abz = a.z + (b.z - a.z) * u;
      const dcx = d.x + (c.x - d.x) * u, dcy = d.y + (c.y - d.y) * u, dcz = d.z + (c.z - d.z) * u;
      return { x: abx + (dcx - abx) * v, y: aby + (dcy - aby) * v, z: abz + (dcz - abz) * v };
    }
    const B = baryUV(u, v, face.uvs[0], face.uvs[1], face.uvs[2]);
    const w = face.verts;
    return {
      x: B.a * w[0].x + B.b * w[1].x + B.c * w[2].x,
      y: B.a * w[0].y + B.b * w[1].y + B.c * w[2].y,
      z: B.a * w[0].z + B.b * w[1].z + B.c * w[2].z
    };
  }
  function faceById(id) {
    for (let i = 0; i < model.faces.length; i++) if (model.faces[i].id === id) return model.faces[i];
    return null;
  }
  function prepareFace(face) {
    face._sp = face.verts.map(project);
    face._n = rotNorm(face.normal);
    face._vis = face._n.z > 0.04;
    let z = 0;
    for (let i = 0; i < face._sp.length; i++) z += face._sp[i].z;
    face._z = z / face._sp.length;
  }
  function pick(sx, sy) {
    let best = null;
    for (let i = 0; i < model.faces.length; i++) {
      const face = model.faces[i];
      if (face.kind === "floor") continue;
      const n = rotNorm(face.normal);
      if (n.z <= 0.04) continue;
      const sp = face.verts.map(project);
      for (let t = 0; t < face.tris.length; t++) {
        const trix = face.tris[t];
        const A = sp[trix[0]], B = sp[trix[1]], C = sp[trix[2]];
        const b = baryScreen(sx, sy, A, B, C);
        if (!b) continue;
        const ua = face.uvs[trix[0]], ub = face.uvs[trix[1]], uc = face.uvs[trix[2]];
        const u = b.a * ua[0] + b.b * ub[0] + b.c * uc[0];
        const v = b.a * ua[1] + b.b * ub[1] + b.c * uc[1];
        const world = surfacePoint(face, u, v);
        const z = project(world).z;
        if (!best || z > best.z) best = { face: face, u: u, v: v, z: z };
      }
    }
    return best;
  }
  function hitWindow(hit) {
    const wins = hit.face.windows || [];
    for (let i = 0; i < wins.length; i++) {
      const w = wins[i];
      if (hit.u >= w.u - 0.02 && hit.u <= w.u + w.w + 0.02 && hit.v >= w.v - 0.02 && hit.v <= w.v + w.h + 0.03) return true;
    }
    return false;
  }

  function archPoints(u, v, w, h) {
    const r = w * 0.5;
    const cx = u + r;
    const cy = v + h - r;
    const pts = [[u, v], [u + w, v]];
    for (let i = 0; i <= 10; i++) {
      const a = (Math.PI * i) / 10;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return pts;
  }
  function roundPoints(cx, cy, rx, ry) {
    const pts = [];
    for (let i = 0; i < 16; i++) {
      const a = (Math.PI * 2 * i) / 16;
      pts.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]);
    }
    return pts;
  }
  function openingPoints(win) {
    if (win.round) {
      const rx = win.w / 2, ry = win.h / 2;
      return roundPoints(win.u + rx, win.v + ry, rx, ry);
    }
    if (win.arch) return archPoints(win.u, win.v, win.w, win.h);
    return [[win.u, win.v], [win.u + win.w, win.v], [win.u + win.w, win.v + win.h], [win.u, win.v + win.h]];
  }
  function traceUV(face, uvPts) {
    ctx.beginPath();
    for (let i = 0; i < uvPts.length; i++) {
      const s = project(surfacePoint(face, uvPts[i][0], uvPts[i][1]));
      if (i === 0) ctx.moveTo(s.x, s.y);
      else ctx.lineTo(s.x, s.y);
    }
    ctx.closePath();
  }
  function screenOf(face, uvPts) {
    let cx = 0, cy = 0, rad = 0;
    const pts = [];
    for (let i = 0; i < uvPts.length; i++) {
      const s = project(surfacePoint(face, uvPts[i][0], uvPts[i][1]));
      pts.push(s);
      cx += s.x; cy += s.y;
    }
    cx /= pts.length; cy /= pts.length;
    for (let i = 0; i < pts.length; i++) rad = Math.max(rad, Math.hypot(pts[i].x - cx, pts[i].y - cy));
    return { cx: cx, cy: cy, r: rad };
  }

  function shade(rgb, k) {
    return "rgb(" + rgb.map(function (c) { return Math.round(clamp(c * k, 0, 255)); }).join(",") + ")";
  }
  function resetT() { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

  function drawPoly(sp) {
    ctx.beginPath();
    ctx.moveTo(sp[0].x, sp[0].y);
    for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i].x, sp[i].y);
    ctx.closePath();
  }

  function drawBeads(sp, i, j) {
    const a = sp[i], b = sp[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len < 10) return;
    const n = Math.max(2, Math.round(len / 15));
    ctx.fillStyle = "#fff8f1";
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      ctx.beginPath();
      ctx.arc(a.x + dx * t, a.y + dy * t, 5.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const glows = [];

  function drawOpening(face, win, lit) {
    const pts = openingPoints(win);
    traceUV(face, pts);
    ctx.fillStyle = "#f6ecdf";
    ctx.fill();
    ctx.save();
    ctx.clip();
    const box = screenOf(face, pts);
    if (lit) {
      const g = ctx.createRadialGradient(box.cx, box.cy, 2, box.cx, box.cy, Math.max(8, box.r));
      const pulse = 0.82 + 0.18 * Math.sin(lastNow / 280);
      g.addColorStop(0, "rgba(255,236,190," + pulse + ")");
      g.addColorStop(0.55, "rgba(255,168,64,0.95)");
      g.addColorStop(1, "rgba(214,92,28,0.9)");
      ctx.fillStyle = g;
      ctx.fillRect(box.cx - box.r - 4, box.cy - box.r - 4, box.r * 2 + 8, box.r * 2 + 8);
      glows.push(box);
    } else {
      ctx.fillStyle = "#2a140e";
      ctx.fillRect(box.cx - box.r - 4, box.cy - box.r - 4, box.r * 2 + 8, box.r * 2 + 8);
      if (state.tool === "drehen" && !discoveredLight) {
        ctx.fillStyle = "rgba(255,220,140," + (0.35 + 0.35 * Math.sin(lastNow / 220)) + ")";
        ctx.beginPath();
        ctx.arc(box.cx, box.cy, Math.max(3, box.r * 0.18), 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
    if (!win.round) {
      const mux = win.u + win.w / 2, muy = win.v + win.h / 2;
      ctx.strokeStyle = "#f6ecdf";
      ctx.lineWidth = 2;
      ctx.beginPath();
      let a = project(surfacePoint(face, mux, win.v + 0.02));
      let b = project(surfacePoint(face, mux, win.v + win.h - (win.arch ? win.w * 0.45 : 0.02)));
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      a = project(surfacePoint(face, win.u + 0.02, muy));
      b = project(surfacePoint(face, win.u + win.w - 0.02, muy));
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function drawDoor(face, door, lit) {
    const pts = door.arch ? archPoints(door.u, door.v, door.w, door.h) : openingPoints(door);
    traceUV(face, pts);
    ctx.fillStyle = "#6b3418";
    ctx.fill();
    ctx.save();
    ctx.clip();
    const box = screenOf(face, pts);
    const g = ctx.createLinearGradient(box.cx, box.cy - box.r, box.cx, box.cy + box.r);
    g.addColorStop(0, "#8a4624");
    g.addColorStop(1, "#5a2c14");
    ctx.fillStyle = g;
    ctx.fillRect(box.cx - box.r - 2, box.cy - box.r - 2, box.r * 2 + 4, box.r * 2 + 4);
    ctx.restore();
    const knob = project(surfacePoint(face, door.u + door.w * 0.78, door.v + door.h * 0.38));
    ctx.fillStyle = "#f0d78c";
    ctx.beginPath();
    ctx.arc(knob.x, knob.y, 3.2, 0, Math.PI * 2);
    ctx.fill();
    const wreath = { u: door.u + door.w * 0.5, v: door.v + door.h * 0.72 };
    paintOn(face, wreath.u, wreath.v, 0, 0.16, function () {
      ctx.strokeStyle = "#2f8a45";
      ctx.lineWidth = 0.16;
      ctx.beginPath();
      ctx.arc(0, 0, 0.42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = "#e23d3d";
      ctx.beginPath();
      ctx.arc(0, 0.46, 0.12, 0, Math.PI * 2);
      ctx.fill();
    });
    if (lit) {
      const pane = roundPoints(door.u + door.w * 0.5, door.v + door.h * 0.72, door.w * 0.12, door.w * 0.14);
      traceUV(face, pane);
      ctx.fillStyle = "rgba(255,196,110,0.92)";
      ctx.fill();
      const box = screenOf(face, pane);
      glows.push(box);
    }
  }

  function paintOn(face, u, v, rot, size, fn) {
    const p = project(surfacePoint(face, u, v));
    const du = 0.04;
    const pU = project(surfacePoint(face, clamp(u + du, 0, 1), v));
    const pV = project(surfacePoint(face, u, clamp(v + du, 0, 1)));
    const w0 = surfacePoint(face, u, v);
    const wU = surfacePoint(face, clamp(u + du, 0, 1), v);
    const wV = surfacePoint(face, u, clamp(v + du, 0, 1));
    const lenU = Math.hypot(wU.x - w0.x, wU.y - w0.y, wU.z - w0.z) / du;
    const lenV = Math.hypot(wV.x - w0.x, wV.y - w0.y, wV.z - w0.z) / du;
    if (lenU < 0.02 || lenV < 0.02) return;
    let ux = (pU.x - p.x) / du / lenU * size;
    let uy = (pU.y - p.y) / du / lenU * size;
    let vx = (pV.x - p.x) / du / lenV * size;
    let vy = (pV.y - p.y) / du / lenV * size;
    const c = Math.cos(rot), sn = Math.sin(rot);
    const rx = ux * c + vx * sn;
    const ry = uy * c + vy * sn;
    const sx = -ux * sn + vx * c;
    const sy = -uy * sn + vy * c;
    if (!Number.isFinite(rx + ry + sx + sy)) return;
    if (Math.hypot(rx, ry) < 0.4 && Math.hypot(sx, sy) < 0.4) return;
    ctx.setTransform(rx * dpr, ry * dpr, sx * dpr, sy * dpr, p.x * dpr, p.y * dpr);
    fn();
    resetT();
  }

  function drawStarShape(fill, edge) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      const r = i % 2 === 0 ? 0.5 : 0.22;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);

    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 0.06;
    ctx.stroke();
  }
  function drawOrnament(face) {
    const o = face.ornament;

      paintOn(face, o.u, o.v, 0, o.size, function () { drawStarShape("#ffd24a", "#c98416"); });
    } else if (o.kind === "bell") {
      paintOn(face, o.u, o.v, 0, o.size, function () {

        ctx.moveTo(-0.28, 0.2);
        ctx.quadraticCurveTo(-0.42, -0.2, 0, -0.45);
        ctx.quadraticCurveTo(0.42, -0.2, 0.28, 0.2);

        ctx.fill();
        ctx.strokeStyle = "#c98416";
        ctx.lineWidth = 0.06;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0.32, 0.1, 0, Math.PI * 2);
        ctx.fillStyle = "#f0c84a";
        ctx.fill();
      });
    }
  }

  function drawFlowers(face) {
    for (let i = 0; i < 7; i++) {
      const u = 0.08 + i * 0.14;
      paintOn(face, u, 0.72, 0, 0.1, function () {

        ctx.beginPath();
        ctx.ellipse(0, 0.15, 0.22, 0.18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = i % 2 ? "#e23d3d" : "#ff5a7a";
        ctx.beginPath();
        ctx.arc(0, -0.12, 0.28, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffd24a";
        ctx.beginPath();
        ctx.arc(0, -0.12, 0.1, 0, Math.PI * 2);
        ctx.fill();
      });
    }
  }

  function drawFaceSurface(face) {
    const sp = face._sp;
    const light = face._n.z * 0.72 + face._n.y * 0.42 - face._n.x * 0.22;
    let k = 0.38 + Math.max(0, light) * 0.95;
    if (state.night) k = Math.min(1.25, k * 1.08 + 0.06);
    if (hover && hover.face === face && face.kind !== "floor") k = Math.min(1.35, k + 0.08);
    drawPoly(sp);
    const rgb = KIND_RGB[face.kind] || KIND_RGB.wall;
    ctx.fillStyle = shade(rgb, k);
    ctx.fill();

      ctx.save();
      ctx.clip();

        ctx.arc(s.x, s.y, 2.1, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    ctx.strokeStyle = face.kind === "roof" || face.kind === "cap" ? "rgba(255,248,240,0.92)" : "rgba(255,244,230,0.75)";

    ctx.lineJoin = "round";
    if (face.kind !== "floor") ctx.stroke();

    const wins = face.windows || [];
    for (let i = 0; i < wins.length; i++) {

        const w = wins[i];
        traceUV(face, [[w.u - 0.045, w.v], [w.u - 0.004, w.v], [w.u - 0.004, w.v + w.h], [w.u - 0.045, w.v + w.h]]);

        ctx.fill();
        traceUV(face, [[w.u + w.w + 0.004, w.v], [w.u + w.w + 0.045, w.v], [w.u + w.w + 0.045, w.v + w.h], [w.u + w.w + 0.004, w.v + w.h]]);
        ctx.fill();
      }

    }
    ctx.fillStyle = "#fff8f1";
    for (let i = 0; i < face.beads.length; i++) drawBeads(sp, face.beads[i][0], face.beads[i][1]);

    drawOrnament(face);
  }

  function worldPx(face, u, v) {
    const du = 0.03;
    const a = project(surfacePoint(face, u, v));
    const bu = project(surfacePoint(face, clamp(u + du, 0, 1), v));
    const bv = project(surfacePoint(face, u, clamp(v + du, 0, 1)));
    const w0 = surfacePoint(face, u, v);
    const wu = surfacePoint(face, clamp(u + du, 0, 1), v);
    const wv = surfacePoint(face, u, clamp(v + du, 0, 1));
    const lenU = Math.hypot(wu.x - w0.x, wu.y - w0.y, wu.z - w0.z) / du;
    const lenV = Math.hypot(wv.x - w0.x, wv.y - w0.y, wv.z - w0.z) / du;
    const pxU = Math.hypot(bu.x - a.x, bu.y - a.y) / du / Math.max(0.04, lenU);
    const pxV = Math.hypot(bv.x - a.x, bv.y - a.y) / du / Math.max(0.04, lenV);
    return (pxU + pxV) * 0.5;
  }

  function traceSmooth(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    if (pts.length === 2) {
      ctx.lineTo(pts[1].x, pts[1].y);
      return;
    }
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const last = pts[pts.length - 1];
    ctx.lineTo(last.x, last.y);
  }

  function drawIcingStroke(face, pts, color) {
    if (!pts || pts.length < 2) return;
    const screen = [];
    for (let i = 0; i < pts.length; i++) {
      const uv = pts[i];
      screen.push(project(surfacePoint(face, uv[0], uv[1])));
    }
    const cols = ICING[color] || ICING.weiss;
    const px = clamp(worldPx(face, pts[0][0], pts[0][1]) * 0.075, 3.5, 26);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(80,40,20,0.22)";
    ctx.lineWidth = px;
    ctx.save();
    ctx.translate(1.2, 1.6);
    traceSmooth(screen);
    ctx.stroke();
    ctx.restore();
    ctx.strokeStyle = cols[0];
    ctx.lineWidth = px;
    traceSmooth(screen);
    ctx.stroke();
    ctx.strokeStyle = cols[1];
    ctx.lineWidth = px * 0.62;
    traceSmooth(screen);
    ctx.stroke();
    ctx.strokeStyle = cols[2];
    ctx.lineWidth = Math.max(1.4, px * 0.28);
    traceSmooth(screen);
    ctx.stroke();
  }

  function drawSnowDot(face, d) {
    paintOn(face, d.u, d.v, 0, d.r * 2.2, function () {
      ctx.fillStyle = "rgba(255,255,252,0.82)";
      ctx.beginPath();
      ctx.arc(0, 0, 0.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function candyScale(c, now) {
    if (!c.born) return 1;
    const t = (now - c.born) / 200;
    if (t >= 1) { c.born = 0; return 1; }
    return 0.35 + 0.65 * (1 - (1 - t) * (1 - t));
  }

  function drawCandy(face, c, now) {
    const k = candyScale(c, now);
    const rot = c.rot || 0;
    if (c.kind === "smarties") {
      paintOn(face, c.u, c.v, rot, 0.2 * k, function () {
        ctx.fillStyle = "rgba(70,30,10,0.2)";
        ctx.beginPath(); ctx.ellipse(0.06, 0.08, 0.48, 0.4, 0, 0, 7); ctx.fill();
        ctx.fillStyle = c.col || "#e23d3d";
        ctx.beginPath(); ctx.ellipse(0, 0, 0.48, 0.4, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.75)";
        ctx.beginPath(); ctx.ellipse(-0.12, -0.12, 0.16, 0.1, -0.4, 0, 7); ctx.fill();
      });
    } else if (c.kind === "baer") {
      paintOn(face, c.u, c.v, rot, 0.28 * k, function () {
        const col = c.col || "#f28a1a";
        ctx.fillStyle = "rgba(70,30,10,0.18)";
        ctx.beginPath(); ctx.ellipse(0.05, 0.28, 0.32, 0.26, 0, 0, 7); ctx.fill();
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.ellipse(-0.28, 0.18, 0.12, 0.16, 0.4, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0.28, 0.18, 0.12, 0.16, -0.4, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-0.16, 0.42, 0.12, 0.14, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0.16, 0.42, 0.12, 0.14, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 0.16, 0.32, 0.3, 0, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(-0.18, -0.28, 0.12, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(0.18, -0.28, 0.12, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -0.08, 0.22, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath(); ctx.ellipse(0, 0.2, 0.16, 0.14, 0, 0, 7); ctx.fill();
        ctx.fillStyle = "#3a2418";
        ctx.beginPath(); ctx.arc(-0.07, -0.1, 0.035, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(0.07, -0.1, 0.035, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.beginPath(); ctx.arc(-0.2, -0.32, 0.04, 0, 7); ctx.fill();
      });
    } else if (c.kind === "stange") {
      paintOn(face, c.u, c.v, rot, 0.2 * k, function () {
        ctx.lineCap = "round";
        ctx.lineWidth = 0.22;
        ctx.strokeStyle = "#fffaf4";
        ctx.beginPath();
        ctx.moveTo(-0.08, 1.15);
        ctx.lineTo(-0.08, -0.15);
        ctx.arc(0.16, -0.15, 0.24, Math.PI, 0.35, true);
        ctx.stroke();
        ctx.strokeStyle = "#e23b3b";
        ctx.setLineDash([0.16, 0.14]);
        ctx.lineDashOffset = 0.05;
        ctx.stroke();
        ctx.setLineDash([]);
      });
    } else if (c.kind === "stern") {
      paintOn(face, c.u, c.v, rot, 0.24 * k, function () {
        ctx.save();
        ctx.translate(0.04, 0.05);
        drawStarShape("rgba(80,40,10,0.2)", "rgba(80,40,10,0)");
        ctx.restore();
        drawStarShape(c.col || "#ffd24a", "#d09018");
      });
    } else if (c.kind === "mandel") {
      paintOn(face, c.u, c.v, rot, 0.2 * k, function () {
        ctx.fillStyle = "rgba(70,40,10,0.2)";
        ctx.beginPath(); ctx.ellipse(0.05, 0.06, 0.46, 0.24, 0.2, 0, 7); ctx.fill();
        ctx.fillStyle = "#d7b07a";
        ctx.beginPath(); ctx.ellipse(0, 0, 0.48, 0.24, 0.2, 0, 7); ctx.fill();
        ctx.strokeStyle = "#a67c48";
        ctx.lineWidth = 0.04;
        ctx.beginPath(); ctx.moveTo(-0.3, 0.02); ctx.lineTo(0.32, -0.02); ctx.stroke();
      });
    } else if (c.kind === "schoggi") {
      paintOn(face, c.u, c.v, rot, 0.26 * k, function () {
        roundBox(-0.42, -0.55, 0.84, 1.1, 0.1);
        ctx.fillStyle = "#4a2918";
        ctx.fill();
        roundBox(-0.3, -0.42, 0.6, 0.84, 0.06);
        ctx.fillStyle = "#7a4630";
        ctx.fill();
        ctx.strokeStyle = "#3a1e12";
        ctx.lineWidth = 0.06;
        ctx.beginPath();
        ctx.moveTo(0, -0.42); ctx.lineTo(0, 0.42);
        ctx.moveTo(-0.3, 0); ctx.lineTo(0.3, 0);
        ctx.stroke();
        ctx.strokeStyle = "rgba(255,220,180,0.45)";
        ctx.lineWidth = 0.05;
        ctx.beginPath();
        ctx.moveTo(-0.22, -0.28); ctx.lineTo(0.05, -0.36);
        ctx.stroke();
      });
    }
  }

  function roundBox(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawDecals(face, pass, now) {
    for (let i = 0; i < decals.length; i++) {
      const d = decals[i];
      if (d.face !== face.id) continue;
      if (pass === "snow" && d.t === "snow") {
        for (let j = 0; j < d.dots.length; j++) drawSnowDot(face, d.dots[j]);
      } else if (pass === "ice" && d.t === "ice") {
        drawIcingStroke(face, d.pts, d.color);
      } else if (pass === "candy" && d.t === "candy") {
        drawCandy(face, d, now);
      }
    }
    if (pass === "ice" && stroke && stroke.t === "ice" && stroke.face === face.id) {
      drawIcingStroke(face, stroke.pts, stroke.color);
    }
    if (pass === "snow" && stroke && stroke.t === "snow" && stroke.face === face.id) {
      for (let j = 0; j < stroke.dots.length; j++) drawSnowDot(face, stroke.dots[j]);
    }
  }

  function drawRails() {
    if (!model.rails || !model.rails.length) return;
    const n = rotNorm({ x: 0, y: 0, z: 1 });
    if (n.z < 0.05) return;
    ctx.lineCap = "round";
    for (let i = 0; i < model.rails.length; i++) {
      const r = model.rails[i];
      const a = project(r.a), b = project(r.b);
      ctx.strokeStyle = r.rail ? "#f6ecdf" : "#f3e2c4";
      ctx.lineWidth = r.rail ? 4 : 3.2;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
  }

  function drawCrown() {
    if (!model.crown) return;
    const p = project(model.crown);
    const s = Math.max(12, layoutUnit() * 0.07);
    ctx.save();
    ctx.translate(p.x, p.y - s * 0.15);
    ctx.lineCap = "round";
    ctx.strokeStyle = "#6b3a14";
    ctx.lineWidth = Math.max(5, s * 0.34);
    ctx.beginPath();
    ctx.moveTo(0, -s);
    ctx.lineTo(0, s * 0.45);
    ctx.moveTo(-s * 0.62, -s * 0.28);
    ctx.lineTo(s * 0.62, -s * 0.28);
    ctx.stroke();
    ctx.strokeStyle = "#f0c84a";
    ctx.lineWidth = Math.max(2.5, s * 0.16);
    ctx.stroke();
    ctx.restore();
  }

  function drawDoily() {
    const y = 0.012;
    const radius = model.pad;
    const c = project({ x: 0, y: y, z: 0 });
    const px = project({ x: radius, y: y, z: 0 });
    const pz = project({ x: 0, y: y, z: radius });
    function disc(scale, color) {
      ctx.setTransform((px.x - c.x) * dpr * scale, (px.y - c.y) * dpr * scale, (pz.x - c.x) * dpr * scale, (pz.y - c.y) * dpr * scale, c.x * dpr, c.y * dpr);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(0, 0, 1, 0, Math.PI * 2);
      ctx.fill();
    }
    disc(1.04, "rgba(60,30,12,0.18)");
    disc(1, "#f7efe2");
    ctx.fillStyle = "#e7c9a2";
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * 0.9, Math.sin(a) * 0.9, 0.055, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.strokeStyle = "#e4c49a";
    ctx.lineWidth = 0.025;
    ctx.beginPath();
    ctx.arc(0, 0, 0.72, 0, Math.PI * 2);
    ctx.stroke();
    resetT();
  }

  function drawBlooms() {
    if (!state.lit || !glows.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < glows.length; i++) {
      const g = glows[i];
      const rad = Math.max(16, g.r * 2.6);
      const grd = ctx.createRadialGradient(g.cx, g.cy, 2, g.cx, g.cy, rad);
      grd.addColorStop(0, "rgba(255,186,80,0.55)");
      grd.addColorStop(1, "rgba(255,140,40,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(g.cx, g.cy, rad, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawHalo() {
    const p = project({ x: 0, y: model.peak * 0.45, z: 0 });
    const rad = layoutUnit() * model.fit * 1.15;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(p.x, p.y, rad * 0.15, p.x, p.y, rad);
    g.addColorStop(0, "rgba(255,176,70,0.38)");
    g.addColorStop(0.55, "rgba(255,140,40,0.14)");
    g.addColorStop(1, "rgba(255,120,30,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHouse(now) {
    glows.length = 0;
    const faces = model.faces;
    for (let i = 0; i < faces.length; i++) prepareFace(faces[i]);
    const order = faces.filter(function (f) { return f._vis; });
    order.sort(function (a, b) { return a._z - b._z; });
    drawDoily();
    if (state.night) drawHalo();
    for (let i = 0; i < order.length; i++) {
      const f = order[i];
      if (f.kind === "floor") {
        drawFaceSurface(f);
        continue;
      }
      drawFaceSurface(f);
      drawDecals(f, "snow", now);
      drawDecals(f, "ice", now);
    }
    drawBlooms();
    for (let i = 0; i < order.length; i++) {
      if (order[i].kind === "floor") continue;
      drawDecals(order[i], "candy", now);
    }
    drawRails();
    drawCrown();
  }

  function rr(g, x, y, w, h, r) {
    const rad = Math.max(0, Math.min(r, w / 2, h / 2));
    g.beginPath();
    g.moveTo(x + rad, y);
    g.arcTo(x + w, y, x + w, y + h, rad);
    g.arcTo(x + w, y + h, x, y + h, rad);
    g.arcTo(x, y + h, x, y, rad);
    g.arcTo(x, y, x + w, y, rad);
    g.closePath();
  }

  function rebuildBg() {
    bg.width = Math.max(1, Math.round(W * dpr));
    bg.height = Math.max(1, Math.round(H * dpr));
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = bgCtx;
    const night = state.night;
    const wall = g.createLinearGradient(0, 0, 0, H);
    if (night) {
      wall.addColorStop(0, "#323c58");
      wall.addColorStop(0.7, "#232a40");
      wall.addColorStop(1, "#1a140f");
    } else {
      wall.addColorStop(0, "#f8e6cb");
      wall.addColorStop(0.62, "#f0c99a");
      wall.addColorStop(1, "#e7b27a");
    }
    g.fillStyle = wall;
    g.fillRect(0, 0, W, H);

    const winW = Math.min(W * 0.34, 300);
    const winH = Math.min(H * 0.4, 250);
    const wx = Math.max(12, W * 0.045);
    const wy = Math.max(12, H * 0.07);
    scene.win = { x: wx, y: wy, w: winW, h: winH, ix: wx + 10, iy: wy + 10, iw: winW - 20, ih: winH - 18 };

    g.save();
    rr(g, wx, wy, winW, winH, 8);
    g.clip();
    const sky = g.createLinearGradient(0, wy, 0, wy + winH);
    if (night) {
      sky.addColorStop(0, "#12182e");
      sky.addColorStop(0.55, "#24345a");
      sky.addColorStop(1, "#3d5168");
    } else {
      sky.addColorStop(0, "#8ecaf5");
      sky.addColorStop(0.62, "#d5eefc");
      sky.addColorStop(1, "#e7f4e4");
    }
    g.fillStyle = sky;
    g.fillRect(wx, wy, winW, winH);
    if (night) {
      g.fillStyle = "#fff3c4";
      g.beginPath();
      g.arc(wx + winW * 0.78, wy + winH * 0.24, Math.min(16, winW * 0.06), 0, 7);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.85)";
      for (let i = 0; i < 12; i++) {
        const sx = wx + ((i * 67) % 100) / 100 * winW;
        const sy = wy + ((i * 41) % 70) / 100 * winH * 0.6;
        g.fillRect(sx, sy, 2, 2);
      }
    } else {
      g.fillStyle = "#fff6c8";
      g.beginPath();
      g.arc(wx + winW * 0.8, wy + winH * 0.22, Math.min(18, winW * 0.07), 0, 7);
      g.fill();
    }
    g.fillStyle = night ? "#243044" : "#8eafc4";
    g.beginPath();
    g.moveTo(wx, wy + winH * 0.72);
    g.lineTo(wx + winW * 0.25, wy + winH * 0.5);
    g.lineTo(wx + winW * 0.48, wy + winH * 0.7);
    g.lineTo(wx + winW * 0.7, wy + winH * 0.46);
    g.lineTo(wx + winW, wy + winH * 0.68);
    g.lineTo(wx + winW, wy + winH);
    g.lineTo(wx, wy + winH);
    g.fill();
    function fir(x, base, hgt) {
      g.fillStyle = night ? "#1c3348" : "#2f6b45";
      g.beginPath();
      g.moveTo(x, base - hgt);
      g.lineTo(x + hgt * 0.42, base);
      g.lineTo(x - hgt * 0.42, base);
      g.fill();
      g.fillStyle = "#f4f7fb";
      g.beginPath();
      g.moveTo(x, base - hgt);
      g.lineTo(x + hgt * 0.18, base - hgt * 0.45);
      g.lineTo(x - hgt * 0.05, base - hgt * 0.5);
      g.fill();
    }
    fir(wx + winW * 0.22, wy + winH * 0.78, winH * 0.28);
    fir(wx + winW * 0.4, wy + winH * 0.8, winH * 0.2);
    g.fillStyle = "#f7fbff";
    g.fillRect(wx, wy + winH * 0.74, winW, winH * 0.3);
    g.restore();

    g.fillStyle = night ? "#4a3428" : "#a86b3c";
    g.fillRect(wx - 4, wy - 4, winW + 8, 10);
    g.fillRect(wx - 4, wy + winH - 6, winW + 8, 12);
    g.fillRect(wx - 4, wy, 10, winH);
    g.fillRect(wx + winW - 6, wy, 10, winH);
    g.fillStyle = night ? "#6b5140" : "#d7a36a";
    g.fillRect(wx + winW * 0.48, wy, 6, winH);

    const shelfY = wy + winH + Math.min(36, H * 0.06);
    if (shelfY < H * 0.62) {
      g.fillStyle = night ? "#5a3e30" : "#c4844c";
      g.fillRect(wx, shelfY, winW * 0.9, 8);
      const jars = ["#e23d3d", "#3eae6a", "#f2d23a", "#fffaf3"];
      for (let i = 0; i < 4; i++) {
        const jx = wx + 16 + i * (winW * 0.2);
        g.fillStyle = jars[i];
        g.fillRect(jx + 3, shelfY - 26, 16, 18);
        g.fillStyle = "#f0d78c";
        g.fillRect(jx + 3, shelfY - 30, 16, 6);
        g.strokeStyle = night ? "#2a2420" : "#f7f1e6";
        g.lineWidth = 2;
        g.strokeRect(jx + 2, shelfY - 28, 18, 22);
      }
    }

    const lampX = Math.min(W - 28, Math.max(W * 0.78, scene.win.x + scene.win.w + 36));
    g.strokeStyle = night ? "#d7c4a4" : "#8a5a32";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(lampX, 0);
    g.lineTo(lampX, 18);
    g.stroke();
    g.fillStyle = night ? "#f0d78c" : "#f6e2b0";
    g.beginPath();
    g.moveTo(lampX - 16, 18);
    g.lineTo(lampX + 16, 18);
    g.lineTo(lampX + 10, 34);
    g.lineTo(lampX - 10, 34);
    g.fill();
    if (night) {
      const lg = g.createRadialGradient(lampX, 40, 4, lampX, 70, 120);
      lg.addColorStop(0, "rgba(255,200,110,0.35)");
      lg.addColorStop(1, "rgba(255,180,80,0)");
      g.fillStyle = lg;
      g.beginPath();
      g.arc(lampX, 60, 120, 0, 7);
      g.fill();
    }

    const tableTop = H * 0.58;
    const floor = g.createLinearGradient(0, tableTop, 0, H);
    floor.addColorStop(0, night ? "#4a3424" : "#e0b06a");
    floor.addColorStop(1, night ? "#2a1a12" : "#c4843e");
    g.fillStyle = floor;
    g.beginPath();
    g.moveTo(0, H * 0.78);
    g.lineTo(W, H * 0.72);
    g.lineTo(W, H);
    g.lineTo(0, H);
    g.fill();
    g.fillStyle = night ? "rgba(255,255,255,0.04)" : "rgba(255,255,255,0.16)";
    for (let i = 0; i < 6; i++) {
      g.fillRect(0, H * 0.78 + i * ((H * 0.22) / 6), W, 1);
    }

    scene.mug = { x: Math.min(W - 36, W * 0.86), y: H * 0.8 };
    const mx = scene.mug.x, my = scene.mug.y;
    g.fillStyle = "#f7f4ee";
    g.beginPath();
    g.ellipse(mx, my, 16, 8, 0, 0, 7);
    g.fill();
    g.fillStyle = "#fffaf6";
    g.fillRect(mx - 14, my - 26, 28, 26);
    g.strokeStyle = "#f7f4ee";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(mx + 16, my - 14, 7, -1.2, 1.2);
    g.stroke();
    g.fillStyle = "#f4e4c4";
    g.beginPath();
    g.ellipse(mx, my - 26, 14, 5, 0, 0, 7);
    g.fill();
    g.fillStyle = "#fff";
    g.beginPath();
    g.ellipse(mx - 2, my - 30, 8, 4, 0, 0, 7);
    g.fill();

    const px = Math.min(W * 0.9, W - 28);
    g.fillStyle = "#f4e2c0";
    g.beginPath();
    g.ellipse(px, H * 0.9, 22, 8, 0, 0, 7);
    g.fill();
    g.fillStyle = "#c4783a";
    g.beginPath(); g.arc(px - 6, H * 0.9 - 4, 6, 0, 7); g.fill();
    g.fillStyle = "#e23d3d";
    g.beginPath(); g.arc(px + 6, H * 0.9 - 3, 5, 0, 7); g.fill();

    if (flakes.length !== 70) {
      flakes = [];
      for (let i = 0; i < 70; i++) {
        flakes.push({
          x: Math.random(),
          y: Math.random(),
          s: 1.2 + Math.random() * 2.4,
          v: 0.08 + Math.random() * 0.2,
          w: Math.random() * 6.28,
          d: 0.4 + Math.random() * 0.8
        });
      }
    }
  }

  function drawSnowfall(dt, now) {
    const win = scene.win;
    if (!win) return;
    ctx.save();
    rr(ctx, win.ix, win.iy, win.iw, win.ih, 4);
    ctx.clip();
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    ctx.strokeStyle = "rgba(120,140,160,0.35)";
    ctx.lineWidth = 1;
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.v * dt * 0.55;
      f.x += Math.sin(now / 700 + f.w) * 0.0025;
      if (f.y > 1.05) { f.y = -0.05; f.x = Math.random(); }
      const x = win.ix + ((f.x % 1 + 1) % 1) * win.iw;
      const y = win.iy + f.y * win.ih;
      ctx.beginPath();
      ctx.arc(x, y, f.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSteam(now) {
    if (!scene.mug) return;
    const mx = scene.mug.x, my = scene.mug.y - 34;
    ctx.strokeStyle = state.night ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.55)";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const ph = now / 500 + i * 1.7;
      ctx.beginPath();
      ctx.moveTo(mx - 8 + i * 8, my);
      ctx.bezierCurveTo(
        mx - 8 + i * 8 + Math.sin(ph) * 6, my - 10,
        mx - 8 + i * 8 - Math.sin(ph) * 6, my - 20,
        mx - 8 + i * 8 + Math.sin(ph + 1) * 4, my - 30 - (i % 2) * 6
      );
      ctx.stroke();
    }
  }

  function drawHud() {
    if (shooting) return;
    const titleSize = Math.max(16, Math.min(26, Math.min(W, H) * 0.055));
    ctx.font = "800 " + titleSize + "px Trebuchet MS, Segoe UI, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const title = "Lebkuchenhaus";
    const titleW = ctx.measureText(title).width;
    const pw = titleW + 22;
    const ph = titleSize + 10;
    const px = W * 0.56;
    const py = 8 + ph / 2;
    ctx.fillStyle = "rgba(255,246,232,0.94)";
    rr(ctx, px - pw / 2, py - ph / 2, pw, ph, ph / 2);
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#c4783a";
    ctx.stroke();
    ctx.fillStyle = "#8a3a22";
    ctx.fillText(title, px, py + 1);

    const hint = HINTS[state.tool] || "";
    let font = Math.max(12, Math.min(15, W * 0.034));
    ctx.font = "700 " + font + "px Trebuchet MS, Segoe UI, sans-serif";
    while (ctx.measureText(hint).width > W - 36 && font > 10) {
      font -= 1;
      ctx.font = "700 " + font + "px Trebuchet MS, Segoe UI, sans-serif";
    }
    const tw = ctx.measureText(hint).width;
    const bw = Math.min(W - 16, tw + 22);
    const bh = font + 12;
    const bx = (W - bw) / 2;
    const by = H - bh - 8;
    ctx.fillStyle = "rgba(255,246,232,0.92)";
    rr(ctx, bx, by, bw, bh, bh / 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(138,78,44,0.45)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#4a2414";
    ctx.textBaseline = "middle";
    ctx.fillText(hint, W / 2, by + bh / 2);
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016);
    lastNow = now;
    if (!dragging) {
      const dy = wrapPi(targetYaw - state.yaw);
      state.yaw += dy * (1 - Math.exp(-9 * dt));
      state.pitch += (targetPitch - state.pitch) * (1 - Math.exp(-9 * dt));
      if (Math.abs(velYaw) > 0.0008) {
        state.yaw += velYaw * dt;
        targetYaw = state.yaw;
        velYaw *= Math.exp(-2.6 * dt);
      }
    }
    resetT();
    if (bg.width) ctx.drawImage(bg, 0, 0, W, H);
    drawSnowfall(dt, now);
    drawSteam(now);
    if (model) drawHouse(now);
    drawHud();
    requestAnimationFrame(frame);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    W = Math.max(2, r.width);
    H = Math.max(2, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    rebuildBg();
  }

  function countSnow() {
    let n = 0;
    for (let i = 0; i < decals.length; i++) if (decals[i].t === "snow") n += decals[i].dots.length;
    return n;
  }
  function countOf(t) {
    let n = 0;
    for (let i = 0; i < decals.length; i++) if (decals[i].t === t) n++;
    return n;
  }

  function pushHist() {
    hist.push(JSON.stringify({ shape: state.shape, lit: state.lit, icing: state.icing, decals: decals }));
    if (hist.length > 40) hist.shift();
    updateUndo();
  }
  function updateUndo() {
    if (buttons.undo) buttons.undo.disabled = hist.length === 0;
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          v: 1,
          shape: state.shape,
          yaw: state.yaw,
          pitch: state.pitch,
          icing: state.icing,
          lit: state.lit,
          night: state.night,
          sound: state.sound,
          decals: decals
        }));
      } catch (err) { /* full storage stays quiet */ }
    }, 200);
  }

  function load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (err) { data = null; }
    if (!data || data.v !== 1) {
      model = buildModel(state.shape);
      return;
    }
    if (data.shape === "chalet" || data.shape === "kirch" || data.shape === "hexen") state.shape = data.shape;
    model = buildModel(state.shape);
    if (typeof data.yaw === "number") state.yaw = data.yaw;
    if (typeof data.pitch === "number") state.pitch = clamp(data.pitch, 0.18, 1.15);
    targetYaw = state.yaw;
    targetPitch = state.pitch;
    if (ICING[data.icing]) state.icing = data.icing;
    state.lit = !!data.lit;
    state.night = !!data.night;
    state.sound = !!data.sound;
    if (state.sound) jingleArmed = true;
    discoveredLight = state.lit;
    const next = [];
    const raw = Array.isArray(data.decals) ? data.decals : [];
    for (let i = 0; i < raw.length; i++) {
      const d = raw[i];
      if (!d || !faceById(d.face)) continue;
      if (d.t === "ice" && Array.isArray(d.pts) && d.pts.length > 1) next.push({ t: "ice", face: d.face, color: ICING[d.color] ? d.color : "weiss", pts: d.pts.slice(0, 500) });
      else if (d.t === "snow" && Array.isArray(d.dots)) next.push({ t: "snow", face: d.face, dots: d.dots.slice(0, 400) });
      else if (d.t === "candy" && CANDY[d.kind] && typeof d.u === "number") {
        next.push({ t: "candy", face: d.face, kind: d.kind, u: d.u, v: d.v, rot: d.rot || 0, col: d.col || null, born: 0 });
      }
    }
    decals = next;
  }

  function setPressed() {
    Object.keys(buttons).forEach(function (id) {
      const b = buttons[id];
      let on = false;
      if (id === state.tool) on = true;
      else if (id === "shape-" + state.shape) on = true;
      else if (id === "licht") on = state.lit;
      else if (id === "nacht") on = state.night;
      else if (id === "ton") on = state.sound;
      else if (id === "ice-" + state.icing) on = true;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    const colors = $("colors");
    if (colors) {
      if (state.tool === "guss") colors.hidden = false;
      else colors.hidden = true;
    }
    if (buttons.ton) {
      const ico = buttons.ton.querySelector(".ico");
      if (ico) ico.innerHTML = state.sound ? ICONS.tonOn : ICONS.ton;
    }
    const cur = state.tool === "drehen" ? "grab" : (state.tool === "guss" || state.tool === "schnee" ? "crosshair" : "pointer");
    canvas.style.cursor = cur;
  }

  function setShape(id) {
    if (id === state.shape) return;
    cancelStroke();
    pushHist();
    state.shape = id;
    decals = [];
    model = buildModel(id);
    setPressed();
    save();
  }
  function setTool(id) {
    cancelStroke();
    state.tool = id;
    setPressed();
    save();
  }
  function setIcing(id) {
    state.icing = id;
    setPressed();
    save();
  }
  function toggleLight() {
    pushHist();
    state.lit = !state.lit;
    if (state.lit) discoveredLight = true;
    setPressed();
    save();
    if (state.lit) playChord();
    else playPop(440, 0.06);
  }
  function toggleNight() {
    state.night = !state.night;
    setPressed();
    rebuildBg();
    save();
  }
  function goView(name) {
    const v = {
      vorne: { yaw: 0.28, pitch: 0.42 },
      seite: { yaw: 1.22, pitch: 0.4 },
      dach: { yaw: 0.55, pitch: 1.0 }
    }[name];
    if (!v) return;
    targetYaw = v.yaw;
    targetPitch = v.pitch;
    velYaw = 0;
    save();
  }
  function neuesHaus() {
    if (!decals.length && !state.lit) {
      toast("Ist schon leer");
      return;
    }
    ask.hidden = false;
  }
  function doNeues() {
    ask.hidden = true;
    cancelStroke();
    pushHist();
    decals = [];
    state.lit = false;
    setPressed();
    save();
    toast("Neues Haus");
  }
  function undo() {
    if (!hist.length) return;
    cancelStroke();
    const s = JSON.parse(hist.pop());
    state.shape = s.shape || state.shape;
    state.lit = !!s.lit;
    if (ICING[s.icing]) state.icing = s.icing;
    model = buildModel(state.shape);
    decals = Array.isArray(s.decals) ? s.decals : [];
    setPressed();
    updateUndo();
    save();
    playPop(520, 0.05);
  }

  function foto() {
    shooting = true;
    const now = performance.now();
    lastNow = now;
    resetT();
    if (bg.width) ctx.drawImage(bg, 0, 0, W, H);
    drawSnowfall(0.016, now);
    drawSteam(now);
    if (model) drawHouse(now);
    let url = "";
    try { url = canvas.toDataURL("image/png"); } catch (err) { url = ""; }
    shooting = false;
    if (!url) { toast("Foto klappt nicht"); return; }
    const a = document.createElement("a");
    a.href = url;
    a.download = "lebkuchenhaus.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Foto gespeichert");
    playChord();
  }

  function cancelStroke() { stroke = null; }

  function startStroke(hit) {
    if (state.tool === "guss") {
      if (countOf("ice") >= 80) { toast("Das Haus ist voll"); return; }
      pushHist();
      stroke = { t: "ice", face: hit.face.id, color: state.icing, pts: [[hit.u, hit.v]] };
    } else if (state.tool === "schnee") {
      if (countSnow() >= 900) { toast("Das Haus ist voll"); return; }
      pushHist();
      stroke = { t: "snow", face: hit.face.id, dots: [] };
      sprinkle(hit);
    }
  }
  function sprinkle(hit) {
    const face = hit.face;
    const w0 = surfacePoint(face, hit.u, hit.v);
    const wU = surfacePoint(face, clamp(hit.u + 0.05, 0, 1), hit.v);
    const len = Math.hypot(wU.x - w0.x, wU.y - w0.y, wU.z - w0.z) / 0.05 || 0.2;
    const uvR = 0.07 / len;
    for (let i = 0; i < 7; i++) {
      const ang = Math.random() * Math.PI * 2;
      const rad = Math.random() * uvR;
      stroke.dots.push({
        u: clamp(hit.u + Math.cos(ang) * rad, 0.01, 0.99),
        v: clamp(hit.v + Math.sin(ang) * rad, 0.01, 0.99),
        r: 0.018 + Math.random() * 0.03
      });
    }
  }
  function extendStroke(p) {
    if (!stroke) return;
    const hit = pick(p.x, p.y);
    if (!hit || hit.face.id !== stroke.face) return;
    if (stroke.t === "ice") {
      const prev = stroke.pts[stroke.pts.length - 1];
      const a = project(surfacePoint(hit.face, prev[0], prev[1]));
      const b = project(surfacePoint(hit.face, hit.u, hit.v));
      if (Math.hypot(a.x - b.x, a.y - b.y) < 3) return;
      if (stroke.pts.length > 480) return;
      stroke.pts.push([hit.u, hit.v]);
    } else if (stroke.t === "snow") {
      if (countSnow() + stroke.dots.length > 900) return;
      const prev = stroke.dots[stroke.dots.length - 1];
      if (prev && Math.hypot(prev.u - hit.u, prev.v - hit.v) < 0.012) return;
      sprinkle(hit);
    }
  }
  function finishStroke() {
    if (!stroke) return;
    if (stroke.t === "ice") {
      if (stroke.pts.length < 2) {
        hist.pop();
        updateUndo();
      } else decals.push(stroke);
      playPop(660, 0.04);
    } else if (stroke.t === "snow") {
      if (!stroke.dots.length) {
        hist.pop();
        updateUndo();
      } else decals.push(stroke);
      playShaker();
    }
    stroke = null;
    updateUndo();
    save();
  }
  function placeCandy(hit) {
    if (countOf("candy") >= 150) { toast("Das Haus ist voll"); return; }
    pushHist();
    const kind = state.tool;
    let col = null;
    if (kind === "smarties") col = SMARTIE[(Math.random() * SMARTIE.length) | 0];
    else if (kind === "baer") col = BEAR[(Math.random() * BEAR.length) | 0];
    else if (kind === "stern") col = Math.random() < 0.5 ? "#ffd24a" : "#fffaf3";
    decals.push({
      t: "candy",
      face: hit.face.id,
      kind: kind,
      u: clamp(hit.u, 0.04, 0.96),
      v: clamp(hit.v, 0.04, 0.96),
      rot: (Math.random() - 0.5) * (kind === "schoggi" ? 0.3 : 0.8),
      col: col,
      born: performance.now()
    });
    updateUndo();
    save();
    playPop(720 + Math.random() * 180, 0.06);
  }

  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  function onDown(e) {
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* already gone */ }
    unlockAudio();
    const p = pos(e);
    down = p;
    lastP = p;
    moved = false;
    velYaw = 0;
    if (state.tool === "drehen") dragging = true;
    else if (state.tool === "guss" || state.tool === "schnee") {
      const hit = pick(p.x, p.y);
      if (hit) startStroke(hit);
    }
  }
  function onMove(e) {
    if (e.pointerId !== activeId) {
      if (e.pointerType !== "touch" && activeId === null) {
        const p = pos(e);
        hover = pick(p.x, p.y);
      }
      return;
    }
    const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (let i = 0; i < list.length; i++) {
      const p = pos(list[i]);
      if (down && Math.hypot(p.x - down.x, p.y - down.y) > 8) moved = true;
      if (state.tool === "drehen" && dragging && lastP) {
        const dx = p.x - lastP.x;
        const dy = p.y - lastP.y;
        state.yaw -= dx * 0.01;
        state.pitch = clamp(state.pitch + dy * 0.0075, 0.18, 1.12);
        targetYaw = state.yaw;
        targetPitch = state.pitch;
        velYaw = clamp(-dx * 0.01 / 0.016, -1.4, 1.4);
      } else if (stroke) extendStroke(p);
      lastP = p;
    }
  }
  function onUp(e) {
    if (e.pointerId !== activeId) return;
    activeId = null;
    const p = pos(e);
    if (state.tool === "drehen") {
      dragging = false;
      if (!moved) {
        const hit = pick(p.x, p.y);
        if (hit && hitWindow(hit)) toggleLight();
        else velYaw = 0;
      }
      save();
    } else if (stroke) finishStroke();
    else if (!moved && CANDY[state.tool]) {
      const hit = pick(p.x, p.y);
      if (hit) placeCandy(hit);
    }
    hover = null;
  }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function unlockAudio() {
    if (!state.sound && !jingleArmed) {
      /* context stays closed until Ton is on, except we may resume later */
    }
    if (state.sound || jingleArmed) {
      ensureAudio();
      if (jingleArmed && state.sound) {
        jingleArmed = false;
        playJingle();
      }
    }
  }
  function tone(freq, t, dur, type, gain) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
    audioNodes.push(o);
  }
  function silence() {
    for (let i = 0; i < audioNodes.length; i++) {
      try { audioNodes[i].stop(); } catch (err) { /* already stopped */ }
    }
    audioNodes = [];
  }
  function playJingle() {
    const ac = ensureAudio();
    if (!ac || !state.sound) return;
    const now = ac.currentTime + 0.04;
    const seq = [
      [659, 0, 0.16], [659, 0.2, 0.16], [659, 0.4, 0.26],
      [659, 0.72, 0.16], [659, 0.92, 0.16], [659, 1.12, 0.26],
      [659, 1.44, 0.16], [784, 1.64, 0.16], [523, 1.84, 0.2], [587, 2.06, 0.2], [659, 2.28, 0.42]
    ];
    for (let i = 0; i < seq.length; i++) {
      tone(seq[i][0], now + seq[i][1], seq[i][2], "triangle", 0.05);
      tone(seq[i][0] * 2, now + seq[i][1], seq[i][2] * 0.7, "sine", 0.015);
    }
  }
  function playPop(freq, gain) {
    if (!state.sound) return;
    const ac = ensureAudio();
    if (!ac) return;
    tone(freq, ac.currentTime, 0.09, "sine", gain || 0.05);
  }
  function playChord() {
    if (!state.sound) return;
    const ac = ensureAudio();
    if (!ac) return;
    const t = ac.currentTime;
    tone(523, t, 0.22, "triangle", 0.04);
    tone(659, t, 0.24, "triangle", 0.035);
    tone(784, t, 0.28, "sine", 0.02);
  }
  function playShaker() {
    if (!state.sound) return;
    const ac = ensureAudio();
    if (!ac) return;
    const frames = (ac.sampleRate * 0.09) | 0;
    const buf = ac.createBuffer(1, frames, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < frames; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / frames);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const filter = ac.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 1800;
    const g = ac.createGain();
    g.gain.value = 0.05;
    src.connect(filter);
    filter.connect(g);
    g.connect(ac.destination);
    src.start();
  }
  function toggleSound() {
    state.sound = !state.sound;
    setPressed();
    save();
    if (!state.sound) {
      silence();
      toast("Ton ist aus");
      return;
    }
    jingleArmed = false;
    ensureAudio();
    playJingle();
    toast("Ton ist an");
  }

    seite: '<svg viewBox="0 0 24 24"><path d="M7 8h6l4 3v7H7z" fill="#fff6e8" stroke="#8a3a22" stroke-width="1.6"/></svg>',
    dach: '<svg viewBox="0 0 24 24"><path d="M4 16 L12 6 L20 16Z" fill="#e23d3d" stroke="#8a3a22" stroke-width="1.4"/></svg>',
    licht: '<svg viewBox="0 0 24 24" fill="none" stroke="#e29a18" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="10" r="4" fill="#ffd24a"/><path d="M9 16h6M10 19h4"/></svg>',
    nacht: '<svg viewBox="0 0 24 24"><path fill="#f0d78c" d="M14 4a7 7 0 1 0 6 10A8 8 0 0 1 14 4z"/></svg>',
    foto: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a3a22" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2" fill="#fff"/><circle cx="12" cy="12.5" r="3.2"/><path d="M8 6l1.2-2h5.6L16 6"/></svg>',
    undo: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a3a22" stroke-width="2" stroke-linecap="round"><path d="M8 8H5V5"/><path d="M5.5 13a7 7 0 1 0 1-5.5L5 8"/></svg>',
    neu: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a3a22" stroke-width="1.7" stroke-linecap="round"><path d="M4 12l8-7 8 7v8H4z"/><path d="M12 10v4M10 12h4" stroke="#e23d3d"/></svg>',
    ton: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a3a22" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>',
    tonOn: '<svg viewBox="0 0 24 24" fill="none" stroke="#8a3a22" stroke-width="1.8" stroke-linecap="round"><path d="M4 10h4l5-4v12l-5-4H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M18.5 7a7 7 0 0 1 0 10"/></svg>'
  };

  function makeButton(id, label, icon, pressable) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="ico" aria-hidden="true">' + icon + '</span><span class="lbl"></span>';
    b.querySelector(".lbl").textContent = label;
    b.setAttribute("aria-label", label);
    if (pressable) b.setAttribute("aria-pressed", "false");
    buttons[id] = b;
    return b;
  }

  function buildUI() {
    const tools = [
      ["drehen", "Drehen", ICONS.drehen],
      ["guss", "Zuckerguss", ICONS.guss],
      ["schnee", "Schnee", ICONS.schnee],
      ["smarties", "Smarties", ICONS.smarties],
      ["baer", "Gummibärchen", ICONS.baer],
      ["stange", "Zuckerstangen", ICONS.stange],
      ["stern", "Sterne", ICONS.stern],
      ["mandel", "Mandeln", ICONS.mandel],
      ["schoggi", "Schoggi-Fenster", ICONS.schoggi]
    ];
    tools.forEach(function (t) {
      const b = makeButton(t[0], t[1], t[2], true);
      b.addEventListener("click", function () { unlockAudio(); setTool(t[0]); });
      bar.appendChild(b);
    });
    const colors = document.createElement("div");
    colors.id = "colors";
    colors.hidden = true;
    const names = [["weiss", "Weiss", "#fffaf4"], ["rosa", "Rosa", "#ffb7c8"], ["rot", "Rot", "#e23d3d"], ["gruen", "Grün", "#3eae6a"], ["blau", "Blau", "#4aa3e8"], ["gelb", "Gelb", "#ffd24a"]];
    names.forEach(function (n) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "swatch";
      b.setAttribute("aria-label", n[1]);
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="dot"></span>';
      b.querySelector(".dot").style.background = n[2];
      b.addEventListener("click", function () { unlockAudio(); setIcing(n[0]); });
      buttons["ice-" + n[0]] = b;
      colors.appendChild(b);
    });
    bar.appendChild(colors);
    [["hexen", "Hexenhaus", ICONS.hexen], ["chalet", "Chalet", ICONS.chalet], ["kirch", "Kirchlein", ICONS.kirch]].forEach(function (t) {
      const b = makeButton("shape-" + t[0], t[1], t[2], true);
      b.addEventListener("click", function () { unlockAudio(); setShape(t[0]); });
      bar.appendChild(b);
    });
    [["vorne", "Vorne", ICONS.vorne], ["seite", "Seite", ICONS.seite], ["dach", "Dach", ICONS.dach]].forEach(function (t) {
      const b = makeButton("view-" + t[0], t[1], t[2], false);
      b.addEventListener("click", function () { unlockAudio(); goView(t[0]); });
      bar.appendChild(b);
    });
    const licht = makeButton("licht", "Licht", ICONS.licht, true);
    licht.addEventListener("click", function () { unlockAudio(); toggleLight(); });
    const nacht = makeButton("nacht", "Nacht", ICONS.nacht, true);
    nacht.addEventListener("click", function () { unlockAudio(); toggleNight(); });
    const fotoB = makeButton("foto", "Foto", ICONS.foto, false);
    fotoB.addEventListener("click", function () { unlockAudio(); foto(); });
    const undoB = makeButton("undo", "Zurück", ICONS.undo, false);
    undoB.addEventListener("click", function () { unlockAudio(); undo(); });
    const neu = makeButton("neu", "Neues Haus", ICONS.neu, false);
    neu.addEventListener("click", function () { unlockAudio(); neuesHaus(); });
    const ton = makeButton("ton", "Ton", ICONS.ton, true);
    ton.addEventListener("click", function () { toggleSound(); });
    [licht, nacht, fotoB, undoB, neu, ton].forEach(function (b) { bar.appendChild(b); });
    $("askJa").addEventListener("click", function () { unlockAudio(); doNeues(); });
    $("askNein").addEventListener("click", function () { ask.hidden = true; });
    ask.addEventListener("click", function (e) { if (e.target === ask) ask.hidden = true; });
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { ask.hidden = true; return; }
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if ((e.key === "z" || e.key === "Z") && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      undo();
      return;
    }
    if (e.key === "ArrowLeft") { state.yaw -= 0.1; targetYaw = state.yaw; velYaw = 0; }
    else if (e.key === "ArrowRight") { state.yaw += 0.1; targetYaw = state.yaw; velYaw = 0; }
    else if (e.key === "ArrowUp") { state.pitch = clamp(state.pitch + 0.06, 0.18, 1.12); targetPitch = state.pitch; }
    else if (e.key === "ArrowDown") { state.pitch = clamp(state.pitch - 0.06, 0.18, 1.12); targetPitch = state.pitch; }
  });

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove);
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onUp);
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("pointerleave", function () { if (activeId === null) hover = null; });

  window.addEventListener("resize", resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  buildUI();
  load();
  setPressed();
  updateUndo();
  resize();
  requestAnimationFrame(frame);

  window.__haus = {
    state: state,
    get decals() { return decals; },
    get model() { return model; },
    pick: pick,
    project: project,
    visibleCount: function () {
      let n = 0;
      for (let i = 0; i < model.faces.length; i++) {
        const rn = rotNorm(model.faces[i].normal);
        if (rn.z > 0.04) n++;
      }
      return n;
    },
    setView: function (yaw, pitch) {
      state.yaw = yaw;
      state.pitch = pitch;
      targetYaw = yaw;
      targetPitch = pitch;
    },
    addCandy: function (face, kind, u, v, rot, col) {
      decals.push({ t: "candy", face: face, kind: kind, u: u, v: v, rot: rot || 0, col: col || null, born: 0 });
    },
    addIce: function (face, pts, color) {
      decals.push({ t: "ice", face: face, pts: pts, color: color || "weiss" });
    },
    addSnow: function (face, dots) {
      decals.push({ t: "snow", face: face, dots: dots });
    },
    setLit: function (v) { state.lit = !!v; discoveredLight = true; setPressed(); },
    setNight: function (v) { state.night = !!v; setPressed(); rebuildBg(); }
  };
})();
</script>
</body>
</html>
