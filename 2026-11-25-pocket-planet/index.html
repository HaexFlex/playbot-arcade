<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="description" content="Taschenplanet: ein kleiner Planet zum Drehen. Forme Land, Wasser, Klima und Leben.">
<title>Taschenplanet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23070b14' width='32' height='32' rx='7'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%233a7ec4'/%3E%3Cpath fill='%236ea84a' d='M8 15c2-4 6-6 10-5 1 2-1 4-3 5-3 1-5 1-7 0z'/%3E%3Ccircle cx='24' cy='8' r='2.2' fill='%23efe8d4'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bar-h: 76px; }
  html, body { margin: 0; height: 100%; background: #070b14; overflow: hidden; color: #e7eef6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  button { font: inherit; color: #e7eef6; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #f0d78c; outline-offset: 2px; }
  button.on { background: rgba(143,208,176,.22); border-color: rgba(184,236,206,.7); }
  button:disabled { opacity: .4; cursor: default; }
  #top { position: fixed; z-index: 4; left: max(12px, env(safe-area-inset-left)); top: max(10px, env(safe-area-inset-top));
    pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); max-width: calc(100vw - 92px); }
  #top b { display: block; font-size: 18px; font-weight: 680; letter-spacing: .01em; color: #f3e6c4; }
  #top span { display: block; margin-top: 1px; font-size: 13px; opacity: .8; }
  #bSound { position: fixed; z-index: 6; right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top));
    min-width: 44px; min-height: 44px; padding: 8px 12px; font-size: 15px; }
  #pass { position: fixed; z-index: 4; box-sizing: border-box; background: rgba(8,14,26,.82);
    border: 1px solid rgba(243,230,196,.22); border-radius: 14px; padding: 10px 12px 8px;
    backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,.28); overflow: auto; -webkit-overflow-scrolling: touch; }
  #pass header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  #pass header b { font-size: 15px; color: #f3e6c4; letter-spacing: .02em; }
  #pass header span, #pLife, #pKlima, #pName { font-size: 12.5px; opacity: .88; }
  #pName { margin-top: 2px; color: #d5ecff; }
  #pLife, #pKlima { margin-top: 2px; }
  #pBiomes { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  #pBiomes li { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: center; font-size: 12.5px; }
  #pBiomes i { width: 10px; height: 10px; border-radius: 3px; display: block; }
  #pBiomes .bar { grid-column: 2 / span 2; height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  #pBiomes .bar span { display: block; height: 100%; background: rgba(243,230,196,.55); }
  #hint { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--bar-h) + max(8px, env(safe-area-inset-bottom)));
    max-width: min(540px, calc(100vw - 16px)); text-align: center; font-size: 13.5px; line-height: 1.35;
    color: #d5e4f6; background: rgba(7,12,22,.55); border-radius: 10px; padding: 6px 10px; pointer-events: none; }
  #toast { position: fixed; z-index: 7; left: 50%; top: max(58px, calc(env(safe-area-inset-top) + 52px));
    transform: translateX(-50%); background: rgba(8,14,26,.92); border: 1px solid rgba(243,230,196,.35);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .35s; max-width: min(92vw, 460px); text-align: center; }
  #toast.show { opacity: 1; }
  #bar { position: fixed; z-index: 5; left: 50%; bottom: max(8px, env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px;
    width: max-content; max-width: calc(100vw - 12px); box-sizing: border-box; border-radius: 14px;
    background: rgba(7,12,22,.78); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); }
  #bar button { min-height: 44px; padding: 8px 10px; font-size: 14px; }
  #ask { position: fixed; z-index: 8; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(420px, calc(100vw - 24px)); box-sizing: border-box; background: rgba(8,14,26,.96);
    border: 1px solid rgba(243,230,196,.35); border-radius: 16px; padding: 16px; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  #ask[hidden] { display: none; }
  #ask p { margin: 0 0 8px; line-height: 1.4; }
  #ask .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #ask .row button { min-height: 44px; padding: 8px 12px; }
  @media (min-width: 760px) {
    #pass { left: max(12px, env(safe-area-inset-left)); top: max(56px, calc(env(safe-area-inset-top) + 48px));
      width: 250px; max-height: calc(100vh - 80px); }
  }
  @media (max-width: 759px) {
    #pass { left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
      top: calc(max(10px, env(safe-area-inset-top)) + 46px); width: auto; max-height: 32vh; }
    #top b { font-size: 16px; }
  }
  @media (max-height: 520px) {
    #hint { display: none; }
    #pass { max-height: calc(100vh - 16px); }
    #pBiomes .bar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #toast { transition: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Taschenplanet. Eine Kugel im All. Ziehen dreht sie, Werkzeuge formen Land und Leben."></canvas>
<div id="top"><b>Taschenplanet</b><span id="sub">ein kleiner Planet</span></div>
<button type="button" id="bSound" aria-pressed="false" aria-label="Ton ist aus" title="Ton an oder aus (M)">Ton</button>
<aside id="pass" aria-label="Planetenpass">
  <header><b>Planetenpass</b><span id="pAge">Alter: frisch</span></header>
  <div id="pName"></div>
  <div id="pLife">Leben: 0</div>
  <div id="pKlima">Klima: mild</div>
  <ul id="pBiomes"></ul>
</aside>
<div id="hint" role="status">Zieh die Kugel, oder wähle ein Werkzeug.</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ask" hidden role="dialog" aria-labelledby="askTitle">
  <p id="askTitle"><b>Neuen Planeten formen?</b></p>
  <p>Die jetzige Kugel geht verloren. Ein geteilter Link bleibt gültig.</p>
  <div class="row">
    <button type="button" id="askYes">Neu formen</button>
    <button type="button" id="askNo">Abbrechen</button>
  </div>
</div>
<div id="bar" role="toolbar" aria-label="Werkzeuge">
  <button type="button" data-tool="drehen" class="on" title="Drehen (1)">Drehen</button>
  <button type="button" data-tool="heben" title="Heben (2)">Heben</button>
  <button type="button" data-tool="senken" title="Senken (3)">Senken</button>
  <button type="button" data-tool="wasser" title="Wasser (4)">Wasser</button>
  <button type="button" data-tool="saat" title="Saat (5)">Saat</button>
  <button type="button" data-tool="wolke" title="Wolke (6)">Wolke</button>
  <button type="button" data-tool="dorf" title="Dorf (7)">Dorf</button>
  <button type="button" id="bWarm" title="Wärmer (+)">Wärmer</button>
  <button type="button" id="bCool" title="Kühler (-)">Kühler</button>
  <button type="button" id="bShare" title="Teilen (S)">Teilen</button>
  <button type="button" id="bNew" title="Neu (N)">Neu</button>
</div>
<script>
(function () {
  "use strict";
  const TAU = Math.PI * 2;
  const GW = 128;
  const GH = 64;
  const MASK = GW - 1;
  const N = GW * GH;
  const KEY = "playbot-pocket-planet-v1";
  const MAX_EDITS = 1800;
  const SUN = norm3(0.62, 0.28, 0.73);
  const BIOMES = [
    { id: "fels", name: "Fels", rgb: [141, 115, 100] },
    { id: "ozean", name: "Ozean", rgb: [30, 120, 200] },
    { id: "eis", name: "Eis", rgb: [220, 240, 250] },
    { id: "wueste", name: "Wüste", rgb: [214, 170, 86] },
    { id: "wiese", name: "Wiese", rgb: [124, 176, 70] },
    { id: "wald", name: "Wald", rgb: [28, 110, 58] }
  ];
  const NAMES = ["Kiesel", "Funke", "Tropfen", "Nebel", "Keim", "Hafen", "Garten", "Stein", "Licht", "Hügel", "Quelle", "Insel", "Bach", "Perle", "Staub", "Mond"];
  const HINTS = {
    drehen: "Zieh, um die Kugel zu drehen.",
    heben: "Zieh über die Kugel, um Berge zu heben.",
    senken: "Zieh, um Täler zu graben.",
    wasser: "Tippe und zieh. Wasser sammelt sich in den Tiefen.",
    saat: "Tippe auf mildes, feuchtes Land.",
    wolke: "Tippe, um eine Wolke zu setzen. Regen breitet Pflanzen aus.",
    dorf: "Tippe nahe bei Wasser und Wald."
  };
  const TOOL_CODE = { heben: 1, senken: 2, wasser: 3, saat: 4, wolke: 5, dorf: 6 };
  const CODE_TOOL = { 1: "heben", 2: "senken", 3: "wasser", 4: "saat", 5: "wolke", 6: "dorf" };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const elPass = document.getElementById("pass");
  const elBar = document.getElementById("bar");
  const elHint = document.getElementById("hint");
  const elToast = document.getElementById("toast");
  const elAge = document.getElementById("pAge");
  const elLife = document.getElementById("pLife");
  const elKlima = document.getElementById("pKlima");
  const elName = document.getElementById("pName");
  const elSub = document.getElementById("sub");
  const elSound = document.getElementById("bSound");
  const elAsk = document.getElementById("ask");
  const elBiomes = document.getElementById("pBiomes");

  const height = new Uint8Array(N);
  const water = new Uint16Array(N);
  const waterNext = new Uint16Array(N);
  const plant = new Uint8Array(N);
  const plantAdd = new Int16Array(N);
  const rain = new Uint8Array(N);
  const albedo = new Uint8Array(N * 3);
  const flags = new Uint8Array(N);
  const vmark = new Uint8Array(N);
  const tideRow = new Float32Array(GH);
  const tideCol = new Float32Array(GW);
  const rowW = new Float32Array(GH);
  const edits = [];
  const villages = [];
  const animals = [];
  const clouds = [];
  const drops = [];
  const pickForest = [];
  const pickOcean = [];
  const stars = [];
  const frameMs = [];

  const state = {
    seed: 1, temp: 56, age: 0, yaw: 0.55, pitch: 0.28,
    tool: "drehen", sound: null, moon: 1.15
  };
  let silent = false;
  let classDirty = true;
  let toastTimer = 0;
  let capTold = false;
  let saveTimer = 0;
  let lastHash = "";
  let growStep = 0;
  let idle = 0;
  let dpr = 1;
  let cssW = 1, cssH = 1, cx = 0, cy = 0, R = 100;
  let discN = 0, discNx, discNy, discNz, discOx, discOy, discDiam = 0;
  let off = null, octx = null, img = null, pix = null;
  let cYaw = 1, sYaw = 0, cPit = 1, sPit = 0;
  let moonOrbit = 1.5;
  let forestRaw = 0, oceanRaw = 0;
  const biomeW = [0, 0, 0, 0, 0, 0];
  const biomePct = [0, 0, 0, 0, 0, 0];
  let audio = null;
  let noteAt = 0;
  let noteI = 0;

  for (let row = 0; row < GH; row++) {
    const lat0 = (row / GH - 0.5) * Math.PI;
    const lat1 = ((row + 1) / GH - 0.5) * Math.PI;
    rowW[row] = Math.max(0.0001, Math.sin(lat1) - Math.sin(lat0));
    const lat = (row / (GH - 1) - 0.5) * Math.PI;
    tideRow[row] = Math.cos(lat);
  }

  BIOMES.forEach(function (b) {
    const li = document.createElement("li");
    li.innerHTML = '<i></i><span class="nm"></span><span class="pct"></span><span class="bar"><span></span></span>';
    li.querySelector("i").style.background = "rgb(" + b.rgb.join(",") + ")";
    li.querySelector(".nm").textContent = b.name;
    elBiomes.appendChild(li);
  });

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function norm3(x, y, z) {
    const m = Math.hypot(x, y, z) || 1;
    return { x: x / m, y: y / m, z: z / m };
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function fastAtan2(y, x) {
    const ax = Math.abs(x), ay = Math.abs(y);
    const a = Math.min(ax, ay) / (Math.max(ax, ay) + 1e-9);
    const s = a * a;
    let r = ((-0.0464964749 * s + 0.15931422) * s - 0.327622764) * s * a + a;
    if (ay > ax) r = 1.57079637 - r;
    if (x < 0) r = 3.14159274 - r;
    if (y < 0) r = -r;
    return r;
  }
  function planetName(seed) {
    return NAMES[seed % NAMES.length] + " " + ((seed % 89) + 11);
  }
  function toast(msg) {
    if (silent) return;
    elToast.textContent = msg;
    elToast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { elToast.classList.remove("show"); }, 2400);
  }
  function syncCam() {
    cYaw = Math.cos(state.yaw); sYaw = Math.sin(state.yaw);
    cPit = Math.cos(state.pitch); sPit = Math.sin(state.pitch);
  }
  function projectVec(wx, wy, wz) {
    const x1 = wx * cYaw - wz * sYaw;
    const z1 = wx * sYaw + wz * cYaw;
    const y2 = wy * cPit - z1 * sPit;
    const z2 = wy * sPit + z1 * cPit;
    return { x: x1, y: y2, z: z2 };
  }
  function viewToWorld(nx, ny, nz) {
    const wy = ny * cPit + nz * sPit;
    const z1 = nz * cPit - ny * sPit;
    const wx = nx * cYaw + z1 * sYaw;
    const wz = z1 * cYaw - nx * sYaw;
    return { wx: wx, wy: wy, wz: wz };
  }
  function cellOf(row, col) { return row * GW + (col & MASK); }
  function rowOf(i) { return (i / GW) | 0; }
  function colOf(i) { return i & MASK; }
  function latOfRow(row) { return (row / (GH - 1) - 0.5) * Math.PI; }
  function lonOfCol(col) { return ((col + 0.5) / GW) * TAU - Math.PI; }
  function cellLatLon(i) {
    const row = rowOf(i), col = colOf(i);
    return { row: row, col: col, lat: latOfRow(row), lon: lonOfCol(col) };
  }
  function latLonToCell(lat, lon) {
    let row = Math.round((lat / Math.PI + 0.5) * (GH - 1));
    row = clamp(row, 0, GH - 1);
    let col = Math.round(((lon + Math.PI) / TAU) * GW);
    col = ((col % GW) + GW) % GW;
    return { row: row, col: col, i: cellOf(row, col) };
  }
  function neighbor(i, dir) {
    const row = rowOf(i), col = colOf(i);
    if (dir === 0) return cellOf(row, col + 1);
    if (dir === 1) return cellOf(row, col - 1);
    if (dir === 2) return row > 0 ? i - GW : -1;
    return row < GH - 1 ? i + GW : -1;
  }
  function tempAt(i) {
    const row = rowOf(i);
    const latAbs = Math.abs(row / (GH - 1) - 0.5) * 2;
    const elev = height[i] / 255;
    return state.temp - latAbs * 48 - Math.max(0, elev - 0.52) * 26;
  }
  function syncTide() {
    const m = state.moon;
    for (let col = 0; col < GW; col++) tideCol[col] = Math.cos(lonOfCol(col) - m) * 6;
  }
  function tideOf(row, col) { return tideRow[row] * tideCol[col]; }
  function wetAt(i) {
    const row = rowOf(i), col = colOf(i);
    const tide = tideOf(row, col);
    if (water[i] > 0) {
      const damp = water[i] < 16 ? 1 : water[i] < 36 ? 0.4 : 0.15;
      return water[i] + tide * damp;
    }
    let best = 0;
    for (let d = 0; d < 4; d++) {
      const j = neighbor(i, d);
      if (j < 0 || water[j] < 3) continue;
      const flood = tide - (height[i] - (height[j] + water[j]));
      if (flood > best) best = flood;
    }
    return best;
  }

  function makeNoise(seed) {
    const rand = mulberry32(seed);
    const perm = new Uint8Array(512);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) {
      const j = (rand() * (i + 1)) | 0;
      const t = p[i]; p[i] = p[j]; p[j] = t;
    }
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function grad(hash, x, y, z) {
      const h = hash & 15;
      const u = h < 8 ? x : y;
      const v = h < 4 ? y : (h === 12 || h === 14) ? x : z;
      return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
    }
    function noise(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = perm[X] + Y, AA = perm[A] + Z, AB = perm[A + 1] + Z;
      const B = perm[X + 1] + Y, BA = perm[B] + Z, BB = perm[B + 1] + Z;
      return lerp(
        lerp(
          lerp(grad(perm[AA], x, y, z), grad(perm[BA], x - 1, y, z), u),
          lerp(grad(perm[AB], x, y - 1, z), grad(perm[BB], x - 1, y - 1, z), u), v),
        lerp(
          lerp(grad(perm[AA + 1], x, y, z - 1), grad(perm[BA + 1], x - 1, y, z - 1), u),
          lerp(grad(perm[AB + 1], x, y - 1, z - 1), grad(perm[BB + 1], x - 1, y - 1, z - 1), u), v),
        w);
    }
    return function fbm(x, y, z) {
      let n = 0, a = 1, f = 0.95, s = 0;
      for (let o = 0; o < 4; o++) {
        n += a * noise(x * f, y * f, z * f);
        s += a; a *= 0.5; f *= 2;
      }
      return n / s;
    };
  }
  function buildHeight(seed) {
    const fbm = makeNoise(seed >>> 0);
    let lo = 255, hi = 0;
    for (let row = 0; row < GH; row++) {
      const lat = latOfRow(row);
      const cl = Math.cos(lat), sl = Math.sin(lat);
      for (let col = 0; col < GW; col++) {
        const lon = lonOfCol(col);
        const x = cl * Math.sin(lon);
        const y = sl;
        const z = cl * Math.cos(lon);
        const n = fbm(x * 1.15 + 2.2, y * 1.15 + 1.4, z * 1.15 + 3.1);
        let h = 126 + n * 74 + Math.pow(Math.abs(sl), 1.45) * 38;
        h = clamp(h, 0, 255) | 0;
        height[row * GW + col] = h;
        if (h < lo) lo = h;
        if (h > hi) hi = h;
      }
    }
    state.heightSpan = [lo, hi];
  }
  function clearDynamic() {
    water.fill(0); plant.fill(0); rain.fill(0); vmark.fill(0);
    villages.length = 0; animals.length = 0; clouds.length = 0; drops.length = 0;
    edits.length = 0;
  }

  function pushEdit(code, row, col, radius, strength) {
    if (silent) return;
    if (edits.length / 4 >= MAX_EDITS) {
      if (!capTold) { capTold = true; toast("Die Kugel merkt sich nicht mehr jede Geste."); }
      return;
    }
    const param = ((radius & 15) << 4) | (strength & 15);
    edits.push(code & 255, row & 255, col & 255, param);
    scheduleSave();
  }
  function brush(kind, row, col, radius, strength, record) {
    radius = clamp(radius | 0, 0, 15);
    strength = clamp(strength | 0, 1, 15);
    const code = TOOL_CODE[kind];
    if (kind === "dorf") {
      if (tryVillage(row, col, false) && record) pushEdit(code, row, col, 0, 1);
      classDirty = true;
      return;
    }
    if (kind === "wolke") {
      applyCloud(row, col, radius || 8, record);
      classDirty = true;
      return;
    }
    const r2 = radius * radius || 0.01;
    let hostile = false;
    let planted = false;
    for (let dy = -radius; dy <= radius; dy++) {
      const rr = row + dy;
      if (rr < 0 || rr >= GH) continue;
      for (let dx = -radius; dx <= radius; dx++) {
        const d2 = dx * dx + dy * dy;
        if (d2 > r2) continue;
        const i = cellOf(rr, col + dx);
        const k = 1 - Math.sqrt(d2) / (radius + 0.001);
        if (kind === "heben") height[i] = clamp(Math.round(height[i] + strength * 1.45 * k), 0, 255);
