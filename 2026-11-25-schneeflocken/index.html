<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schneeflocken-Labor</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<meta name="description" content="Schneeflocken wachsen lassen. Temperatur und Feuchtigkeit, ein Nakaya-Diagramm, ein Regal für gefangene Flocken.">
<meta name="theme-color" content="#07111f">
<style>
html,body{margin:0;height:100%;background:#07111f;color:#e7f1ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
html{overflow:hidden}
body{overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;overflow:hidden}
#stage{position:relative;flex:1 1 auto;min-width:0;min-height:120px}
#c{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;z-index:2;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 12px 26px;background:linear-gradient(to bottom,rgba(6,14,28,.78),rgba(6,14,28,0));pointer-events:none}
h1{margin:0;font-family:Georgia,Palatino,"Iowan Old Style",serif;font-weight:600;font-size:22px;letter-spacing:.01em;color:#f4f8ff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
#status{margin:2px 0 0;font-size:13.5px;line-height:1.35;color:#c9daf3;text-shadow:0 1px 8px rgba(0,0,0,.55);max-width:100%}
#hint{position:absolute;z-index:2;left:50%;bottom:10px;transform:translateX(-50%);width:min(420px,90%);margin:0;text-align:center;pointer-events:none;color:#d5e4f8;text-shadow:0 2px 12px #000;font-size:15px;line-height:1.4;transition:opacity .6s}
#hint.gone,#hint[hidden]{opacity:0}
#foot{flex:0 1 auto;min-width:0;max-height:48%;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(8,18,36,.88);border-top:1px solid rgba(190,214,255,.2);box-sizing:border-box}
.slider{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;min-height:40px}
.slider label{flex:0 1 auto;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slider input{flex:1 1 0;min-width:0;width:0;height:36px;margin:0;background:transparent;-webkit-appearance:none;appearance:none}
.slider output{flex:0 0 74px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums;color:#d5e6fa}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:rgba(198,220,255,.38);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#f4f8ff;box-shadow:0 0 0 4px rgba(180,206,240,.28)}
input[type=range]::-moz-range-track{height:4px;background:rgba(198,220,255,.38);border:none;border-radius:99px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:none;border-radius:50%;background:#f4f8ff}
#tools{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-width:0}
button{font:inherit;color:#e8f1ff;background:rgba(232,241,255,.08);border:1px solid rgba(198,220,255,.38);border-radius:12px;min-height:40px;min-width:44px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid #d5e6ff;outline-offset:2px}
button[aria-pressed="true"],button.on{background:rgba(214,230,255,.24);border-color:rgba(234,244,255,.9)}
#chartBox{flex:1 1 240px;min-width:0;max-width:min(440px,100%)}
#nakaya{display:block;width:100%;height:118px;border-radius:10px;background:#0c1c33}
#chartCap{margin:4px 0 0;font-size:12.5px;color:#c5d8f2}
.legend{display:flex;flex-wrap:wrap;gap:3px 8px;margin:4px 0 0;padding:0;list-style:none;font-size:11px;color:#b7cceb}
.legend li{display:flex;align-items:center;gap:4px;white-space:nowrap}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.k-plate{background:#b9d0ea}.k-sector{background:#7eaddd}.k-dendrite{background:#f7fbff}.k-needle{background:#4d84c2}.k-column{background:#2a5c8c}
#shelfBox{flex:1 1 100%;min-width:0}
.lbl{margin:0 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#a9c3e0}
#empty{margin:0;font-size:13px;color:#b7cbeb}
#shelf{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.thumb{padding:4px;min-width:44px;min-height:44px;border-radius:12px}
.thumb canvas{display:block;width:48px;height:48px;border-radius:8px}
.thumb.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.86);opacity:.3}to{transform:none;opacity:1}}
#viewer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 6px}
#viewer[hidden]{display:none}
#viewerLabel{flex:1 1 140px;min-width:0;margin:0;font-size:13.5px;line-height:1.3}
@media (max-height:520px){
  #app{flex-direction:row}
  #foot{flex-direction:column;flex-wrap:nowrap;align-items:stretch;max-height:none;height:100%;width:min(300px,46vw);border-top:none;border-left:1px solid rgba(190,214,255,.2)}
  h1{font-size:18px}
  #hint{font-size:13px;bottom:6px}
  #nakaya{height:96px}
}
@media (max-width:380px){
  h1{font-size:18px}
  .slider output{flex-basis:64px}
}
@media (prefers-reduced-motion:reduce){
  #hint{transition:none}
  .thumb.pop{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Schneeflocke. Tippe in den Himmel, um einen Keim zu setzen."></canvas>
    <header id="top">
      <h1>Schneeflocken-Labor</h1>
      <p id="status" role="status" aria-live="polite"></p>
    </header>
    <p id="hint">Tippe in den Himmel, um einen Keim zu setzen. Temperatur und Feuchtigkeit bestimmen die Form.</p>
  </div>
  <section id="foot" aria-label="Steuerung">
    <div class="slider">
      <label for="temp">Temperatur</label>
      <input id="temp" type="range" min="-30" max="-1" step="0.5" value="-15" aria-label="Temperatur">
      <output id="tempOut" for="temp"></output>
    </div>
    <div class="slider">
      <label for="hum">Feuchtigkeit</label>
      <input id="hum" type="range" min="0" max="100" step="1" value="70" aria-label="Feuchtigkeit">
      <output id="humOut" for="hum"></output>
    </div>
    <div id="tools" role="toolbar" aria-label="Werkzeuge">
      <button id="bWind" type="button" aria-pressed="false" title="Leichte zufällige Variation">Wind</button>
      <button id="bCatch" type="button" title="Kristall ins Regal legen">Fangen</button>
      <button id="bNew" type="button" title="Neuen Keim vorbereiten">Neu</button>
      <button id="bTon" type="button" aria-pressed="false" title="Windspiel">Ton</button>
    </div>
    <div id="chartBox" role="img">
      <canvas id="nakaya" width="320" height="118" aria-hidden="true"></canvas>
      <p id="chartCap">Nakaya</p>
      <ul class="legend">
        <li><i class="k-plate"></i>Platten</li>
        <li><i class="k-sector"></i>Sektorplatten</li>
        <li><i class="k-dendrite"></i>Dendriten</li>
        <li><i class="k-needle"></i>Nadeln</li>
        <li><i class="k-column"></i>Säulen</li>
      </ul>
    </div>
    <div id="shelfBox">
      <div id="viewer" hidden>
        <p id="viewerLabel"></p>
        <button id="bBack" type="button">Zurück</button>
        <button id="bDrop" type="button">Weglegen</button>
      </div>
      <p class="lbl">Regal</p>
      <p id="empty">Noch nichts im Regal.</p>
      <div id="shelf"></div>
    </div>
  </section>
</div>
<script>
'use strict';
(function () {
  const R = 80;
  const SIZE = R * 2 + 1;
  const N = SIZE * SIZE;
  const SQ3 = Math.sqrt(3);
  const KEY = 'schneeflocken-labor-v1';
  const DQ = [1, 1, 0, -1, -1, 0];
  const DR = [0, -1, -1, 0, 1, 1];
  const SHAPE_NAME = {
    plate: 'Platten',
    sector: 'Sektorplatten',
    dendrite: 'Dendriten',
    needle: 'Nadeln',
    column: 'Säulen'
  };
  const REGION_COLOR = {
    plate: '#b9d0ea',
    sector: '#7eaddd',
    dendrite: '#f7fbff',
    needle: '#4d84c2',
    column: '#2a5c8c'
  };

  const idx = (q, r) => (r + R) * SIZE + (q + R);
  const hexDist = (q, r) => (Math.abs(q) + Math.abs(r) + Math.abs(-q - r)) / 2;

  const qOf = new Int16Array(N);
  const rOf = new Int16Array(N);
  const dist = new Uint16Array(N);
  const neigh = new Int32Array(N * 6);
  const align = new Float32Array(N);
  const axisD = new Float32Array(N);
  const cells = [];
  for (let r = -R; r <= R; r++) {
    for (let q = -R; q <= R; q++) {
      const i = idx(q, r);
      qOf[i] = q;
      rOf[i] = r;
      const d = hexDist(q, r);
      dist[i] = d;
      if (d <= R) {
        cells.push(i);
        const x = q + r * 0.5;
        const y = r * SQ3 * 0.5;
        const rad = Math.hypot(x, y);
        if (rad < 1e-6) {
          align[i] = 1;
          axisD[i] = 0;
        } else {
          let a = Math.atan2(y, x) % (Math.PI / 3);
          if (a < 0) a += Math.PI / 3;
          const from = Math.min(a, Math.PI / 3 - a);
          align[i] = 1 - from / (Math.PI / 6);
          axisD[i] = rad * Math.sin(from);
        }
      }
      for (let k = 0; k < 6; k++) {
        const nq = q + DQ[k];
        const nr = r + DR[k];
        neigh[i * 6 + k] = (Math.abs(nq) <= R && Math.abs(nr) <= R) ? idx(nq, nr) : -1;
      }
    }
  }

  function canon(q, r) {
    let bq = q, br = r, best = Infinity;
    for (let m = 0; m < 2; m++) {
      let x = q, y = r;
      if (m === 1) { x = q + r; y = -r; }
      for (let k = 0; k < 6; k++) {
        const key = (x + 512) * 4096 + (y + 512);
        if (key < best) { best = key; bq = x; br = y; }
        const nx = -y, ny = x + y;
        x = nx; y = ny;
      }
    }
    return (bq + 512) * 4096 + (br + 512);
  }
  function hash(n, seed) {
    let h = (seed | 0) ^ Math.imul(n, 374761393);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967295;
  }

  const ice = new Uint8Array(N);
  const age = new Uint16Array(N);
  const vap = new Float32Array(N);
  const nxt = new Float32Array(N);
  const rec = new Uint8Array(N);
  const noise = new Float32Array(N);
  const viewIce = new Uint8Array(N);
  const viewAge = new Uint16Array(N);
  const tmpIce = new Uint8Array(N);
  let iceList = [];
  let viewList = [];
  let thumbList = [];
  let maxR = 0;
  let geoR = 0;
  let plateFront = 1;
  let plateBase = 0;
  let dendroBank = 0;
  let ageClock = 1;
  let columnRing = false;
  let seeded = false;
  let finished = false;
  let finishedAnn = false;
  let viewing = null;
  let viewMax = 1;
  let windOn = false;
  let tonOn = false;
  let caughtThis = false;
  let armClear = false;
  let armTimer = 0;
  let noiseSeed = 1;
  let bank = 0;
  let lastShape = null;
  let dirty = true;
  let toastUntil = 0;
  let toastText = '';
  let seq = 1;
  let shelf = [];

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const crystal = document.createElement('canvas');
  const cctx = crystal.getContext('2d', { alpha: true });
  const bg = document.createElement('canvas');
  const bctx = bg.getContext('2d', { alpha: false });
  const hint = document.getElementById('hint');
  const statusEl = document.getElementById('status');
  const tempEl = document.getElementById('temp');
  const humEl = document.getElementById('hum');
  const tempOut = document.getElementById('tempOut');
  const humOut = document.getElementById('humOut');
  const bWind = document.getElementById('bWind');
  const bCatch = document.getElementById('bCatch');
  const bNew = document.getElementById('bNew');
  const bTon = document.getElementById('bTon');
  const nakaya = document.getElementById('nakaya');
  const nctx = nakaya.getContext('2d');
  const chartBox = document.getElementById('chartBox');
  const chartCap = document.getElementById('chartCap');
  const shelfEl = document.getElementById('shelf');
  const emptyEl = document.getElementById('empty');
  const viewerEl = document.getElementById('viewer');
  const viewerLabel = document.getElementById('viewerLabel');
  const bBack = document.getElementById('bBack');
  const bDrop = document.getElementById('bDrop');

  let viewW = 0, viewH = 0, dpr = 1, scale = 2, bScale = 3, origin = 0;
  let stamp = new Int16Array(0);
  let img = null;
  let motes = [];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frameSamples = [];

  function readTemp() { return parseFloat(tempEl.value); }
  function readHum() { return parseFloat(humEl.value) / 100; }
  function fmtTemp(v) {
    const a = Math.abs(Math.round(v * 10) / 10);
    const s = Number.isInteger(a) ? String(a) : a.toFixed(1);
    return '\u2212' + s + ' \u00b0C';
  }
  function region(tempC, hum) {
    const t = -tempC;
    const h = hum;
    if (t < 3.4) return h > 0.66 ? 'sector' : 'plate';
    if (t < 8.0) return h > 0.4 ? 'needle' : 'column';
    if (t < 10.6) return h > 0.58 ? 'sector' : h > 0.32 ? 'plate' : 'column';
    if (t < 13.2) return h > 0.62 ? 'dendrite' : h > 0.34 ? 'sector' : 'plate';
    if (t < 17.4) return h > 0.42 ? 'dendrite' : 'plate';
    if (t < 21.2) return h > 0.72 ? 'dendrite' : h > 0.4 ? 'sector' : 'plate';
    if (h < 0.38 || h > 0.74) return 'column';
    return 'plate';
  }
  function shapeNow() { return region(readTemp(), readHum()); }
  function labelOf(item) {
    return SHAPE_NAME[item.shape] + ' \u00b7 ' + fmtTemp(item.temp) + ' \u00b7 ' + item.hum + '%';
  }

  function nIce(i, src) {
    const b = i * 6;
    let n = 0;
    for (let k = 0; k < 6; k++) {
      const j = neigh[b + k];
      if (j >= 0 && src[j]) n++;
    }
    return n;
  }
  function freeze(i) {
    if (ice[i]) return;
    ice[i] = 1;
    age[i] = ageClock;
    vap[i] = 1;
    if (dist[i] > maxR) maxR = dist[i];
    iceList.push(i);
    dirty = true;
  }
  function buildNoise() {
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      noise[i] = hash(canon(qOf[i], rOf[i]), noiseSeed);
    }
  }
  function dParams() {
    let h = readHum();
    if (windOn) h = Math.min(1, Math.max(0, h + Math.sin(performance.now() / 1400) * 0.05));
    return {
      beta: 0.40 + h * 0.24,
      gamma: 0.0005 + h * 0.0012,
      amp: windOn ? 0.18 : 0.07
    };
  }
  function resetVapor() {
    const beta = dParams().beta;
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      if (!ice[i]) vap[i] = beta;
    }
  }
  function noteShape(shape) {
    if (shape === lastShape) return;
    if (lastShape !== null && maxR < R - 3) finished = false;
    if (lastShape !== null && shape === 'dendrite' && seeded) resetVapor();
    if (shape === 'column' && maxR < 3) columnRing = false;
    if (shape === 'plate' && lastShape !== null && lastShape !== 'plate') {
      plateBase = Math.max(1, maxR - 1);
      if (plateFront < maxR) plateFront = maxR;
    }
    lastShape = shape;
  }

  function reiterStep() {
    const p = dParams();
    const lim = Math.min(R - 1, maxR + 12);
    rec.fill(0);
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      if (dist[i] > lim) continue;
      if (ice[i]) { rec[i] = 1; continue; }
      const b = i * 6;
      for (let k = 0; k < 6; k++) {
        const j = neigh[b + k];
        if (j >= 0 && ice[j]) { rec[i] = 1; break; }
      }
    }
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      if (dist[i] > lim) { nxt[i] = p.beta; continue; }
      let sum = rec[i] ? 0 : vap[i];
      const b = i * 6;
      for (let k = 0; k < 6; k++) {
        const j = neigh[b + k];
        if (j < 0 || dist[j] > lim) sum += p.beta;
        else if (rec[j]) sum += 0;
        else sum += vap[j];
      }
      nxt[i] = sum / 7;
    }
    const batch = [];
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      if (dist[i] > lim || dist[i] >= R - 1) { if (!ice[i]) vap[i] = p.beta; continue; }
      if (ice[i]) continue;
      const v = rec[i] ? vap[i] + p.gamma + nxt[i] : nxt[i];
      vap[i] = v > 2.4 ? 2.4 : v;
      if (!rec[i]) continue;
      const need = 1 + (noise[i] - 0.5) * 2 * p.amp;
      if (vap[i] >= need && nIce(i, ice) >= 1) batch.push(i);
    }
    for (let n = 0; n < batch.length; n++) freeze(batch[n]);
    if (maxR >= R - 2) finished = true;
  }

  function fillRing(radius, test) {
    let guard = 0;
    let added = true;
    while (added && guard++ < 10) {
      const batch = [];
      for (let n = 0; n < cells.length; n++) {
        const i = cells[n];
        if (ice[i] || dist[i] !== radius || dist[i] >= R - 1) continue;
        if (!test(i)) continue;
        if (radius <= 1 || nIce(i, ice) >= 1) batch.push(i);
      }
      added = batch.length > 0;
      for (let n = 0; n < batch.length; n++) freeze(batch[n]);
    }
  }
  function sectorCut() { return 0.30 + (1 - readHum()) * 0.22; }
  function needleWidth() { return 0.72 + readHum() * 1.35; }
  function wobble(i) { return (noise[i] - 0.5) * (windOn ? 0.16 : 0.05); }
  function columnOuter() { return Math.min(R - 2, Math.round(14 + readHum() * 18)); }
  function columnInner() { return 6; }

  function plateTick() {
    // Fill every kink inside the current radius before the front may advance.
    // That keeps a hexagon. Tips are not allowed to run ahead of the flats.
    const cap = Math.min(R - 2, plateFront);
    const batch = [];
    for (let n = 0; n < cells.length; n++) {
      const i = cells[n];
      if (ice[i]) continue;
      const d = dist[i];
      if (d > cap) continue;
      if (plateBase && d < plateBase) continue;
      if (d <= 1 || nIce(i, ice) >= 2) batch.push(i);
    }
    if (batch.length) {
      for (let n = 0; n < batch.length; n++) freeze(batch[n]);
      return;
    }
    if (plateFront < R - 2) plateFront++;
    else finished = true;
  }
  function columnTick() {
    const outer = columnOuter();
    const inner = columnInner();
    if (!columnRing) {
      for (let n = 0; n < cells.length; n++) {
        const i = cells[n];
        const d = dist[i];
        if (d <= 1 || d === inner) freeze(i);
      }
      columnRing = true;
      geoR = maxR;
      return;
    }
    if (maxR >= outer || maxR >= R - 2) { finished = true; return; }
    fillRing(maxR + 1, function (i) { return dist[i] <= outer; });
    if (maxR >= outer) finished = true;
  }
  function geoTick() {
    const shape = shapeNow();
    noteShape(shape);
    ageClock++;
    if (shape === 'plate') { plateTick(); return; }
    if (shape === 'column') { columnTick(); return; }
    if (geoR < maxR) geoR = maxR;
    if (geoR >= R - 2) { finished = true; return; }
    geoR++;
    if (shape === 'needle') {
      fillRing(geoR, function (i) {
        const w = needleWidth() + (noise[i] - 0.5) * (windOn ? 0.45 : 0.12);
        if (axisD[i] <= w) return true;
        return windOn && noise[i] > 0.94 && dist[i] % 5 === 0 && axisD[i] <= w + 1.5;
      });
    } else {
      const cut = sectorCut();
      fillRing(geoR, function (i) { return align[i] + wobble(i) > cut; });
    }
    if (geoR >= R - 2) finished = true;
  }
  function rateOf(shape) {
    const h = readHum();
    const wob = windOn ? 1 + Math.sin(performance.now() / 1400) * 0.18 : 1;
    let base = 7 + h * 4;
    if (shape === 'needle') base = 8 + h * 4;
    else if (shape === 'sector') base = 6 + h * 4;
    else if (shape === 'column') base = 4 + h * 2;
    return base * wob;
  }

  function resetLive() {
    ice.fill(0);
    age.fill(0);
    vap.fill(0);
    iceList = [];
    maxR = 0;
    geoR = 0;
    plateFront = 1;
    plateBase = 0;
    dendroBank = 0;
    ageClock = 1;
    columnRing = false;
    seeded = false;
    finished = false;
    finishedAnn = false;
    caughtThis = false;
    armClear = false;
    bank = 0;
    lastShape = null;
    dirty = true;
    noiseSeed = (Math.random() * 0x7fffffff) | 0;
    buildNoise();
  }
  function seed() {
    clearToast();
    if (viewing) exitView();
    resetLive();
    seeded = true;
    const p = dParams();
    for (let n = 0; n < cells.length; n++) vap[cells[n]] = p.beta;
    buildNoise();
    freeze(idx(0, 0));
    lastShape = shapeNow();
    if (lastShape === 'dendrite') {
      for (let k = 0; k < 28; k++) { ageClock++; reiterStep(); }
    } else {

  function pack(src) {

      const byte = bin.charCodeAt(bi);

  requestAnimationFrame(frame);

  window.__lab = {
    R: R,
    seed: seed,
    reset: clearCrystal,
    set: function (t, h) { tempEl.value = String(t); humEl.value = String(h); onSliders(); },
    wind: function (on) { windOn = !!on; syncWind(); },
    tick: function (n) {
      for (let k = 0; k < n; k++) {
        const shape = shapeNow();
        noteShape(shape);
        if (finished) break;
        if (shape === 'dendrite') { ageClock++; reiterStep(); }
        else geoTick();
      }
      dirty = true;
    },
    catch: catchFlake,
    stats: function () {
      const arr = frameSamples.slice().sort(function (a, b) { return a - b; });
      const mid = arr.length ? arr[(arr.length / 2) | 0] : 0;
      return {
        ice: iceList.length,
        maxR: maxR,
        shape: shapeNow(),
        finished: finished,
        seeded: seeded,
        viewing: !!viewing,
        shelf: shelf.length,
        medianMs: mid,
        wind: windOn,
        ton: tonOn
      };
    }
  };
})();
</script>
