<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Modelleisenbahn</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    color: #3a2a1c;
    background: #e7d3ae;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 100%;
    overflow: hidden;
  }
  #top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 12px;
    padding: 6px 10px 4px;
    background: #f6efe2;
    border-bottom: 1px solid #e2d3ba;
    max-width: 100%;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-size: 17px;
    line-height: 1.2;
    margin: 0;
    font-weight: 700;
  }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .stats div { display: flex; gap: 6px; align-items: baseline; }
  .stats em { font-style: normal; font-size: 12px; color: #7a624c; }
  .stats b { font-variant-numeric: tabular-nums; font-size: 15px; }
  #hint {
    flex-basis: 100%;
    margin: 0;
    font-size: 12px;
    line-height: 1.35;
    color: #6d5640;
    overflow-wrap: anywhere;
  }
  #view { flex: 1; min-height: 120px; position: relative; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #toast {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    background: rgba(48, 32, 20, 0.92);
    color: #fffaf3;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    max-width: calc(100% - 24px);
    text-align: center;
  }
  #toast.on { opacity: 1; }
  #tools {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px;
    background: #f3e7d2;
    border-top: 1px solid #e2d3ba;
    max-width: 100%;
    max-height: 42vh;
    overflow-x: hidden;
    overflow-y: auto;
  }
  button {
    min-width: 36px;
    min-height: 36px;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid #d9c7a6;
    background: #fffaf3;
    color: #3a2a1c;
    font: 600 14px/1.2 "Avenir Next", "Segoe UI", system-ui, sans-serif;
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  button.active { background: #2f5d3a; color: #fffaf3; border-color: #244a2e; }
  button:focus-visible { outline: 2px solid #2f5d3a; outline-offset: 1px; }
  #exbar, #ask {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    flex-basis: 100%;
    align-items: center;
  }
  #exbar[hidden], #ask[hidden] { display: none; }
  #exbar span, #ask span { font-size: 13px; padding: 0 4px; }
  @media (max-height: 430px) {
    #hint { display: none; }
    #top { padding: 3px 8px; }
    h1 { font-size: 15px; }
    #tools { max-height: 38vh; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <h1>Modelleisenbahn</h1>
    <div class="stats">
      <div><em>Uhr</em> <b id="clk">06:00</b></div>
      <div><em>Fahrgäste</em> <b id="pax">0</b></div>
      <div><em>Pünktlichkeit</em> <b id="pun">100%</b></div>
    </div>
    <p id="hint">Ziehen legt Gleise. Eine Weiche antippen stellt sie. Zeiger verschiebt die Ansicht, das Mausrad zoomt.</p>
  </header>
  <div id="view">
    <canvas id="c"></canvas>
    <div id="toast" role="status"></div>
  </div>
  <div id="tools" role="toolbar" aria-label="Werkzeuge">
    <button type="button" data-tool="zeiger">Zeiger</button>
    <button type="button" data-tool="gerade">Gerade</button>
    <button type="button" data-tool="kurve">Kurve</button>
    <button type="button" data-tool="weiche">Weiche</button>
    <button type="button" data-tool="kreuz">Kreuzung</button>
    <button type="button" data-tool="prell">Prellbock</button>
    <button type="button" data-tool="bahnhof">Bahnhof</button>
    <button type="button" data-tool="tunnel">Tunnel</button>
    <button type="button" data-tool="bruecke">Brücke</button>
    <button type="button" data-tool="regional">Regional</button>
    <button type="button" data-tool="steam">Dampf</button>
    <button type="button" data-tool="freight">Güter</button>
    <button type="button" data-tool="haus">Haus</button>
    <button type="button" data-tool="baum">Baum</button>
    <button type="button" data-tool="kuh">Kuh</button>
    <button type="button" data-tool="see">See</button>
    <button type="button" id="btn-rot">Drehen</button>
    <button type="button" data-tool="weg">Weg</button>
    <button type="button" id="btn-pause">Halt</button>
    <button type="button" id="btn-ex">Beispiele</button>
    <button type="button" id="btn-share">Teilen</button>
    <button type="button" id="btn-clear">Leeren</button>
    <button type="button" id="btn-sound" aria-pressed="false">Ton</button>
    <button type="button" id="btn-day">Tag</button>
    <button type="button" id="btn-in" aria-label="Näher">+</button>
    <button type="button" id="btn-out" aria-label="Weiter">−</button>
    <button type="button" id="btn-fit">Passend</button>
    <div id="exbar" hidden>
      <span>Beispiel</span>
      <button type="button" data-ex="kreis">Kreis</button>
      <button type="button" data-ex="achter">Achterbahn</button>
      <button type="button" data-ex="berg">Bergstrecke</button>
      <button type="button" id="ex-zu">Zu</button>
    </div>
    <div id="ask" hidden>
      <span>Tabelle leeren?</span>
      <button type="button" id="ask-ja">Ja</button>
      <button type="button" id="ask-nein">Nein</button>
    </div>
  </div>
</div>
<script>
'use strict';
const GW = 18, GH = 13;
const SHEAR = 0.15, YSQ = 0.93;
const DX = [0, 1, 0, -1];
const DY = [-1, 0, 1, 0];
const OPP = [2, 3, 0, 1];
const PORT = [
  {x: 0.5, y: 0},
  {x: 1, y: 0.5},
  {x: 0.5, y: 1},
  {x: 0, y: 0.5}
];
const TRACK = {gerade:1, kurve:1, weiche:1, kreuz:1, prell:1, bahnhof:1, tunnel:1, bruecke:1};
const TRAINS = {regional:1, steam:1, freight:1};
const DECOS = {haus:1, baum:1, kuh:1};
const UNITS = {
  regional: [
    {len: 0.64, role: 'regioLoco'},
    {len: 0.56, role: 'regio'},
    {len: 0.56, role: 'regio'}
  ],
  steam: [
    {len: 0.70, role: 'steam'},
    {len: 0.44, role: 'tender'},
    {len: 0.56, role: 'coach'},
    {len: 0.56, role: 'coach'}
  ],
  freight: [
    {len: 0.62, role: 'diesel'},
    {len: 0.50, role: 'box'},
    {len: 0.50, role: 'box'},
    {len: 0.48, role: 'tank'}
  ]
};
const CRUISE = {regional: 1.22, steam: 0.92, freight: 1.02};
const CAP = {regional: 36, steam: 24, freight: 2};
const STORE = 'modelleisenbahn-v1';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const elClk = document.getElementById('clk');
const elPax = document.getElementById('pax');
const elPun = document.getElementById('pun');
const toastEl = document.getElementById('toast');

const cells = new Map();
let trains = [];
let cows = [];
let parts = [];
let nextId = 1;
let tool = 'zeiger';
let rot = 0;
let hand = 0;
let weicheIx = 0;
let cam = {x: 9, y: 6, z: 48};
let paused = false;
let soundOn = false;
let dayMode = 'tag';
let tod = 0.15;
let modelMin = 6 * 60;
let paxN = 0, onN = 0, lateN = 0;
let collisions = 0, derailments = 0, signalHolds = 0;
let lastCol = '';
const occ = new Map();
let hover = null;
let saveTimer = 0;
let fast = false;
let layoutError = '';
let clockAcc = 0;
let audio = null;
let noiseBuf = null;
let toastTimer = 0;
let frameN = 0, frameMs = 0, frameMax = 0;
const pointers = new Map();
let gesture = null;

function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function key(x, y) { return x + ',' + y; }
function at(x, y) { return cells.get(key(x, y)) || null; }
function ensure(x, y) {
  let c = cells.get(key(x, y));
  if (!c) {
    c = {x, y, k: null, rot: 0, hand: 0, sw: 0, g: null, d: null, drot: 0, wait: 0, name: ''};
    cells.set(key(x, y), c);
  }
  return c;
}
function consistLength(type) {
  const u = UNITS[type];
  let d = 0;
  for (let i = 0; i < u.length; i++) {
    d += u[i].len;
    if (i < u.length - 1) d += 0.06;
  }
  return d;
}
function rotDir(d, r) { return (d + r) & 3; }
function arcCenter(a, b) {
  const lo = Math.min(a, b), hi = Math.max(a, b);
  if (lo === 0 && hi === 1) return {x: 1, y: 0};
  if (lo === 1 && hi === 2) return {x: 1, y: 1};
  if (lo === 2 && hi === 3) return {x: 0, y: 1};
  return {x: 0, y: 0};
}
function angNorm(d) {
  while (d > Math.PI) d -= Math.PI * 2;
  while (d <= -Math.PI) d += Math.PI * 2;
  return d;
}
function pointOn(entry, exit, arc, stub, t) {
  if (stub || exit == null) {
    const p = PORT[entry];
    const span = 0.84;
    return {
      x: p.x + (0.5 - p.x) * span * t,
      y: p.y + (0.5 - p.y) * span * t,
      ang: Math.atan2(0.5 - p.y, 0.5 - p.x)
    };
  }
  if (!arc) {
    const p = PORT[entry], q = PORT[exit];
    return {
      x: p.x + (q.x - p.x) * t,
      y: p.y + (q.y - p.y) * t,
      ang: Math.atan2(q.y - p.y, q.x - p.x)
    };
  }
  const c = arcCenter(entry, exit);
  const p = PORT[entry], q = PORT[exit];
  const a0 = Math.atan2(p.y - c.y, p.x - c.x);
  const a1 = Math.atan2(q.y - c.y, q.x - c.x);
  const sweep = angNorm(a1 - a0);
  const a = a0 + sweep * t;
  return {
    x: c.x + 0.5 * Math.cos(a),
    y: c.y + 0.5 * Math.sin(a),
    ang: sweep >= 0 ? a + Math.PI / 2 : a - Math.PI / 2
  };
}
function logicalPaths(cell) {
  const r = cell.rot | 0;
  const R = (d) => rotDir(d, r);
  if (cell.k === 'gerade' || cell.k === 'bahnhof' || cell.k === 'tunnel' || cell.k === 'bruecke') {
    return [{a: R(3), b: R(1), arc: false}];
  }
  if (cell.k === 'kurve') return [{a: R(0), b: R(1), arc: true}];
  if (cell.k === 'kreuz') return [{a: 0, b: 2, arc: false}, {a: 1, b: 3, arc: false}];
  if (cell.k === 'prell') return [{a: R(3), b: null, arc: false, stub: true}];
  if (cell.k === 'weiche') {
    const common = R(3), straight = R(1), branch = R(cell.hand ? 2 : 0);
    if (cell.sw) return [{a: common, b: branch, arc: true}];
    return [{a: common, b: straight, arc: false}];
  }
  return [];
}
function bothSwitch(cell) {
  const r = cell.rot | 0;
  const R = (d) => rotDir(d, r);
  const common = R(3), straight = R(1), branch = R(cell.hand ? 2 : 0);
  return [
    {a: common, b: straight, arc: false, active: !cell.sw},
    {a: common, b: branch, arc: true, active: !!cell.sw}
  ];
}
function resolve(cell, entry, doFlip) {
  if (!cell || !cell.k) return null;
  let paths = logicalPaths(cell);
  let p = paths.find((q) => q.a === entry || q.b === entry);
  if (!p && doFlip && cell.k === 'weiche') {
    const saved = cell.sw;
    cell.sw = saved ? 0 : 1;
    paths = logicalPaths(cell);
    p = paths.find((q) => q.a === entry || q.b === entry);
    if (!p) cell.sw = saved;
  }
  if (!p) return null;
  const exit = p.a === entry ? p.b : p.a;
  const stub = exit == null;
  const arc = !!p.arc && !stub;
  const len = stub ? 0.42 : (arc ? Math.PI / 4 : 1);
  return {entry, exit, arc, stub, len};
}
function canConnect(cell, entry, doFlip) {
  if (!cell || !cell.k) return false;
  if (resolve(cell, entry, false)) return true;
  if (cell.k !== 'weiche') return false;
  const saved = cell.sw;
  cell.sw = saved ? 0 : 1;
  const ok = !!resolve(cell, entry, false);
  if (!ok || !doFlip) cell.sw = saved;
  return ok;
}
function moveBy(start, dir0, dist, opts) {
  const o = opts || {};
  let loc = {tx: start.tx, ty: start.ty, entry: start.entry | 0, s: start.s};
  let dir = dir0 >= 0 ? 1 : -1;
  let consumed = 0;
  if (!(dist > 0)) return {loc, dir, consumed, ok: true};
  for (let guard = 0; guard < 28 && dist > 1e-7; guard++) {
    const cell = at(loc.tx, loc.ty);
    const path = cell && resolve(cell, loc.entry, false);
    if (!path) return {loc, dir, consumed, derail: true, stopped: true, ok: false};
    if (loc.s < 0) loc.s = 0;
    if (loc.s > path.len) loc.s = path.len;
    if (dir > 0) {
      const room = path.len - loc.s;
      if (dist <= room + 1e-8) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: loc.s + dist};
        consumed += dist;
        return {loc, dir, consumed, ok: true};
      }
      if (path.exit == null) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: path.len};
        consumed += Math.max(0, room);
        return {loc, dir, consumed, buffer: true, stopped: true, ok: false};
      }
      const nx = loc.tx + DX[path.exit];
      const ny = loc.ty + DY[path.exit];
      const nb = at(nx, ny);
      const nentry = OPP[path.exit];
      if (!canConnect(nb, nentry, false)) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: path.len};
        consumed += Math.max(0, room);
        return {loc, dir, consumed, derail: true, stopped: true, ok: false};
      }
      if (o.stopAt && o.stopAt(nx, ny)) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: path.len};
        consumed += Math.max(0, room);
        return {loc, dir, consumed, blocked: true, ok: false};
      }
      if (o.flip) canConnect(nb, nentry, true);
      dist -= room;
      consumed += Math.max(0, room);
      loc = {tx: nx, ty: ny, entry: nentry, s: 0};
      dir = 1;
    } else {
      const room = loc.s;
      if (dist <= room + 1e-8) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: loc.s - dist};
        consumed += dist;
        return {loc, dir, consumed, ok: true};
      }
      const nx = loc.tx + DX[loc.entry];
      const ny = loc.ty + DY[loc.entry];
      const nb = at(nx, ny);
      const nentry = OPP[loc.entry];
      if (!canConnect(nb, nentry, false)) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: 0};
        consumed += Math.max(0, room);
        return {loc, dir, consumed, derail: true, stopped: true, ok: false};
      }
      if (o.stopAt && o.stopAt(nx, ny)) {
        loc = {tx: loc.tx, ty: loc.ty, entry: loc.entry, s: 0};
        consumed += Math.max(0, room);
        return {loc, dir, consumed, blocked: true, ok: false};
      }
      if (o.flip) canConnect(nb, nentry, true);
      dist -= room;
      consumed += Math.max(0, room);
      loc = {tx: nx, ty: ny, entry: nentry, s: 0};
      dir = 1;
    }
  }
  return {loc, dir, consumed, ok: true};
}

function tilesOf(t) {
  const set = new Set();
  const len = consistLength(t.type);
  const n = Math.max(1, Math.ceil(len / 0.16));
  for (let i = 0; i <= n; i++) {
    const d = Math.min(len, (len * i) / n);
    const r = moveBy(t.loc, -t.dir, d, {soft: true});
    set.add(key(r.loc.tx, r.loc.ty));
    if (r.derail || r.buffer || r.stopped) break;
  }
  return set;
}
function rebuildOcc() {
  occ.clear();
  for (const t of trains) {
    if (t.dead) { t.tiles = new Set(); continue; }
    t.tiles = tilesOf(t);
    for (const k of t.tiles) {
      let s = occ.get(k);
      if (!s) { s = new Set(); occ.set(k, s); }
      s.add(t.id);
    }
  }
}
function tileBlocked(t, x, y) {
  const s = occ.get(key(x, y));
  if (!s) return false;
  for (const id of s) if (id !== t.id) return true;
  return false;
}
function trainOn(x, y) {
  const s = occ.get(key(x, y));
  return !!(s && s.size);
}

function addTrain(type, tx, ty, entry, s, dir) {
  const cell = at(tx, ty);
  const path = cell && resolve(cell, entry, false);
  if (!path) return null;
  const ss = clamp(s, 0.02, Math.max(0.02, path.len - 0.02));
  const t = {
    id: nextId++,
    type,
    loc: {tx, ty, entry, s: ss},
    dir: dir >= 0 ? 1 : -1,
    speed: CRUISE[type] * 0.65,
    state: 'run',
    dwell: 0,
    bufT: 0,
    served: cell.k === 'bahnhof' ? key(tx, ty) : null,
    redTime: 0,
    pax: 0,
    paxDone: false,
    odo: 0,
    snd: 0,
    dead: false,
    reason: '',
    tiles: new Set(),
    people: []
  };
  trains.push(t);
  return t;
}
function wouldOverlap(loc, dir, type) {
  const ghost = {id: -1, type, loc, dir, dead: false};
  const tiles = tilesOf(ghost);
  for (const k of tiles) {
    const s = occ.get(k);
    if (s && s.size) return true;
  }
  return false;
}
function spawnAt(type, x, y) {
  const cell = at(x, y);
  if (!cell || !cell.k) { toast('Zuerst ein Gleis legen'); return; }
  if (trains.length >= 6) { toast('Höchstens sechs Züge'); return; }
  rebuildOcc();
  const seen = new Set();
  const paths = cell.k === 'weiche' ? bothSwitch(cell) : logicalPaths(cell);
  const entries = [];
  for (const p of paths) {
    if (p.a != null) entries.push(p.a);
    if (p.b != null) entries.push(p.b);
  }
  for (const entry of entries) {
    if (seen.has(entry)) continue;
    seen.add(entry);
    const path = resolve(cell, entry, false);
    if (!path) continue;
    const loc = {tx: x, ty: y, entry, s: path.len * 0.42};
    const back = moveBy(loc, -1, consistLength(type), {soft: true});
    const fwd = moveBy(loc, 1, 0.35, {soft: true});
    if (back.derail || back.stopped || fwd.derail) continue;
    if (wouldOverlap(loc, 1, type)) continue;
    addTrain(type, x, y, entry, loc.s, 1);
    rebuildOcc();
    toast(type === 'steam' ? 'Dampfzug' : type === 'freight' ? 'Güterzug' : 'Regionalzug');
    return;
  }
  toast('Zu wenig Gleis für den Zug');
}

function peekNext(t) {
  const cell = at(t.loc.tx, t.loc.ty);
  const path = cell && resolve(cell, t.loc.entry, false);
  if (!path) return null;
  if (t.dir > 0) {
    if (path.exit == null) return {buffer: true, room: path.len - t.loc.s, path};
    const x = t.loc.tx + DX[path.exit], y = t.loc.ty + DY[path.exit];
    const nb = at(x, y);
    return {x, y, k: nb && nb.k, key: key(x, y), room: path.len - t.loc.s, path, buffer: false};
  }
  const x = t.loc.tx + DX[t.loc.entry], y = t.loc.ty + DY[t.loc.entry];
  const nb = at(x, y);
  return {x, y, k: nb && nb.k, key: key(x, y), room: t.loc.s, path, buffer: false};
}
function exchange(t, cell) {
  if (t.type === 'freight') return;
  const cap = CAP[t.type];
  const alight = Math.min(t.pax, 1 + ((t.id + (paxN | 0)) % 3));
  t.pax -= alight;
  const room = cap - t.pax;
  const board = Math.min(room, Math.floor(cell.wait));
  if (board > 0) {
    cell.wait -= board;
    t.pax += board;
    paxN += board;
  }
  t.people = [];
  const n = Math.min(5, board + alight);
  for (let i = 0; i < n; i++) t.people.push({u: i / n, life: 0.9});
}
function updateTrain(t, dt) {
  if (t.dead) return;
  if (t.state === 'dwell') {
    t.speed = 0;
    t.dwell -= dt;
    for (const p of t.people) p.life -= dt;
    if (!t.paxDone) {
      const cell = at(t.loc.tx, t.loc.ty);
      if (t.redTime > 1.6) lateN++; else onN++;
      t.redTime = 0;
      if (cell) exchange(t, cell);
      t.paxDone = true;
      if (t.type !== 'freight') chime();
    }
    if (t.dwell <= 0) {
      t.state = 'run';
      t.served = key(t.loc.tx, t.loc.ty);
      t.paxDone = false;
      t.people = [];
      if (t.type === 'steam') whistle();
    }
    return;
  }
  if (t.state === 'buffer') {
    t.speed = 0;
    t.bufT -= dt;
    if (t.bufT <= 0) {
      const len = consistLength(t.type);

    t.pax | 0, t.state, Math.round(t.dwell * 100) / 100, t.served || '', Math.round(t.redTime * 10) / 10

    const aheadR = moveBy(train.loc, -train.dir, Math.max(0, d - 0.07), {soft: true});
    const here = worldOf(locR.loc);
    const ahead = worldOf(aheadR.loc);
    let ang = Math.atan2(ahead.y - here.y, ahead.x - here.x);

    const hit = trains.some((t) => t.tiles && t.tiles.has(k));

  if (DECOS[tool]) {

    if (c.k || c.g === 'w') return;

    c.drot = rot;

function armAudio() {

    if (!AC) return;
    audio = new AC();
  }
  if (audio.state === 'suspended') audio.resume();
  if (!noiseBuf) {
    const n = Math.floor(audio.sampleRate * 0.2);
    noiseBuf = audio.createBuffer(1, n, audio.sampleRate);
    const data = noiseBuf.getChannelData(0);

    const mid = pointerPos({clientX: (pts[0].x + pts[1].x) / 2, clientY: (pts[0].y + pts[1].y) / 2});

  else if (e.key === 'Escape') { setTool('zeiger'); document.getElementById('exbar').hidden = true; document.getElementById('ask').hidden = true; }
  else if (e.key >= '1' && e.key <= '9') {
    const names = ['zeiger', 'gerade', 'kurve', 'weiche', 'kreuz', 'prell', 'bahnhof', 'tunnel', 'bruecke'];
    setTool(names[e.key - 1]);
  }
});
function clearHash() {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
window.addEventListener('resize', () => fit());
window.addEventListener('hashchange', () => {
  const raw = (location.hash || '').replace(/^#/, '');
  if (raw.length < 8) return;
  try { applyState(dec(raw)); fit(); } catch (e) { /* ignorieren */ }
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!fast) {
    let acc = dt;
    while (acc > 0) {
      const h = Math.min(acc, 1 / 60);
      step(h);
      acc -= h;
    }
  }
  draw();
  syncHud();
  requestAnimationFrame(frame);
}

window.__bahn = {
  loadExample,
  sim(sec) {
    const n = Math.round(sec * 60);
    const was = fast;
    fast = true;
    for (let i = 0; i < n; i++) step(1 / 60);
    fast = was;
    rebuildOcc();
  },
  stats() {
    const n = onN + lateN;
    return {
      collisions, derailments, signalHolds, lastCol, passengers: paxN,
      punctuality: n ? Math.round(100 * onN / n) : 100,
      on: onN, late: lateN,
      layoutError,
      paused, day: dayMode, sound: soundOn,
      trains: trains.map((t) => ({
        id: t.id, type: t.type, tx: t.loc.tx, ty: t.loc.ty, s: Math.round(t.loc.s * 100) / 100,
        entry: t.loc.entry, dir: t.dir, speed: Math.round(t.speed * 100) / 100,
        state: t.state, dead: t.dead, odo: Math.round(t.odo), reason: t.reason, pax: t.pax
      }))
    };
  },
  fps() {
    return {n: frameN, avg: frameN ? frameMs / frameN : 0, max: frameMax};
  },
  fit, setTool, exportState, flipCell(x, y) { return flipAt(x, y); }, proveAll() {
    return trains.map((t) => prove(t));
  }
};

boot();
requestAnimationFrame(frame);
</script>
