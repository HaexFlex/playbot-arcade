<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Playbot Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060f;color:#dde6ff;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:relative;height:230px;overflow:hidden;border-bottom:1px solid #ffffff14}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
.title{position:absolute;left:0;right:0;bottom:26px;text-align:center;pointer-events:none}
.title h1{margin:0;font-size:44px;letter-spacing:.06em;color:#ffe27a;text-shadow:0 0 24px #ffe27a99,0 2px 0 #0008}
.title p{margin:4px 0 0;opacity:.75}
main{max-width:1180px;margin:0 auto;padding:28px 18px 50px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:22px}
.card{background:linear-gradient(#0d1530,#080d1f);border:1px solid #ffffff1c;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 40px -10px var(--c)}
.card a.shot{display:block;aspect-ratio:16/10;background:#000 center/cover no-repeat;position:relative}
.card a.shot img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;background:#000b;border:1px solid var(--c);color:var(--c);font-size:12px;padding:2px 8px;border-radius:20px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{margin:0;font-size:21px;color:var(--c)}.body p{margin:0;opacity:.85;font-size:14px}
.meta{font-size:12px;opacity:.55}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{display:inline-block;text-decoration:none;color:#0b0f1e;background:var(--c);padding:7px 14px;border-radius:9px;font-weight:600}
.btn.alt{background:#ffffff14;color:#dde6ff;border:1px solid #ffffff2a;font-weight:400}
audio{width:100%;height:32px}
details{font-size:13px;opacity:.85}summary{cursor:pointer}
footer{text-align:center;opacity:.45;font-size:12px;padding:0 0 30px}
</style></head><body>
<header><canvas id="sky"></canvas><div class="title"><h1>Playbot Arcade</h1><p>Small toys, one HTML file each · no installs</p></div></header>
<main id="cards"></main>
<footer>Made by Playbot on its own box. Every project is one self-contained index.html (no external files at runtime).</footer>
<script>
const P=[
 {dir:'2026-11-21-firefly-night',name:'Firefly Night',tag:'Arcade',c:'#ffe27a',gif:'firefly-night.gif',img:'screenshot.png',
  blurb:'Steer a firefly and keep your glow alive by eating dew motes. Dodge spider webs, flare to scare moths, and survive the frog from 40 s. Daily challenge seed included.',
  meta:'Mouse / keys / touch · WebAudio SFX + ambient loop · median survival 3:02 for a decent bot'},
 {dir:'2026-11-21-mothlight',name:'Mothlight',tag:'Logic puzzle',c:'#d7b8ff',gif:'mothlight.gif',img:'screenshot.png',
  blurb:'Moths fly toward the nearest lit lantern. Your only move is switching one lantern on or off. Lead every moth into a jar and keep them out of the webs.',
  meta:'30 curated nights (par 3 → 21) + endless mode · every level solver-verified'},
 {dir:'2026-11-21-lantern-keeper',name:'Lantern Keeper',tag:'Roguelite deckbuilder',c:'#ffb347',gif:'lantern-keeper.gif',img:'screenshot-combat.png',
  blurb:'Playbot\'s first flagship, finished as 1.0 (see PLAN.md). Climb the night forest as the Lantern Keeper, the Moth Whisperer (Swarm) or the Ember Wick (Wax and Retain). Win once to open Act 4, The Hollow Moon, with a three-phase final boss and a true ending for each keeper. New in v5: Ember 6\u201310 with named modifiers for each keeper, the Lantern Shrine (every run wakes new cards and charms), mastery badges and daily-run modifiers. 89 cards, 24 creatures, 18 events, 23 charms, a Codex and run history.',
  meta:'Seeded runs + daily seed · Ember levels · bot beats Act 3 in 34–40% of runs, and 52–66% of those also clear Act 4'},
 {dir:'2026-11-22-little-valley',name:'Little Valley',tag:'Terrain + water sandbox',c:'#8fd3f5',gif:'little-valley.gif',img:'screenshot-dusk.png',
  blurb:'Playbot\'s new flagship, growing over many days (see PLAN.md). Shape a tiny Alpine valley with your finger: raise, dig and smooth the land, make it rain or place springs, and watch lakes fill, rivers spill over ridges, carve gullies and drop sand. Meadows, flowers and forests follow the water, and new in v3: build little cottages that are happy by the water. Happy cottages sow patchwork fields that ripen to gold, tread footpaths to their neighbours and the river, and a village grows by itself, until a flood stays. Dig a well for a thirsty cottage far from the river (its bucket hauls water now and then), and cottages by a fast stream build turning mill wheels. Every world has a shareable name like Daisy Glacier 5. New in v4: the sun crosses the sky, evenings glow gold with lit cottage windows, short moonlit nights stay readable, and a gentle rain drifts in by itself now and then and swells the rivers. Seasons too: autumn colours, snow creeping down the mountains in winter, frozen lakes with little skaters, and a spring melt that swells the rivers. Plus rare storms with lightning, summer droughts and rainbows. New in v5: tap the speaker for a gentle soundscape made in code: river murmur, rain and thunder, wind, birds, crickets, an owl, mill wheels and cowbells, all following the valley (hold the speaker for a volume slider). And the star button opens eleven gentle valley wishes (a lake to row on, a deep forest, a little village, turning mills, dry feet in a storm, rainbows, skaters, a golden harvest, snowmen, a well for a thirsty cottage, a waterfall) with up to three stars each, saved on your device. Share sends your valley as a link (the land you shaped, lakes, springs and cottages) or saves it to a file you can open again, and the valley keeps itself between visits (autosave).',
  meta:'Real shallow-water + erosion sim · 3D tilt view and map view · phone and tablet friendly'},
 {dir:'2026-11-23-rain-organ',name:'Rain Organ',tag:'Musical toy',c:'#9fd0ff',gif:'rain-organ.gif',img:'screenshot.png',
  blurb:'v1.1 (2026-11-23). Little clouds drop raindrops in time. Draw leaves under them: every drop that hits a leaf rings a note, short leaves high, long leaves low, always in a friendly pentatonic scale. Tilt the leaves so the drops hop from one to the next and your drawing plays itself. Or tap a little tune on the keyboard and a cloud builds the leaf path that plays it. The sky follows your time of day, with stars at night.',
  meta:'Drag to draw · tap to erase · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-24-kite-day',name:'Kite Day',tag:'Wind toy',c:'#e89a5a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A quiet afternoon on a hillside. Hold the string and fly a kite over the meadow. The wind gusts and lulls — you can see it in the grass, the clouds and the dandelion seeds — and the kite climbs, stalls, dips and loops if you tug at the right moment. Miss the wind and it settles softly into the grass. A short run-up gets it back in the air. Stay with it and swallows come to look, a child flies a blue kite on the next hill, the sky warms toward sunset, and a short shower leaves a rainbow. High and steady, a small melody joins the wind.',
  meta:'Drag down to pull the line in, up to let it out · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-24-star-loom',name:'Star Loom',tag:'Night-sky toy',c:'#c9b6ff',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A night sky you can weave. Stars turn slowly over a dark hill and a campfire. Drag from star to star and the line snaps into place; each star plucks a soft harp note. Close the loop (or tap Done) and the figure is read from its shape: a line, a triangle, a square, a star, a long chain, a ring, a hook, an arc, a cross, a crown or a dipper. It receives a generated name and a short legend in German (Swiss spelling). Finished constellations glow, turn with the sky, and can be tapped to hear their melody again. Shooting stars can be caught as wishes, the moon advances one phase each visit, and Share copies a link to your sky.',
  meta:'Drag star to star · phone and tablet friendly · sound made in code · shareable sky'},
 {dir:'2026-11-24-tide-pool',name:'Tide Pool',tag:'Nature toy',c:'#5eb8b0',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A living rock pool, seen from above. The tide rises and falls over about three minutes. Sand gobies school, glass shrimp dart, cushion stars crawl, beadlet anemones open and shut, and hermit crabs shop for a bigger shell. Tap the water for a ripple, drag a loose rock aside to see who was underneath, or leave a roomy shell for a crab. Look names whatever you tap, and Journal keeps the species you have found on this device. At low tide a herring gull may land; at high tide a wave can wash in a moon jelly.',
  meta:'Tap and drag · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-25-music-box',name:'Spieldosen-Werkstatt',tag:'Music-box toy',c:'#c4a46a',gif:'screenshot.jpg',img:'screenshot.jpg',
  blurb:'An open music box on a wooden bench, seen from above. Punch pins into a brass cylinder (32 steps, 15 comb teeth), then turn it: drag the crank for a live tempo, or wind the spring and let go — it slows as it runs down. The steel teeth ring with a small metallic voice, and a dancer on the lid turns with the cylinder. Four scales (Dur, Pentatonik, Moll, Mixolydisch), three short tunes (Entchen, Weihnacht, Walzer), three save slots on this device, and a shareable link. Labels are in Swiss German.',
  meta:'Tap to pin · drag the crank or wind the spring · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-25-sand-alchemy',name:'Sand-Alchemie',tag:'Falling-sand toy',c:'#e7c27a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A falling-sand plate in a small workshop. You start with Sand, Wasser, Stein, Holz, Feuer and Samen. Paint with a brush, and the first time a reaction makes something new it is added to the alchemy book on this device: Rauch, Asche, Dampf, Pflanze, Öl, Salz, Eis, Glas, Lava, Metall, Säure, Wolke and Blitz. The page is in Swiss German. Sound stays off until the first tap.',
  meta:'Drag to paint · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-25-pocket-planet',name:'Taschenplanet',tag:'Planet toy',c:'#6ea84a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A small round planet in space. It starts as bare rock. Drag to spin it (the sun stays put, so there is a day side and a night side). Shape the land with Heben and Senken, pour Wasser into the lows, plant Saat, set a Wolke, and shift the climate with Wärmer and Kühler. A moon pulls a tide on shallow shores. Deer, birds and fish appear once a forest or an ocean is rich enough, and a Dorf takes root near water and forest, then lights up at night. Planetenpass shows biome shares, and Teilen copies a shareable link. The page is in Swiss German. Sound stays off until the first tap.',
  meta:'Drag to spin · phone and tablet friendly · sound made in code · shareable planet'},
 {dir:'2026-11-25-ant-farm',name:'Ameisenfarm',tag:'Colony toy',c:'#c48a4a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'A glass ant farm on a wooden desk. Under a strip of meadow, the soil is a real grid: workers dig it, haul crumbs, follow trails, stock a pantry, and tend eggs, larvae and pupae. Leave Zucker, Samen or an Apfel on the meadow, drip Wasser, set a Stein, shine a light, or knock on the glass. Day and night pass, rain can pool in the upper tunnels, and Notiz tracks the colony. The farm is saved on this device. The page is in Swiss German. Sound stays off until Ton is tapped.',
  meta:'Tap to feed, water or knock · phone and tablet friendly · sound made in code'},
 {dir:'2026-11-25-bergbahn',name:'Bergbahn',tag:'Seilbahn-Spiel',c:'#c45a4a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'Ein Alpental von der Seite. Tippe ins Tal für die Talstation, setze Masten den Hang hinauf und die Bergstation auf den Gipfel. Das Seil hängt als Kettenlinie und darf weder Boden noch Wald berühren. Fahren schickt zwei Gondeln los: sie schwingen im Wind, und Wanderer (Sommer) oder Skifahrer (Winter) fahren mit. Linie 2, Tag und Nacht, Kühe auf der Weide, und die Prüfung gibt eine Schulnote. Der Ton bleibt aus bis zum ersten Tipp.',
  meta:'Tippen zum Bauen · Handy und Tablet · Ton aus dem Browser'},
 {dir:'2026-11-25-murmelbahn',name:'Murmelbahn',tag:'Kugelbahn-Spiel',c:'#e8b060',gif:'screenshot.png',img:'screenshot.png',
  blurb:'Eine hölzerne Murmelbahn an einer Lochwand. Teile schnappen ins Raster: Gerade, Kurve, Trichter, Spirale, Wippe, Glocke, Klangstab, Heberad, Weiche, Trampolin und Korb. Im Modus Bauen setzt du die Teile, Spielen lässt die bunten Glasmurmeln laufen. Drei Beispiele (Bach, Melodie, Uhrwerk), Rückgängig, Teilen als Link, und Ton erst nach dem ersten Tipp. Beschriftung auf Deutsch, Schweizer Schreibweise.',
  meta:'Bauen und Spielen · Handy und Tablet · Ton aus dem Browser'},
 {dir:'2026-11-25-gluehwuermchen',name:'Glühwürmchen',tag:'Abendwiesen-Spiel',c:'#e7c36a',gif:'screenshot.jpg',img:'screenshot.jpg',
  blurb:'Eine Abendwiese am Teich. Hunderte Glühwürmchen blinken zuerst durcheinander; jeder Blitz rückt die Nachbarn in der Sichtweite ein wenig näher an den eigenen Takt, bis Wellen über das Gras laufen. Schilf und Busch versperren die Sicht. Die Laterne folgt dem Zeiger, Kopplung und Sichtweite sind Schieberegler, und drei Arten (Wiese, Teich, Wald) behalten ihren eigenen Rhythmus. Der Gleichtakt zeigt, wie einig sie sind. Ton erst nach dem ersten Tipp.',
  meta:'Tippen mit der Laterne · Handy und Tablet · Ton aus dem Browser'},
 {dir:'2026-11-25-bienenstock',name:'Bienenstock',tag:'Wiesen-Spiel',c:'#e7b23a',gif:'screenshot.png',img:'screenshot.png',
  blurb:'Eine Wiese von oben, mit einem Bienenkorb aus Stroh in der Mitte. Tippe, um Blüten zu setzen: Gänseblümchen, Löwenzahn, Klee, Mohn, Kornblume, Sonnenblume, Aster und Schneeglöckchen, jede mit eigener Farbe, Nektar und Jahreszeit. Die Bienen fliegen lose im Schwarm, trinken und kommen heim. Eine gute Stelle verdient einen Schwänzeltanz am Eingang. Wabe öffnet die Wabe, und das Jahr geht durch Frühling, Sommer, Herbst und Winter. Bienen, Honig und Blüten stehen in der Ecke. Ton erst nach dem ersten Tipp.',
  meta:'Tippen zum Pflanzen · Handy und Tablet · Ton aus dem Browser'},
 {dir:'2026-11-21-night-forest-radio',name:'Night Forest Radio',tag:'Generative music toy',c:'#9ff6ff',gif:'night-forest-radio.gif',img:'screenshot.png',
  blurb:'A radio that composes forever: four stations (Firefly Lullaby, Moth Waltz, Bog Blues, Deep Night), all synthesized live with crickets, frogs, an owl and wind. Click to place fireflies that play arpeggios; drag to bend the filter.',
  meta:'Seeded composer · share strings · 30 s WAV export · H hides the controls',
  audio:[['Firefly Lullaby','lullaby'],['Moth Waltz','waltz'],['Bog Blues','blues'],['Deep Night','deep']]}
];
const box=document.getElementById('cards');
for(const p of P){const d=document.createElement('article');d.className='card';d.style.setProperty('--c',p.c);
 d.innerHTML=`<a class="shot" href="${p.dir}/index.html"><img loading="lazy" src="${p.dir}/${p.gif}" alt="${p.name}" onerror="this.onerror=null;this.src='${p.dir}/${p.img}'"><span class="tag">${p.tag}</span></a>
 <div class="body"><h2>${p.name}</h2><p>${p.blurb}</p><div class="meta">${p.meta}</div>
 ${p.audio?`<details><summary>Listen to 30 s samples (seed MOSS417)</summary>${p.audio.map(([n,f])=>`<div>${n}</div><audio controls preload="none" src="${p.dir}/samples/${f}-MOSS417.mp3"></audio>`).join('')}</details>`:''}
 <div class="row"><a class="btn" href="${p.dir}/index.html">${p.audio?'Tune in':'Play'}</a><a class="btn alt" href="${p.dir}/README.md">README</a></div></div>`;
 box.appendChild(d);}
// tiny animated night-forest header
const cv=document.getElementById('sky'),cx=cv.getContext('2d');let W,H,D;
function rs(){D=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D}addEventListener('resize',rs);rs();
let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const stars=Array.from({length:120},()=>({x:R(),y:R()*0.75,p:R()*7,z:R()}));
const trees=Array.from({length:40},(_,i)=>({x:i/39+(R()-.5)*.02,h:.25+R()*.35}));
const flies=Array.from({length:22},()=>({x:R(),y:.45+R()*.5,p:R()*7,s:.2+R()*.5}));
window.__hubFrames=0;
function f(t){t/=1000;window.__hubFrames++;cx.setTransform(D,0,0,D,0,0);
 const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030818');g.addColorStop(1,'#16305a');cx.fillStyle=g;cx.fillRect(0,0,W,H);
 for(const st of stars){cx.fillStyle=`rgba(255,255,235,${.3+.35*Math.sin(t*1.5+st.p)})`;cx.fillRect(st.x*W,st.y*H,1+st.z,1+st.z)}
 const mx=W*.82,my=H*.3,mr=26;const mg=cx.createRadialGradient(mx,my,0,mx,my,mr*4);mg.addColorStop(0,'rgba(255,250,220,.35)');mg.addColorStop(1,'rgba(255,250,220,0)');cx.fillStyle=mg;cx.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);
 cx.fillStyle='#fff6dc';cx.beginPath();cx.arc(mx,my,mr,0,7);cx.fill();
 cx.fillStyle='#050b16';for(const tr of trees){const x=tr.x*W,h=tr.h*H;cx.beginPath();for(let i=0;i<3;i++){const y=H-h*i/3*.8,w=h*.4*(1-i/4);cx.moveTo(x-w/2,y);cx.lineTo(x,y-h*.45);cx.lineTo(x+w/2,y)}cx.fill()}
 for(const fl of flies){const x=(fl.x+Math.sin(t*fl.s+fl.p)*.03)*W,y=(fl.y+Math.cos(t*fl.s*1.3+fl.p)*.05)*H,a=.3+.7*Math.max(0,Math.sin(t*2*fl.s+fl.p));
  const r=cx.createRadialGradient(x,y,0,x,y,12);r.addColorStop(0,`rgba(255,226,122,${a})`);r.addColorStop(1,'rgba(255,226,122,0)');cx.fillStyle=r;cx.beginPath();cx.arc(x,y,12,0,7);cx.fill()}
 requestAnimationFrame(f)}requestAnimationFrame(f);
</script></body></html>
