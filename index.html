"blurb": "A wooden table, seen slightly from above. Draw a track, and the dominoes line up on it. Tap the stone with the golden rim, and the row falls: each stone leans into the next until it lies flat. Plus Ball, Ramp, Bell, Switch and Stairs. Spiral, Heart and Branch are ready-made tracks. Reset sets up the same layout again, Clear empties the table. Sound only after the first tap. The layout stays on this device.",

"en": {
"name": "Hot-Air Balloon",
"tag": "Balloon game",
"blurb": "A calm morning over a Swiss valley. You only steer the altitude: the burner heats the envelope, the valve lets hot air out, and the wind turns with altitude. Land gently on a landing site, bring the postcard from Seeblick to Bergli, and avoid the lake and the power line. Free flight is open flying, Excursion asks for five meadows and then opens the score sheet. Sound only after the first tap. The best result stays on this device.",

"tag": "Ballon-Spiel",
"blurb": "Ein ruhiger Morgen über einem Schweizer Tal. Du steuerst nur die Höhe: der Brenner heizt die Hülle, das Ventil lässt heisse Luft ab, und der Wind dreht mit der Höhe. Lande sanft auf einem Landeplatz, bring die Postkarte von Seeblick nach Bergli, und meide See und Stromleitung. Freiflug ist offenes Fliegen, Ausflug verlangt fünf Wiesen und öffnet dann den Punktezettel. Ton erst nach dem ersten Tipp. Der beste Stand bleibt auf diesem Gerät.",

"tag": "Mirror game",
"blurb": "A brass tube you can turn. Beads and shards fall in a wedge, and the mirrors repeat them live all around, in 3, 4, 6 or 8 sectors. Mirror changes the symmetry. Glass, Gems, Blossoms and Winter swap the pieces. Shake throws everything up, Photo saves a PNG. Dragging on the glass turns the tube, on a phone tilting works too. Sound only after the first tap. Symmetry and set stay on this device.",

"en": {
"name": "Coral Reef",
"tag": "Reef game",
"blurb": "A calm side view of a shallow sea. Place coral larvae on the sand and watch a reef grow. Staghorn, Brain, Fan, Soft and Anemone are the forms; fish, a turtle and cleaner shrimp join in. Water temperature keeps the reef cool: if the water gets too warm, the colour bleaches and the fish leave. Night makes polyps and plankton glow, Day brings the light back. New asks once, then clears the sand. Sound only after the first tap. The reef stays on this device.",

"name": "Korallenriff",
"tag": "Riff-Spiel",
"blurb": "Eine ruhige Seitenansicht eines flachen Meeres. Setze Korallenlarven auf den Sand und schaue, wie ein Riff wächst. Geweih, Hirn, Fächer, Weich und Anemone sind die Formen; Fische, eine Schildkröte und Putzer-Garnelen kommen dazu. Die Wassertemperatur hält das Riff kühl: wird das Wasser zu warm, bleicht die Farbe und die Fische gehen. Nacht lässt Polypen und Plankton leuchten, Tag bringt das Licht zurück. Neu fragt einmal, dann räumt den Sand. Ton erst nach dem ersten Tipp. Das Riff bleibt auf diesem Gerät.",

"en": {
"name": "Crystal Garden",
"tag": "Crystal game",
"blurb": "A jar of supersaturated solution on a sunny windowsill. Choose a salt, tap into the jar, and a seed sinks – onto the thread or to the bottom – and starts to grow. Table salt, alum, copper sulphate, sugar and snowflake each have their own shape. Temperature and concentration change how fast the crystals grow. The magnifier enlarges a spot, Info explains the salt. New asks once, then empties the jar. Sound only after the first tap. The jar stays on this device.",

},

"name": "Kristallgarten",
"tag": "Kristall-Spiel",
"blurb": "Ein Glas übersättigter Lösung auf einem sonnigen Sims. Wähle ein Salz, tippe ins Glas, und ein Keim sinkt — an den Faden oder auf den Boden — und beginnt zu wachsen. Kochsalz, Alaun, Kupfersulfat, Zucker und Schneeflocke haben je ihre eigene Form. Temperatur und Konzentration ändern, wie schnell die Kristalle wachsen. Die Lupe vergrössert eine Stelle, Info erklärt das Salz. Neu fragt einmal, dann leert das Glas. Ton erst nach dem ersten Tipp. Das Glas bleibt auf diesem Gerät.",

"en": {
"name": "Fireworks",
"tag": "Fireworks game",
"blurb": "A night over a small lakeside town, in the spirit of 1 August. Tap into the sky, and a rocket rises. It opens as the burst you chose: chrysanthemum, palm, willow, ring, heart, crackle or a volcano on the shore. The wind drives the smoke, the lake mirrors the blooms. Show opens the timeline: Play, Festival (a ready-made programme) and Set. Sound only after the first tap. The show stays on this device.",

"en": {
"name": "Wind Chimes",
"tag": "Sound game",
"blurb": "A wind chime on a balcony. Hang tubes on the beam, plus clappers and sails. The length chooses the pitch. The wind comes in gusts, or you swipe and nudge the sail yourself. Add tube and Remove tube hang one to eight tubes, Shorter and Longer tune the selected tube. Pentatonic, Major, Minor, Japanese and Gamelan change the tuning, Bamboo, Brass and Glass change sound and colour. Storm and Calm, Day and Night. Sound only after the first tap. The piece stays on this device.",

"name": "Windspiel",

"blurb": "Ein Windspiel auf einem Balkon. Hänge Rohre an den Balken, dazu Klöppel und Segel. Die Länge wählt die Tonhöhe. Der Wind kommt in Böen, oder du wischst und schubst das Segel selbst. Rohr dazu und Rohr weg hängen ein bis acht Rohre, Kürzer und Länger stimmen das gewählte Rohr. Pentatonik, Dur, Moll, Japanisch und Gamelan wechseln die Stimmung, Bambus, Messing und Glas ändern Klang und Farbe. Sturm und Windstille, Tag und Nacht. Ton erst nach dem ersten Tipp. Das Spiel bleibt auf diesem Gerät.",

"en": {
"name": "Bonsai",
"tag": "Tree game",
"blurb": "A small tree in a ceramic pot. It grows while you watch, and slowly keeps growing between visits. Water gives it water, Prune shortens a branch, Wire bends it with copper wire. Repot offers six pots, Light moves the sun, the season runs through spring, summer, autumn and winter. The time-lapse is calm, or a gentle fast-forward. Sound only after the first tap. The tree stays on this device.",

"blurb": "Ein kleiner Baum in einem Keramiktopf. Er wächst, während du zuschaust, und wächst langsam auch zwischen den Besuchen weiter. Giessen gibt Wasser, Schneiden kürzt einen Ast, Drahten biegt ihn mit einem Kupferdraht. Umtopfen bietet sechs Töpfe, Licht rückt die Sonne, die Jahreszeit geht durch Frühling, Sommer, Herbst und Winter. Der Zeitraffer ist ruhig oder ein sanfter Zeitraffer. Ton erst nach dem ersten Tipp. Der Baum bleibt auf diesem Gerät.",

"en": {
"name": "Shadow Theatre",
"tag": "Shadow play",
"blurb": "A paper screen, a warm lamp and shadow-play figures. Pull a figure closer to the lamp, and its shadow gets bigger and softer; further away it gets smaller and sharper. Dragon, knight, princess, fox, hare, tree, castle and moon come on stage. Joints can be turned. Curtain opens and closes the curtain. Record captures six seconds and plays them back, Play repeats the show. Remove takes away the selected figure, Clear empties the stage. Sound only after the first tap. Figures, curtain and the last show stay on this device.",

"name": "Worm Bin",
"tag": "Compost game",
"blurb": "A glass worm bin from the side, on a kitchen table. Throw scraps onto the soil, keep it moist, and watch the earthworms turn them into dark humus. Apple, banana, coffee, egg, cardboard and lettuce are the scraps. Spray makes the bin wet, Cooler and Warmer change the temperature. Harvest takes the humus when there is enough. Info, or a tap on a worm, opens a short card. Sound only after the first tap. The bin stays on this device.",

"blurb": "Eine gläserne Wurmkiste von der Seite, auf einem Küchentisch. Wirf Reste auf die Erde, halte sie feucht, und schaue, wie die Regenwürmer sie in dunklen Humus verwandeln. Apfel, Banane, Kaffee, Ei, Karton und Salat sind die Reste. Sprühen macht die Kiste nass, Kühler und Wärmer ändern die Temperatur. Ernten nimmt den Humus, wenn genug da ist. Info, oder ein Tipp auf einen Wurm, öffnet eine kurze Karte. Ton erst nach dem ersten Tipp. Die Kiste bleibt auf diesem Gerät.",

"name": "Tangram",
"tag": "Puzzle game",
"blurb": "Seven wooden pieces on a table, and a shadow you fill. Drag a piece, Rotate turns it by 45 degrees, Flip mirrors the parallelogram. The pieces snap to edges and corners. Puzzle asks you to cover the dark shape exactly; then the page says Done. Hint puts a piece in its place, Shuffle scatters them anew, Free removes the shadow. Sound only after the first tap. Your progress stays on this device.",

"name": "Origami",
"tag": "Folding game",
"blurb": "A square sheet on a wooden table. Fold it into a crane, a boat, a hat, a frog or a fish, or fold freely. A glowing line shows the next crease; Drag follows it, Next does the same step, Back takes it back. The last step shapes the model in 3D, and it turns slowly. Plain, Washi and Check change the paper, the round fields choose the colour. Sound only after the first tap. New lays a fresh sheet on the table.",

"blurb": "A snowy garden behind the window. Fill the bird house and watch which guests come to the windowsill. Seeds, fat balls, apple and water attract differently: great tit and blue tit at seeds and fat balls, robin, bullfinch, chaffinch and blackbird at fruit and bowls, the woodpecker at the fat ball, the squirrel at the bowl. A tap on the glass scares them off. Notebook collects the sightings. Sound only after the first tap. The notebook stays on this device.",

"tag": "Autumn game",
"blurb": "An autumn garden. Four trees drop their leaves: maple, oak, beech and chestnut. Drag the rake through the leaves and push them into piles. Gust sends a blast of wind, Child and dog jump into the biggest pile. A hedgehog can hide in a deep pile; rake it open, and it scurries into the bushes. Chestnuts fall from the chestnut tree. New scatters the garden anew. Sound only after the first tap. The biggest pile stays on this device.",

"blurb": "A Sunday morning in a Swiss kitchen. Knead the dough until it rises, roll strands, and braid a Zopf – or shape a Grittibenz. 2, 3 or 4 strands, then Braid: pull one strand over the next. Raisins sets eyes and buttons. Egg brushes the loaf, the wood oven browns it, Rack stands it to cool. New starts a fresh dough. Sound only after the first tap. The rack stays on this device.",
