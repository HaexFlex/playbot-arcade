<canvas id="view" aria-label="Little Valley: draw on the valley to shape it"></canvas>
<div id="top">
  <div class="pill" id="title"><b>Little Valley</b><span id="seedName"></span><span id="clock" title="Time of day in the valley (one day is about 100 s at 1x)"></span></div>

<script>// Little Valley: pure simulation module (no DOM). Works in the browser (window.LV)
// and in node (module.exports). Heightmap terrain, virtual-pipes shallow water,
// sediment erosion/deposition with semi-Lagrangian transport, thermal slumping.
(function (root) {
'use strict';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const WORDS_A = ['Sunny', 'Mossy', 'Breezy', 'Golden', 'Misty', 'Happy', 'Clover', 'Daisy', 'Pebble', 'Honey', 'Maple', 'Snowy', 'Bubbly', 'Merry', 'Cosy', 'Sparkly'];
const WORDS_B = ['Larch', 'Meadow', 'Brook', 'Alp', 'Glacier', 'Marmot', 'Edelweiss', 'Gentian', 'Chalet', 'Pine', 'Falls', 'Ridge', 'Cowbell', 'Lake', 'Pasture', 'Summit'];
function randomSeedName(rnd) { rnd = rnd || Math.random; return WORDS_A[(rnd() * WORDS_A.length) | 0] + ' ' + WORDS_B[(rnd() * WORDS_B.length) | 0] + ' ' + (1 + ((rnd() * 99) | 0)); }

// Seeded 2D gradient noise (Perlin style)
function makeNoise(rnd) {
  const p = new Uint8Array(512), g = new Float32Array(512);
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; g[i * 2] = Math.cos(a); g[i * 2 + 1] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const dot = (hx, hy, dx, dy) => { const k = p[p[hx] + hy] * 2; return g[k] * dx + g[k + 1] * dy; };
    const n00 = dot(X, Y, xf, yf), n10 = dot(X + 1, Y, xf - 1, yf), n01 = dot(X, Y + 1, xf, yf - 1), n11 = dot(X + 1, Y + 1, xf - 1, yf - 1);
    const u = fade(xf), v = fade(yf);
    return (n00 + u * (n10 - n00)) * (1 - v) + (n01 + u * (n11 - n01)) * v; // ~[-0.7,0.7]
  };
}

const DEFAULTS = {
  dt: 0.04, g: 9.81, damp: 0.9985,
  rain: 0, evap: 0.012, openEdges: true, edgeDrain: 3,
  Kc: 0.9, Ks: 0.35, Kd: 0.8, depthMax: 0.6, minTilt: 0.04, maxErode: 0.004,
  talus: 1.6, talusWet: 0.4, thermal: 0.15, thermalEvery: 2,
  springRate: 3.0, erosion: true,
  life: true, lifeEvery: 6,
  growMax: 24, // cottages the village may build by itself (GROW_MAX)
  weather: false, // natural rain that comes and goes by itself (the app turns it on; tests opt in)
  dayLen: 720, // sim seconds per day (about 100 s at 1x)
  seasons: false, // a year of P.yearDays days: snow in winter, melt in spring, a drier summer (the app turns it on; tests opt in)
  yearDays: 4, // days per year (one day per season)
  events: false, // weather events: rare storms and summer droughts (the app turns it on; tests opt in)
  boost: 1 // time-lapse: erosion and plant growth run this many times faster
};

// World size: heights are in "cell" units; mountains ~ 0.27 * N tall.
function generateTerrain(N, seed) {
  const rnd = mulberry32(hashStr(seed));
  const n1 = makeNoise(rnd), n2 = makeNoise(rnd), n3 = makeNoise(rnd);
  const h = new Float32Array(N * N);
  const meander = rnd() * 6.28, mAmp = 0.06 + rnd() * 0.07, side = rnd() < 0.5 ? -1 : 1;
  const lakeY = 0.55 + rnd() * 0.15, lakeX = 0.5 + (rnd() - 0.5) * 0.12, lakeR = 0.07 + rnd() * 0.04;
  const H = N * 0.27;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N; // v=0 far (north), v=1 near (south)
    let f = 0, amp = 0.5, fr = 2.2;
    for (let o = 0; o < 5; o++) { f += amp * n1(u * fr + 11.3, v * fr + 7.1); amp *= 0.5; fr *= 2.05; }
    let r = 0; amp = 0.55; fr = 2.6; let w = 1;
    for (let o = 0; o < 5; o++) { let k = 1 - Math.abs(n2(u * fr + 3.7, v * fr + 1.9) * 1.6); k = k * k * w; w = Math.min(1, k * 1.4); r += k * amp; amp *= 0.48; fr *= 2.1; }
    // valley centreline meanders from north to south
    const cx = 0.5 + mAmp * Math.sin(v * 5.2 + meander) + 0.03 * side * (v - 0.5) + 0.04 * n3(v * 3 + 5, 0.5);
    const dx = Math.abs(u - cx);
    const valleyW = 0.13 + 0.05 * v;
    const t = Math.min(1, dx / (valleyW * 2.4));
    const mount = t * t * (3 - 2 * t); // 0 in valley, 1 on flanks
    const north = 0.55 + 0.6 * (1 - v); // mountains taller at the back
    let e = 0.07 + 0.22 * (1 - v) * (1 - v) + 0.04 * f;      // valley floor sloping south
    e += mount * north * (0.42 * r + 0.18 + 0.14 * f);
    // rim: edges a bit higher except the river outlet in the south
    const edge = Math.min(u, 1 - u, v);
    if (edge < 0.08) e += (0.08 - edge) * 2.2 * (v > 0.85 && dx < valleyW * 0.4 ? 0.1 : 1);
    // gentle basin for a lake
    const lx = (u - lakeX) / lakeR, ly = (v - lakeY) / (lakeR * 0.8), ld = lx * lx + ly * ly;
    if (ld < 1) e -= 0.035 * (1 - ld) * (1 - ld) * (1 - mount);
    h[y * N + x] = Math.max(0, e) * H;
  }
  return { h, lake: { x: lakeX, y: lakeY } };
}

function create(N, seed, opts) {
  const P = Object.assign({}, DEFAULTS, opts || {});
  const n = N * N, F = () => new Float32Array(n);
  const T = generateTerrain(N, seed);
  const S = { N, seed: String(seed), P, h: T.h, d: F(), s: F(), fL: F(), fR: F(), fT: F(), fB: F(), u: F(), v: F(), tmp: F(), tmp2: F(), ero: F(), wet: F(), dep: F(), veg: F(), tree: F(), bloom: F(), moist: F(), fert: F(), flood: F(), rush: F(), field: F(), ripe: F(), path: F(), tend: new Uint8Array(n), h0: null, springs: [], cottages: [], grown: 0, vtick: 0, steps: 0, time: 0, wx: null, rainNow: 0, dryNow: 0, dr: null, snow: F(), ice: F(), yearOff: 0 };
  S.h0 = new Float32Array(S.h);
  initLife(S);
  return S;
}

// ---------- life: meadows and forests that follow the water ----------
// moist: ground moisture 0..1 (water spreads it to the banks, lowlands have some groundwater)
// veg: meadow cover 0..1, tree: forest 0..1 (> ~0.35 shows a tree)
function cellRand(i, k) { let x = (i * 374761393 + k * 668265263) | 0; x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function initLife(S) {
  const { N, h, veg, tree, moist, fert } = S, H = N * 0.27;
  const nz = makeNoise(mulberry32(hashStr(S.seed + '#forest')));
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    const i = y * N + x, hn = h[i] / H;
    const gx = 0.5 * (h[i + 1] - h[i - 1]), gy = 0.5 * (h[i + N] - h[i - N]), sl = Math.sqrt(gx * gx + gy * gy);
    const base = groundWater(hn);
    moist[i] = base;
    veg[i] = Math.max(0, Math.min(1, smoothstep(0.08, 0.42, base) * (1 - smoothstep(0.55, 0.72, hn)) + 0.05));
    const f = nz(x / N * 6, y / N * 6) + 0.4 * nz(x / N * 15 + 7, y / N * 15);
    fert[i] = f;
    const ok = hn > 0.1 && hn < 0.55 && sl < 1.2;
    tree[i] = ok && base + 0.35 * f > 0.31 ? Math.min(1, (base + 0.35 * f - 0.31) * 10) : 0;
    S.bloom[i] = bloomTarget(veg[i], tree[i], base, hn, f) * 0.6;
  }
}
// flowers: rich meadow, not under the forest, not soggy, not up on the alp; patchy by fertility
function bloomTarget(g, t, m, hn, f) {
  return smoothstep(0.35, 0.75, g) * (1 - smoothstep(0.25, 0.55, t)) * smoothstep(0.08, 0.2, m) * (1 - smoothstep(0.8, 0.98, m)) * (1 - smoothstep(0.42, 0.56, hn)) * smoothstep(-0.25, 0.15, f);
}
// is a tree here content? Unhappy = the same conditions that make lifeStep wither it: too dry,
// above the treeline, too steep, buried in sand, drowning in a lake or scoured by a river.
function treeHappy(S, i) {
  const N = S.N, h = S.h, hn = h[i] / (N * 0.27);
  const x = i % N, y = (i / N) | 0; if (x < 1 || y < 1 || x > N - 2 || y > N - 2) return 0;
  const gx = 0.5 * (h[i + 1] - h[i - 1]), gy = 0.5 * (h[i + N] - h[i - N]), sl = Math.sqrt(gx * gx + gy * gy);
  if (S.flood[i] > FLOOD_TREE || S.rush[i] > RUSH_SCOUR) return 0; // a lake that stays, a river that stays
  return S.moist[i] + 0.35 * S.fert[i] < 0.2 || hn >= 0.6 || sl > 1.5 || S.dep[i] > 1.5 ? 0 : 1;
}
// broadleaf share of a forest cell: leafy trees in the warm moist lowlands, pines above
function leafy(S, i) {
  const hn = S.h[i] / (S.N * 0.27) + 0.07 * S.fert[i] - 0.05 * S.moist[i];
  return 1 - smoothstep(0.12, 0.22, hn);
}
// Water memory, in seconds of simulated time (1x play runs about 7 sim seconds per real second).
// flood: how long water has been STANDING here (deep and slow). Runoff that flows past does not count,
// and it fades quickly once the ground is dry, so the puddles of a shower are harmless.
// rush: how long a fast, deep river has been running here. Only a river that keeps running scours
// its bed; the brief sheet runoff of a shower does not.
const FLOOD_MEADOW = 30, FLOOD_TREE = 60, RUSH_SCOUR = 60, FLOOD_RUIN = 20;

// ---------- the little village: cottages ----------
// A cottage sits on one cell ({x, y} as fractions of the map, like springs, so it survives a resample).
// Mood: 'flooded' while water STANDS on it (deep and slow; after FLOOD_RUIN sim seconds it becomes a ruin),
// 'happy' on dry ground with open water nearby (a lake or stream within a short walk), otherwise 'sad'
// (dry and far from water, or soggy with runoff). A ruin is rebuilt by placing a cottage on it again.
const COTTAGE_MAX = 80;
function cottageCell(S, c) { const N = S.N; return Math.max(1, Math.min(N - 2, Math.round(c.y * N))) * N + Math.max(1, Math.min(N - 2, Math.round(c.x * N))); }
function waterNear(S, i, thr) { // open-water cells within a short walk (radius scales with the grid, so it is the same distance on every size)
  const N = S.N, d = S.d, R = Math.max(4, N * 0.045), R2 = R * R, x = i % N, y = (i / N) | 0; let n = 0;
  for (let yy = Math.max(0, Math.floor(y - R)); yy <= Math.min(N - 1, Math.ceil(y + R)); yy++) for (let xx = Math.max(0, Math.floor(x - R)); xx <= Math.min(N - 1, Math.ceil(x + R)); xx++) {
    const r2 = (xx - x) * (xx - x) + (yy - y) * (yy - y); if (r2 > R2 || r2 < 2.5) continue;
    if (d[yy * N + xx] > (thr || 0.15)) n++;
  }
  return n;
}
function cottageStanding(S, i) { return S.d[i] > 0.25 && Math.hypot(S.u[i], S.v[i]) < 1.5; }
function cottageMood(S, c) {
  if (c.ruin) return 'ruin';
  const i = cottageCell(S, c);
  if (cottageStanding(S, i)) return 'flooded';
  if (S.d[i] >= 0.05) return 'sad'; // soggy with runoff
  const D = S.dryNow || 0; // in a drought a shrunken stream is not enough: it needs deeper water close by
  if (D > 0.3 ? waterNear(S, i, 0.15 + 0.45 * D) >= 3 + 9 * D : waterNear(S, i) >= 3) return 'happy';

  return c.well && wellYield(S, i) >= WELL_MIN ? 'happy' : 'sad'; // a well that still finds groundwater
}
// ---------- wells and mill wheels ----------
// A well reaches groundwater: plenty in the lowland, little up the slopes, none on the high rock and snow
// (hn > WELL_HIGH). Ground that water soaked recently (moist) helps too. A cottage with a working well is
// happy even far from a lake or stream, tends fields, and its village can grow (new cottages dig their own well).
const WELL_MIN = 0.12, WELL_HIGH = 0.5, MILL_D = 0.25, MILL_SP = 1, MILL_T = 30;
function wellYield(S, i) { const hn = S.h[i] / (S.N * 0.27); return hn > WELL_HIGH ? 0 : Math.max(groundWater(hn), S.moist[i]); }
function digWell(S, gx, gy) {
  const N = S.N; let best = null, bd = Math.max(3, N * 0.03);
  for (const c of S.cottages) { if (c.ruin) continue; const dd = Math.hypot(c.x * N - gx, c.y * N - gy); if (dd < bd) { bd = dd; best = c; } }
  if (!best) return 'nohouse';
  if (best.well) return 'has';
  const i = cottageCell(S, best);
  if (wellYield(S, i) < WELL_MIN) return S.h[i] / (N * 0.27) > WELL_HIGH ? 'rock' : 'dry';
  best.well = true; best.mood = cottageMood(S, best); return 'dug';
}
// A mill wheel: a cottage next to a river that keeps running fast (water > MILL_D deep, faster than MILL_SP)
// builds a water wheel in it once the river has run there for MILL_T sim seconds (c.riverT; the miller
// does not count while it rains, so the sheet runoff of a Shower never builds wheels). The wheel turns
// while water flows at its spot (c.turn = flow speed) and stops when the river dries up. A turning mill
// grinds: the fields of its cottage ripen MILL_RIPEN times faster.
function fastCell(S, j) { return S.d[j] > MILL_D && Math.hypot(S.u[j], S.v[j]) > MILL_SP; }
function millStep(S, c, i, tl) {
  const N = S.N, d = S.d, u = S.u, v = S.v, x = i % N, y = (i / N) | 0;
  if (!c.wheel) {
    const R = Math.max(3, N * 0.03), R2 = R * R; let bj = -1, bd = 1e9;
    for (let yy = Math.max(1, Math.floor(y - R)); yy <= Math.min(N - 2, Math.ceil(y + R)); yy++) for (let xx = Math.max(1, Math.floor(x - R)); xx <= Math.min(N - 2, Math.ceil(x + R)); xx++) {
      const r2 = (xx - x) * (xx - x) + (yy - y) * (yy - y); if (r2 > R2 || r2 < 2) continue;
      const j = yy * N + xx; if (!fastCell(S, j)) continue;
      if (r2 < bd) { bd = r2; bj = j; }
    }
    c.turn = 0;
    if (bj < 0) { c.riverT = Math.max(0, (c.riverT || 0) - tl * 2); return; } // forgets a river that stopped (2 s per s)

  st.ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, down: true, type: e.pointerType };
  const g = unproj(e.clientX, e.clientY); st.ptr.g = g;
  if (g && st.tool === 'spring') { const res = LV.applyTool(st.S, 'spring', g[0], g[1], 0, 0); hint(res === 'added' ? 'A new spring bubbles up!' : 'Spring removed'); }

});

// ---------- main loop ----------

  else { drawSky(st.time, dtReal); renderTop(st.time); drawCottagesTop(); drawWindowGlowTop(st.time); }

    // cottages: count and happy count (ruins only when there are some)
    if (S.grown > (st.grownSeen || 0)) hint('The village grows: a new cottage by the water!'); st.grownSeen = S.grown;
    const fl = V.fields ? ` · ${V.fields} field${V.fields > 1 ? 's' : ''}` : '';
    const ru = V.ruins ? ` · ${V.ruins} ruin${V.ruins > 1 ? 's' : ''}` : '';
    const mi = V.mills ? ` · ${V.mills} mill${V.mills > 1 ? 's' : ''}` : '';
    $('clock').textContent = clockText();
    $('stats').textContent = (vw < 600 ? `${tt} trees · ${hp}% happy · ${ff} 🌼 · 🏠 ${V.cottages} (${V.happy} 😊)${V.mills ? ' ⚙' + V.mills : ''}${V.ruins ? ' · ' + V.ruins + ' ruin' : ''}`
      : vw < 1000 ? `${tt} trees (${hp}% happy) · ${ff} flowers · 🏠 ${V.cottages} (${V.happy} happy)${V.mills ? ' · ⚙ ' + V.mills : ''}${ru}`
      : `${S.N}² · ${Math.round(st.fps)} fps · ${tt} trees (${hp}% happy) · ${ff} flowers · ${V.cottages} cottage${V.cottages === 1 ? '' : 's'} (${V.happy} happy)${fl}${mi}${ru}${S.dryNow > 0.05 ? ' · drought' : LV.weatherEvent(S) === 'storm' ? ' · storm' : ''}`) + (st.paused ? ' · paused' : ''); }

// auto quality: lower render scale first, then the grid (not in time-lapse, which fills spare time on purpose)

window.__lv = { st, LV, LT, leaf: LS, clockText, wheelAng, get col() { return [colR, colG, colB]; }, get tilt() { return tilt; }, get area() { return area; }, setTool, newWorld, unproj, proj, get S() { return st.S; } };

})();
