<canvas id="view" aria-label="Little Valley: draw on the valley to shape it"></canvas>
<div id="top">

<script>// Little Valley: pure simulation module (no DOM). Works in the browser (window.LV)
// and in node (module.exports). Heightmap terrain, virtual-pipes shallow water,
// sediment erosion/deposition with semi-Lagrangian transport, thermal slumping.
(function (root) {
'use strict';

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; s = String(s); for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

const WORDS_A = ['Sunny', 'Mossy', 'Breezy', 'Golden', 'Misty', 'Happy', 'Clover', 'Daisy', 'Pebble', 'Honey', 'Maple', 'Snowy', 'Bubbly', 'Merry', 'Cosy', 'Sparkly'];
const WORDS_B = ['Larch', 'Meadow', 'Brook', 'Alp', 'Glacier', 'Marmot', 'Edelweiss', 'Gentian', 'Chalet', 'Pine', 'Falls', 'Ridge', 'Cowbell', 'Lake', 'Pasture', 'Summit'];
function randomSeedName(rnd) { rnd = rnd || Math.random; return WORDS_A[(rnd() * WORDS_A.length) | 0] + ' ' + WORDS_B[(rnd() * WORDS_B.length) | 0] + ' ' + (1 + ((rnd() * 99) | 0)); }

// Seeded 2D gradient noise (Perlin style)
function makeNoise(rnd) {
  const p = new Uint8Array(512), g = new Float32Array(512);
  const perm = []; for (let i = 0; i < 256; i++) perm.push(i);
  for (let i = 255; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; const t = perm[i]; perm[i] = perm[j]; perm[j] = t; }
  for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
  for (let i = 0; i < 256; i++) { const a = rnd() * Math.PI * 2; g[i * 2] = Math.cos(a); g[i * 2 + 1] = Math.sin(a); }
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const X = xi & 255, Y = yi & 255;
    const dot = (hx, hy, dx, dy) => { const k = p[p[hx] + hy] * 2; return g[k] * dx + g[k + 1] * dy; };
    const n00 = dot(X, Y, xf, yf), n10 = dot(X + 1, Y, xf - 1, yf), n01 = dot(X, Y + 1, xf, yf - 1), n11 = dot(X + 1, Y + 1, xf - 1, yf - 1);
    const u = fade(xf), v = fade(yf);
    return (n00 + u * (n10 - n00)) * (1 - v) + (n01 + u * (n11 - n01)) * v; // ~[-0.7,0.7]
  };
}

const DEFAULTS = {
  dt: 0.04, g: 9.81, damp: 0.9985,
  rain: 0, evap: 0.012, openEdges: true, edgeDrain: 3,
  Kc: 0.9, Ks: 0.35, Kd: 0.8, depthMax: 0.6, minTilt: 0.04, maxErode: 0.004,
  talus: 1.6, talusWet: 0.4, thermal: 0.15, thermalEvery: 2,
  springRate: 3.0, erosion: true,
  life: true, lifeEvery: 6
};

// World size: heights are in "cell" units; mountains ~ 0.27 * N tall.
function generateTerrain(N, seed) {
  const rnd = mulberry32(hashStr(seed));
  const n1 = makeNoise(rnd), n2 = makeNoise(rnd), n3 = makeNoise(rnd);
  const h = new Float32Array(N * N);
  const meander = rnd() * 6.28, mAmp = 0.06 + rnd() * 0.07, side = rnd() < 0.5 ? -1 : 1;
  const lakeY = 0.55 + rnd() * 0.15, lakeX = 0.5 + (rnd() - 0.5) * 0.12, lakeR = 0.07 + rnd() * 0.04;
  const H = N * 0.27;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N; // v=0 far (north), v=1 near (south)
    let f = 0, amp = 0.5, fr = 2.2;
    for (let o = 0; o < 5; o++) { f += amp * n1(u * fr + 11.3, v * fr + 7.1); amp *= 0.5; fr *= 2.05; }
    let r = 0; amp = 0.55; fr = 2.6; let w = 1;
    for (let o = 0; o < 5; o++) { let k = 1 - Math.abs(n2(u * fr + 3.7, v * fr + 1.9) * 1.6); k = k * k * w; w = Math.min(1, k * 1.4); r += k * amp; amp *= 0.48; fr *= 2.1; }
    // valley centreline meanders from north to south
    const cx = 0.5 + mAmp * Math.sin(v * 5.2 + meander) + 0.03 * side * (v - 0.5) + 0.04 * n3(v * 3 + 5, 0.5);
    const dx = Math.abs(u - cx);
    const valleyW = 0.13 + 0.05 * v;
    const t = Math.min(1, dx / (valleyW * 2.4));
    const mount = t * t * (3 - 2 * t); // 0 in valley, 1 on flanks
    const north = 0.55 + 0.6 * (1 - v); // mountains taller at the back
    let e = 0.07 + 0.22 * (1 - v) * (1 - v) + 0.04 * f;      // valley floor sloping south
    e += mount * north * (0.42 * r + 0.18 + 0.14 * f);
    // rim: edges a bit higher except the river outlet in the south
    const edge = Math.min(u, 1 - u, v);
    if (edge < 0.08) e += (0.08 - edge) * 2.2 * (v > 0.85 && dx < valleyW * 0.4 ? 0.1 : 1);
    // gentle basin for a lake
    const lx = (u - lakeX) / lakeR, ly = (v - lakeY) / (lakeR * 0.8), ld = lx * lx + ly * ly;
    if (ld < 1) e -= 0.035 * (1 - ld) * (1 - ld) * (1 - mount);
    h[y * N + x] = Math.max(0, e) * H;
  }
  return { h, lake: { x: lakeX, y: lakeY } };
}

function create(N, seed, opts) {
  const P = Object.assign({}, DEFAULTS, opts || {});
  const n = N * N, F = () => new Float32Array(n);
  const T = generateTerrain(N, seed);
  const S = { N, seed: String(seed), P, h: T.h, d: F(), s: F(), fL: F(), fR: F(), fT: F(), fB: F(), u: F(), v: F(), tmp: F(), tmp2: F(), ero: F(), wet: F(), dep: F(), veg: F(), tree: F(), bloom: F(), moist: F(), fert: F(), flood: F(), h0: null, springs: [], steps: 0, time: 0 };
  S.h0 = new Float32Array(S.h);
  initLife(S);
  return S;
}

// ---------- life: meadows and forests that follow the water ----------
// moist: ground moisture 0..1 (water spreads it to the banks, lowlands have some groundwater)
// veg: meadow cover 0..1, tree: forest 0..1 (> ~0.35 shows a tree)
function cellRand(i, k) { let x = (i * 374761393 + k * 668265263) | 0; x = Math.imul(x ^ (x >>> 13), 1274126177); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function initLife(S) {
  const { N, h, veg, tree, moist, fert } = S, H = N * 0.27;
  const nz = makeNoise(mulberry32(hashStr(S.seed + '#forest')));
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    const i = y * N + x, hn = h[i] / H;
    const gx = 0.5 * (h[i + 1] - h[i - 1]), gy = 0.5 * (h[i + N] - h[i - N]), sl = Math.sqrt(gx * gx + gy * gy);
    const base = groundWater(hn);
    moist[i] = base;
    veg[i] = Math.max(0, Math.min(1, smoothstep(0.08, 0.42, base) * (1 - smoothstep(0.55, 0.72, hn)) + 0.05));
    const f = nz(x / N * 6, y / N * 6) + 0.4 * nz(x / N * 15 + 7, y / N * 15);
    fert[i] = f;
    const ok = hn > 0.1 && hn < 0.55 && sl < 1.2;
    tree[i] = ok && base + 0.35 * f > 0.31 ? Math.min(1, (base + 0.35 * f - 0.31) * 10) : 0;
    S.bloom[i] = bloomTarget(veg[i], tree[i], base, hn, f) * 0.6;
  }
}
// flowers: rich meadow, not under the forest, not soggy, not up on the alp; patchy by fertility
function bloomTarget(g, t, m, hn, f) {
  return smoothstep(0.5, 0.85, g) * (1 - smoothstep(0.25, 0.55, t)) * smoothstep(0.1, 0.24, m) * (1 - smoothstep(0.8, 0.98, m)) * (1 - smoothstep(0.42, 0.56, hn)) * smoothstep(-0.25, 0.15, f);
}
// broadleaf share of a forest cell: leafy trees in the warm moist lowlands, pines above
function leafy(S, i) {
  const hn = S.h[i] / (S.N * 0.27) + 0.07 * S.fert[i] - 0.05 * S.moist[i];
  return 1 - smoothstep(0.12, 0.22, hn);
}
function smoothstep(a, b, x) { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function groundWater(hn) { return 0.32 * (1 - smoothstep(0.12, 0.6, hn)); }

function lifeStep(S) {
  const { N, h, d, u, v, veg, tree, moist, dep, fert, flood, bloom } = S, H = N * 0.27, m2 = S.tmp;
  const rainK = S.P.rain > 0 ? Math.min(0.5, S.P.rain * 20) : 0, k0 = S.steps;
  // moisture: open water = 1, spreads a few cells onto the banks, otherwise relaxes to groundwater
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    const i = y * N + x;
    if (d[i] > 0.03) { m2[i] = 1; continue; }
    const nb = Math.max(moist[i - 1], moist[i + 1], moist[i - N], moist[i + N]) * 0.86;
    const gw = groundWater(h[i] / H) + rainK;
    let m = moist[i] + (gw - moist[i]) * 0.01;
    if (nb > m) m += (nb - m) * 0.5;
    m2[i] = m > 1 ? 1 : m;
  }
  for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
    const i = y * N + x; moist[i] = m2[i];
    const di = d[i], hn = h[i] / H;
    const gx = 0.5 * (h[i + 1] - h[i - 1]), gy = 0.5 * (h[i + N] - h[i - N]), sl = Math.sqrt(gx * gx + gy * gy);
    const sp = Math.sqrt(u[i] * u[i] + v[i] * v[i]);
    // flood memory: plants survive a shower, but not a lake that stays (about 15 s of play)
    let fl = flood[i]; fl = di > 0.3 ? fl + 0.01 : fl * 0.97; flood[i] = fl;
    let g = veg[i], t = tree[i], fb = bloom[i];
    if (sp > 3.5 && di > 0.6) { g -= 0.05; t -= 0.015; fb -= 0.08; }     // a real river scours its bed
    else if (fl > 0.5) { g -= 0.02; fb -= 0.04; if (fl > 1) t -= 0.006; } // drowning in standing water
    else if (di > 0.1) { /* wet for now: no growth, no harm */ }
    else {
      const m = moist[i], alpine = 1 - smoothstep(0.55, 0.75, hn), rock = 1 - smoothstep(1.1, 1.8, sl);
      const target = smoothstep(0.08, 0.45, m) * alpine * rock;
      g += (target - g) * (target > g ? 0.03 : 0.008);
      // trees: need moist (not soggy) ground below the treeline on gentle slopes
      const good = m + 0.35 * fert[i] > 0.3 && hn > 0.04 && hn < 0.58 && sl < 1.25 && dep[i] < 1.2;
      if (good) {
        if (t > 0.02) t += 0.006 * (1 - t);
        else if (cellRand(i, k0) < 0.004) { // seeding from a grown neighbour
          const nt = Math.max(tree[i - 1], tree[i + 1], tree[i - N], tree[i + N]);
          if (nt > 0.5 || cellRand(i, k0 + 1) < 0.01) t = 0.05;
        }
      } else if (m + 0.35 * fert[i] < 0.2 || hn >= 0.6 || sl > 1.5) t -= 0.004;
      if (dep[i] > 1.5) t -= 0.003; // buried by sand
      const bt = bloomTarget(g, t, m, hn, fert[i]) * (dep[i] > 0.8 ? 0.3 : 1);
      fb += (bt - fb) * (bt > fb ? 0.012 : 0.02);
    }
    veg[i] = g < 0 ? 0 : g > 1 ? 1 : g; tree[i] = t < 0 ? 0 : t > 1 ? 1 : t; bloom[i] = fb < 0 ? 0 : fb > 1 ? 1 : fb;
  }
}
function countTrees(S) { let n = 0; const t = S.tree; for (let i = 0; i < t.length; i++) if (t[i] > 0.35) n++; return n; }
function countLife(S) { // trees (pines / leafy) and flower cells, for the stats pill and tests
  let pine = 0, leaf = 0, fl = 0; const t = S.tree, b = S.bloom;
  for (let i = 0; i < t.length; i++) { if (t[i] > 0.35) { if (leafy(S, i) > 0.5) leaf++; else pine++; } if (b[i] > 0.4) fl++; }
  return { trees: pine + leaf, pine, leaf, flowers: fl };
}

// Default friendly start: a few springs high up plus a first shower.
function seedLife(S, count) {
  const { N, h } = S; const rnd = mulberry32(hashStr(S.seed + '#springs'));
  count = count == null ? 3 : count;
  let tries = 0;
  while (S.springs.length < count && tries++ < 400) {
    const x = 0.12 + rnd() * 0.76, y = 0.08 + rnd() * 0.4;
    const gx = (x * N) | 0, gy = (y * N) | 0; const hv = h[gy * N + gx];
    if (hv < N * 0.12 || hv > N * 0.24) continue;
    if (S.springs.some(s => Math.hypot(s.x - x, s.y - y) < 0.18)) continue;
    S.springs.push({ x, y, rate: 1 });
  }
  for (let i = 0; i < N * N; i++) S.d[i] += 0.25;
}

function totalWater(S) { let t = 0; const d = S.d; for (let i = 0; i < d.length; i++) t += d[i]; return t; }
function totalTerrain(S) { let t = 0; const h = S.h; for (let i = 0; i < h.length; i++) t += h[i]; return t; }

function addKernel(S, arr, gx, gy, rad, amount) {
  // gaussian-ish brush; amount is the total-ish height added at centre
  const N = S.N, r = Math.max(1, rad), r2 = r * r;
  const x0 = Math.max(0, Math.floor(gx - r)), x1 = Math.min(N - 1, Math.ceil(gx + r));
  const y0 = Math.max(0, Math.floor(gy - r)), y1 = Math.min(N - 1, Math.ceil(gy + r));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dd = ((x - gx) * (x - gx) + (y - gy) * (y - gy)) / r2; if (dd >= 1) continue;
    const w = (1 - dd) * (1 - dd); arr[y * N + x] += amount * w;
  }
}

// tool: 'raise' | 'lower' | 'smooth' | 'rain' | 'spring' | 'drain'
// gx, gy in cell coordinates; rad in cells; dtReal seconds of holding
function applyTool(S, tool, gx, gy, rad, dtReal, strength) {
  const N = S.N, h = S.h, d = S.d, s = S.s; strength = strength == null ? 1 : strength;
  const k = dtReal * strength;
  if (tool === 'raise' || tool === 'lower') {
    const sign = tool === 'raise' ? 1 : -1, r = Math.max(1, rad), r2 = r * r, amt = sign * k * N * 0.06;
    const x0 = Math.max(0, Math.floor(gx - r)), x1 = Math.min(N - 1, Math.ceil(gx + r));
    const y0 = Math.max(0, Math.floor(gy - r)), y1 = Math.min(N - 1, Math.ceil(gy + r));
    const maxH = N * 0.45;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const dd = ((x - gx) * (x - gx) + (y - gy) * (y - gy)) / r2; if (dd >= 1) continue;
      const w = (1 - dd) * (1 - dd), i = y * N + x;
      h[i] = Math.min(maxH, Math.max(0, h[i] + amt * w));
    }
  } else if (tool === 'smooth') {
    const r = Math.max(1.5, rad), r2 = r * r, a = Math.min(1, k * 6);
    const x0 = Math.max(1, Math.floor(gx - r)), x1 = Math.min(N - 2, Math.ceil(gx + r));
    const y0 = Math.max(1, Math.floor(gy - r)), y1 = Math.min(N - 2, Math.ceil(gy + r));

// grid -> screen (css px) in tilt view
function projTilt(gx, gy) {

// ---------- sky / background ----------
const skyN = LV.makeNoise(LV.mulberry32(42));
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: Math.random(), y: 0.05 + Math.random() * 0.25, s: 0.6 + Math.random() * 0.8, v: 0.004 + Math.random() * 0.006, seed: i * 13.7 }));
const birds = Array.from({ length: 4 }, (_, i) => ({ x: Math.random(), y: 0.12 + Math.random() * 0.18, v: 0.012 + Math.random() * 0.01, p: Math.random() * 6 }));
function drawSky(t, dt) {

// ---------- overlays: springs, brush, rain ----------
function drawOverlays(t) {
  const S = st.S, N = S.N;
  for (const sp of S.springs) {
    const p = proj(sp.x * N, sp.y * N); if (!p) continue;

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  if (st.ptr && st.ptr.down && st.ptr.id !== e.pointerId) return;
  cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
  st.ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, down: true, type: e.pointerType };
  const g = unproj(e.clientX, e.clientY); st.ptr.g = g;

  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (st.ptr && st.ptr.down && st.ptr.id !== e.pointerId) return;
  if (!st.ptr) st.ptr = { id: e.pointerId, down: false };

const up = e => { if (!st.ptr || st.ptr.id !== e.pointerId) return; st.ptr.down = false; if (e.pointerType !== 'mouse') st.ptr = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

// ---------- main loop ----------
let last = performance.now(), fpsAcc = 0, fpsN = 0, statT = 0;

// auto quality: lower render scale first, then the grid

window.__lv = { st, LV, get tilt() { return tilt; }, get area() { return area; }, setTool, newWorld, unproj, proj, get S() { return st.S; } };
updUI();
const fromHash = decodeURIComponent((location.hash || '').slice(1));
newWorld(fromHash || LV.randomSeedName());
requestAnimationFrame(frame);
})();
